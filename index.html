,"ato":"RA 69/1978","data":"1978-09-26","observacao":"Redação original - RA 69/1978, DJ 26.09.1978"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 84 O adicional regional, instituído pela Petrobras, não contraria o art. 165, item XVII, da Constituição."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-85","tribunal":"TST","tipo":"sumula","numero":85,"teor":"COMPENSAÇÃO DE JORNADA.\n\nI - A compensação de jornada de trabalho deve ser ajustada por acordo individual escrito, acordo coletivo ou convenção coletiva. (ex-Súmula nº 85 - primeira parte - alterada pela Res. 121/2003, DJ 21.11.2003)\nII - O acordo individual para compensação de horas é válido, salvo se houver norma coletiva em sentido contrário. (ex-OJ nº 182 da SBDI-1 - inserida em 08.11.2000)\nIII - O mero não atendimento das exigências legais para a compensação de jornada, inclusive quando encetada mediante acordo tácito, não implica a repetição do pagamento das horas excedentes à jornada normal diária, se não dilatada a jornada máxima semanal, sendo devido apenas o respectivo adicional. (ex-Súmula nº 85 - segunda parte - alterada pela Res. 121/2003, DJ 21.11.2003)\nIV - A prestação de horas extras habituais descaracteriza o acordo de compensação de jornada. Nesta hipótese, as horas que ultrapassarem a jornada semanal normal deverão ser pagas como horas extraordinárias e, quanto àquelas destinadas à compensação, deverá ser pago a mais apenas o adicional por trabalho extraordinário. (ex-OJ nº 220 da SBDI-1 - inserida em 20.06.2001)\nV - As disposições contidas nesta súmula não se aplicam ao regime compensatório na modalidade \"banco de horas\", que somente pode ser instituído por negociação coletiva.\nVI - Não é válido acordo de compensação de jornada em atividade insalubre, ainda que estipulado em norma coletiva, sem a necessária inspeção prévia e permissão da autoridade competente, na forma do art. 60 da CLT.","status":"em_vigor","temas":["Adicionais (insalubridade, periculosidade e outros)","Jornada e horas extras","Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 209/2016","data":"2016-06-03","observacao":"(inserido o item VI) - Res. 209/2016, DEJT divulgado em 01, 02 e 03.06.2016"},{"evento":"Nova redação","ato":"Res. 174/2011","data":"2011-05-31","observacao":"Súmula alterada - Res. 174/2011, DEJT divulgado em 27, 30 e 31.05.2011"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 85. Compensação de jornada (inserido o item V)"},{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"Súmula alterada - Res. 129/2005, DJ 20, 22 e 25.04.2005"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 85.Compensação de jornada (incorporadas as Orientações Jurisprudenciais nºs 182, 220 e 223 da SBDI-1)\n(...)"},{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula alterada - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 85 Compensação de horário\nA compensação de jornada de trabalho deve ser ajustada por acordo individual escrito, acordo coletivo ou convenção coletiva. O não-atendimento das exigências legais não implica a repetição do pagamento das horas excedentes, sendo devido apenas o respectivo adicional."},{"evento":"Redação original","ato":"RA 69/1978","data":"1978-09-26","observacao":"Redação original - RA 69/1978, DJ 26.09.1978"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 85 O não atendimento das exigências legais, para adoção do regime de compensação de horário semanal, não implica a repetição do pagamento das horas excedentes, sendo devido, apenas, o adicional respectivo."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-86","tribunal":"TST","tipo":"sumula","numero":86,"teor":"DESERÇÃO. MASSA FALIDA. EMPRESA EM LIQUIDAÇÃO EXTRAJUDICIAL.\n\nNão ocorre deserção de recurso da massa falida por falta de pagamento de custas ou de depósito do valor da condenação. Esse privilégio, todavia, não se aplica à empresa em liquidação extrajudicial. (primeira parte - ex-Súmula nº 86 - RA 69/78, DJ 26.09.1978; segunda parte - ex-OJ nº 31 da SBDI-1 - inserida em 14.03.1994)","status":"em_vigor","temas":["Honorários, custas e justiça gratuita","Execução e penhora","Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"(incorporada a Orientação Jurisprudencial nº 31 da SBDI-1) - Res. 129/2005, DJ 20, 22 e 25.04.2005"},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 86 Não ocorre deserção de recurso da massa falida por falta de pagamento de custas ou de depósito do valor da condenação."},{"evento":"Redação original","ato":"RA 69/1978","data":"1978-09-26","observacao":"Redação original - RA 69/1978, DJ 26.09.1978"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 86 Deserção. Massa falida\nInocorre deserção de recurso da massa falida, por falta de pagamento de custas ou de depósito do valor da condenação."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-87","tribunal":"TST","tipo":"sumula","numero":87,"teor":"PREVIDÊNCIA PRIVADA.\n\nSe o empregado, ou seu beneficiário, já recebeu da instituição previdenciária privada, criada pela empresa, vantagem equivalente, é cabível a dedução de seu valor do benefício a que faz jus por norma regulamentar anterior.","status":"em_vigor","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 69/1978","data":"1978-09-26","observacao":"Redação original - RA 69/1978, DJ 26.09.1978"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 87 Se o empregado, ou seu beneficiário, já recebeu da instituição previdenciária privada, criada pela empresa, vantagem equivalente, é cabível a dedução do seu valor do benefício a que faz jus, por norma regulamentar anterior."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-88","tribunal":"TST","tipo":"sumula","numero":88,"teor":"JORNADA DE TRABALHO. INTERVALO ENTRE TURNOS.\n\nO desrespeito ao intervalo mínimo entre dois turnos de trabalho, sem importar em excesso na jornada efetivamente trabalhada, não dá direito a qualquer ressarcimento ao obreiro, por tratar-se apenas de infração sujeita a penalidade administrativa (art. 71 da CLT).","status":"cancelada","temas":["Jornada e horas extras"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelamento mantido) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Cancelamento","ato":"Res. 42/1995","data":"1995-02-21","observacao":"Súmula cancelada - Res. 42/1995, DJ 17, 20 e 21.02.1995"},{"evento":"Redação original","ato":"RA 69/1978","data":"1978-09-26","observacao":"Redação original - RA 69/1978, DJ 26.09.1978"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-89","tribunal":"TST","tipo":"sumula","numero":89,"teor":"FALTA AO SERVIÇO.\n\nSe as faltas já são justificadas pela lei, consideram-se como ausências legais e não serão descontadas para o cálculo do período de férias.","status":"em_vigor","temas":["Férias, 13º e descansos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 69/1978","data":"1978-09-26","observacao":"Redação original - RA 69/1978, DJ 26.09.1978"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-90","tribunal":"TST","tipo":"sumula","numero":90,"teor":"HORAS \"IN ITINERE\". TEMPO DE SERVIÇO.\n\nI - O tempo despendido pelo empregado, em condução fornecida pelo empregador, até o local de trabalho de difícil acesso, ou não servido por transporte público regular, e para o seu retorno é computável na jornada de trabalho. (ex-Súmula nº 90 - RA 80/1978, DJ 10.11.1978)\nII - A incompatibilidade entre os horários de início e término da jornada do empregado e os do transporte público regular é circunstância que também gera o direito às horas \"in itinere\". (ex-OJ nº 50 da SBDI-1 - inserida em 01.02.1995)\nIII - A mera insuficiência de transporte público não enseja o pagamento de horas \"in itinere\". (ex-Súmula nº 324 - Res. 16/1993, DJ 21.12.1993)\nIV - Se houver transporte público regular em parte do trajeto percorrido em condução da empresa, as horas \"in itinere\" remuneradas limitam-se ao trecho não alcançado pelo transporte público. (ex-Súmula nº 325 - Res. 17/1993, DJ 21.12.1993)\nV - Considerando que as horas \"in itinere\" são computáveis na jornada de trabalho, o tempo que extrapola a jornada legal é considerado como extraordinário e sobre ele deve incidir o adicional respectivo. (ex-OJ nº 236 da SBDI-1 - inserida em 20.06.2001)","status":"cancelada","temas":["Jornada e horas extras"],"historico":[{"evento":"Cancelamento","ato":"Res. 225/2025","data":"2025-07-02","observacao":"Cancelada por perda de eficácia a partir de 11.11.2017, pela Lei 13.467/2017. Res. 225/2025, DEJT divulgado em 30.06, 01 e 02.07.2025"},{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"Incorporadas as Súmulas nºs 324 e 325 e as Orientações Jurisprudenciais nºs 50 e 236 da SBDI-1 - Res. 129/2005, DJ 20, 22 e 25.04.2005"},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Nova redação","ato":"RA 80/1978","data":"1978-11-10","observacao":"Súmula alterada - RA 80/1978, DJ 10.11.1978"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 90 Tempo de serviço\nO tempo despendido pelo empregado, em condução fornecida pelo empregador, até o local de trabalho de difícil acesso ou não servido por transporte regular público, e para o seu retorno, é computável na jornada de trabalho."},{"evento":"Redação original","ato":"RA 69/1978","data":"1978-09-26","observacao":"Redação original - RA 69/1978, DJ 26.09.1978"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 90 O tempo despendido pelo empregado, em condução fornecida pelo empregador, até o local do trabalho e no seu retorno, é computável na jornada de trabalho."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-91","tribunal":"TST","tipo":"sumula","numero":91,"teor":"SALÁRIO COMPLESSIVO.\n\nNula é a cláusula contratual que fixa determinada importância ou percentagem para atender englobadamente vários direitos legais ou contratuais do trabalhador.","status":"em_vigor","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 69/1978","data":"1978-09-26","observacao":"Redação original - RA 69/1978, DJ 26.09.1978"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-92","tribunal":"TST","tipo":"sumula","numero":92,"teor":"APOSENTADORIA.\n\nO direito à complementação de aposentadoria, criado pela empresa, com requisitos próprios, não se altera pela instituição de benefício previdenciário por órgão oficial.","status":"em_vigor","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 69/1978","data":"1978-09-26","observacao":"Redação original - RA 69/1978, DJ 26.09.1978"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-93","tribunal":"TST","tipo":"sumula","numero":93,"teor":"BANCÁRIO.\n\nIntegra a remuneração do bancário a vantagem pecuniária por ele auferida na colocação ou na venda de papéis ou valores mobiliários de empresas pertencentes ao mesmo grupo econômico, se exercida essa atividade no horário e no local de trabalho e com o consentimento, tácito ou expresso, do banco empregador.","status":"em_vigor","temas":["Terceirização e responsabilidade","Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 121/1979","data":"1979-11-27","observacao":"Redação original - RA 121/1979, DJ 27.11.1979"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 93 Integra a remuneração do bancário a vantagem pecuniária por ele auferida na colocação ou na venda de papéis ou valores mobiliários de empresas pertencentes ao mesmo grupo econômico, quando exercida essa atividade no horário e no local de trabalho e com o consentimento, tácito ou expresso, do banco empregador."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-94","tribunal":"TST","tipo":"sumula","numero":94,"teor":"HORAS EXTRAS.\n\nO valor das horas extraordinárias habituais integra o aviso prévio indenizado.","status":"cancelada","temas":["Jornada e horas extras","Rescisão e verbas rescisórias"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 43/1980","data":"1980-05-15","observacao":"Redação original - RA 43/1980, DJ 15.05.1980 - Republicada Res. 80/1980, DJ 04.07.1980"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-95","tribunal":"TST","tipo":"sumula","numero":95,"teor":"PRESCRIÇÃO TRINTENÁRIA. FGTS.\n\nÉ trintenária a prescrição do direito de reclamar contra o não recolhimento da contribuição para o Fundo de Garantia do Tempo de Serviço.\n(Cancelada em decorrência da sua incorporação à nova redação da Súmula nº 362)","status":"cancelada","temas":["FGTS","Prescrição e decadência"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 44/1980","data":"1980-05-15","observacao":"Redação original - (RA 44/1980, DJ 15.05.1980)"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-96","tribunal":"TST","tipo":"sumula","numero":96,"teor":"MARÍTIMO.\n\nA permanência do tripulante a bordo do navio, no período de repouso, além da jornada, não importa presunção de que esteja à disposição do empregador ou em regime de prorrogação de horário, circunstâncias que devem resultar provadas, dada a natureza do serviço.","status":"em_vigor","temas":["Jornada e horas extras","Provas e ônus da prova"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 45/1980","data":"1980-05-16","observacao":"Redação original - RA 45/1980, DJ 16.05.1980"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 96 A permanência do tripulante a bordo do navio, no período de repouso, além da jornada, não importa em presunção de que esteja à disposição do empregador ou em regime de prorrogação de horário, circunstâncias que devem resultar provadas, dada a natureza do serviço."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-97","tribunal":"TST","tipo":"sumula","numero":97,"teor":"APOSENTADORIA. COMPLEMENTAÇÃO.\n\nInstituída complementação de aposentadoria por ato da empresa, expressamente dependente de regulamentação, as condições desta devem ser observadas como parte integrante da norma.","status":"em_vigor","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Nova redação","ato":"RA 96/1980","data":"1980-09-11","observacao":"Súmula alterada - RA 96/1980, DJ 11.09.1980"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 97 Instituída complementação de aposentadoria, por ato da empresa, expressamente dependente de sua regulamentação, as condições desta devem ser observadas como parte integrante da norma."},{"evento":"Redação original","ato":"RA 48/1980","data":"1980-05-22","observacao":"Redação original - RA 48/1980, DJ 22.05.1980"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 97 Instituída complementação de aposentadoria, por ato da empresa, expressamente dependente de sua regulamentação, as condições destas devem ser observadas como parte integrante da norma."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-98","tribunal":"TST","tipo":"sumula","numero":98,"teor":"FGTS. INDENIZAÇÃO. EQUIVALÊNCIA. COMPATIBILIDADE.\n\nI - A equivalência entre os regimes do Fundo de Garantia do Tempo de Serviço e da estabilidade prevista na CLT é meramente jurídica e não econômica, sendo indevidos valores a título de reposição de diferenças. (ex-Súmula nº 98 - RA 57/1980, DJ 06.06.1980)\nII - A estabilidade contratual ou a derivada de regulamento de empresa são compatíveis com o regime do FGTS. Diversamente ocorre com a estabilidade legal (decenal, art. 492 da CLT), que é renunciada com a opção pelo FGTS. (ex-OJ nº 299 da SBDI-1 - DJ 11.08.2003)","status":"em_vigor","temas":["FGTS","Estabilidade e garantias de emprego","Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"(incorporada a Orientação Jurisprudencial nº 299 da SBDI-1) - Res. 129/2005, DJ 20, 22 e 25.04.2005"},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 98 FGTS. Indenização. Equivalência\nA equivalência entre os regimes do Fundo de Garantia do Tempo de Serviço e da estabilidade prevista na CLT é meramente jurídica e não econômica, sendo indevidos valores a título de reposição de diferenças."},{"evento":"Redação original","ato":"RA 57/1980","data":"1980-06-06","observacao":"Redação original - RA 57/1980, DJ 06.06.1980"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 98 A equivalência entre os regimes do Fundo de Garantia do Tempo de Serviço e da estabilidade da Consolidação das Leis do Trabalho é meramente jurídica e não econômica, sendo indevidos quaisquer valores a título de reposição de diferenças."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-99","tribunal":"TST","tipo":"sumula","numero":99,"teor":"AÇÃO RESCISÓRIA. DESERÇÃO. PRAZO.\n\nHavendo recurso ordinário em sede de rescisória, o depósito recursal só é exigível quando for julgado procedente o pedido e imposta condenação em pecúnia, devendo este ser efetuado no prazo recursal, no limite e nos termos da legislação vigente, sob pena de deserção. (ex-Súmula nº 99 - alterada pela Res. 110/2002, DJ 15.04.2002 - e ex-OJ nº 117 da SBDI-2 - DJ 11.08.2003)","status":"em_vigor","temas":["Rescisão e verbas rescisórias","Honorários, custas e justiça gratuita","Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 137/2005","data":"2005-08-24","observacao":"(incorporada a Orientação Jurisprudencial nº 117 da SBDI-2) - Res. 137/2005, DJ 22, 23 e 24.08.2005"},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 99 Ao recorrer de decisão condenatória em ação rescisória, é ônus do empregador vencido efetuar, no prazo, no limite e nos termos da legislação vigente, sob pena de deserção, o depósito recursal."},{"evento":"Nova redação","ato":"Res. 110/2002","data":"2002-04-15","observacao":"Súmula alterada - Res. 110/2002, DJ 11, 12 e 15.04.2002"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 99. Ação rescisória. Deserção. Prazo.\nAo recorrer de decisão condenatória em ação rescisória, deve o empregador vencido efetuar, no prazo, no limite e nos termos da legislação vigente, sob pena de deserção, o depósito recursal."},{"evento":"Redação original","ato":"RA 62/1980","data":"1980-06-11","observacao":"Redação original - RA 62/1980, DJ 11.06.1980"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 99. Ação rescisória. Deserção. Prazo.\nAo recorrer de decisão condenatória em ação rescisória, resultante do acolhimento desta, deve o empregador vencido depositar o valor da condenação no prazo legal, sob pena de deserção (CLT, artigo 899, § 1º)."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-100","tribunal":"TST","tipo":"sumula","numero":100,"teor":"AÇÃO RESCISÓRIA. DECADÊNCIA.\n\nI - O prazo de decadência, na ação rescisória, conta-se do dia imediatamente subseqüente ao trânsito em julgado da última decisão proferida na causa, seja de mérito ou não. (ex-Súmula nº 100 - alterada pela Res. 109/2001, DJ 20.04.2001)\nII - Havendo recurso parcial no processo principal, o trânsito em julgado dá-se em momentos e em tribunais diferentes, contando-se o prazo decadencial para a ação rescisória do trânsito em julgado de cada decisão, salvo se o recurso tratar de preliminar ou prejudicial que possa tornar insubsistente a decisão recorrida, hipótese em que flui a decadência a partir do trânsito em julgado da decisão que julgar o recurso parcial. (ex-Súmula nº 100 - alterada pela Res. 109/2001, DJ 20.04.2001)\nIII - Salvo se houver dúvida razoável, a interposição de recurso intempestivo ou a interposição de recurso incabível não protrai o termo inicial do prazo decadencial. (ex-Súmula nº 100 - alterada pela Res. 109/2001, DJ 20.04.2001)\nIV - O juízo rescindente não está adstrito à certidão de trânsito em julgado juntada com a ação rescisória, podendo formar sua convicção através de outros elementos dos autos quanto à antecipação ou postergação do \"dies a quo\" do prazo decadencial. (ex-OJ nº 102 da SBDI-2 - DJ 29.04.2003)\nV - O acordo homologado judicialmente tem força de decisão irrecorrível, na forma do art. 831 da CLT. Assim sendo, o termo conciliatório transita em julgado na data da sua homologação judicial. (ex-OJ nº 104 da SBDI-2 - DJ 29.04.2003)\nVI - Na hipótese de colusão das partes, o prazo decadencial da ação rescisória somente começa a fluir para o Ministério Público, que não interveio no processo principal, a partir do momento em que tem ciência da fraude. (ex-OJ nº 122 da SBDI-2 - DJ 11.08.2003)\nVII - Não ofende o princípio do duplo grau de jurisdição a decisão do TST que, após afastar a decadência em sede de recurso ordinário, aprecia desde logo a lide, se a causa versar questão exclusivamente de direito e estiver em condições de imediato julgamento. (ex-OJ nº 79 da SBDI-2 - inserida em 13.03.2002)\nVIII - A exceção de incompetência, ainda que oposta no prazo recursal, sem ter sido aviado o recurso próprio, não tem o condão de afastar a consumação da coisa julgada e, assim, postergar o termo inicial do prazo decadencial para a ação rescisória. (ex-OJ nº 16 da SBDI-2 - inserida em 20.09.2000)\nIX - Prorroga-se até o primeiro dia útil, imediatamente subseqüente, o prazo decadencial para ajuizamento de ação rescisória quando expira em férias forenses, feriados, finais de semana ou em dia em que não houver expediente forense. Aplicação do art. 775 da CLT. (ex-OJ nº 13 da SBDI-2 - inserida em 20.09.2000)\nX - Conta-se o prazo decadencial da ação rescisória, após o decurso do prazo legal previsto para a interposição do recurso extraordinário, apenas quando esgotadas todas as vias recursais ordinárias. (ex-OJ nº 145 da SBDI-2 - DJ 10.11.2004)","status":"em_vigor","temas":["Férias, 13º e descansos","Estabilidade e garantias de emprego","Rescisão e verbas rescisórias"],"historico":[{"evento":"Nova redação","ato":"Res. 137/2005","data":"2005-08-24","observacao":"(incorporadas as Orientações Jurisprudenciais nºs 13, 16, 79, 102, 104, 122 e 145 da SBDI-2) - Res. 137/2005, DJ 22, 23 e 24.08.2005"},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Nova redação","ato":"Res. 109/2001","data":"2001-04-20","observacao":"Súmula alterada - Res. 109/2001, DJ 18, 19 e 20.04.2001"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 100 AÇÃO RESCISÓRIA. DECADÊNCIA\nI - O prazo de decadência, na ação rescisória, conta-se do dia imediatamente subseqüente ao trânsito em julgado da última decisão proferida na causa, seja de mérito ou não.\nII - Havendo recurso parcial no processo principal, o trânsito em julgado dá-se em momentos e em tribunais diferentes, contando-se o prazo decadencial para a ação rescisória do trânsito em julgado de cada decisão, salvo se o recurso tratar de preliminar ou prejudicial que possa tornar insubsistente a decisão recorrida, hipótese em que flui a decadência, a partir do trânsito em julgado da decisão que julgar o recurso parcial.\nIII - Salvo se houver dúvida razoável, a interposição de recurso intempestivo ou a interposição de recurso incabível não protrai o termo inicial do prazo decadencial."},{"evento":"Redação original","ato":"RA 63/1980","data":"1980-06-11","observacao":"Redação original - RA 63/1980, DJ 11.06.1980"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 100 O prazo de decadência, na ação rescisória, conta-se do trânsito em julgado da última decisão proferida na causa, seja de mérito ou não."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-101","tribunal":"TST","tipo":"sumula","numero":101,"teor":"DIÁRIAS DE VIAGEM. SALÁRIO.\n\nIntegram o salário, pelo seu valor total e para efeitos indenizatórios, as diárias de viagem que excedam a 50% (cinqüenta por cento) do salário do empregado, enquanto perdurarem as viagens. (primeira parte - ex-Súmula nº 101 - RA 65/1980, DJ 18.06.1980; segunda parte - ex-OJ nº 292 da SBDI-1 - inserida em 11.08.2003)","status":"em_vigor","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"(incorporada a Orientação Jurisprudencial nº 292 da SBDI-1) - Res. 129/2005, DJ 20, 22 e 25.04.2005"},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 101 Diárias de viagem. Salário\nIntegram o salário, pelo seu valor total e para efeitos indenizatórios, as diárias de viagem que excedam a 50% (cinquenta por cento) do salário do empregado."},{"evento":"Redação original","ato":"RA 65/1980","data":"1980-06-18","observacao":"Redação original - RA 65/1980, DJ 18.06.1980"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 101 Integram o salário, pelo seu valor total e para efeitos indenizatórios, as diárias de viagem que excedam a 50% do salário do empregado."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-102","tribunal":"TST","tipo":"sumula","numero":102,"teor":"BANCÁRIO. CARGO DE CONFIANÇA.\n\nI - A configuração, ou não, do exercício da função de confiança a que se refere o art. 224, § 2º, da CLT, dependente da prova das reais atribuições do empregado, é insuscetível de exame mediante recurso de revista ou de embargos. (ex-Súmula nº 204 - alterada pela Res. 121/2003, DJ 21.11.2003)\nII - O bancário que exerce a função a que se refere o § 2º do art. 224 da CLT e recebe gratificação não inferior a um terço de seu salário já tem remuneradas as duas horas extraordinárias excedentes de seis. (ex-Súmula nº 166 - RA 102/1982, DJ 11.10.1982 e DJ 15.10.1982)\nIII - Ao bancário exercente de cargo de confiança previsto no artigo 224, § 2º, da CLT são devidas as 7ª e 8ª horas, como extras, no período em que se verificar o pagamento a menor da gratificação de 1/3. (ex-OJ nº 288 da SBDI-1 - DJ 11.08.2003)\nIV - O bancário sujeito à regra do art. 224, § 2º, da CLT cumpre jornada de trabalho de 8 (oito) horas, sendo extraordinárias as trabalhadas além da oitava. (ex-Súmula nº 232- RA 14/1985, DJ 19.09.1985)\nV - O advogado empregado de banco, pelo simples exercício da advocacia, não exerce cargo de confiança, não se enquadrando, portanto, na hipótese do § 2º do art. 224 da CLT. (ex-OJ nº 222 da SBDI-1 - inserida em 20.06.2001)\nVI - O caixa bancário, ainda que caixa executivo, não exerce cargo de confiança. Se perceber gratificação igual ou superior a um terço do salário do posto efetivo, essa remunera apenas a maior responsabilidade do cargo e não as duas horas extraordinárias além da sexta. (ex-Súmula nº 102 - RA 66/1980, DJ 18.06.1980 e republicada DJ 14.07.1980)\nVII - O bancário exercente de função de confiança, que percebe a gratificação não inferior ao terço legal, ainda que norma coletiva contemple percentual superior, não tem direito às sétima e oitava horas como extras, mas tão somente às diferenças de gratificação de função, se postuladas. (ex-OJ nº 15 da SBDI-1 - inserida em 14.03.1994)","status":"em_vigor","temas":["Jornada e horas extras","Salário e remuneração","Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 174/2011","data":"2011-05-31","observacao":"(mantida) - Res. 174/2011, DEJT divulgado em 27, 30 e 31.05.2011"},{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"Súmula alterada - Res. 129/2005, DJ 20, 22 e 25.04.2005"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 102 Bancário. Cargo de confiança (incorporadas as Súmulas nºs 166, 204 e 232 e as Orientações Jurisprudenciais nºs 15, 222 e 288 da SBDI-1)\n(...)"},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 102 Bancário. Caixa. Cargo de confiança\nO caixa bancário, ainda que caixa executivo, não exerce cargo de confiança. Se perceber gratificação igual ou superior a um terço do salário do posto efetivo, essa remunera apenas a maior responsabilidade do cargo e não as duas horas extraordinárias além da sexta."},{"evento":"Redação original","ato":"RA 66/1980","data":"1980-06-18","observacao":"Redação original - RA 66/1980, DJ 18.06.1980 - Republicada DJ 14.07.1980"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 102 O caixa bancário, ainda que caixa executivo, não exerce cargo de confiança. Percebendo gratificação igual ou superior a um terço do salário do posto efetivo, esta remunera apenas a maior responsabilidade do cargo e não as duas horas extraordinárias além da sexta."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-103","tribunal":"TST","tipo":"sumula","numero":103,"teor":"TEMPO DE SERVIÇO. LICENÇA-PRÊMIO.\n\nOs trabalhadores que hajam prestado serviço no regime da Lei nº 1.890, de 13.06.1953, e optado pelo regime estatutário, não contam, posteriormente, esse período para fins de licença-prêmio, privativa de servidores estatutários.","status":"cancelada","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 67/1980","data":"1980-06-18","observacao":"Redação original - RA 67/1980, DJ 18.06.1980"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-104","tribunal":"TST","tipo":"sumula","numero":104,"teor":"FÉRIAS. TRABALHADOR RURAL.\n\nÉ devido o pagamento de férias ao rurícola, qualquer que tenha sido a data de sua admissão e, em dobro, se não concedidas na época prevista em lei.","status":"cancelada","temas":["Férias, 13º e descansos","Recursos e prazos","Contrato e vínculo de emprego"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 70/1980","data":"1980-07-21","observacao":"Redação original - RA 70/1980, DJ 21.07.1980"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-105","tribunal":"TST","tipo":"sumula","numero":105,"teor":"FUNCIONÁRIO PÚBLICO. QUINQUÊNIOS.\n\nO empregado estatutário que optar pelo regime celetista, com o congelamento dos qüinqüênios em seus valores à época, não tem direito ao reajuste posterior dos seus níveis.","status":"cancelada","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 71/1980","data":"1980-07-21","observacao":"Redação original - RA 71/1980, DJ 21.07.1980"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-106","tribunal":"TST","tipo":"sumula","numero":106,"teor":"APOSENTADORIA. FERROVIÁRIO. COMPETÊNCIA.\n\nÉ incompetente a Justiça do Trabalho para julgar ação ajuizada em face da Rede Ferroviária Federal, em que ex-empregado desta pleiteie complementação de aposentadoria, elaboração ou alteração de folhas de pagamento de aposentados, se por essas obrigações responde órgão da previdência social.","status":"cancelada","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 157/2009","data":"2009-09-09","observacao":"COMPETÊNCIA (cancelada) - Res. 157/2009, DEJT divulgado em 04, 08 e 09.09.2009"},{"evento":"Manutenção","ato":"Res. 121/2003","data":null,"observacao":"Súmula mantida - Res. 121/2003 - DJ 19, 20 e 21.1.2003"},{"evento":"Redação original","ato":"RA 72/1980","data":"1980-07-21","observacao":"Redação original - RA 72/1980, DJ 21.07.1980"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 106 É incompetente a Justiça do Trabalho para julgar ação contra a Rede Ferroviária Federal, em que ex-empregado desta pleiteie complementação de aposentadoria, elaboração ou alteração de folhas de pagamento de aposentados, se por essas obrigações responde órgão da previdência social."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-107","tribunal":"TST","tipo":"sumula","numero":107,"teor":"AÇÃO RESCISÓRIA. PROVA.\n\nÉ indispensável a juntada à inicial da ação rescisória da prova do trânsito em julgado da decisão rescindenda, sob pena de indeferimento liminar.","status":"cancelada","temas":["Rescisão e verbas rescisórias","Provas e ônus da prova"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelamento mantido) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Cancelamento","ato":"Res. 9/1989","data":"1989-04-19","observacao":"Cancelada pela Súmula nº 299 - Res. 9/1989, DJ 14, 18 e 19.04.1989"},{"evento":"Redação original","ato":"RA 74/1980","data":"1980-07-21","observacao":"Redação original - RA 74/1980, DJ 21.07.1980"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-108","tribunal":"TST","tipo":"sumula","numero":108,"teor":"COMPENSAÇÃO DE HORÁRIO. ACORDO.\n\nA compensação de horário semanal deve ser ajustada por acordo escrito, não necessariamente em acordo coletivo ou convenção coletiva, exceto quanto ao trabalho da mulher.","status":"cancelada","temas":["Jornada e horas extras","Direito coletivo e sindical"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelamento mantido) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Cancelamento","ato":"Res. 85/1998","data":"1998-08-24","observacao":"Súmula cancelada - Res. 85/1998, DJ 20, 21 e 24.08.1998"},{"evento":"Redação original","ato":"RA 75/1980","data":"1980-07-21","observacao":"Redação original - RA 75/1980, DJ 21.07.1980"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-109","tribunal":"TST","tipo":"sumula","numero":109,"teor":"GRATIFICAÇÃO DE FUNÇÃO.\n\nO bancário não enquadrado no § 2º do art. 224 da CLT, que receba gratificação de função, não pode ter o salário relativo a horas extraordinárias compensado com o valor daquela vantagem.","status":"em_vigor","temas":["Jornada e horas extras","Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Nova redação","ato":"RA 97/1980","data":"1980-09-19","observacao":"Súmula alterada - RA 97/1980, DJ 19.09.1980"},{"evento":"Redação original","ato":"RA 89/1980","data":"1980-08-29","observacao":"Redação original - RA 89/1980, DJ 29.08.1980"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 109 A gratificação de função prevista no § 2º, do artigo 224, da Consolidação das Leis do Trabalho, não é compensável com o valor da 7ª (sétima) e da 8ª (oitava) horas de serviço."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-110","tribunal":"TST","tipo":"sumula","numero":110,"teor":"JORNADA DE TRABALHO. INTERVALO.\n\nNo regime de revezamento, as horas trabalhadas em seguida ao repouso semanal de 24 horas, com prejuízo do intervalo mínimo de 11 horas consecutivas para descanso entre jornadas, devem ser remuneradas como extraordinárias, inclusive com o respectivo adicional.","status":"em_vigor","temas":["Jornada e horas extras","Férias, 13º e descansos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 101/1980","data":"1980-09-25","observacao":"Redação original - RA 101/1980, DJ 25.09.1980"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-111","tribunal":"TST","tipo":"sumula","numero":111,"teor":"EQUIPARAÇÃO SALARIAL.\n\nA cessão de empregados não exclui a equiparação salarial, embora exercida a função em órgão governamental estranho à cedente, se esta responde pelos salários do paradigma e do reclamante.","status":"convertida","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"(cancelada em decorrência da sua incorporação à nova redação da Súmula nº 6) - Res. 129/2005, DJ 20, 22 e 25.04.2005"},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 102/1980","data":"1980-09-25","observacao":"Redação original - RA 102/1980, DJ 25.09.1980"}],"observacao":"Cancelada em decorrência da sua incorporação à nova redação da Súmula nº 6 do TST.","alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-112","tribunal":"TST","tipo":"sumula","numero":112,"teor":"TRABALHO NOTURNO. PETRÓLEO.\n\nO trabalho noturno dos empregados nas atividades de exploração, perfuração, produção e refinação do petróleo, industrialização do xisto, indústria petroquímica e transporte de petróleo e seus derivados, por meio de dutos, é regulado pela Lei nº 5.811, de 11.10.1972, não se lhe aplicando a hora reduzida de 52 minutos e 30 segundos prevista no art. 73, § 1º, da CLT.","status":"em_vigor","temas":["Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 107/1980","data":"1980-10-10","observacao":"Redação original - RA 107/1980, DJ 10.10.1980"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 112 O trabalho noturno dos empregados nas atividades de exploração, perfuração, produção e refinação do petróleo, industrialização do xisto, indústria petroquímica e transporte de petróleo e seus derivados, por meio de dutos, é regulado pela Lei nº 5.811, de 1972, não se lhe aplicando a hora reduzida de 52 minutos e 30 segundos do art. 73, § 2º, da CLT."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-113","tribunal":"TST","tipo":"sumula","numero":113,"teor":"BANCÁRIO. SÁBADO. DIA ÚTIL.\n\nO sábado do bancário é dia útil não trabalhado, não dia de repouso remunerado. Não cabe a repercussão do pagamento de horas extras habituais em sua remuneração.","status":"em_vigor","temas":["Jornada e horas extras","Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 115/1980","data":"1980-11-03","observacao":"Redação original - RA 115/1980, DJ 03.11.1980"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 113 O sábado do bancário é dia útil não trabalhado e não dia de repouso remunerado, não cabendo assim a repercussão do pagamento de horas extras habituais sobre a sua remuneração."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-114","tribunal":"TST","tipo":"sumula","numero":114,"teor":"PRESCRIÇÃO INTERCORRENTE.\n\nÉ inaplicável na Justiça do Trabalho a prescrição intercorrente.","status":"cancelada","temas":["Prescrição e decadência"],"historico":[{"evento":"Cancelamento","ato":"Res. 225/2025","data":"2025-07-02","observacao":"Cancelada por perda de eficácia a partir de 11.11.2017, pela Lei 13.467/2017. Res. 225/2025, DEJT divulgado em 30.06, 01 e 02.06.2025."},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003."},{"evento":"Redação original","ato":"RA 116/1980","data":"1980-11-03","observacao":"Redação original - RA 116/1980, DJ 03.11.1980."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-115","tribunal":"TST","tipo":"sumula","numero":115,"teor":"HORAS EXTRAS. GRATIFICAÇÕES SEMESTRAIS.\n\nO valor das horas extras habituais integra a remuneração do trabalhador para o cálculo das gratificações semestrais.","status":"em_vigor","temas":["Jornada e horas extras","Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(nova redação) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 117/1980","data":"1980-11-03","observacao":"Redação original - RA 117/1980, DJ 03.11.1980"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 115 O valor das horas extras habituais integra o ordenado do trabalhador para cálculo das gratificações semestrais."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-116","tribunal":"TST","tipo":"sumula","numero":116,"teor":"FUNCIONÁRIO PÚBLICO. CEDIDO. REAJUSTE SALARIAL.\n\nOs funcionários públicos cedidos à Rede Ferroviária Federal S.A. têm direito ao reajustamento salarial determinado pelo art. 5º da Lei nº 4.345/1964.","status":"cancelada","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Revista pela Súmula nº 252 - Res. 18/1985, DJ 13, 14 e 15.01.1986."},{"evento":"Redação original","ato":"RA 118/1980","data":"1980-11-03","observacao":"Redação original - RA 118/1980, DJ 03.11.1980"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-117","tribunal":"TST","tipo":"sumula","numero":117,"teor":"BANCÁRIO. CATEGORIA DIFERENCIADA.\n\nNão se beneficiam do regime legal relativo aos bancários os empregados de estabelecimento de crédito pertencentes a categorias profissionais diferenciadas.","status":"em_vigor","temas":["Contrato e vínculo de emprego","Direito coletivo e sindical"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 140/1980","data":"1980-12-18","observacao":"Redação original - RA 140/1980, DJ 18.12.1980"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-118","tribunal":"TST","tipo":"sumula","numero":118,"teor":"JORNADA DE TRABALHO. HORAS EXTRAS.\n\nOs intervalos concedidos pelo empregador na jornada de trabalho, não previstos em lei, representam tempo à disposição da empresa, remunerados como serviço extraordinário, se acrescidos ao final da jornada.","status":"em_vigor","temas":["Jornada e horas extras"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 12/1981","data":"1981-03-19","observacao":"Redação original - RA 12/1981, DJ 19.03.1981"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 118 Os intervalos concedidos pelo empregador, na jornada de trabalho, não previstos em lei, representam tempo à disposição da empresa, remunerados como serviço extraordinário, se acrescidos ao final da jornada."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-119","tribunal":"TST","tipo":"sumula","numero":119,"teor":"JORNADA DE TRABALHO.\n\nOs empregados de empresas distribuidoras e corretoras de títulos e valores mobiliários não têm direito à jornada especial dos bancários.","status":"em_vigor","temas":["Jornada e horas extras"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 13/1981","data":"1981-03-19","observacao":"Redação original - RA 13/1981, DJ 19.03.1981"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-120","tribunal":"TST","tipo":"sumula","numero":120,"teor":"EQUIPARAÇÃO SALARIAL. DECISÃO JUDICIAL.\n\nPresentes os pressupostos do art. 461 da CLT, é irrelevante a circunstância de que o desnível salarial tenha origem em decisão judicial que beneficiou o paradigma, exceto se decorrente de vantagem pessoal ou de tese jurídica superada pela jurisprudência de Corte Superior.","status":"convertida","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"(cancelada em decorrência da sua incorporação à nova redação da Súmula nº 6) - Res. 129/2005, DJ 20, 22 e 25.04.2005"},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Nova redação","ato":"Res. 100/2000","data":"2000-09-20","observacao":"Súmula alterada - Res. 100/2000, DJ 18, 19 e 20.09.2000"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 120 Equiparação salarial. Decisão judicial. Presentes os pressupostos do art. 461 da CLT, é irrelevante a circunstância de que o desnível salarial tenha origem em decisão judicial que beneficiou o paradigma, exceto quando decorrente de vantagem pessoal ou de tese jurídica superada pela jurisprudência de Corte Superior."},{"evento":"Redação original","ato":"RA 14/1981","data":"1981-03-19","observacao":"Redação original - RA 14/1981, DJ 19.03.1981"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 120 Presentes os pressupostos do art. 461 da CLT é irrelevante a circunstância de que o desnível salarial tenha origem em decisão judicial que beneficiou o paradigma."}],"observacao":"Cancelada em decorrência da sua incorporação à nova redação da Súmula nº 6 do TST.","alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-121","tribunal":"TST","tipo":"sumula","numero":121,"teor":"FUNCIONÁRIO PÚBLICO. GRATIFICAÇÃO DE PRODUTIVIDADE.\n\nNão tem direito a percepção da gratificação de produtividade, na forma do regime estatutário, o servidor de ex-autarquia administradora de porto que opta pelo regime jurídico da Consolidação das Leis do Trabalho.","status":"cancelada","temas":["Salário e remuneração","Ente público como empregador"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 15/1981","data":"1981-03-19","observacao":"Redação original - RA 15/1981, DJ 19.03.1981"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-122","tribunal":"TST","tipo":"sumula","numero":122,"teor":"REVELIA. ATESTADO MÉDICO.\n\nA reclamada, ausente à audiência em que deveria apresentar defesa, é revel, ainda que presente seu advogado munido de procuração, podendo ser ilidida a revelia mediante a apresentação de atestado médico, que deverá declarar, expressamente, a impossibilidade de locomoção do empregador ou do seu preposto no dia da audiência. (primeira parte - ex-OJ nº 74 da SBDI-1 - inserida em 25.11.1996; segunda parte - ex-Súmula nº 122 - alterada pela Res. 121/2003, DJ 21.11.2003)","status":"em_vigor","temas":["Provas e ônus da prova"],"historico":[{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"(incorporada a Orientação Jurisprudencial nº 74 da SBDI-1) - Res. 129/2005, DJ 20, 22 e 25.04.2005"},{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula alterada - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 122 Atestado médico. Revelia\nPara ilidir a revelia, o atestado médico deve declarar expressamente a impossibilidade de locomoção do empregador ou de seu preposto no dia da audiência."},{"evento":"Redação original","ato":"RA 80/1981","data":"1981-10-06","observacao":"Redação original - RA 80/1981, DJ 06.10.1981"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 122 Para elidir a revelia o atestado médico deve declarar expressamente a impossibilidade de locomoção do empregador ou seu preposto, no dia da audiência."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-123","tribunal":"TST","tipo":"sumula","numero":123,"teor":"COMPETÊNCIA. ART. 106 DA CF.\n\nEm se tratando de Estado ou Município, a lei que estabelece o regime jurídico (art. 106 da Constituição Federal) do servidor temporário ou contratado é a estadual ou municipal, a qual, uma vez editada, apanha as situações preexistentes, fazendo cessar sua regência pelo regime trabalhista. Incompetente é a Justiça do Trabalho para julgar as reclamações ajuizadas posteriormente à vigência da lei especial.","status":"cancelada","temas":["Estabilidade e garantias de emprego","Ente público como empregador"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 81/1981","data":"1981-10-06","observacao":"Redação original - RA 81/1981, DJ 06.10.1981 - Republicada DJ 13.10.1981"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-124","tribunal":"TST","tipo":"sumula","numero":124,"teor":"BANCÁRIO. SALÁRIO-HORA. DIVISOR.\n\nI - O divisor aplicável para o cálculo das horas extras do bancário será:\na)180, para os empregados submetidos à jornada de seis horas prevista no caput do art. 224 da CLT;\nb) 220, para os empregados submetidos à jornada de oito horas, nos termos do § 2º do art. 224 da CLT.\nII - Ressalvam-se da aplicação do item anterior as decisões de mérito sobre o tema, qualquer que seja o s eu teor, emanadas de Turma do TST ou da SBDI-I, no período de 27/09/2012 até 21/11/2016, conforme a modulação aprovada no precedente obrigatório firmado no Incidente de Recursos de Revista Repetitivos nº TST-IRR-849-83.2013.5.03.0138, DEJT 19.12.2016.","status":"em_vigor","temas":["Jornada e horas extras","Salário e remuneração","Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 219/2017","data":"2017-07-14","observacao":"(alteração em razão do julgamento do processo TST-IRR 849-83.2013.5.03.0138) - Res. 219/2017, DEJT divulgado em 28, 29 e 30.06.2017 - Republicada - DEJT divulgado em 12, 13 e 14.07.2017"},{"evento":"Nova redação","ato":"Res. 185/2012","data":"2012-09-14","observacao":"Súmula alterada - redação alterada na sessão do Tribunal Pleno realizada em 14.09.2012 - Res. 185/2012- DEJT divulgado em 25, 26 e 27.09.2012"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 124 Bancário. Hora de salário. Divisor\nI - O divisor aplicável para o cálculo das horas extras do bancário, se houver ajuste individual expresso ou coletivo no sentido de considerar o sábado como dia de descanso remunerado, será:\na) 150, para os empregados submetidos à jornada de seis horas, prevista no caput do art. 224 da CLT;\nb) 200, para os empregados submetidos à jornada de oito horas, nos termos do § 2º do art. 224 da CLT.\nII - Nas demais hipóteses, aplicar-se-á o divisor:\na)180, para os empregados submetidos à jornada de seis horas prevista no caput do art. 224 da CLT;\nb) 220, para os empregados submetidos à jornada de oito horas, nos termos do § 2º do art. 224 da CLT."},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 124 Bancário. Hora de salário. Divisor"},{"evento":"Redação original","ato":"RA 82/1981","data":"1981-10-06","observacao":"Redação original - RA 82/1981, DJ 06.10.1981"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 124 Para o cálculo do salário-hora do bancário mensalista, o divisor a ser adotado é o de 180 (cento e oitenta)"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-125","tribunal":"TST","tipo":"sumula","numero":125,"teor":"CONTRATO DE TRABALHO. ART. 479 DA CLT.\n\nO art. 479 da CLT aplica-se ao trabalhador optante pelo FGTS admitido mediante contrato por prazo determinado, nos termos do art. 30, § 3º, do Decreto nº 59.820, de 20.12.1966.","status":"em_vigor","temas":["FGTS","Contrato e vínculo de emprego"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DEJT divulgado em 12, 13 e 14.07.2017"},{"evento":"Redação original","ato":"RA 83/1981","data":"1981-10-06","observacao":"Redação original - RA 83/1981, DJ 06.10.1981"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 125 O artigo 479, da CLT, aplica-se ao trabalhador optante pelo FGTS, admitido mediante contrato por prazo determinado, nos termos do art. 30, § 3º, do Decreto nº 59.820, de 20 de dezembro de 1966."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-126","tribunal":"TST","tipo":"sumula","numero":126,"teor":"RECURSO. CABIMENTO.\n\nIncabível o recurso de revista ou de embargos (arts. 896 e 894, \"b\", da CLT) para reexame de fatos e provas.","status":"em_vigor","temas":["Recursos e prazos","Provas e ônus da prova"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 84/1981","data":"1981-10-06","observacao":"Redação original - RA 84/1981, DJ 06.10.1981"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 126 Incabível o recurso de revista ou de embargos (arts. 896 e 894, letra b da CLT) para reexame de fatos e provas."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-127","tribunal":"TST","tipo":"sumula","numero":127,"teor":"QUADRO DE CARREIRA.\n\nQuadro de pessoal organizado em carreira, aprovado pelo órgão competente, excluída a hipótese de equiparação salarial, não obsta reclamação fundada em preterição, enquadramento ou reclassificação.","status":"em_vigor","temas":["Salário e remuneração","Provas e ônus da prova"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 103/1981","data":"1981-11-12","observacao":"Redação original - RA 103/1981, DJ 12.11.1981"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-128","tribunal":"TST","tipo":"sumula","numero":128,"teor":"DEPÓSITO RECURSAL.\n\nI - É ônus da parte recorrente efetuar o depósito legal, integralmente, em relação a cada novo recurso interposto, sob pena de deserção. Atingido o valor da condenação, nenhum depósito mais é exigido para qualquer recurso. (ex-Súmula nº 128 - alterada pela Res. 121/2003, DJ 21.11.03, que incorporou a OJ nº 139 da SBDI-1 - inserida em 27.11.1998)\nII - Garantido o juízo, na fase executória, a exigência de depósito para recorrer de qualquer decisão viola os incisos II e LV do art. 5º da CF/1988. Havendo, porém, elevação do valor do débito, exige-se a complementação da garantia do juízo. (ex-OJ nº 189 da SBDI-1 - inserida em 08.11.2000)\nIII - Havendo condenação solidária de duas ou mais empresas, o depósito recursal efetuado por uma delas aproveita as demais, quando a empresa que efetuou o depósito não pleiteia sua exclusão da lide. (ex-OJ nº 190 da SBDI-1 - inserida em 08.11.2000)","status":"em_vigor","temas":["Honorários, custas e justiça gratuita","Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"(incorporadas as Orientações Jurisprudenciais nºs 139, 189 e 190 da SBDI-1) - Res. 129/2005, DJ 20, 22 e 25.04.2005"},{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula alterada - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 128 Depósito recursal. Complementação devida. Aplicação da Instrução Normativa nº 3, II, DJ 12.03.1993\nÉ ônus da parte recorrente efetuar o depósito legal, integralmente, em relação a cada novo recurso interposto, sob pena de deserção. Atingido o valor da condenação, nenhum depósito mais é exigido para qualquer recurso."},{"evento":"Redação original","ato":"RA 115/1981","data":"1981-12-21","observacao":"Redação original - RA 115/1981, DJ 21.12.1981"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 128 Da mesma forma que as custas, o depósito da condenação deve ser complementado até o limite legal se acrescida a condenação pelo acórdão regional, sob pena de deserção."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-129","tribunal":"TST","tipo":"sumula","numero":129,"teor":"CONTRATO DE TRABALHO. GRUPO ECONÔMICO.\n\nA prestação de serviços a mais de uma empresa do mesmo grupo econômico, durante a mesma jornada de trabalho, não caracteriza a coexistência de mais de um contrato de trabalho, salvo ajuste em contrário.","status":"em_vigor","temas":["Terceirização e responsabilidade","Jornada e horas extras","Contrato e vínculo de emprego"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 26/1982","data":"1982-05-04","observacao":"Redação original - RA 26/1982, DJ 04.05.1982"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-130","tribunal":"TST","tipo":"sumula","numero":130,"teor":"ADICIONAL NOTURNO.\n\nO regime de revezamento no trabalho não exclui o direito do empregado ao adicional noturno, em face da derrogação do art. 73 da CLT pelo art. 157, item III, da Constituição de 18.09.1946 (ex-Prejulgado nº 1).","status":"cancelada","temas":["Adicionais (insalubridade, periculosidade e outros)"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 102/1982","data":"1982-10-11","observacao":"Redação original - RA 102/1982, DJ 11.10.1982 e DJ 15.10.1982"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 130 O regime de revezamento no trabalho não exclui o direito do empregado ao adicional noturno, face à derrogação do art. 73 da CLT, pelo art. 157, item III, da Constituição de 18.09.1946 (ex-Prejulgado nº 1)."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-131","tribunal":"TST","tipo":"sumula","numero":131,"teor":"SALÁRIO MÍNIMO. VIGÊNCIA.\n\nO salário mínimo, uma vez decretado em condições de excepcionalidade, tem imediata vigência (ex-Prejulgado nº 2).","status":"cancelada","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 102/1982","data":"1982-10-11","observacao":"Redação original - RA 102/1982, DJ 11.10.1982 e DJ 15.10.1982"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-132","tribunal":"TST","tipo":"sumula","numero":132,"teor":"ADICIONAL DE PERICULOSIDADE. INTEGRAÇÃO.\n\nI - O adicional de periculosidade, pago em caráter permanente, integra o cálculo de indenização e de horas extras (ex-Prejulgado nº 3). (ex-Súmula nº 132 - RA 102/1982, DJ 11.10.1982/ DJ 15.10.1982 - e ex-OJ nº 267 da SBDI-1 - inserida em 27.09.2002)\nII - Durante as horas de sobreaviso, o empregado não se encontra em condições de risco, razão pela qual é incabível a integração do adicional de periculosidade sobre as mencionadas horas. (ex-OJ nº 174 da SBDI-1 - inserida em 08.11.2000)","status":"em_vigor","temas":["Adicionais (insalubridade, periculosidade e outros)","Jornada e horas extras"],"historico":[{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"(incorporadas as Orientações Jurisprudenciais nºs 174 e 267 da SBDI-1) - Res. 129/2005, DJ 20, 22 e 25.04.2005"},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 132 Adicional de periculosidade\nO adicional de periculosidade pago em caráter permanente integra o cálculo de indenização (ex-Prejulgado nº 3)."},{"evento":"Redação original","ato":"RA 102/1982","data":"1982-10-11","observacao":"Redação original - RA 102/1982, DJ 11.10.1982 e DJ 15.10.1982"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 132 O adicional-periculosidade pago em caráter permanente integra o cálculo de indenização (ex-Prejulgado nº 3 )."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-133","tribunal":"TST","tipo":"sumula","numero":133,"teor":"EMBARGOS INFRINGENTES.\n\nPara o julgamento dos embargos infringentes, nas juntas, é desnecessária a notificação das partes (ex-Prejulgado nº 4).","status":"cancelada","temas":["Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 102/1982","data":"1982-10-11","observacao":"Redação original - RA 102/1982, DJ 11.10.1982 e DJ 15.10.1982"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-134","tribunal":"TST","tipo":"sumula","numero":134,"teor":"SALÁRIO. MENOR NÃO APRENDIZ.\n\nAo menor não aprendiz é devido o salário mínimo integral (ex-Prejulgado nº 5).","status":"cancelada","temas":["Salário e remuneração","Contrato e vínculo de emprego"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 102/1982","data":"1982-10-11","observacao":"Redação original - RA 102/1982, DJ 11.10.1982 e DJ 15.10.1982"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-135","tribunal":"TST","tipo":"sumula","numero":135,"teor":"SALÁRIO. EQUIPARAÇÃO.\n\nPara efeito de equiparação de salários em caso de trabalho igual, conta-se o tempo de serviço na função e não no emprego (ex-Prejulgado nº 6).","status":"convertida","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"(cancelada em decorrência da sua incorporação à nova redação da Súmula nº 6) - Res. 129/2005, DJ 20, 22 e 25.04.2005"},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003."},{"evento":"Redação original","ato":"RA 102/1982","data":"1982-10-11","observacao":"Redação original - RA 102/1982, DJ 11.10.1982 e DJ 15.10.1982"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 135 Para efeito de equiparação de salários, em caso de trabalho igual, conta-se o tempo de serviço na função, e não no emprego (ex-Prejulgado nº 6)."}],"observacao":"Cancelada em decorrência da sua incorporação à nova redação da Súmula nº 6 do TST.","alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-136","tribunal":"TST","tipo":"sumula","numero":136,"teor":"JUIZ. IDENTIDADE FÍSICA.\n\nNão se aplica às Varas do Trabalho o princípio da identidade física do juiz (ex-Prejulgado nº 7).","status":"cancelada","temas":["Outros"],"historico":[{"evento":"Nova redação","ato":"Res. 185/2012","data":"2012-09-27","observacao":"(cancelada) - Res. 185/2012, DEJT divulgado em 25, 26 e 27.09.2012"},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003."},{"evento":"Redação original","ato":"RA 102/1982","data":"1982-10-11","observacao":"Redação original - RA 102/1982, DJ 11.10.1982 e DJ 15.10.1982"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 136 Não se aplica às Juntas de Conciliação e Julgamento o princípio da identidade física do Juiz (ex-Prejulgado nº 7)."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-137","tribunal":"TST","tipo":"sumula","numero":137,"teor":"ADICIONAL DE INSALUBRIDADE.\n\nÉ devido o adicional de serviço insalubre, calculado à base do salário mínimo da região, ainda que a remuneração contratual seja superior ao salário mínimo acrescido da taxa de insalubridade (ex-Prejulgado nº 8).","status":"cancelada","temas":["Adicionais (insalubridade, periculosidade e outros)","Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 102/1982","data":"1982-10-11","observacao":"Redação original - RA 102/1982, DJ 11.10.1982 e DJ 15.10.1982"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-138","tribunal":"TST","tipo":"sumula","numero":138,"teor":"READMISSÃO.\n\nEm caso de readmissão, conta-se a favor do empregado o período de serviço anterior, encerrado com a saída espontânea (ex-Prejulgado nº 9).","status":"em_vigor","temas":["Estabilidade e garantias de emprego"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 102/1982","data":"1982-10-11","observacao":"Redação original - RA 102/1982, DJ 11.10.1982 e DJ 15.10.1982"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-139","tribunal":"TST","tipo":"sumula","numero":139,"teor":"ADICIONAL DE INSALUBRIDADE.\n\nEnquanto percebido, o adicional de insalubridade integra a remuneração para todos os efeitos legais. (ex-OJ nº 102 da SBDI-1 - inserida em 01.10.1997)","status":"em_vigor","temas":["Adicionais (insalubridade, periculosidade e outros)","Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"(incorporada a Orientação Jurisprudencial nº 102 da SBDI-1) - Res. 129/2005, DJ 20, 22 e 25.04.2005"},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 102/1982","data":"1982-10-11","observacao":"Redação original - RA 102/1982, DJ 11.10.1982 e DJ 15.10.1982"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 139 O adicional de insalubridade, pago em caráter permanente, integra a remuneração para o cálculo de indenização (ex-Prejulgado nº 11)."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-140","tribunal":"TST","tipo":"sumula","numero":140,"teor":"VIGIA.\n\nÉ assegurado ao vigia sujeito ao trabalho noturno o direito ao respectivo adicional (ex-Prejulgado nº 12).","status":"em_vigor","temas":["Adicionais (insalubridade, periculosidade e outros)"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 102/1982","data":"1982-10-11","observacao":"Redação original - RA 102/1982, DJ 11.10.1982 e DJ 15.10.1982"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 140 É assegurado ao vigia, sujeito ao trabalho noturno, o direito ao respectivo adicional (ex-Prejulgado nº 12)."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-141","tribunal":"TST","tipo":"sumula","numero":141,"teor":"DISSÍDIO COLETIVO.\n\nÉ constitucional o art. 2º da Lei nº 4.725, de 13.07.1965 (ex-Prejulgado nº 13).","status":"cancelada","temas":["Direito coletivo e sindical"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 102/1982","data":"1982-10-11","observacao":"Redação original - RA 102/1982, DJ 11.10.1982 e DJ 15.10.1982"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 141 É constitucional o art. 2º, da Lei nº 4.725, de 13 de julho de 1965 (ex-Prejulgado squisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-144","tribunal":"TST","tipo":"sumula","numero":144,"teor":"AÇÃO RESCISÓRIA.\n\nÉ cabível a ação rescisória no âmbito da Justiça do Trabalho (ex-Prejulgado nº 16).","status":"cancelada","temas":["Rescisão e verbas rescisórias"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 102/1982","data":"1982-10-11","observacao":"Redação original - RA 102/1982, DJ 11.10.1982 e DJ 15.10.1982"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-145","tribunal":"TST","tipo":"sumula","numero":145,"teor":"GRATIFICAÇÃO DE NATAL.\n\nÉ compensável a gratificação de Natal com a da Lei nº 4.090, de 1962 (ex-Prejulgado nº 17).","status":"cancelada","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 102/1982","data":"1982-10-11","observacao":"Redação original - RA 102/1982, DJ 11.10.1982 e DJ 15.10.1982"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-146","tribunal":"TST","tipo":"sumula","numero":146,"teor":"TRABALHO EM DOMINGOS E FERIADOS, NÃO COMPENSADO.\n\nO trabalho prestado em domingos e feriados, não compensado, deve ser pago em dobro, sem prejuízo da remuneração relativa ao repouso semanal.","status":"em_vigor","temas":["Férias, 13º e descansos","Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(incorporada a Orientação Jurisprudencial nº 93 da SBDI-1) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 102/1982","data":"1982-10-11","observacao":"Redação original - RA 102/1982, DJ 11.10.1982 e DJ 15.10.1982"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 146 O trabalho realizado em dia feriado, não compensado, é pago em dobro e não em triplo (ex-Prejulgado nº 18)."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-147","tribunal":"TST","tipo":"sumula","numero":147,"teor":"FÉRIAS. INDENIZAÇÃO.\n\nIndevido o pagamento dos repousos semanais e feriados intercorrentes nas férias indenizadas (ex-Prejulgado nº 19).","status":"cancelada","temas":["Férias, 13º e descansos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 102/1982","data":"1982-10-11","observacao":"Redação original - RA 102/1982, DJ 11.10.1982 e DJ 15.10.1982"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-148","tribunal":"TST","tipo":"sumula","numero":148,"teor":"GRATIFICAÇÃO NATALINA.\n\nÉ computável a gratificação de Natal para efeito de cálculo de indenização (ex-Prejulgado nº 20).","status":"em_vigor","temas":["Férias, 13º e descansos","Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 102/1982","data":"1982-10-11","observacao":"Redação original - RA 102/1982, DJ 11.10.1982 e DJ 15.10.1982"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 148 É computável a gratificação de Natal para efeito de cálculo da indenização (ex-Prejulgado nº 20)."}],"observacao":null,"alerta":null,
