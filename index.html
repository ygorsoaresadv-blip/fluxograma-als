<script id="sumulasDados" type="application/json">[{"id":"tst-1","tribunal":"TST","tipo":"sumula","numero":1,"teor":"PRAZO JUDICIAL.\n\nQuando a intimação tiver lugar na sexta-feira, ou a publicação com efeito de intimação for feita nesse dia, o prazo judicial será contado da segunda-feira imediata, inclusive, salvo se não houver expediente, caso em que fluirá no dia útil que se seguir.","status":"em_vigor","temas":["Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 28/1969","data":"1969-08-21","observacao":"Redação original - RA 28/1969, DO-GB 21.08.1969"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-2","tribunal":"TST","tipo":"sumula","numero":2,"teor":"GRATIFICAÇÃO NATALINA.\n\nÉ devida a gratificação natalina proporcional (Lei nº 4.090, de 1962) na extinção dos contratos a prazo, entre estes incluídos os de safra, ainda que a relação de emprego haja findado antes de dezembro.","status":"cancelada","temas":["Férias, 13º e descansos","Salário e remuneração","Contrato e vínculo de emprego"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 28/1969","data":"1969-08-21","observacao":"Redação original - RA 28/1969, DO-GB 21.08.1969"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-3","tribunal":"TST","tipo":"sumula","numero":3,"teor":"GRATIFICAÇÃO NATALINA.\n\nÉ devida a gratificação natalina proporcional (Lei nº 4.090, de 1962) na cessação da relação de emprego resultante da aposentadoria do trabalhador, ainda que verificada antes de dezembro.","status":"cancelada","temas":["Férias, 13º e descansos","Salário e remuneração","Contrato e vínculo de emprego"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003 DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 28/1969","data":"1969-08-21","observacao":"Redação original - RA 28/1969, DO-GB 21.08.1969"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-4","tribunal":"TST","tipo":"sumula","numero":4,"teor":"CUSTAS.\n\nAs pessoas jurídicas de direito público não estão sujeitas a prévio pagamento de custas, nem a depósito da importância da condenação, para o processamento de recurso na Justiça do Trabalho.","status":"cancelada","temas":["Honorários, custas e justiça gratuita","Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 28/1969","data":"1969-08-21","observacao":"Redação original - RA 28/1969, DO-GB 21.08.1969"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-5","tribunal":"TST","tipo":"sumula","numero":5,"teor":"REAJUSTAMENTO SALARIAL.\n\nO reajustamento salarial coletivo, determinado no curso do aviso prévio, beneficia o empregado pré-avisado da despedida, mesmo que tenha recebido antecipadamente os salários correspondentes ao período do aviso, que integra o seu tempo de serviço para todos os efeitos legais.","status":"cancelada","temas":["Salário e remuneração","Estabilidade e garantias de emprego","Rescisão e verbas rescisórias"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 28/1969","data":"1969-08-21","observacao":"Redação original - RA 28/1969, DO-GB 21.08.1969"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-6","tribunal":"TST","tipo":"sumula","numero":6,"teor":"EQUIPARAÇÃO SALARIAL. ART. 461 DA CLT.\n\nI - Para os fins previstos no § 2º do art. 461 da CLT, só é válido o quadro de pessoal organizado em carreira quando homologado pelo Ministério do Trabalho, excluindo-se, apenas, dessa exigência o quadro de carreira das entidades de direito público da administração direta, autárquica e fundacional aprovado por ato administrativo da autoridade competente. (item cancelado por perda de eficácia a partir de 11/11/2017, pela Lei 13.467/2017, Res. 225/2025 - DEJT divulgado em 30.06, 01 e 02.07.2025)\nII - Para efeito de equiparação de salários em caso de trabalho igual, conta-se o tempo de serviço na função e não no emprego. (item cancelado por perda de eficácia a partir de 11/11/2017, pela Lei 13.467/2017, Res. 225/2025 - DEJT divulgado em 30.06, 01 e 02.07.2025)\nIII - A equiparação salarial só é possível se o empregado e o paradigma exercerem a mesma função, desempenhando as mesmas tarefas, não importando se os cargos têm, ou não, a mesma denominação. (ex-OJ da SBDI-1 nº 328 - DJ 09.12.2003).\nIV - É desnecessário que, ao tempo da reclamação sobre equiparação salarial, reclamante e paradigma estejam a serviço do estabelecimento, desde que o pedido se relacione com situação pretérita. (ex-Súmula nº 22 - RA 57/1970, DO-GB 27.11.1970).\nV - A cessão de empregados não exclui a equiparação salarial, embora exercida a função em órgão governamental estranho à cedente, se esta responde pelos salários do paradigma e do reclamante. (ex-Súmula nº 111 - RA 102/1980, DJ 25.09.1980).\nVI - Presentes os pressupostos do art. 461 da CLT, é irrelevante a circunstância de que o desnível salarial tenha origem em decisão judicial que beneficiou o paradigma, exceto: a) se decorrente de vantagem pessoal ou de tese jurídica superada pela jurisprudência de Corte Superior; b) na hipótese de equiparação salarial em cadeia, suscitada em defesa, se o empregador produzir prova do alegado fato modificativo, impeditivo ou extintivo do direito à equiparação salarial em relação ao paradigma remoto, considerada irrelevante, para esse efeito, a existência de diferença de tempo de serviço na função superior a dois anos entre o reclamante e os empregados paradigmas componentes da cadeia equiparatória, à exceção do paradigma imediato. (alínea cancelada por perda de eficácia a partir de 11/11/2017, pela Lei 13.467/2017, Res. 225/2025 - DEJT divulgado em 30.06, 01 e 02.07.2025)\nVII - Desde que atendidos os requisitos do art. 461 da CLT, é possível a equiparação salarial de trabalho intelectual, que pode ser avaliado por sua perfeição técnica, cuja aferição terá critérios objetivos. (ex-OJ da SBDI-1 nº 298 - DJ 11.08.2003).\nVIII - É do empregador o ônus da prova do fato impeditivo, modificativo ou extintivo da equiparação salarial. (ex-Súmula nº 68 - RA 9/1977, DJ 11.02.1977).\nIX - Na ação de equiparação salarial, a prescrição é parcial e só alcança as diferenças salariais vencidas no período de 5 (cinco) anos que precedeu o ajuizamento. (ex-Súmula nº 274 - alterada pela Res. 121/2003, DJ 21.11.2003).\nX - O conceito de \"mesma localidade\" de que trata o art. 461 da CLT refere-se, em princípio, ao mesmo município, ou a municípios distintos que, comprovadamente, pertençam à mesma região metropolitana. (item cancelado por perda de eficácia a partir de 11/11/2017, pela Lei 13.467/2017, Res. 225/2025 - DEJT divulgado em 30.06, 01 e 02.07.2025)","status":"em_vigor","temas":["Salário e remuneração","Prescrição e decadência","Provas e ônus da prova"],"historico":[{"evento":"Nova redação","ato":"Res. 225/2025","data":"2025-07-02","observacao":"Itens I, II, VI, alínea \"b\", e item X cancelados por perda de eficácia a partir de 11.11.2017, pela Lei 13.467/2017, Res. 225/2025 - DEJT divulgado em 30.06, 01 e 02.07.2025"},{"evento":"Nova redação","ato":"Res. 104/2000","data":"2000-12-20","observacao":"Item I - ex-Súmula nº 06 - alterada pela Res. 104/2000, DJ 20.12.2000"},{"evento":"Nova redação","ato":"RA 102/1982","data":"1982-10-11","observacao":"Item II - ex-Súmula nº 135 - RA 102/1982, DJ 11.10.1982 e DJ 15.10.1982"},{"evento":"Nova redação","ato":null,"data":"2002-03-13","observacao":"Item X - ex-OJ da SBDI-1 nº 252 - inserida em 13.03.2002"},{"evento":"Nova redação","ato":"Res. 198/2015","data":"2015-06-16","observacao":"Item VI alterado - Res. 198/2015, republicada em razão de erro material - DEJT divulgado em 12, 15 e 16.06.2015"},{"evento":"Nova redação","ato":"Res. 185/2012","data":"2012-09-14","observacao":"Item VI alterado - (redação do item VI alterada na sessão do Tribunal Pleno realizada em 14.09.2012) Res. 185/2012, DEJT divulgado em 25, 26 e 27.09.2012"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"VI - Presentes os pressupostos do art. 461 da CLT, é irrelevante a circunstância de que o desnível salarial tenha origem em decisão judicial que beneficiou o paradigma, exceto se decorrente de vantagem pessoal, de tese jurídica superada pela jurisprudência de Corte Superior ou, na hipótese de equiparação salarial em cadeia, suscitada em defesa, se o empregador produzir prova do alegado fato modificativo, impeditivo ou extintivo do direito à equiparação salarial em relação ao paradigma remoto."},{"evento":"Nova redação","ato":"Res. 172/2010","data":"2010-11-16","observacao":"Item VI alterado - (redação do item VI alterada na sessão do Tribunal Pleno realizada em 16.11.2010) Res. 172/2010, DEJT divulgado em 19, 22 e 23.11.2010"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"VI - Presentes os pressupostos do art. 461 da CLT, é irrelevante a circunstância de que o desnível salarial tenha origem em decisão judicial que beneficiou o paradigma, exceto se decorrente de vantagem pessoal, de tese jurídica superada pela jurisprudência de Corte Superior ou, na hipótese de equiparação salarial em cadeia, se não demonstrada a presença dos requisitos da equiparação em relação ao paradigma que deu origem à pretensão, caso arguida a objeção pelo reclamado. (item alterado na sessão do Tribunal Pleno realizada em 16.11.2010)"},{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"Item VI alterado - (incorporação das Súmulas nºs 22, 68, 111, 120, 135 e 274 e das Orientações Jurisprudenciais nºs 252, 298 e 328 da SBDI-1) - Res. 129/2005, DJ 20, 22 e 25.04.2005"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"VI - Presentes os pressupostos do art. 461 da CLT, é irrelevante a circunstância de que o desnível salarial tenha origem em decisão judicial que beneficiou o paradigma, exceto se de-corrente de vantagem pessoal ou de tese jurídica superada pela jurisprudência de Corte Superior. (ex-Súmula nº 120 - alterada pela Res. 100/2000, DJ 20.09.2000)"},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 6 Quadro de carreira. Homologação. Equiparação salarial\nPara os fins previstos no § 2º do art. 461 da CLT, só é válido o quadro de pessoal organizado em carreira quando homologado pelo Ministério do Trabalho, excluindo-se, apenas, dessa exigência o quadro de carreira das entidades de direito público da administração direta, autárquica e fundacional, aprovado por ato administrativo da autoridade competente."},{"evento":"Nova redação","ato":"Res. 104/2000","data":"2000-12-20","observacao":"Súmula alterada - Res. 104/2000, DJ 18, 19 e 20.12.2000"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 6 Quadro de carreira. Homologação. Equiparação salarial\nPara os fins previstos no parágrafo 2º do artigo 461 da CLT, só é válido o quadro de pessoal organizado em carreira quando homologado pelo Ministério do Trabalho, excluindo-se, apenas, dessa exigência, o quadro de carreira das entidades de Direito Público da administração direta, autárquica e fundacional e aprovado por ato administrativo da autoridade competente."},{"evento":"Redação original","ato":"RA 28/1969","data":"1969-08-21","observacao":"Redação original - RA 28/1969, DO-GB 21.08.1969"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 6 Para os fins previstos no § 2º do art. 461 da C. L. T., só é válido o quadro de pessoal organizado em carreira quando homologado pelo Ministério do Trabalho e Previdência Social."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-7","tribunal":"TST","tipo":"sumula","numero":7,"teor":"FÉRIAS.\n\nA indenização pelo não-deferimento das férias no tempo oportuno será calculada com base na remuneração devida ao empregado na época da reclamação ou, se for o caso, na da extinção do contrato.","status":"em_vigor","temas":["Férias, 13º e descansos","Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 28/1969","data":"1969-08-21","observacao":"Redação original - RA 28/1969, DO-GB 21.08.1969"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 7 A indenização pelo não deferimento das férias no tempo oportuno será calculada com base na remuneração devida ao empregado à época da reclamação ou, se for o caso, à da extinção do contrato."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-8","tribunal":"TST","tipo":"sumula","numero":8,"teor":"JUNTADA DE DOCUMENTO.\n\nA juntada de documentos na fase recursal só se justifica quando provado o justo impedimento para sua oportuna apresentação ou se referir a fato posterior à sentença.","status":"em_vigor","temas":["Provas e ônus da prova"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003). - Entendimento reafirmado no IRR nº 286.\nIRR-286 JUNTADA DE DOCUMENTO NA FASE RECURSAL. (RR-0010013-87.2024.5.03.0073, Tribunal Pleno, publicado em 03.09.2025, rel. Min. Aloysio Silva Corrêa da Veiga)\nA juntada de documentos na fase recursal só se justifica quando provado o justo impedimento para sua oportuna apresentação ou se referir a fato posterior à sentença."},{"evento":"Redação original","ato":"RA 28/1969","data":"1969-08-21","observacao":"Redação original - RA 28/1969, DO-GB 21.08.1969"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-9","tribunal":"TST","tipo":"sumula","numero":9,"teor":"AUSÊNCIA DO RECLAMANTE.\n\nA ausência do reclamante, quando adiada a instrução após contestada a ação em audiência, não importa arquivamento do processo.","status":"em_vigor","temas":["Outros"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 28/1969","data":"1969-08-21","observacao":"Redação original - RA 28/1969, DO-GB 21.08.1969"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-10","tribunal":"TST","tipo":"sumula","numero":10,"teor":"PROFESSOR. DISPENSA SEM JUSTA CAUSA. TÉRMINO DO ANO LETIVO OU NO CURSO DE FÉRIAS ESCOLARES. AVISO PRÉVIO.\n\nO direito aos salários do período de férias escolares assegurado aos professores (art. 322, caput e § 3º, da CLT) não exclui o direito ao aviso prévio, na hipótese de dispensa sem justa causa ao término do ano letivo ou no curso das férias escolares.","status":"em_vigor","temas":["Férias, 13º e descansos","Salário e remuneração","Rescisão e verbas rescisórias"],"historico":[{"evento":"Nova redação","ato":"Res. 185/2012","data":"2012-09-27","observacao":"(redação alterada em sessão do Tribunal Pleno realizada em 14.09.2012) - Res. 185/2012, DEJT divulgado em 25, 26 e 27.09.2012"},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 10 Professor"},{"evento":"Redação original","ato":"RA 28/1969","data":"1969-08-21","observacao":"Redação original - RA 28/1969, DO-GB 21.08.1969"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 10 Professor\nÉ assegurado aos professores o pagamento dos salários no período de férias escolares. Se despedido sem justa causa, ao terminar o ano letivo ou no curso dessas férias, faz jus aos referidos salários."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-11","tribunal":"TST","tipo":"sumula","numero":11,"teor":"HONORÁRIOS DE ADVOGADO.\n\nÉ inaplicável na Justiça do Trabalho o disposto no art. 64 do Código de Processo Civil, sendo os honorários de advogado somente devidos nos termos do preceituado na Lei nº 1.060, de 1950.","status":"cancelada","temas":["Honorários, custas e justiça gratuita"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 28/1969","data":"1969-08-21","observacao":"Redação original - RA 28/1969, DO-GB 21.08.1969"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-12","tribunal":"TST","tipo":"sumula","numero":12,"teor":"CARTEIRA PROFISSIONAL.\n\nAs anotações apostas pelo empregador na carteira profissional do empregado não geram presunção \"juris et de jure\", mas apenas \"juris tantum\".","status":"em_vigor","temas":["Provas e ônus da prova"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003). - Entendimento reafirmado no IRR nº 240.\nIRR-240 CARTEIRA DE TRABALHO. ANOTAÇÕES. (RR-0010173-11.2023.5.03.0021, Tribunal Pleno, publicado em 02.09.2025, rel. Min. Aloysio Silva Corrêa da Veiga)\nAs anotações apostas pelo empregador na carteira profissional do empregado não geram presunção absoluta, mas apenas relativa."},{"evento":"Redação original","ato":"RA 28/1969","data":"1969-08-21","observacao":"Redação original - RA 28/1969, DO-GB 21.08.1969"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-13","tribunal":"TST","tipo":"sumula","numero":13,"teor":"MORA.\n\nO só pagamento dos salários atrasados em audiência não ilide a mora capaz de determinar a rescisão do contrato de trabalho.","status":"em_vigor","temas":["Salário e remuneração","Rescisão e verbas rescisórias","Contrato e vínculo de emprego"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 28/1969","data":"1969-08-21","observacao":"Redação original - RA 28/1969, DO-GB 21.08.1969"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-14","tribunal":"TST","tipo":"sumula","numero":14,"teor":"CULPA RECÍPROCA.\n\nReconhecida a culpa recíproca na rescisão do contrato de trabalho (art. 484 da CLT), o empregado tem direito a 50% (cinqüenta por cento) do valor do aviso prévio, do décimo terceiro salário e das férias proporcionais.","status":"em_vigor","temas":["Férias, 13º e descansos","Salário e remuneração","Rescisão e verbas rescisórias"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(nova redação) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 28/1969","data":"1969-08-21","observacao":"Redação original - RA 28/1969, DO-GB 21.08.1969"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 14 Reconhecida a culpa recíproca na rescisão do contrato de trabalho (art. 484 da CLT), o empregado não fará jus ao aviso prévio, às férias proporcionais e à gratificação natalina do ano respectivo."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-15","tribunal":"TST","tipo":"sumula","numero":15,"teor":"ATESTADO MÉDICO.\n\nA justificação da ausência do empregado motivada por doença, para a percepção do salário-enfermidade e da remuneração do repouso semanal, deve observar a ordem preferencial dos atestados médicos estabelecida em lei.","status":"em_vigor","temas":["Férias, 13º e descansos","Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003,DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 28/1969","data":"1969-08-21","observacao":"Redação original - RA 28/1969, DO-GB 21.08.1969"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-16","tribunal":"TST","tipo":"sumula","numero":16,"teor":"NOTIFICAÇÃO.\n\nPresume-se recebida a notificação 48 (quarenta e oito) horas depois de sua postagem. O seu não-recebimento ou a entrega após o decurso desse prazo constitui ônus de prova do destinatário.","status":"em_vigor","temas":["Provas e ônus da prova"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(nova redação) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 28/1969","data":"1969-08-21","observacao":"Redação original - RA 28/1969, DO-GB 21.08.1969"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 16 Presume-se recebida a notificação 48 horas depois de sua regular expedição. O seu não recebimento ou a entrega após o decurso desse prazo constituem ônus de prova do destinatário."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-17","tribunal":"TST","tipo":"sumula","numero":17,"teor":"ADICIONAL DE INSALUBRIDADE.\n\nO adicional de insalubridade devido a empregado que, por força de lei, convenção coletiva ou sentença normativa, percebe salário profissional será sobre este calculado.","status":"cancelada","temas":["Adicionais (insalubridade, periculosidade e outros)","Salário e remuneração","Direito coletivo e sindical"],"historico":[{"evento":"Nova redação","ato":"Res. 148/2008","data":"2008-07-10","observacao":"(cancelada na sessão do Tribunal Pleno realizada em 26.06.2008) - Res. 148/2008, DJ 04 e 07.07.2008 - Republicada DJ 08, 09 e 10.07.2008"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Súmula restaurada - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Cancelamento","ato":"Res. 29/1994","data":"1994-05-19","observacao":"Súmula cancelada - Res. 29/1994, DJ 12, 17 e 19.05.1994"},{"evento":"Redação original","ato":"RA 28/1969","data":"1969-08-21","observacao":"Redação original - RA 28/1969, DO-GB 21.08.1969"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 17 O adicional-insalubridade devido a empregado que percebe, por força de lei, convenção coletiva ou sentença normativa, salário-profissional, será sobre este calculado."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-18","tribunal":"TST","tipo":"sumula","numero":18,"teor":"COMPENSAÇÃO.\n\nA compensação, na Justiça do Trabalho, está restrita a dívidas de natureza trabalhista.","status":"em_vigor","temas":["Outros"],"historico":[{"evento":"Nova redação","ato":null,"data":"2003-11-21","observacao":"Entendimento reafirmado no IRR nº 241.\nIRR nº 241 - COMPENSAÇÃO DE DÍVIDAS. (RR-0010239-59.2021.5.15.0107, Tribunal Pleno, publicado em 02.09.2025, rel. Min. Aloysio Silva Corrêa da Veiga)\nA compensação, no processo do trabalho, está restrita a dívidas de natureza trabalhista."},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003."},{"evento":"Redação original","ato":"RA 28/1969","data":"1969-08-21","observacao":"Redação original - RA 28/1969, DO-GB 21.08.1969."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-19","tribunal":"TST","tipo":"sumula","numero":19,"teor":"QUADRO DE CARREIRA.\n\nA Justiça do Trabalho é competente para apreciar reclamação de empregado que tenha por objeto direito fundado em quadro de carreira.","status":"em_vigor","temas":["Competência da Justiça do Trabalho","Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 28/1969","data":"1969-08-21","observacao":"Redação original - RA 28/1969, DO-GB 21.08.1969"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 19 A Justiça do Trabalho é competente para apreciar reclamação de empregado que tenha por objeto direito fundado no quadro de carreira."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-20","tribunal":"TST","tipo":"sumula","numero":20,"teor":"RESILIÇÃO CONTRATUAL.\n\nNão obstante o pagamento da indenização de antigüidade, presume-se em fraude à lei a resilição contratual, se o empregado permaneceu prestando serviço ou tiver sido, em curto prazo, readmitido.","status":"cancelada","temas":["Contrato e vínculo de emprego","Rescisão e verbas rescisórias"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelamento mantido) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Cancelamento","ato":"Res. 106/2001","data":"2001-03-23","observacao":"Súmula cancelada - Res. 106/2001, DJ 21, 22 e 23.03.2001"},{"evento":"Redação original","ato":"RA 57/1970","data":"1970-11-27","observacao":"Redação original - RA 57/1970, DO-GB 27.11.1970"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-21","tribunal":"TST","tipo":"sumula","numero":21,"teor":"APOSENTADORIA.\n\nO empregado aposentado tem direito ao cômputo do tempo anterior à aposentadoria, se permanecer a serviço da empresa ou a ela retornar.","status":"cancelada","temas":["Contrato e vínculo de emprego"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelamento mantido) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Cancelamento","ato":"Res. 30/1994","data":"1994-05-18","observacao":"Súmula cancelada - Res. 30/1994, DJ 12, 16 e 18.05.1994"},{"evento":"Redação original","ato":"RA 57/1970","data":"1970-11-27","observacao":"Redação original - RA 57/1970, DO-GB 27.11.1970"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-22","tribunal":"TST","tipo":"sumula","numero":22,"teor":"EQUIPARAÇÃO SALARIAL.\n\nÉ desnecessário que, ao tempo da reclamação sobre equiparação salarial, reclamante e paradigma estejam a serviço do estabelecimento, desde que o pedido se relacione com situação pretérita.","status":"convertida","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"(cancelada em decorrência da sua incorporação à nova redação da Súmula nº 6) - Res. 129/2005, DJ 20, 22 e 25.04.2005"},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":null,"data":"1970-11-27","observacao":"Redação original - RA 57/70, DO-GB 27.11.1970"}],"observacao":"Cancelada em decorrência da sua incorporação à nova redação da Súmula nº 6 do TST.","alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-23","tribunal":"TST","tipo":"sumula","numero":23,"teor":"RECURSO.\n\nNão se conhece de recurso de revista ou de embargos, se a decisão recorrida resolver determinado item do pedido por diversos fundamentos e a jurisprudência transcrita não abranger a todos.","status":"em_vigor","temas":["Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 57/1970","data":"1970-11-27","observacao":"Redação original - RA 57/1970, DO-GB 27.11.1970"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 23 Não se conhece da revista ou dos embargos, quando a decisão recorrida resolver determinado item do pedido por diversos fundamentos, e a jurisprudência transcrita não abranger a todos."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-24","tribunal":"TST","tipo":"sumula","numero":24,"teor":"SERVIÇO EXTRAORDINÁRIO.\n\nInsere-se no cálculo da indenização por antigüidade o salário relativo a serviço extraordinário, desde que habitualmente prestado.","status":"em_vigor","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 57/1970","data":"1970-11-27","observacao":"Redação original - RA 57/1970, DO-GB 27.11.1970"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-25","tribunal":"TST","tipo":"sumula","numero":25,"teor":"CUSTAS PROCESSUAIS. INVERSÃO DO ÔNUS DA SUCUMBÊNCIA.\n\nI - A parte vencedora na primeira instância, se vencida na segunda, está obrigada, independentemente de intimação, a pagar as custas fixadas na sentença originária, das quais ficara isenta a parte então vencida;\nII - No caso de inversão do ônus da sucumbência em segundo grau, sem acréscimo ou atualização do valor das custas e se estas já foram devidamente recolhidas, descabe um novo pagamento pela parte vencida, ao recorrer. Deverá ao final, se sucumbente, reembolsar a quantia; (ex-OJ nº 186 da SBDI-I)\nIII - Não caracteriza deserção a hipótese em que, acrescido o valor da condenação, não houve fixação ou cálculo do valor devido a título de custas e tampouco intimação da parte para o preparo do recurso, devendo ser as custas pagas ao final; (ex-OJ nº 104 da SBDI-I)\nIV - O reembolso das custas à parte vencedora faz-se necessário mesmo na hipótese em que a parte vencida for pessoa isenta do seu pagamento, nos termos do art. 790-A, parágrafo único, da CLT.","status":"em_vigor","temas":["Honorários, custas e justiça gratuita","Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 197/2015","data":"2015-05-18","observacao":"(alterada a Súmula e incorporadas as Orientações Jurisprudenciais nºs 104 e 186 da SBDI-1) - Res. 197/2015 - DEJT divulgado em 14, 15 e 18.05.2015"},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 25 - Custas.\nA parte vencedora na primeira instância, se vencida na segunda, está obrigada, independen-temente de intimação, a pagar as custas fixadas na sentença originária, das quais ficara isenta a parte então vencida."},{"evento":"Redação original","ato":"RA 57/1970","data":"1970-11-27","observacao":"Redação original - RA 57/1970, DO-GB 27.11.1970"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-26","tribunal":"TST","tipo":"sumula","numero":26,"teor":"ESTABILIDADE.\n\nPresume-se obstativa à estabilidade a despedida, sem justo motivo, do empregado que alcançar nove anos de serviço na empresa.","status":"cancelada","temas":["Estabilidade e garantias de emprego","Rescisão e verbas rescisórias"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 57/1970","data":"1970-11-27","observacao":"Redação original - RA 57/1970, DO-GB 27.11.1970"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-27","tribunal":"TST","tipo":"sumula","numero":27,"teor":"COMISSIONISTA.\n\nÉ devida a remuneração do repouso semanal e dos dias feriados ao empregado comissionista, ainda que pracista.","status":"em_vigor","temas":["Férias, 13º e descansos","Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 57/1970","data":"1970-11-27","observacao":"Redação original - RA 57/1970, DO-GB 27.11.1970"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-28","tribunal":"TST","tipo":"sumula","numero":28,"teor":"INDENIZAÇÃO.\n\nNo caso de se converter a reintegração em indenização dobrada, o direito aos salários é assegurado até a data da primeira decisão que determinou essa conversão.","status":"em_vigor","temas":["Salário e remuneração","Estabilidade e garantias de emprego"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(nova redação) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 57/1970","data":"1970-11-27","observacao":"Redação original - RA 57/1970, DO-GB 27.11.1970"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 28 No caso de se converter a reintegração em indenização dobrada, o direito aos salários é assegurado até a data da sentença constitutiva que põe fim ao contrato."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-29","tribunal":"TST","tipo":"sumula","numero":29,"teor":"TRANSFERÊNCIA.\n\nEmpregado transferido, por ato unilateral do empregador, para local mais distante de sua residência, tem direito a suplemento salarial correspondente ao acréscimo da despesa de transporte.","status":"em_vigor","temas":["Contrato e vínculo de emprego"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 57/1970","data":"1970-11-27","observacao":"Redação original - RA 57/1970, DO-GB 27.11.1970"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-30","tribunal":"TST","tipo":"sumula","numero":30,"teor":"INTIMAÇÃO DA SENTENÇA.\n\nQuando não juntada a ata ao processo em 48 horas, contadas da audiência de julgamento (art. 851, § 2º, da CLT), o prazo para recurso será contado da data em que a parte receber a intimação da sentença.","status":"em_vigor","temas":["Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 57/1970","data":"1970-11-27","observacao":"Redação original - RA 57/1970, DO-GB 27.11.1970"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-31","tribunal":"TST","tipo":"sumula","numero":31,"teor":"AVISO PRÉVIO.\n\nÉ incabível o aviso prévio na despedida indireta.","status":"cancelada","temas":["Rescisão e verbas rescisórias"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelamento mantido) - Res. 121/2003, DJ 19, 20 e 21.11.2003 - Referência Lei nº 7.108/1983"},{"evento":"Cancelamento","ato":"Res. 31/1994","data":"1994-05-18","observacao":"Súmula cancelada - Res. 31/1994, DJ 12, 16 e 18.05.1994"},{"evento":"Redação original","ato":"RA 57/1970","data":"1970-11-27","observacao":"Redação original - RA 57/1970, DO-GB 27.11.1970"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-32","tribunal":"TST","tipo":"sumula","numero":32,"teor":"ABANDONO DE EMPREGO.\n\nPresume-se o abandono de emprego se o trabalhador não retornar ao serviço no prazo de 30 (trinta) dias após a cessação do benefício previdenciário nem justificar o motivo de não o fazer.","status":"em_vigor","temas":["Rescisão e verbas rescisórias"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(nova redação - Res. 121/2003, DJ 19, 20 e 21.11.2003). - Entendimento reafirmado no IRR nº 226.\nIRR-226 CESSAÇÃO DE BENEFÍCIO PREVIDENCIÁRIO. ABANDONO DE EMPREGO. PRESUNÇÃO. CRITÉRIOS. PRAZO PARA RETORNO. APRESENTAÇÃO DE JUSTIFICATIVA. (RR-0000193-17.2024.5.09.0125, Tribunal Pleno, publicado em 02.09.2025, rel. Min. Aloysio Silva Corrêa da Veiga)\nPresume-se o abandono de emprego se o trabalhador não retornar ao serviço no prazo de 30 (trinta) dias após a cessação do benefício previdenciário nem justificar o motivo de não o fazer."},{"evento":"Redação original","ato":"RA 57/1970","data":"1970-11-27","observacao":"Redação original - RA 57/1970, DO-GB 27.11.1970"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 32 Configura-se o abandono de emprego quando o trabalhador não retornar ao serviço no prazo de 30 dias após a cessação do benefício previdenciário, nem justificar o motivo de não o fazer."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-33","tribunal":"TST","tipo":"sumula","numero":33,"teor":"MANDADO DE SEGURANÇA. DECISÃO JUDICIAL TRANSITADA EM JULGADO.\n\nNão cabe mandado de segurança de decisão judicial transitada em julgado.","status":"em_vigor","temas":["Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 57/1970","data":"1970-11-27","observacao":"Redação original - RA 57/1970, DO-GB 27.11.1970"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 33 Não cabe mandado de segurança contra decisão judicial transitada em julgado."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-34","tribunal":"TST","tipo":"sumula","numero":34,"teor":"GRATIFICAÇÃO NATALINA.\n\nA gratificação natalina, instituída pela Lei nº 4.090, de 1962, é devida ao empregado rural.","status":"cancelada","temas":["Férias, 13º e descansos","Salário e remuneração","Contrato e vínculo de emprego"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 57/1970","data":"1970-11-27","observacao":"Redação original - RA 57/1970, DO-GB 27.11.1970"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-35","tribunal":"TST","tipo":"sumula","numero":35,"teor":"DEPÓSITO RECURSAL. COMPLEMENTAÇÃO.\n\nA majoração do salário mínimo não obriga o recorrente a complementar o depósito de que trata o art. 899 da CLT.","status":"cancelada","temas":["Salário e remuneração","Honorários, custas e justiça gratuita"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 57/1970","data":"1970-11-27","observacao":"Redação original - RA 57/1970, DO-GB 27.11.1970"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-36","tribunal":"TST","tipo":"sumula","numero":36,"teor":"CUSTAS\n\nNas ações plúrimas, as custas incidem sobre o respectivo valor global.","status":"em_vigor","temas":["Honorários, custas e justiça gratuita"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 57/1970","data":"1970-11-27","observacao":"Redação original - RA 57/1970, DO-GB 27.11.1970"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 36 Nas ações plúrimas as custas incidem sobre o respectivo valor global."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-37","tribunal":"TST","tipo":"sumula","numero":37,"teor":"PRAZO.\n\nO prazo para recurso da parte que não comparece à audiência de julgamento, apesar de notificada, conta-se da intimação da sentença.","status":"cancelada","temas":["Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelamento mantido) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Cancelamento","ato":"Res. 32/1994","data":"1994-05-19","observacao":"Súmula cancelada - Res. 32/1994, DJ 12, 17 e 19.05.1994"},{"evento":"Redação original","ato":"RA 57/1970","data":"1970-11-27","observacao":"Redação original - RA 57/1970, DO-GB 27.11.1970"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-38","tribunal":"TST","tipo":"sumula","numero":38,"teor":"RECURSO.\n\nPara comprovação da divergência justificadora do recurso é necessário que o recorrente junte certidão, ou documento equivalente, do acórdão paradigma ou faça transcrição do trecho pertinente à hipótese, indicando de 13.07.1962, é devida pela empresa cessionária ao servidor público cedido enquanto durar a cessão.","status":"em_vigor","temas":["Férias, 13º e descansos","Salário e remuneração","Ente público como empregador"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 41/1973","data":"1973-06-14","observacao":"Redação original - RA 41/1973, DJ 14.06.1973"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 50 A gratificação natalina, instituída pela Lei nº 4.090, de 1962, é devida pela empresa cessionária ao servidor público cedido enquanto durar a cessão."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-51","tribunal":"TST","tipo":"sumula","numero":51,"teor":"NORMA REGULAMENTAR. VANTAGENS E OPÇÃO PELO NOVO REGULAMENTO. ART. 468 DA CLT.\n\nI - As cláusulas regulamentares, que revoguem ou alterem vantagens deferidas anteriormente, só atingirão os trabalhadores admitidos após a revogação ou alteração do regulamento. (ex-Súmula nº 51 - RA 41/1973, DJ 14.06.1973)\nII - Havendo a coexistência de dois regulamentos da empresa, a opção do empregado por um deles tem efeito jurídico de renúncia às regras do sistema do outro. (ex-OJ nº 163 da SBDI-1 - inserida em 26.03.1999)","status":"em_vigor","temas":["Contrato e vínculo de emprego","Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"(incorporada a Orientação Jurisprudencial nº 163 da SBDI-1) - Res. 129/2005, DJ 20, 22 e 25.04.2005"},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":null,"data":"1973-06-14","observacao":"Redação original - RA 41/73, DJ 14.06.1973"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 51 Vantagens\nAs cláusulas regulamentares, que revoguem ou alterem vantagens deferidas anteriormente, só atingirão os trabalhadores admitidos após a revogação ou alteração do regulamento."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-52","tribunal":"TST","tipo":"sumula","numero":52,"teor":"TEMPO DE SERVIÇO.\n\nO adicional de tempo de serviço (qüinqüênio) é devido, nas condições estabelecidas no art. 19 da Lei nº 4.345, de 26.06.1964, aos contratados sob o regime da CLT, pela empresa a que se refere a mencionada lei, inclusive para o fim de complementação de aposentadoria.","status":"em_vigor","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 41/1973","data":"1973-06-14","observacao":"Redação original - RA 41/1973, DJ 14.06.1973"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 52 O adicional de tempo de serviço (qüinqüênios) é devido, nas condições estabelecidas no art. 19 da Lei nº 4.345, de 1964, aos contratados sob regime da CLT, pela empresa a que se refere a mencionada lei, inclusive para fins de complementação de aposentadoria."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-53","tribunal":"TST","tipo":"sumula","numero":53,"teor":"CUSTAS.\n\nO prazo para pagamento das custas, no caso de recurso, é contado da intimação do cálculo.","status":"em_vigor","temas":["Honorários, custas e justiça gratuita","Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 41/1973","data":"1973-06-14","observacao":"Redação original - RA 41/1973, DJ 14.06.1973"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-54","tribunal":"TST","tipo":"sumula","numero":54,"teor":"OPTANTE.\n\nRescindindo por acordo seu contrato de trabalho, o empregado estável optante tem direito ao mínimo de 60% (sessenta por cento) do total da indenização em dobro, calculada sobre o maior salário percebido no emprego. Se houver recebido menos do que esse total, qualquer que tenha sido a forma de transação, assegura-se-lhe a complementação até aquele limite.","status":"em_vigor","temas":["Salário e remuneração","Contrato e vínculo de emprego"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 105/1974","data":"1974-10-24","observacao":"Redação original - RA 105/1974, DJ 24.10.1974"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 54 Rescindindo por acordo seu contrato de trabalho, o empregado estável optante tem direito ao mínimo de 60% do total da indenização em dobro, calculada sobre o maior salário percebido no emprego. Se houver recebido menos do que esse total, qualquer tenha sido a forma de transação, assegura-se-lhe a complementação até aquele limite."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-55","tribunal":"TST","tipo":"sumula","numero":55,"teor":"FINANCEIRAS.\n\nAs empresas de crédito, financiamento ou investimento, também denominadas financeiras, equiparam-se aos estabelecimentos bancários para os efeitos do art. 224 da CLT.","status":"em_vigor","temas":["Jornada e horas extras","Contrato e vínculo de emprego"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003). - Entendimento reafirmado no IRR nº 261.\nIRR-261 FINANCEIRAS. (RR-0020245-50.2023.5.04.0661, Tribunal Pleno, publicado em 02.09.2025, rel. Min. Aloysio Silva Corrêa da Veiga)\nAs empresas de crédito, financiamento ou investimento, também denominadas financeiras, equiparam-se aos estabelecimentos bancários para os efeitos do art. 224 da CLT."},{"evento":"Redação original","ato":"RA 105/1974","data":"1974-10-24","observacao":"Redação original - RA 105/1974, DJ 24.10.1974"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-56","tribunal":"TST","tipo":"sumula","numero":56,"teor":"BALCONISTA.\n\nO balconista que recebe comissão tem direito ao adicional de 20% (vinte por cento) pelo trabalho em horas extras, calculado sobre o valor das comissões referentes a essas horas.","status":"cancelada","temas":["Jornada e horas extras","Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Revista pela Súmula nº 340 - Res. 40/1995, DJ 17, 20 e 21.02.1995"},{"evento":"Redação original","ato":"RA 105/1974","data":"1974-10-24","observacao":"Redação original - RA 105/1974, DJ 24.10.1974"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 56 O balconista que recebe comissão tem direito ao adicional de 20% pelo trabalho em horas extras, calculados sobre o valor das comissões referentes a essas horas."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-57","tribunal":"TST","tipo":"sumula","numero":57,"teor":"TRABALHADOR RURAL.\n\nOs trabalhadores agrícolas das usinas de açúcar integram categoria profissional de industriários, beneficiando-se dos aumentos normativos obtidos pela referida categoria.","status":"cancelada","temas":["Direito coletivo e sindical","Contrato e vínculo de emprego"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelamento mantido) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Cancelamento","ato":"Res. 3/1993","data":"1993-05-12","observacao":"Súmula cancelada - Res. 3/1993, DJ 06, 10 e 12.05.1993"},{"evento":"Redação original","ato":"RA 105/1974","data":"1974-10-24","observacao":"Redação original - RA 105/1974, DJ 24.10.1974"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-58","tribunal":"TST","tipo":"sumula","numero":58,"teor":"PESSOAL DE OBRAS.\n\nAo empregado admitido como pessoal de obras, em caráter permanente e não amparado pelo regime estatutário, aplica-se a legislação trabalhista.","status":"em_vigor","temas":["Contrato e vínculo de emprego","Ente público como empregador"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 105/1974","data":"1974-10-24","observacao":"Redação original - RA 105/1974, DJ 24.10.1974"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-59","tribunal":"TST","tipo":"sumula","numero":59,"teor":"VIGIA.\n\nVigia de estabelecimento bancário não se beneficia da jornada de trabalho reduzida prevista no art. 224 da CLT.","status":"cancelada","temas":["Jornada e horas extras","Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 105/1974","data":"1974-10-24","observacao":"Redação original - RA 105/1974, DJ 24.10.1974"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-60","tribunal":"TST","tipo":"sumula","numero":60,"teor":"ADICIONAL NOTURNO. INTEGRAÇÃO NO SALÁRIO E PRORROGAÇÃO EM HORÁRIO DIURNO.\n\nI - O adicional noturno, pago com habitualidade, integra o salário do empregado para todos os efeitos. (ex-Súmula nº 60 - RA 105/1974, DJ 24.10.1974)\nII - Cumprida integralmente a jornada no período noturno e prorrogada esta, devido é também o adicional quanto às horas prorrogadas. Exegese do art. 73, § 5º, da CLT. (ex-OJ nº 6 da SBDI-1 - inserida em 25.11.1996)","status":"em_vigor","temas":["Adicionais (insalubridade, periculosidade e outros)","Jornada e horas extras","Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"(incorporada a Orientação Jurisprudencial nº 6 da SBDI-1) - Res. 129/2005, DJ 20, 22 e 25.04.2005"},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 105/1974","data":"1974-10-24","observacao":"Redação original - RA 105/1974, DJ 24.10.1974"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 60 Adicional noturno\nO adicional noturno, pago com habitualidade, integra o salário do empregado para todos os efeitos."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-61","tribunal":"TST","tipo":"sumula","numero":61,"teor":"FERROVIÁRIO.\n\nAos ferroviários que trabalham em estação do interior, assim classificada por autoridade competente, não são devidas horas extras (art. 243 da CLT).","status":"em_vigor","temas":["Jornada e horas extras"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 105/1974","data":"1974-10-24","observacao":"Redação original - RA 105/1974, DJ 24.10.1974"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 61 Aos ferroviários que trabalham em estação do interior, assim classificada por autoridade competente, não são devidas horas extras (CLT, art.243)."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-62","tribunal":"TST","tipo":"sumula","numero":62,"teor":"ABANDONO DE EMPREGO.\n\nO prazo de decadência do direito do empregador de ajuizar inquérito em face do empregado que incorre em abandono de emprego é contado a partir do momento em que o empregado pretendeu seu retorno ao serviço.","status":"em_vigor","temas":["Rescisão e verbas rescisórias","Prescrição e decadência"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 105/1974","data":"1974-10-24","observacao":"Redação original - RA 105/1974, DJ 24.10.1974"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 62 O prazo de decadência do direito do empregador de ajuizar inquérito contra o empregado que incorre em abandono de emprego, é contado a partir do momento em que o empregado pretendeu seu retorno ao serviço."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-63","tribunal":"TST","tipo":"sumula","numero":63,"teor":"FUNDO DE GARANTIA.\n\nA contribuição para o Fundo de Garantia do Tempo de Serviço incide sobre a remuneração mensal devida ao empregado, inclusive horas extras e adicionais eventuais.","status":"em_vigor","temas":["FGTS","Jornada e horas extras","Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 105/1974","data":"1974-10-24","observacao":"Redação original - RA 105/1974, DJ 24.10.1974"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-64","tribunal":"TST","tipo":"sumula","numero":64,"teor":"PRESCRIÇÃO.\n\nA prescrição para reclamar contra anotação de carteira profissional, ou omissão desta, flui da data de cessação do contrato de trabalho.","status":"cancelada","temas":["Prescrição e decadência","Provas e ônus da prova","Contrato e vínculo de emprego"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 52/1975","data":"1975-06-05","observacao":"Redação original - RA 52/1975, DJ 05.06.1975"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-65","tribunal":"TST","tipo":"sumula","numero":65,"teor":"VIGIA.\n\nO direito à hora reduzida de 52 minutos e 30 segundos aplica-se ao vigia noturno.","status":"em_vigor","temas":["Jornada e horas extras"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 5/1976","data":"1976-02-26","observacao":"Redação original - RA 5/1976, DJ 26.02.1976"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 65 O direito à hora reduzida para 52 (cinqüenta e dois) minutos e 30 (trinta) segundos aplica-se ao vigia noturno."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-66","tribunal":"TST","tipo":"sumula","numero":66,"teor":"TEMPO DE SERVIÇO.\n\nOs qüinqüênios devidos ao pessoal da Rede Ferroviária Federal S.A. serão calculados sobre o salário do cargo efetivo, ainda que o trabalhador exerça cargo ou função em comissão.","status":"cancelada","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 7/1977","data":"1977-02-11","observacao":"Redação original - RA 7/1977, DJ 11.02.1977"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-67","tribunal":"TST","tipo":"sumula","numero":67,"teor":"GRATIFICAÇÃO. FERROVIÁRIO.\n\nChefe de trem, regido pelo estatuto dos ferroviários (Decreto nº 35.530, de 19.09.1959), não tem direito à gratificação prevista no respectivo art. 110.","status":"em_vigor","temas":["Salário e remuneração","Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 8/1977","data":"1977-02-11","observacao":"Redação original - RA 8/1977, DJ 11.02.1977"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 67 Chefe de trem, regido pelo Estatuto dos Ferroviários (Decreto nº 35.530, de 19 de setembro de 1959), não tem direito à gratificação prevista no respectivo artigo 110."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-68","tribunal":"TST","tipo":"sumula","numero":68,"teor":"PROVA.\n\nÉ do empregador o ônus da prova do fato impeditivo, modificativo ou extintivo da equiparação salarial.","status":"convertida","temas":["Salário e remuneração","Provas e ônus da prova"],"historico":[{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"(cancelada em decorrência da sua incorporação à nova redação da Súmula nº 6) - Res. 129/2005, DJ 20, 22 e 25.04.2005"},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 9/1977","data":"1977-02-11","observacao":"Redação original - (RA 9/1977, DJ 11.02.1977)"}],"observacao":"Cancelada em decorrência da sua incorporação à nova redação da Súmula nº 6 do TST.","alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-69","tribunal":"TST","tipo":"sumula","numero":69,"teor":"RESCISÃO DO CONTRATO.\n\nA partir da Lei nº 10.272, de 05.09.2001, havendo rescisão do contrato de trabalho e sendo revel e confesso quanto à matéria de fato, deve ser o empregador condenado ao pagamento das verbas rescisórias, não quitadas na primeira audiência, com acréscimo de 50% (cinqüenta por cento).","status":"em_vigor","temas":["Rescisão e verbas rescisórias","Contrato e vínculo de emprego"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(nova redação) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 10/1977","data":"1977-02-11","observacao":"Redação original - RA 10/1977, DJ 11.02.1977"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 69 Havendo rescisão contratual e sendo revel e confesso o empregador quanto à matéria de fato, deve ser condenado ao pagamento em dobro dos salários incontroversos (CLT, art. 467)."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-70","tribunal":"TST","tipo":"sumula","numero":70,"teor":"ADICIONAL DE PERICULOSIDADE.\n\nO adicional de periculosidade não incide sobre os triênios pagos pela Petrobras.","status":"em_vigor","temas":["Adicionais (insalubridade, periculosidade e outros)"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 69/1978","data":"1978-09-26","observacao":"Redação original - RA 69/1978, DJ 26.09.1978"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-71","tribunal":"TST","tipo":"sumula","numero":71,"teor":"ALÇADA.\n\nA alçada é fixada pelo valor dado à causa na data de seu ajuizamento, desde que não impugnado, sendo inalterável no curso do processo.","status":"em_vigor","temas":["Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 69/1978","data":"1978-09-26","observacao":"Redação original - RA 69/1978, DJ 26.09.1978"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-72","tribunal":"TST","tipo":"sumula","numero":72,"teor":"APOSENTADORIA.\n\nO prêmio-aposentadoria instituído por norma regulamentar da empresa não está condicionado ao disposto no § 2º do art. 14 da Lei nº 8.036, de 11.05.1990.","status":"em_vigor","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(nova redação) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 69/1978","data":"1978-09-26","observacao":"Redação original - RA 69/1978, DJ 26.09.1978"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 72 O prêmio-aposentadoria instituído por norma regulamentar da empresa não está condicionado ao disposto no § 3º do art. 17 da Lei nº 5.107/1966."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-73","tribunal":"TST","tipo":"sumula","numero":73,"teor":"DESPEDIDA. JUSTA CAUSA.\n\nA ocorrência de justa causa, salvo a de abandono de emprego, no decurso do prazo do aviso prévio dado pelo empregador, retira do empregado qualquer direito às verbas rescisórias de natureza indenizatória.","status":"em_vigor","temas":["Rescisão e verbas rescisórias"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(nova redação) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 69/1978","data":"1978-09-26","observacao":"Redação original - RA 69/1978, DJ 26.09.1978"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 73 Falta grave.\nFalta grave, salvo a de abandono de emprego, praticada pelo empregado no decurso do prazo do aviso prévio dado pelo empregador, retira àquele qualquer direito a indenização."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-74","tribunal":"TST","tipo":"sumula","numero":74,"teor":"CONFISSÃO.\n\nI - Aplica-se a confissão à parte que, expressamente intimada com aquela cominação, não comparecer à audiência em prosseguimento, na qual deveria depor. (ex-Súmula nº 74 - RA 69/1978, DJ 26.09.1978)\nII - A prova pré-constituída nos autos pode ser levada em conta para confronto com a confissão ficta (arts. 442 e 443, do CPC de 2015 - art. 400, I, do CPC de 1973), não implicando cerceamento de defesa o indeferimento de provas posteriores. (ex-OJ nº 184 da SBDI-1 - inserida em 08.11.2000)\nIII- A vedação à produção de prova posterior pela parte confessa somente a ela se aplica, não afetando o exercício, pelo magistrado, do poder/dever de conduzir o processo.","status":"em_vigor","temas":["Provas e ônus da prova"],"historico":[{"evento":"Nova redação","ato":"Res. 208/2016","data":"2016-04-26","observacao":"(atualizada em decorrência do CPC de 2015) - Res. 208/2016, DEJT divulgado em 22, 25 e 26.04.2016"},{"evento":"Nova redação","ato":"Res. 174/2011","data":"2011-05-31","observacao":"Súmula alterada - Res. 174/2011, DEJT divulgado em 27, 30 e 31.05.2011"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 74. Confissão (nova redação do item I e inserido o item III à redação em decorrência do julgamento do processo TST-IUJEEDRR 801385-77.2001.5.02.0017)\nI - Aplica-se a confissão à parte que, expressamente intimada com aquela cominação, não comparecer à audiência em prosseguimento, na qual deveria depor. (ex-Súmula nº 74 - RA 69/1978, DJ 26.09.1978)\nII - A prova pré-constituída nos autos pode ser levada em conta para confronto com a confissão ficta (art. 400, I, CPC), não implicando cerceamento de defesa o indeferimento de provas posteriores. (ex-OJ nº 184 da SBDI-1 - inserida em 08.11.2000)\nIII- A vedação à produção de prova posterior pela parte confessa somente a ela se aplica, não afetando o exercício, pelo magistrado, do poder/dever de conduzir o processo."},{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"Súmula alterada - Res. 129/2005, DJ 20, 22 e 25.04.2005"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 74 Confissão (incorporada a Orientação Jurisprudencial nº 184 da SBDI-1)\nI - Aplica-se a pena de confissão à parte que, expressamente intimada com aquela cominação, não comparecer à audiência em prosseguimento, na qual deveria depor. (ex-Súmula nº 74 - RA 69/1978, DJ 26.09.1978)\n(...)"},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 69/1978","data":"1978-09-26","observacao":"Redação original - RA 69/1978, DJ 26.09.1978"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 74 Confissão\nAplica-se a pena de confissão à parte que, expressamente intimada com aquela cominação, não comparecer à audiência em prosseguimento, na qual deveria depor."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-75","tribunal":"TST","tipo":"sumula","numero":75,"teor":"FERROVIÁRIO.\n\nÉ incompetente a Justiça do Trabalho para conhecer de ação de ferroviário oriundo das empresas Sorocabana, São Paulo-Minas e Araraquarense, que mantém a condição de funcionário público.","status":"cancelada","temas":["Competência da Justiça do Trabalho"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 69/1978","data":"1978-09-26","observacao":"Redação original - RA 69/1978, DJ 26.09.1978"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-76","tribunal":"TST","tipo":"sumula","numero":76,"teor":"HORAS EXTRAS.\n\nO valor das horas suplementares prestadas habitualmente, por mais de 2 (dois) anos, ou durante todo o contrato, se suprimidas, integra-se ao salário para todos os efeitos legais.","status":"cancelada","temas":["Jornada e horas extras","Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Revista pela Súmula nº 291 - Res. 1/1989, DJ 14.18 e 19.04.1989"},{"evento":"Redação original","ato":"RA 69/1978","data":"1978-09-26","observacao":"Redação original - RA 69/1978, DJ 26.09.1978"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-77","tribunal":"TST","tipo":"sumula","numero":77,"teor":"PUNIÇÃO.\n\nNula é a punição de empregado se não precedida de inquérito ou sindicância internos a que se obrigou a empresa por norma regulamentar.","status":"em_vigor","temas":["Direito coletivo e sindical"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 69/1978","data":"1978-09-26","observacao":"Redação original - RA 69/1978, DJ 26.09.1978"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 77 Nula é a punição de empregado se não precedida de inquérito ou sindicância internos a que se obrigou a empresa, por norma regulamentar."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-78","tribunal":"TST","tipo":"sumula","numero":78,"teor":"GRATIFICAÇÃO.\n\nA gratificação periódica contratual integra o salário, pelo seu duodécimo, para todos os efeitos legais, inclusive o cálculo da natalina da Lei nº 4.090/1962.","status":"cancelada","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 69/1978","data":"1978-09-26","observacao":"Redação original - RA 69/1978, DJ 26.09.1978"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-79","tribunal":"TST","tipo":"sumula","numero":79,"teor":"TEMPO DE SERVIÇO.\n\nO adicional de antigüidade, pago pela Fepasa, calcula-se sobre o salário-base.","status":"cancelada","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 69/1978","data":"1978-09-26","observacao":"Redação original - RA 69/1978, DJ 26.09.1978"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-80","tribunal":"TST","tipo":"sumula","numero":80,"teor":"INSALUBRIDADE.\n\nA eliminação da insalubridade mediante fornecimento de aparelhos protetores aprovados pelo órgão competente do Poder Executivo exclui a percepção do respectivo adicional.","status":"em_vigor","temas":["Adicionais (insalubridade, periculosidade e outros)","Provas e ônus da prova"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 69/1978","data":"1978-09-26","observacao":"Redação original - RA 69/1978, DJ 26.09.1978"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 80 A eliminação da insalubridade pelo fornecimento de aparelhos protetores aprovados pelo órgão competente do Poder Executivo exclui a percepção do adicional respectivo."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-81","tribunal":"TST","tipo":"sumula","numero":81,"teor":"FÉRIAS.\n\nOs dias de férias gozados após o período legal de concessão deverão ser remunerados em dobro.","status":"em_vigor","temas":["Férias, 13º e descansos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 69/1978","data":"1978-09-26","observacao":"Redação original - RA 69/1978, DJ 26.09.1978"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 81 Os dias de férias, gozados após o período legal de concessão, deverão ser remunerados em dobro."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-82","tribunal":"TST","tipo":"sumula","numero":82,"teor":"ASSISTÊNCIA.\n\nA intervenção assistencial, simples ou adesiva, só é admissível se demonstrado o interesse jurídico e não o meramente econômico.","status":"em_vigor","temas":["Outros"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(nova redação) - Res. 121/2003, DJ DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 69/1978","data":"1978-09-26","observacao":"Redação original - RA 69/1978, DJ 26.09.1978"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 82 A intervenção assistencial, simples ou adesiva, só é admissível se demonstrado o interesse jurídico e não o meramente econômico, perante a Justiça onde é postulada."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-83","tribunal":"TST","tipo":"sumula","numero":83,"teor":"AÇÃO RESCISÓRIA. MATÉRIA CONTROVERTIDA.\n\nI - Não procede pedido formulado na ação rescisória por violação literal de lei se a decisão rescindenda estiver baseada em texto legal infraconstitucional de interpretação controvertida nos Tribunais. (ex-Súmula nº 83 - alterada pela Res. 121/2003, DJ 21.11.2003)\nII - O marco divisor quanto a ser, ou não, controvertida, nos Tribunais, a interpretação dos dispositivos legais citados na ação rescisória é a data da inclusão, na Orientação Jurisprudencial do TST, da matéria discutida. (ex-OJ nº 77 da SBDI-2 - inserida em 13.03.2002)","status":"em_vigor","temas":["Rescisão e verbas rescisórias"],"historico":[{"evento":"Nova redação","ato":"Res. 137/2005","data":"2005-08-24","observacao":"(incorporada a Orientação Jurisprudencial nº 77 da SBDI-2) - Res. 137/2005, DJ 22, 23 e 24.08.2005"},{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula alterada - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 83 Ação Rescisória\nNão procede o pedido formulado na ação rescisória por violação literal de lei se a decisão rescindenda estiver baseada em texto legal infraconstitucional, de interpretação controvertida nos Tribunais."},{"evento":"Redação original","ato":"RA 69/1978","data":"1978-09-26","observacao":"Redação original - RA 69/1978, DJ 26.09.1978"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 83 Não cabe ação rescisória, por violação literal de lei, quando a decisão rescindenda estiver baseada em texto legal de interpretação controvertida nos tribunais."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-84","tribunal":"TST","tipo":"sumula","numero":84,"teor":"ADICIONAL REGIONAL.\n\nO adicional regional, instituído pela Petrobras, não contraria o art. 7º, XXXII, da CF/1988.","status":"em_vigor","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(nova redação) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original"
