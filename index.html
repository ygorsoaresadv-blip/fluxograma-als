","temas":["Rescisão e verbas rescisórias","Provas e ônus da prova"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003). - Entendimento reafirmado no IRR nº 227.\nIRR-227 AVISO-PRÉVIO. RENÚNCIA PELO EMPREGADO. (RR-0000280-61.2024.5.09.0322, Tribunal Pleno, publicado em 03.09.2025, rel. Min. Aloysio Silva Corrêa da Veiga)\nO direito ao aviso prévio é irrenunciável pelo empregado. O pedido de dispensa de cumprimento não exime o empregador de pagar o respectivo valor, salvo comprovação de haver o trabalhador obtido novo emprego."},{"evento":"Redação original","ato":"Res. 9/1988","data":"1988-03-03","observacao":"Redação original - Res. 9/1988, DJ 01, 02 e 03.03.1988"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 276 Aviso prévio - Renúncia pelo empregado.\nO direito ao aviso prévio é irrenunciável pelo empregado. O pedido de dispensa de cumprimento não exime o empregador de pagar o valor respectivo, salvo comprovação de haver o prestador dos serviços obtido novo emprego."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-277","tribunal":"TST","tipo":"sumula","numero":277,"teor":"CONVENÇÃO COLETIVA DE TRABALHO OU ACORDO COLETIVO DE TRABALHO. EFICÁCIA. ULTRATIVIDADE.\n\nAs cláusulas normativas dos acordos coletivos ou convenções coletivas integram os contratos individuais de trabalho e somente poderão ser modificados ou suprimidas mediante negociação coletiva de trabalho.","status":"cancelada","temas":["Direito coletivo e sindical"],"historico":[{"evento":"Cancelamento","ato":"Res. 225/2025","data":"2025-07-02","observacao":"Cancelada por perda de eficácia a partir de 11.11.2017, pela Lei 13.467/2017. Res. 225/2025, DEJT divulgado em 30.06, 01 e 02.07.2025"},{"evento":"Suspensão","ato":null,"data":"2022-09-15","observacao":"Súmula declarada inconstitucional pelo Supremo Tribunal Federal, no julgamento da ADPF nº 323/DF, Rel Min. Gilmar Mendes, DJE de 15/09/2022."},{"evento":"Suspensão","ato":"Res. 185/2012","data":"2012-09-14","observacao":"Redação alterada na sessão do Tribunal Pleno realizada em 14.09.2012 - (Súmula cuja aplicação está suspensa nos termos da medida cautelar deferida nos autos do processo STF-ADPF nº 323/DF Rel. Min. Gilmar Mendes) - Res. 185/2012 - DEJT divulgado em 25, 26 e 27.09.2012"},{"evento":"Nova redação","ato":"Res. 161/2009","data":"2009-11-16","observacao":"Súmula alterada - redação alterada na sessão do Tribunal Pleno em 16.11.2009) - Res. 161/2009, DEJT 23, 24 e 25.11.2009"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 277 Sentença normativa. Convenção ou acordo coletivos. Vigência. Repercussão nos contratos de trabalho\nI - As condições de trabalho alcançadas por força de sentença normativa, convenção ou acordos coletivos vigoram no prazo assinado, não integrando, de forma definitiva, os contratos individuais de trabalho.\nII - Ressalva-se da regra enunciado no item I o período compreendido entre 23.12.1992 e 28.07.1995, em que vigorou a Lei nº 8.542, revogada pela Medida Provisória nº 1.709, convertida na Lei nº 10.192, de 14.02.2001."},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 10/1988","data":"1988-03-03","observacao":"Redação original - Res. 10/1988, DJ 01, 02 e 03.03.1988"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 277 Sentença normativa. Vigência. Repercussão nos contratos de trabalho.\nAs condições de trabalho alcançadas por força de sentença normativa vigoram no prazo assinado, não integrando, de forma definitiva, os contratos."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-278","tribunal":"TST","tipo":"sumula","numero":278,"teor":"EMBARGOS DE DECLARAÇÃO. OMISSÃO NO JULGADO.\n\nA natureza da omissão suprida pelo julgamento de embargos declaratórios pode ocasionar efeito modificativo no julgado.","status":"em_vigor","temas":["Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 11/1988","data":"1988-03-03","observacao":"Redação original - Res. 11/1988, DJ 01, 02 e 03.03.1988"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-279","tribunal":"TST","tipo":"sumula","numero":279,"teor":"RECURSO CONTRA SENTENÇA NORMATIVA. EFEITO SUSPENSIVO. CASSAÇÃO.\n\nA cassação de efeito suspensivo concedido a recurso interposto de sentença normativa retroage à data do despacho que o deferiu.","status":"em_vigor","temas":["Direito coletivo e sindical","Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 12/1988","data":"1988-03-03","observacao":"Redação original - Res. 12/1988, DJ 01, 02 e 03.03.1988"},{"evento":"Suspensão","ato":null,"data":null,"observacao":"Nº 279 Recurso contra sentença normativa - Efeito suspensivo - Cassação."},{"evento":"Suspensão","ato":null,"data":null,"observacao":"A cassação de efeito suspensivo concedido a recurso interposto contra sentença normativa retroage à data do despacho que o deferiu."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-280","tribunal":"TST","tipo":"sumula","numero":280,"teor":"CONVENÇÃO COLETIVA. SOCIEDADE DE ECONOMIA MISTA. AUDIÊNCIA PRÉVIA DO ÓRGÃO OFICIAL COMPETENTE.\n\nConvenção coletiva, formalizada sem prévia audição do órgão oficial competente, não obriga sociedade de economia mista.","status":"cancelada","temas":["Direito coletivo e sindical","Ente público como empregador"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelamento mantido) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Cancelamento","ato":"Res. 2/1990","data":"1991-01-14","observacao":"Súmula cancelada - Res. 2/1990, DJ 10, 11 e 14.01.1991"},{"evento":"Redação original","ato":"Res. 13/1988","data":"1988-03-03","observacao":"Redação original - Res. 13/1988, DJ 01, 02 e 03.03.1988"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-281","tribunal":"TST","tipo":"sumula","numero":281,"teor":"PISO SALARIAL. PROFESSORES.\n\nA instituição do Fundo de Participação dos Estados e Municípios não fez surgir, para os professores, direito a piso salarial.","status":"cancelada","temas":["Salário e remuneração","Estabilidade e garantias de emprego","Ente público como empregador"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 14/1988","data":"1988-03-03","observacao":"Redação original - Res. 14/1988, DJ 01, 02 e 03.03.1988"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-282","tribunal":"TST","tipo":"sumula","numero":282,"teor":"ABONO DE FALTAS. SERVIÇO MÉDICO DA EMPRESA.\n\nAo serviço médico da empresa ou ao mantido por esta última mediante convênio compete abonar os primeiros 15 (quinze) dias de ausência ao trabalho.","status":"em_vigor","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 15/1988","data":"1988-03-03","observacao":"Redação original - Res. 15/1988, DJ 01, 02 e 03.03.1988"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-283","tribunal":"TST","tipo":"sumula","numero":283,"teor":"RECURSO ADESIVO. PERTINÊNCIA NO PROCESSO DO TRABALHO. CORRELAÇÃO DE MATÉRIAS.\n\nO recurso adesivo é compatível com o processo do trabalho e cabe, no prazo de 8 (oito) dias, nas hipóteses de interposição de recurso ordinário, de agravo de petição, de revista e de embargos, sendo desnecessário que a matéria nele veiculada esteja relacionada com a do recurso interposto pela parte contrária.","status":"em_vigor","temas":["Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 16/1988","data":"1988-03-22","observacao":"Redação original (revisão da Súmula nº 196) - Res. 16/1988, DJ 18, 21 e 22.03.1988"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 283 Recurso adesivo - Pertinência no processo do trabalho - Correlação de matérias.\nO recurso adesivo é compatível com o processo do trabalho, onde cabe, no prazo de oito dias, nas hipóteses de interposição de recurso ordinário, de agravo de petição, de revista e de embargos, sendo desnecessário que a matéria nele veiculada esteja relacionada com a do recurso interposto pela parte contrária."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-284","tribunal":"TST","tipo":"sumula","numero":284,"teor":"CORREÇÃO MONETÁRIA. EMPRESAS EM LIQUIDAÇÃO. LEI Nº 6.024/1974.\n\nOs débitos trabalhistas das empresas em liquidação de que cogita a Lei nº 6.024/1974 estão sujeitos à correção monetária, observada a vigência do Decreto-Lei nº 2.278/1985, ou seja, a partir de 22.11.1985.","status":"cancelada","temas":["Execução e penhora"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Revista pela Súmula nº 304 - Res. 2/1992, DJ 05.11.1992"},{"evento":"Redação original","ato":"Res. 17/1988","data":"1988-03-22","observacao":"Redação original (revisão da Súmula nº 185) - Res. 17/1988, DJ 18, 21 e 22.03.1988"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-285","tribunal":"TST","tipo":"sumula","numero":285,"teor":"RECURSO DE REVISTA. ADMISSIBILIDADE PARCIAL PELO JUIZ-PRESIDENTE DO TRIBUNAL REGIONAL DO TRABALHO. EFEITO.\n\nO fato de o juízo primeiro de admissibilidade do recurso de revista entendê-lo cabível apenas quanto a parte das matérias veiculadas não impede a apreciação integral pela Turma do Tribunal Superior do Trabalho, sendo imprópria a interposição de agravo de instrumento.","status":"cancelada","temas":["Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 204/2016","data":"2016-03-21","observacao":"(cancelada a partir de 15 de abril de 2016) - Res. 204/2016, DEJT divulgado em 17, 18 e 21.03.2016"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"*Cf. Instrução Normativa 40/2016"},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 18/1988","data":"1988-03-22","observacao":"Redação original - Res. 18/1988, DJ 18, 21 e 22.03.1988"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 285 Recurso de revista - Admissibilidade parcial pelo Juiz Presidente do Tribunal Regional do Trabalho - Efeito.\nO fato de o juízo primeiro de admissibilidade do recurso de revista entendê-lo cabível apenas quanto à parte das matérias veiculadas não impede a apreciação integral pela Turma do Tribunal Superior do Trabalho, sendo imprópria a interposição de agravo de instrumento."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-286","tribunal":"TST","tipo":"sumula","numero":286,"teor":"SINDICATO. SUBSTITUIÇÃO PROCESSUAL. CONVENÇÃO E ACORDO COLETIVOS.\n\nA legitimidade do sindicato para propor ação de cumprimento estende-se também à observância de acordo ou de convenção coletivos.","status":"em_vigor","temas":["Direito coletivo e sindical"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Nova redação","ato":"Res. 98/2000","data":"2000-09-20","observacao":"Súmula alterada - Res. 98/2000, DJ 18, 19 e 20.09.2000"},{"evento":"Redação original","ato":"Res. 19/1988","data":"1988-03-22","observacao":"Redação original - Res. 19/1988, DJ 18, 21 e 22.03.1988"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 286 Sindicato - Substituição processual - Convenção coletiva\nO sindicato não é parte legítima para propor, como substituto processual, demanda que vise a observância de convenção coletiva."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-287","tribunal":"TST","tipo":"sumula","numero":287,"teor":"JORNADA DE TRABALHO. GERENTE BANCÁRIO.\n\nA jornada de trabalho do empregado de banco gerente de agência é regida pelo art. 224, § 2º, da CLT. Quanto ao gerente-geral de agência bancária, presume-se o exercício de encargo de gestão, aplicando-se-lhe o art. 62 da CLT.","status":"em_vigor","temas":["Jornada e horas extras"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(nova redação - Res. 121/2003, DJ 19, 20 e 21.11.2003) - Entendimento reafirmado no IRR nº 253.\nIRR-253 - BANCÁRIO. JORNADA DE TRABALHO. GERENTE GERAL. (RR-0011312-53.2023.5.15.0024, Tribunal Pleno, publicado em 02.09.2025, rel. Min. Aloysio Silva Corrêa da Veiga)\nA jornada de trabalho do empregado de banco gerente de agência é regida pelo art. 224, § 2º, da CLT. Quanto ao gerente-geral de agência bancária, presume-se o exercício de encargo de gestão, aplicando-se-lhe o art. 62 da CLT."},{"evento":"Redação original","ato":"Res. 20/1988","data":"1988-03-18","observacao":"Redação original - Res. 20/1988, DJ 18.03.1988"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 287 Jornada de Trabalho - Gerente bancário.\nO gerente bancário, enquadrado na previsão do § 2º do art. 224 consolidado, cumpre jornada normal de oito horas, somente não tendo jus às horas suplementares, excedentes da oitava, quando, investido em mandato, em forma legal, tenha encargos de gestão e usufrua de padrão salarial que o distinga dos demais empregados."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-288","tribunal":"TST","tipo":"sumula","numero":288,"teor":"COMPLEMENTAÇÃO DOS PROVENTOS DA APOSENTADORIA.\n\nI - A complementação dos proventos de aposentadoria, instituída, regulamentada e paga diretamente pelo empregador, sem vínculo com as entidades de previdência privada fechada, é regida pelas normas em vigor na data de admissão do empregado, ressalvadas as alterações que forem mais benéficas (art. 468 da CLT).\nII - Na hipótese de coexistência de dois regulamentos de planos de previdência complementar, instituídos pelo empregador ou por entidade de previdência privada, a opção do beneficiário por um deles tem efeito jurídico de renúncia às regras do outro.\nIII - Após a entrada em vigor das Leis Complementares nºs 108 e 109, de 29/05/2001, reger-se-á a complementação dos proventos de aposentadoria pelas normas vigentes na data da implementação dos requisitos para obtenção do benefício, ressalvados o direito adquirido do participante que anteriormente implementara os requisitos para o benefício e o direito acumulado do empregado que até então não preenchera tais requisitos.\nIV - O entendimento da primeira parte do item III aplica-se aos processos em curso no Tribunal Superior do Trabalho em que, em 12/04/2016, ainda não haja sido proferida decisão de mérito por suas Turmas e Seções.","status":"em_vigor","temas":["Estabilidade e garantias de emprego","Contrato e vínculo de emprego"],"historico":[{"evento":"Nova redação","ato":"Res. 207/2016","data":"2016-04-20","observacao":"(nova redação para o item I e acrescidos os itens III e IV em decorrência do julgamento do processo TST-E-ED-RR-235-20.2010.5.20.0006 pelo Tribunal Pleno em 12.04.2016) - Res. 207/2016, DEJT divulgado em 18, 19 e 20.04.2016"},{"evento":"Nova redação","ato":null,"data":null,"observacao":"Súmula alterada"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 288 Complementação dos proventos da aposentadoria (inclusão do item II) - Res. 193/2013, DEJT divulgado em 13, 16 e 17.12.2013\nI - A complementação dos proventos da aposentadoria é regida pelas normas em vigor na data da admissão do empregado, observando-se as alterações posteriores desde que mais favoráveis ao beneficiário do direito.\nII - Na hipótese de coexistência de dois regulamentos de planos de previdência complementar, instituídos pelo empregador ou por entidade de previdência privada, a opção do beneficiário por um deles tem efeito jurídico de renúncia às regras do outro."},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 21/1988","data":"1988-03-22","observacao":"Redação original - Res. 21/1988, DJ 18, 21 e 22.03.1988"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-289","tribunal":"TST","tipo":"sumula","numero":289,"teor":"INSALUBRIDADE. ADICIONAL. FORNECIMENTO DO APARELHO DE PROTEÇÃO. EFEITO.\n\nO simples fornecimento do aparelho de proteção pelo empregador não o exime do pagamento do adicional de insalubridade. Cabe-lhe tomar as medidas que conduzam à diminuição ou eliminação da nocividade, entre as quais as relativas ao uso efetivo do equipamento pelo empregado.","status":"em_vigor","temas":["Adicionais (insalubridade, periculosidade e outros)"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 22/1988","data":"1988-03-28","observacao":"Redação original - Res. 22/1988, DJ 24, 25 e 28.03.1988"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 289 Insalubridade - Adicional - Fornecimento do aparelho de proteção - Efeito.\nO simples fornecimento do aparelho de proteção pelo empregador não o exime do pagamento do adicional de insalubridade, cabendo-lhe tomar as medidas que conduzam à diminuição ou eliminação da nocividade, dentre as quais as relativas ao uso efetivo do equipamento pelo empregado."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-290","tribunal":"TST","tipo":"sumula","numero":290,"teor":"GORJETAS. NATUREZA JURÍDICA. AUSÊNCIA DE DISTINÇÃO QUANTO À FORMA DE RECEBIMENTO.\n\nAs gorjetas, sejam cobradas pelo empregador na nota de serviço ou oferecidas espontaneamente pelos clientes, integram a remuneração do empregado.","status":"cancelada","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Revista pela Súmula nº 354 - Res. 71/1997, DJ 30.05.1997 e 04, 05 e 06.06.1997"},{"evento":"Redação original","ato":"Res. 23/1988","data":"1988-03-28","observacao":"Redação original - Res. 23/1988, DJ 24, 25 e 28.03.1988"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-291","tribunal":"TST","tipo":"sumula","numero":291,"teor":"HORAS EXTRAS. HABITUALIDADE. SUPRESSÃO. INDENIZAÇÃO.\n\nA supressão total ou parcial, pelo empregador, de serviço suplementar prestado com habitualidade, durante pelo menos 1 (um) ano, assegura ao empregado o direito à indenização correspondente ao valor de 1 (um) mês das horas suprimidas, total ou parcialmente, para cada ano ou fração igual ou superior a seis meses de prestação de serviço acima da jornada normal. O cálculo observará a média das horas suplementares nos últimos 12 (doze) meses anteriores à mudança, multiplicada pelo valor da hora extra do dia da supressão.","status":"em_vigor","temas":["Jornada e horas extras"],"historico":[{"evento":"Nova redação","ato":"Res. 174/2011","data":"2011-05-31","observacao":"(nova redação em decorrência do julgamento do processo TST-IUJERR 10700-45.2007.5.22.0101) - Res. 174/2011, DEJT divulgado em 27, 30 e 31.05.2011"},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 1/1989","data":"1989-04-19","observacao":"Redação original (revisão da Súmula nº 76) - Res. 1/1989, DJ 14, 18 e 19.04.1989"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 291 Horas extras. Revisão do Enunciado número 76.\nA supressão, pelo empregador, do serviço suplementar prestado com habitualidade, durante pelo menos um ano, assegura ao empregado o direito à indenização correspondente ao valor de um mês das horas suprimidas para cada ano ou fração igual ou superior a seis meses de prestação de serviço acima da jornada normal. O cálculo observará a média das horas suplementares efetivamente trabalhadas nos últimos 12 meses, multiplicada pelo valor da hora extra do dia da supressão."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-292","tribunal":"TST","tipo":"sumula","numero":292,"teor":"ADICIONAL DE INSALUBRIDADE. TRABALHADOR RURAL.\n\nO trabalhador rural tem direito ao adicional de insalubridade, observando-se a necessidade de verificação, na forma da lei, de condições nocivas à saúde.","status":"cancelada","temas":["Adicionais (insalubridade, periculosidade e outros)","Contrato e vínculo de emprego"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 2/1989","data":"1989-04-19","observacao":"Redação original - Res. 2/1989, DJ 14, 18 e 19.04.1989"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-293","tribunal":"TST","tipo":"sumula","numero":293,"teor":"ADICIONAL DE INSALUBRIDADE. CAUSA DE PEDIR. AGENTE NOCIVO DIVERSO DO APONTADO NA INICIAL.\n\nA verificação mediante perícia de prestação de serviços em condições nocivas, considerado agente insalubre diverso do apontado na inicial, não prejudica o pedido de adicional de insalubridade.","status":"em_vigor","temas":["Adicionais (insalubridade, periculosidade e outros)","Provas e ônus da prova"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 3/1989","data":"1989-04-19","observacao":"Redação original - Res. 3/1989, DJ 14, 18 e 19.04.1989"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-294","tribunal":"TST","tipo":"sumula","numero":294,"teor":"PRESCRIÇÃO. ALTERAÇÃO CONTRATUAL. TRABALHADOR URBANO.\n\nTratando-se de ação que envolva pedido de prestações sucessivas decorrente de alteração do pactuado, a prescrição é total, exceto quando o direito à parcela esteja também assegurado por preceito de lei.","status":"cancelada","temas":["Prescrição e decadência","Contrato e vínculo de emprego"],"historico":[{"evento":"Cancelamento","ato":"Res. 225/2025","data":"2025-07-02","observacao":"Cancelada por perda de eficácia a partir de 11.11.2017, pela Lei 13.467/2017. Res. 225/2025, DEJT divulgado em 30.06, 01 e 02.07.2025"},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 4/1989","data":"1989-04-19","observacao":"Redação original (cancelamento das Súmulas nºs 168 e 198) - Res. 4/1989, DJ 14, 18 e 19.04.1989"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-295","tribunal":"TST","tipo":"sumula","numero":295,"teor":"APOSENTADORIA ESPONTÂNEA. DEPÓSITO DO FGTS. PERÍODO ANTERIOR À OPÇÃO.\n\nA cessação do contrato de trabalho em razão de aposentadoria espontânea do empregado exclui o direito ao recebimento de indenização relativa ao período anterior à opção. A realização de depósito na conta do Fundo de Garantia do Tempo de Serviço, de que trata o § 3º do art. 14 da Lei nº 8.036, de 11.05.1990, é faculdade atribuída ao empregador.","status":"cancelada","temas":["FGTS","Contrato e vínculo de emprego"],"historico":[{"evento":"Nova redação","ato":"Res. 152/2008","data":"2008-11-24","observacao":"(cancelada) - Res. 152/2008, DEJT divulgado em 20, 21 e 24.11.2008"},{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula alterada - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 5/1989","data":"1989-04-19","observacao":"Redação original - Res. 5/1989, DJ 14, 18 e 19.04.1989"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 295 Aposentadoria espontânea - Depósito do FGTS - Período anterior à opção.\nA cessação do contrato de trabalho em razão de aposentadoria espontânea do empregado exclui o direito ao recebimento de indenização relativa ao período anterior à opção. A realização de depósito na conta do Fundo de Garantia do Tempo de Serviço, cogitada no § 2º do artigo 16 da Lei 5.107/66, coloca-se no campo das faculdades atribuídas ao empregador."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-296","tribunal":"TST","tipo":"sumula","numero":296,"teor":"RECURSO. DIVERGÊNCIA JURISPRUDENCIAL. ESPECIFICIDADE.\n\nI - A divergência jurisprudencial ensejadora da admissibilidade, do prosseguimento e do conhecimento do recurso há de ser específica, revelando a existência de teses diversas na interpretação de um mesmo dispositivo legal, embora idênticos os fatos que as ensejaram. (ex-Súmula nº 296 - Res. 6/1989, DJ 19.04.1989)\nII - Não ofende o art. 896 da CLT decisão de Turma que, examinando premissas concretas de especificidade da divergência colacionada no apelo revisional, conclui pelo conhecimento ou desconhecimento do recurso. (ex-OJ nº 37 da SBDI-1 - inserida em 01.02.1995)","status":"em_vigor","temas":["Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"(incorporada a Orientação Jurisprudencial nº 37 da SBDI-1) - Res. 129/2005, DJ 20, 22 e 25.04.2005"},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 6/1989","data":"1989-04-19","observacao":"Redação original - Res. 6/1989, DJ 14, 18 e 19.04.1989"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 296 Recurso. Divergência jurisprudencial. Especificidade\nA divergência jurisprudencial ensejadora da admissibilidade, do prosseguimento e do conhecimento do recurso há de ser específica, revelando a existência de teses diversas na interpretação de um mesmo dispositivo legal, embora idênticos os fatos que as ensejaram."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-297","tribunal":"TST","tipo":"sumula","numero":297,"teor":"PREQUESTIONAMENTO. OPORTUNIDADE. CONFIGURAÇÃO.\n\nI - Diz-se prequestionada a matéria ou questão quando na decisão impugnada haja sido adotada, explicitamente, tese a respeito.\nII - Incumbe à parte interessada, desde que a matéria haja sido invocada no recurso principal, opor embargos declaratórios objetivando o pronunciamento sobre o tema, sob pena de preclusão.\nIII - Considera-se prequestionada a questão jurídica invocada no recurso principal sobre a qual se omite o Tribunal de pronunciar tese, não obstante opostos embargos de declaração.","status":"em_vigor","temas":["Estabilidade e garantias de emprego","Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(nova redação) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 7/1989","data":"1989-04-19","observacao":"Redação original - Res. 7/1989, DJ 14,18 e 19.04.1989"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 297 Prequestionamento - Oportunidade - Configuração\nDiz-se prequestionada a matéria quando na decisão impugnada haja sido adotada, explicitamente, tese a respeito. Incumbe à parte interessada interpor embargos declaratórios objetivando o pronunciamento sobre o tema, sob pena de preclusão."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-298","tribunal":"TST","tipo":"sumula","numero":298,"teor":"AÇÃO RESCISÓRIA. VIOLAÇÃO A DISPOSIÇÃO DE LEI. PRONUNCIAMENTO EXPLÍCITO.\n\nI - A conclusão acerca da ocorrência de violação literal a disposição de lei pressupõe pronunciamento explícito, na sentença rescindenda, sobre a matéria veiculada.\nII - O pronunciamento explícito exigido em ação rescisória diz respeito à matéria e ao enfoque específico da tese debatida na ação, e não, necessariamente, ao dispositivo legal tido por violado. Basta que o conteúdo da norma reputada violada haja sido abordado na decisão rescindenda para que se considere preenchido o pressuposto.\nIII - Para efeito de ação rescisória, considera-se pronunciada explicitamente a matéria tratada na sentença quando, examinando remessa de ofício, o Tribunal simplesmente a confirma.\nIV - A sentença meramente homologatória, que silencia sobre os motivos de convencimento do juiz, não se mostra rescindível, por ausência de pronunciamento explícito.\nV - Não é absoluta a exigência de pronunciamento explícito na ação rescisória, ainda que esta tenha por fundamento violação de dispositivo de lei. Assim, prescindível o pronunciamento explícito quando o vício nasce no próprio julgamento, como se dá com a sentença \"extra, citra e ultra petita\".","status":"em_vigor","temas":["Rescisão e verbas rescisórias"],"historico":[{"evento":"Nova redação","ato":"Res. 177/2012","data":"2012-02-15","observacao":"(redação alterada pelo Tribunal Pleno na sessão realizada em 6.2.2012) - Res. 177/2012, DEJT divulgado em 13, 14 e 15.02.2012"},{"evento":"Nova redação","ato":"Res. 137/2005","data":"2005-08-24","observacao":"Súmula alterada em decorrência da incorporação das Orientações Jurisprudenciais nºs 36, 72, 75 e 85, parte final, da SBDI-2 - Res. 137/2005, DJ 22, 23 e 24.08.2005"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 298 Ação rescisória. Violência de lei. Prequestionamento\nI - A conclusão acerca da ocorrência de violação literal de lei... (ex-Súmula nº 298 - Res. 8/1989, DJ 14.04.1989)\nII - O prequestionamento exigido em ação rescisória diz respeito à matéria e ao enfoque específico da tese debatida na ação e não, necessariamente, ao dispositivo legal tido por violado. Basta que o conteúdo da norma, reputada como violada, tenha sido abordado na decisão rescindenda para que se considere preenchido o pressuposto do prequestionamento. (ex-OJ nº 72 da SBDI-2 - inserida em 20.09.2000)\nIII - Para efeito de ação rescisória, considera-se prequestionada a matéria... (ex-OJ nº 75 da SBDI-2 - inserida em 20.04.2001)\nIV - A sentença meramente homologatória, que silencia sobre os motivos de convencimento do juiz, não se mostra rescindível, por ausência de prequestionamento. (ex-OJ nº 85 da SBDI-2 - parte final - inserida em 13.03.2002 e alterada em 26.11.2002)\nV - Não é absoluta a exigência de prequestionamento na ação rescisória. Ainda que a ação rescisória tenha por fundamento violação de dispositivo legal, é prescindível o prequestionamento quando o vício nasce no próprio julgamento, como se dá com a sentença \"extra, citra e ultra petita\". (ex-OJ nº 36 da SBDI-2 - inserida em 20.09.2000)"},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 8/1989","data":"1989-04-19","observacao":"Redação original - Res. 8/1989, DJ 14, 18 e 19.04.1989"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 298 Ação rescisória. Violência à lei. Prequestionamento\nA conclusão acerca da ocorrência de violação literal de lei pressupõe pronunciamento explícito, na sentença rescindenda, sobre a matéria veiculada."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-299","tribunal":"TST","tipo":"sumula","numero":299,"teor":"AÇÃO RESCISÓRIA. DECISÃO RESCINDENDA. TRÂNSITO EM JULGADO. COMPROVAÇÃO. EFEITOS.\n\nI - É indispensável ao processamento da ação rescisória a prova do trânsito em julgado da decisão rescindenda. (ex-Súmula nº 299 - Res. 8/1989, DJ 14, 18 e 19.04.1989)\nII - Verificando o relator que a parte interessada não juntou à inicial o documento comprobatório, abrirá prazo de 15 (quinze) dias para que o faça (art. 321 do CPC de 2015), sob pena de indeferimento.(ex-Súmula nº 299 - Res 8/1989, DJ 14, 18 e 19.04.1989)\nIII - A comprovação do trânsito em julgado da decisão rescindenda é pressuposto processual indispensável ao tempo do ajuizamento da ação rescisória. Eventual trânsito em julgado posterior ao ajuizamento da ação rescisória não reabilita a ação proposta, na medida em que o ordenamento jurídico não contempla a ação rescisória preventiva. (ex-OJ nº 106 da SBDI-2 - DJ 29.04.2003)\nIV - O pretenso vício de intimação, posterior à decisão que se pretende rescindir, se efetivamente ocorrido, não permite a formação da coisa julgada material. Assim, a ação rescisória deve ser julgada extinta, sem julgamento do mérito, por carência de ação, por inexistir decisão transitada em julgado a ser rescindida. (ex-OJ nº 96 da SBDI-2 - inserida em 27.09.2002)","status":"em_vigor","temas":["Rescisão e verbas rescisórias","Provas e ônus da prova"],"historico":[{"evento":"Nova redação","ato":"Res. 211/2016","data":"2016-08-26","observacao":"(nova redação do item II em decorrência do CPC de 2015) - Res. 211/2016, DEJT divulgado em 24, 25 e 26.08.2016"},{"evento":"Nova redação","ato":"Res. 137/2005","data":"2005-08-24","observacao":"Súmula alterada em decorrência das incorporações das Orientações Jurisprudenciais nºs 96 e 106 da SBDI-2 - Res. 137/2005, DJ 22, 23 e 24.08.2005"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"II - Verificando o relator que a parte interessada não juntou à inicial o documento comprobatório, abrirá prazo de 10 (dez) dias para que o faça, sob pena de indeferimento. (ex-Súmula nº 299 - Res 8/1989, DJ 14, 18 e 19.04.1989)"},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 8/1989","data":"1989-04-19","observacao":"Redação original - Res. 8/1989, DJ 14, 18 e 19.04.1989"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 299 Ação rescisória - Prova do trânsito em julgado da sentença ou do acórdão rescindendo (cancela o enunciado nº 107)\nÉ indispensável ao processamento da demanda rescisória a prova do trânsito em julgado da decisão rescindenda. Verificando o relator que a parte interessada não juntou à inicial o documento comprobatório, abrirá prazo de dez dias para que o faça, sob pena de indeferimento."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-300","tribunal":"TST","tipo":"sumula","numero":300,"teor":"COMPETÊNCIA DA JUSTIÇA DO TRABALHO. CADASTRAMENTO NO PIS.\n\nCompete à Justiça do Trabalho processar e julgar ações ajuizadas por empregados em face de empregadores relativas ao cadastramento no Programa de Integração Social (PIS).","status":"em_vigor","temas":["Competência da Justiça do Trabalho"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DEJT divulgado em 24, 25 e 26.08.2016"},{"evento":"Redação original","ato":"Res. 10/1989","data":"1989-04-19","observacao":"Redação original - Res. 10/1989, DJ 14, 18 e 19.04.1989"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 300 Competência da Justiça do Trabalho - Cadastramento no PIS.\nCompete à Justiça do Trabalho processar e julgar ações de empregados contra empregadores, relativas ao cadastramento no Plano de Integração Social (PIS)."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-301","tribunal":"TST","tipo":"sumula","numero":301,"teor":"AUXILIAR DE LABORATÓRIO. AUSÊNCIA DE DIPLOMA. EFEITOS.\n\nO fato de o empregado não possuir diploma de profissionalização de auxiliar de laboratório não afasta a observância das normas da Lei nº 3.999, de 15.12.1961, uma vez comprovada a prestação de serviços na atividade.","status":"em_vigor","temas":["Provas e ônus da prova"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 11/1989","data":"1989-04-19","observacao":"Redação original - Res. 11/1989, DJ 14, 18 e 19.04.1989"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 301 Auxiliar de laboratório - Ausência de diploma - Efeitos.\nO fato de o empregado não possuir diploma de profissionalização de auxiliar de laboratório não afasta a observância das normas da Lei nº 3.999/61, uma vez comprovada a prestação de serviços na atividade."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-302","tribunal":"TST","tipo":"sumula","numero":302,"teor":"PROCESSO ADMINISTRATIVO.\n\nNão cabe recurso ao Tribunal Superior do Trabalho, contra decisão em processo administrativo, proferida por Tribunal Regional do Trabalho, ainda que nele seja interessado magistrado.","status":"cancelada","temas":["Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Revista pela Súmula nº 321 - Res. 13/1993, DJ 29.11.1993, 01 e 03.12 .1993"},{"evento":"Redação original","ato":"Res. 1/1990","data":"1990-04-04","observacao":"Redação original (revisão da Súmula nº 40) - Res. 1/1990, DJ 02, 03 e 04.04.1990"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-303","tribunal":"TST","tipo":"sumula","numero":303,"teor":"FAZENDA PÚBLICA. REEXAME NECESSÁRIO.\n\nI - Em dissídio individual, está sujeita ao reexame necessário, mesmo na vigência da Constituição Federal de 1988, decisão contrária à Fazenda Pública, salvo quando a condenação não ultrapassar o valor correspondente a: a) 1.000 (mil) salários mínimos para a União e as respectivas autarquias e fundações de direito público; b) 500 (quinhentos) salários mínimos para os Estados, o Distrito Federal, as respectivas autarquias e fundações de direito público e os Municípios\nque constituam capitais dos Estados; c) 100 (cem) salários mínimos para todos os demais Municípios e respectivas autarquias e fundações de direito público.\nII - Também não se sujeita ao duplo grau de jurisdição a decisão fundada em:\na) súmula ou orientação jurisprudencial do Tribunal Superior do Trabalho;\nb) acórdão proferido pelo Supremo Tribunal Federal ou pelo Tribunal Superior do Trabalho em julgamento de recursos repetitivos;\nc) entendimento firmado em incidente de resolução de demandas repetitivas ou de assunção de competência;\nd) entendimento coincidente com orientação vinculante firmada no âmbito administrativo do próprio ente público, consolidada em manifestação, parecer ou súmula administrativa.\nIII - Em ação rescisória, a decisão proferida pelo Tribunal Regional do Trabalho está sujeita ao duplo grau de jurisdição obrigatório quando desfavorável ao ente público, exceto nas hipóteses dos incisos anteriores. (ex-OJ nº 71 da SBDI-1 - inserida em 03.06.1996)\nIV - Em mandado de segurança, somente cabe reexame necessário se, na relação processual, figurar pessoa jurídica de direito público como parte prejudicada pela concessão da ordem. Tal situação não ocorre na hipótese de figurar no feito como impetrante e terceiro interessado pessoa de direito privado, ressalvada a hipótese de matéria administrativa. (ex-OJs nºs 72 e 73 da SBDI-1 - inseridas, respectivamente, em 25.11.1996 e 03.06.1996).","status":"em_vigor","temas":["Salário e remuneração","Rescisão e verbas rescisórias","Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 211/2016","data":"2016-08-26","observacao":"(nova redação em decorrência do CPC de 2015) - Res. 211/2016, DEJT divulgado em 24, 25 e 26.08.2016"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 303 Fazenda Pública. Duplo grau de jurisdição"},{"evento":"Nova redação","ato":null,"data":null,"observacao":"Súmula alterada em decorrência da incorporação das Orientações Jurisprudenciais nºs 9, 71, 72 e 73 da SBDI-1"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"- Res. 129/2005, DJ 20, 22 e 25.04.2005\nI - Em dissídio individual, está sujeita ao duplo grau de jurisdição, mesmo na vigência da CF/1988, decisão contrária à Fazenda Pública, salvo:\na) quando a condenação não ultrapassar o valor correspondente a 60 (sessenta) salários mínimos;\nb) quando a decisão estiver em consonância com decisão plenária do Supremo Tribunal Federal ou com súmula ou orientação jurisprudencial do Tribunal Superior do Trabalho. (ex-Súmula nº 303 - alterada pela Res. 121/2003, DJ 21.11.2003 - Lei nº 10.352, de 26.12.2001)\nII - Em ação rescisória, a decisão proferida pelo juízo de primeiro grau está sujeita ao duplo grau de jurisdição obrigatório quando desfavorável ao ente público, exceto nas hipóteses das alíneas \"a\" e \"b\" do inciso anterior. (ex-OJ nº 71 da SBDI-1 - inserida em 03.06.1996)\nIII - Em mandado de segurança, somente cabe remessa \"ex officio\" se, na relação processual, figurar pessoa jurídica de direito público como parte prejudicada pela concessão da ordem. Tal situação não ocorre na hipótese de figurar no feito como impetrante e terceiro interessado pessoa de direito privado, ressalvada a hipótese de matéria administrativa. (ex-OJs nºs 72 e 73 da SBDI-1 - inseridas, respectivamente, em 25.11.1996 e 03.06.1996)"},{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula alterada - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 303 Fazenda Pública. Duplo grau de jurisdição\nEstá sujeita ao duplo grau de jurisdição, mesmo na vigência da CF/1988, decisão contrária à Fazenda Pública, salvo:\na) quando a condenação não ultrapassar o valor correspondente a 60 (sessenta) salários mínimos;\nb) quando a decisão estiver em consonância com decisão plenária do Supremo Tribunal Federal ou com enunciados de Súmula ou Orientação Jurisprudencial do Tribunal Superior do Trabalho."},{"evento":"Redação original","ato":"Res. 1/1992","data":"1992-11-19","observacao":"Redação original - Res. 1/1992, DJ 05, 12 e 19.11.1992"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 303 Fazenda Pública - Duplo Grau de Jurisdição.\nEstá sujeita ao duplo grau de jurisdição, mesmo na vigência da Constituição Federal de 1988, decisão contrária à Fazenda Pública."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-304","tribunal":"TST","tipo":"sumula","numero":304,"teor":"CORREÇÃO MONETÁRIA. EMPRESAS EM LIQUIDAÇÃO. ART. 46 DO ADCT/CF.\n\nOs débitos trabalhistas das entidades submetidas aos regimes de intervenção ou liquidação extrajudicial estão sujeitos a correção monetária desde o respectivo vencimento até seu efetivo pagamento, sem interrupção ou suspensão, não incidindo, entretanto, sobre tais débitos, juros de mora.","status":"em_vigor","temas":["Execução e penhora"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-25","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003 e republicada DJ 25.11.2003"},{"evento":"Redação original","ato":"Res. 2/1992","data":"1992-11-19","observacao":"Redação original (revisão da Súmula nº 284) - Res. 2/1992, DJ 05, 12 e 19.11.1992"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-305","tribunal":"TST","tipo":"sumula","numero":305,"teor":"FUNDO DE GARANTIA DO TEMPO DE SERVIÇO. INCIDÊNCIA SOBRE O AVISO PRÉVIO.\n\nO pagamento relativo ao período de aviso prévio, trabalhado ou não, está sujeito a contribuição para o FGTS.","status":"em_vigor","temas":["FGTS","Rescisão e verbas rescisórias"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 3/1992","data":"1992-11-19","observacao":"Redação original - Res. 3/1992, DJ 05, 12 e 19.11.1992"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-306","tribunal":"TST","tipo":"sumula","numero":306,"teor":"INDENIZAÇÃO ADICIONAL. PAGAMENTO DEVIDO COM FUNDAMENTO NOS ARTIGOS 9º DA LEI Nº 6.708/1979 E 9º DA LEI Nº 7.238/1984.\n\nÉ devido o pagamento da indenização adicional na hipótese de dispensa injusta do empregado, ocorrida no trintídio que antecede a data-base. A legislação posterior não revogou os arts. 9º da Lei nº 6.708/1979 e 9º da Lei nº 7.238/1984.","status":"cancelada","temas":["Rescisão e verbas rescisórias"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 4/1992","data":"1992-11-19","observacao":"Redação original - Res. 4/1992, DJ 05, 12 e 19.11.1992"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-307","tribunal":"TST","tipo":"sumula","numero":307,"teor":"JUROS. IRRETROATIVIDADE DO DECRETO-LEI Nº 2.322, DE 26.02.1987.\n\nA fórmula de cálculo de juros prevista no Decreto-Lei nº 2.322, de 26.02.1987 somente é aplicável a partir de 27.02.1987. Quanto ao período anterior, deve-se observar a legislação então vigente.","status":"cancelada","temas":["Recursos e prazos"],"historico":[{"evento":"Cancelamento","ato":"Res. 225/2025","data":"2025-07-02","observacao":"Cancelada por perda de eficácia considerando a decisão da ADI 5867, ADI 6012, ADC 58 e ADC 59, a partir da publicação da ata de julgamento dos embargos de declaração em 09.12.2021. Res. 225/2025, DEJT divulgado em 30.06, 01 e 02.07.2025"},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 5/1992","data":"1992-11-19","observacao":"Redação original - Res. 5/1992, DJ 05, 12 e 19.11.1992"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 307 Juros. Irretroatividade do Decreto-Lei nº 2322/87.\nA fórmula de cálculo de juros prevista no Decreto-Lei nº 2.322/87 somente é aplicável a partir de 27.02.87, devendo-se observar, quanto ao período anterior, a legislação então vigente."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-308","tribunal":"TST","tipo":"sumula","numero":308,"teor":"PRESCRIÇÃO QÜINQÜENAL.\n\nI - Respeitado o biênio subseqüente à cessação contratual, a prescrição da ação trabalhista concerne às pretensões imediatamente anteriores a cinco anos, contados da data do ajuizamento da reclamação e, não, às anteriores ao qüinqüênio da data da extinção do contrato. (ex-OJ nº 204 da SBDI-1 - inserida em 08.11.2000)\nII - A norma constitucional que ampliou o prazo de prescrição da ação trabalhista para 5 (cinco) anos é de aplicação imediata e não atinge pretensões já alcançadas pela prescrição bienal quando da promulgação da CF/1988. (ex-Súmula nº 308 - Res. 6/1992, DJ 05.11.1992)","status":"em_vigor","temas":["Prescrição e decadência"],"historico":[{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"(incorporada a Orientação Jurisprudencial nº 204 da SBDI-1) - Res. 129/2005, DJ 20, 22 e 25.04.2005"},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 6/1992","data":"1992-11-19","observacao":"Redação original - Res. 6/1992, DJ 05, 12 e 19.11.1992"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 308 Prescrição qüinqüenal\nA norma constitucional que ampliou a prescrição da ação trabalhista para cinco anos é de aplicação imediata, não atingindo pretensões já alcançadas pela prescrição bienal, quando da promulgação da Constituição de 1988."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-309","tribunal":"TST","tipo":"sumula","numero":309,"teor":"VIGIA PORTUÁRIO. TERMINAL PRIVATIVO. NÃO OBRIGATORIEDADE DE REQUISIÇÃO.\n\nTratando-se de terminais privativos destinados à navegação de cabotagem ou de longo curso, não é obrigatória a requisição de vigia portuário indicado por sindicato.","status":"em_vigor","temas":["Direito coletivo e sindical"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 7/1992","data":"1992-11-19","observacao":"Redação original - Res. 7/1992, DJ 05, 12 e 19.11.1992"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 309 Vigia portuário.\nEm se tratando de terminais privativos destinados à navegação de cabotagem ou de longo curso, não é obrigatória a requisição de vigia portuário indicado por sindicato."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-310","tribunal":"TST","tipo":"sumula","numero":310,"teor":"SUBSTITUIÇÃO PROCESSUAL. SINDICATO.\n\nI - O art. 8º, inciso III, da Constituição da República não assegura a substituição processual pelo sindicato.\nII - A substituição processual autorizada ao sindicato pelas Leis nºs 6.708, de 30.10.1979, e 7.238, de 29.10.1984, limitada aos associados, restringe-se às demandas que visem aos reajustes salariais previstos em lei, ajuizadas até 03.07.1989, data em que entrou em vigor a Lei nº 7.788/1989.\nIII - A Lei nº 7.788/1989, em seu art. 8º, assegurou, durante sua vigência, a legitimidade do sindicato como substituto processual da categoria.\nIV - A substituição processual autorizada pela Lei nº 8.073, de 30.07.1990, ao sindicato alcança todos os integrantes da categoria e é restrita às demandas que visem à satisfação de reajustes salariais específicos resultantes de disposição prevista em lei de política salarial.\nV - Em qualquer ação proposta pelo sindicato como substituto processual, todos os substituídos serão individualizados na petição inicial e, para o início da execução, devidamente identificados pelo número da Carteira de Trabalho e Previdência Social ou de qualquer documento de identidade.\nVI - É lícito aos substituídos integrar a lide como assistente litisconsorcial, acordar, transigir e renunciar, independentemente de autorização ou anuência do substituto.\nVII - Na liquidação da sentença exeqüenda, promovida pelo substituto, serão individualizados os valores devidos a cada substituído, cujos depósitos para quitação serão levantados através de guias expedidas em seu nome ou de procurador com poderes especiais para esse fim, inclusive nas ações de cumprimento.\nVIII - Quando o sindicato for o autor da ação na condição de substituto processual, não serão devidos honorários advocatícios.","status":"cancelada","temas":["Salário e remuneração","Direito coletivo e sindical","Honorários, custas e justiça gratuita"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelamento mantido) - Res. 121/2003, DJ 19, 20 e 21.11.2003 e republicada DJ 25.11.2003"},{"evento":"Cancelamento","ato":"Res. 119/2003","data":"2003-10-01","observacao":"Súmula cancelada - Res. 119/2003, DJ 01.10.2003"},{"evento":"Redação original","ato":"Res. 1/1993","data":"1993-05-12","observacao":"Redação original - Res. 1/1993, DJ 06, 10 e 12.05.1993"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-311","tribunal":"TST","tipo":"sumula","numero":311,"teor":"BENEFÍCIO PREVIDENCIÁRIO A DEPENDENTE DE EX-EMPREGADO. CORREÇÃO MONETÁRIA. LEGISLAÇÃO APLICÁVEL.\n\nO cálculo da correção monetária incidente sobre débitos relativos a benefícios previdenciários devidos a dependentes de ex-empregado pelo empregador, ou por entidade de previdência privada a ele vinculada, será o previsto na Lei nº 6.899, de 08.04.1981.","status":"cancelada","temas":["Outros"],"historico":[{"evento":"Cancelamento","ato":"Res. 225/2025","data":"2025-07-02","observacao":"Cancelada por perda de eficácia considerando a decisão da ADI 5867, ADI 6012, ADC 58 e ADC 59, a partir da publicação da ata de julgamento dos embargos de declaração em 09.12.2021. Res. 225/2025, DEJT divulgado em 30.06, 01 e 02.07.2025"},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 2/1993","data":"1993-05-12","observacao":"Redação original - Res. 2/1993, DJ 06, 10 e 12.05.1993 - Republicada DJ 14, 20 e 21.05.1993"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 311 Benefício previdenciário a dependente de ex-empregado. Correção monetária. Legislação aplicável.\nO cálculo da correção monetária incidente sobre débitos relativos a benefícios previdenciários devidos a dependentes de ex-empregado pelo empregador, ou entidade de previdência privada a ele vinculada, será o previsto na Lei nº 6.899/81."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-312","tribunal":"TST","tipo":"sumula","numero":312,"teor":"CONSTITUCIONALIDADE. ALÍNEA \"B\" DO ART. 896 DA CLT.\n\nÉ constitucional a alínea \"b\" do art. 896 da CLT, com a redação dada pela Lei nº 7.701, de 21.12.1988.","status":"em_vigor","temas":["Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 4/1993","data":"1993-09-29","observacao":"Redação original - Res. 4/1993, DJ 22, 27 e 29.09.1993"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-313","tribunal":"TST","tipo":"sumula","numero":313,"teor":"COMPLEMENTAÇÃO DE APOSENTADORIA. PROPORCIONALIDADE. BANESPA.\n\nA complementação de aposentadoria, prevista no art. 106, e seus parágrafos, do regulamento de pessoal editado em 1965, só é integral para os empregados que tenham 30 (trinta) ou mais anos de serviços prestados exclusivamente ao banco.","status":"em_vigor","temas":["Salário e remuneração","Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 5/1993","data":"1993-09-29","observacao":"Redação original - Res. 5/1993, DJ 22, 27 e 29.09.1993"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-314","tribunal":"TST","tipo":"sumula","numero":314,"teor":"INDENIZAÇÃO ADICIONAL. VERBAS RESCISÓRIAS. SALÁRIO CORRIGIDO.\n\nSe ocorrer a rescisão contratual no período de 30 (trinta) dias que antecede à data-base, observado a Súmula nº 182 do TST, o pagamento das verbas rescisórias com o salário já corrigido não afasta o direito à indenização adicional prevista nas Leis nºs 6.708, de 30.10.1979 e 7.238, de 28.10.1984.","status":"em_vigor","temas":["Salário e remuneração","Rescisão e verbas rescisórias","Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 6/1993","data":"1993-09-29","observacao":"Redação original - Res. 6/1993, DJ 22, 27 e 29.09.1993"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 314 Ocorrendo a rescisão contratual no período de 30 dias que antecede à data-base, observado o Enunciado de nº 182 do TST, o pagamento das verbas rescisórias com o salário já corrigido não afasta o direito à indenização adicional prevista nas Leis nºs 6.708/1979 e 7.238/1984."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-315","tribunal":"TST","tipo":"sumula","numero":315,"teor":"IPC DE MARÇO/1990. LEI Nº 8.030, DE 12.04.1990 (PLANO COLLOR). INEXISTÊNCIA DE DIREITO ADQUIRIDO.\n\nA partir da vigência da Medida Provisória nº 154, de 15.03.1990, convertida na Lei nº 8.030, de 12.04.1990, não se aplica o IPC de março de 1990, de 84,32% (oitenta e quatro vírgula trinta e dois por cento), para a correção dos salários, porque o direito ainda não se havia incorporado ao patrimônio jurídico dos trabalhadores, inexistindo ofensa ao inciso XXXVI do art. 5º da CF/1988.","status":"em_vigor","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 7/1993","data":"1993-09-29","observacao":"Redação original - Res. 7/1993, DJ 22, 27 e 29.09.1993"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 315 IPC de março/90 - Lei nº 8.030/90 (Plano Collor) - Inexistência de direito adquirido.\nA partir da vigência da Medida Provisória nº 154/90, convertida na Lei nº 8.030/90, não se aplica o IPC de março de 1990, de 84,32% (oitenta e quatro vírgula trinta e dois por cento), para a correção dos salários, porque o direito ainda não se havia incorporado ao patrimônio jurídico dos trabalhadores, inexistindo ofensa ao XXXVI do art. 5º da Constituição da República."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-316","tribunal":"TST","tipo":"sumula","numero":316,"teor":"IPC DE JUNHO/1987. DECRETO-LEI Nº 2.335/1987 (PLANO BRESSER). EXISTÊNCIA DE DIREITO ADQUIRIDO.\n\nÉ devido o reajuste salarial decorrente da incidência do IPC de junho de 1987, correspondente a 26,06% (vinte e seis vírgula zero seis por cento), porque este direito já se havia incorporado ao patrimônio jurídico dos trabalhadores quando do advento do Decreto-Lei nº 2.335/1987.","status":"cancelada","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelamento mantido) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Cancelamento","ato":"Res. 37/1994","data":"1994-11-29","observacao":"Súmula cancelada - Res. 37/1994, DJ 25, 28 e 29.11.1994"},{"evento":"Redação original","ato":"Res. 8/1993","data":"1993-09-29","observacao":"Redação original - Res. 8/1993, DJ 22, 27 e 29.09.1993"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-317","tribunal":"TST","tipo":"sumula","numero":317,"teor":"URP DE FEVEREIRO/1989. LEI Nº 7.730/1989 (PLANO VERÃO). EXISTÊNCIA DE DIREITO ADQUIRIDO.\n\nA correção salarial da URP de fevereiro de 1989, de 26,05% (vinte e seis vírgula zero cinco por cento), já constituía direito adquirido do trabalhador, quando do advento da Medida Provisória nº 32/1989, convertida na Lei nº 7.730/1989, sendo devido o reajuste respectivo.","status":"cancelada","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelamento mantido) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Cancelamento","ato":"Res. 37/1994","data":"1994-11-29","observacao":"Súmula cancelada - Res. 37/1994, DJ 25, 28 e 29.11.1994"},{"evento":"Redação original","ato":"Res. 9/1993","data":"1993-09-29","observacao":"Redação original - Res. 9/1993, DJ 22, 27 e 29.09.1993"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-318","tribunal":"TST","tipo":"sumula","numero":318,"teor":"DIÁRIAS. BASE DE CÁLCULO PARA SUA INTEGRAÇÃO NO SALÁRIO.\n\nTratando-se de empregado mensalista, a integração das diárias no salário deve ser feita tomando-se por base o salário mensal por ele percebido e não o valor do dia de salário, somente sendo devida a referida integração quando o valor das diárias, no mês, for superior à metade do salário mensal.","status":"em_vigor","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 10/1993","data":"1993-12-03","observacao":"Redação original - Res. 10/1993, DJ 29.11, e 01 e 03.12.1993"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 318 Diárias. Base de cálculo para sua integração ao salário\nTratando-se de empregado mensalista, a integração das diárias ao salário deve ser feita tomando-se por base o salário mensal por ele percebido, e não o salário dia, somente sendo devida a referida integração quando o valor das diárias, no mês, for superior à metade do salário mensal."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-319","tribunal":"TST","tipo":"sumula","numero":319,"teor":"REAJUSTES SALARIAIS (\"GATILHOS\"). APLICAÇÃO AOS SERVIDORES PÚBLICOS CONTRATADOS SOB A ÉGIDE DA LEGISLAÇÃO TRABALHISTA.\n\nAplicam-se aos servidores públicos, contratados sob o regime da CLT, os reajustes decorrentes da correção automática dos salários pelo mecanismo denominado \"gatilho\", de que tratam os Decretos-Leis nºs 2.284, de 10.03.1986 e 2.302, de 21.11.1986.","status":"em_vigor","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 11/1993","data":"1993-12-03","observacao":"Redação original - Res. 11/1993, DJ 29.11, 01 e 03.12.1993"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 319 Reajustes salariais (Gatilhos). Sua aplicação relativa aos servidores públicos contratados sob a égide da legislação trabalhista.\nAplicam-se aos servidores públicos, contratados sob o regime da CLT, os reajustes decorrentes da correção automática dos salários pelo mecanismo denominado \"gatilho\", de que tratam os Decretos-Leis nºs 2.284/1986 e 2.302/1986."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-320","tribunal":"TST","tipo":"sumula","numero":320,"teor":"HORAS \"IN ITINERE\". OBRIGATORIEDADE DE CÔMPUTO NA JORNADA DE TRABALHO.\n\nO fato de o empregador cobrar, parcialmente ou não, importância pelo transporte fornecido, para local de difícil acesso ou não servido por transporte regular, não afasta o direito à percepção das horas \"in itinere\".","status":"cancelada","temas":["Jornada e horas extras"],"historico":[{"evento":"Cancelamento","ato":"Res. 225/2025","data":"2025-07-02","observacao":"Cancelada por perda de eficácia a partir de 11.11.2017, pela Lei 13.467/2017. Res. 225/2025, DEJT divulgado em 30.06, 01 e 02.07.2025"},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 12/1993","data":"1993-12-03","observacao":"Redação original - Res. 12/1993, DJ 29.11, 01 e 03.12.1993"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 320 Horas \"in itinere\". Obrigatoriedade de seu cômputo na jornada de trabalho.\nO fato de o empregador cobrar, parcialmente ou não, importância pelo transporte fornecido, para local de difícil acesso ou não servido por transporte regular, não afasta o direito à percepção do pagamento das horas \"in itinere\"."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-321","tribunal":"TST","tipo":"sumula","numero":321,"teor":"DECISÃO ADMINISTRATIVA. RECURSO.\n\nDas decisões proferidas pelos Tribunais Regionais do Trabalho, em processo administrativo, cabe recurso para o Tribunal Superior do Trabalho tão-somente para o exame da legalidade do ato.","status":"cancelada","temas":["Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 135/2005","data":"2005-07-05","observacao":"(cancelada) - Res. 135/2005, DJ 05.07.2005"},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 13/1993","data":"1993-12-03","observacao":"Redação original (revisão da Súmula nº 302) - Res. 13/1993, DJ 29.11, 01 e 03.12.1993"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 321 Decisão administrativa - Recurso - Revisão do Enunciado nº 302.\nDas decisões proferidas pelos Tribunais Regionais, em processo administrativo, cabe recurso para o Tribunal Superior do Trabalho tão-somente para exame da legalidade do ato."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-322","tribunal":"TST","tipo":"sumula","numero":322,"teor":"DIFERENÇAS SALARIAIS. PLANOS ECONÔMICOS. LIMITE.\n\nOs reajustes salariais decorrentes dos chamados \"gatilhos\" e URPs, previstos legalmente como antecipação, são devidos tão-somente até a data-base de cada categoria.","status":"em_vigor","temas":["Salário e remuneração","Estabilidade e garantias de emprego"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21/11/2003"},{"evento":"Redação original","ato":"Res. 14/1993","data":"1993-12-28","observacao":"Redação original - Res. 14/1993, DJ 21, 28.12.1993 e 04.01.1994"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-323","tribunal":"TST","tipo":"sumula","numero":323,"teor":"URP DE ABRIL E MAIO DE 1988. DECRETO-LEI Nº 2.425/1988.\n\nA suspensão do pagamento das URPs de abril e maio de 1988, determinada pelo Decreto-Lei nº 2.425, de 07.04.1988, afronta direito adquirido dos trabalhadores e o princípio constitucional da isonomia.","status":"cancelada","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelamento mantido) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Cancelamento","ato":"Res. 38/1994","data":"1994-11-29","observacao":"Súmula cancelada - Res. 38/1994, DJ 25, 28 e 29.11.1994"},{"evento":"Redação original","ato":"Res. 15/1993","data":"1993-12-28","observacao":"Redação original - Res. 15/1993, DJ 21, 28.12.1993 e 04.01.1994"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-324","tribunal":"TST","tipo":"sumula","numero":324,"teor":"HORAS \"IN ITINERE\". ENUNCIADO Nº 90. INSUFICIÊNCIA DE TRANSPORTE PÚBLICO.\n\nA mera insuficiência de transporte público não enseja o pagamento de horas \"in itinere\".","status":"convertida","temas":["Jornada e horas extras"],"historico":[{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"(cancelada em decorrência da sua incorporação à nova redação da súmula nº 90) - Res. 129/2005, DJ 20, 22 e 25.04.2005"},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 16/1993","data":"1993-12-28","observacao":"Redação original - Res. 16/1993, DJ 21, 28.12.1993 e 04.01.1994"}],"observacao":"Cancelada em decorrência da sua incorporação à nova redação da Súmula nº 90 do TST.","alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-325","tribunal":"TST","tipo":"sumula","numero":325,"teor":"HORAS \"IN ITINERE\". ENUNCIADO Nº 90. REMUNERAÇÃO EM RELAÇÃO A TRECHO NÃO SERVIDO POR TRANSPORTE PÚBLICO.\n\nSe houver transporte público regular, em parte do trajeto percorrido em condução da empresa, as horas \"in itinere\" remuneradas limitam-se ao trecho não alcançado pelo transporte público.","status":"convertida","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"(cancelada em decorrência da sua incorporação à nova redação da Súmula nº 90) - Res. 129/2005, DJ 20, 22 e 25.04.2005"},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 17/1993","data":"1993-12-28","observacao":"Redação original - Res. 17/1993, DJ 21, 28.12.1993 e 04.01.1994"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 325 Horas \"in itinere\". Enunciado nº 90. Remuneração em relação a trecho não servido por transporte público.\nHavendo transporte público regular, em parte do trajeto percorrido em condução da empresa, as horas in itinere remuneradas se limitam ao trecho não alcançado pelo transporte público."}],"observacao":"Cancelada em decorrência da sua incorporação à nova redação da Súmula nº 90 do TST.","alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-326","tribunal":"TST","tipo":"sumula","numero":326,"teor":"COMPLEMENTAÇÃO DE APOSENTADORIA. PRESCRIÇÃO TOTAL.\n\nA pretensão à complementação de aposentadoria jamais recebida prescreve em 2 (dois) anos contados da cessação do contrato de trabalho.","status":"em_vigor","temas":["Salário e remuneração","Prescrição e decadência","Contrato e vínculo de emprego"],"historico":[{"evento":"Nova redação","ato":"Res. 174/2011","data":"2011-05-31","observacao":"(nova redação) - Res. 174/2011, DEJT divulgado em 27, 30 e 31.05.2011"},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 18/1993","data":"1993-12-28","observacao":"Redação original - Res. 18/1993, DJ 21,28.12.1993 e 04.01.1994"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 326 Complementação dos proventos de aposentadoria. Parcela nunca recebida. Prescrição total.\nEm se tratando de pedido de complementação de aposentadoria oriunda de norma regulamentar e jamais paga ao ex-empregado, a prescrição aplicável é a total, começando a fluir o biênio a partir da aposentadoria."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-327","tribunal":"TST","tipo":"sumula","numero":327,"teor":"COMPLEMENTAÇÃO DE APOSENTADORIA. DIFERENÇAS. PRESCRIÇÃO PARCIAL.\n\nA pretensão a diferenças de complementação de aposentadoria sujeita-se à prescrição parcial e quinquenal, salvo se o pretenso direito decorrer de verbas não recebidas no curso da relação de emprego e já alcançadas pela prescrição, à época da propositura da ação.","status":"em_vigor","temas":["Salário e remuneração","Prescrição e decadência","Contrato e vínculo de emprego"],"historico":[{"evento":"Nova redação","ato":"Res. 174/2011","data":"2011-05-31","observacao":"(nova redação) - Res. 174/2011, DEJT divulgado em 27, 30 e 31.05.2011"},{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Nova redação - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 327 Complementação dos proventos de aposentadoria. Diferença. Prescrição parcial\nTratando-se de pedido de diferença de complementação de aposentadoria oriunda de norma regulamentar, a prescrição aplicável é a parcial, não atingindo o direito de ação, mas, tão-somente, as parcelas anteriores ao qüinqüênio."},{"evento":"Redação original","ato":"Res. 19/1993","data":"1993-12-28","observacao":"Redação original - Res. 19/1993, DJ 21, 28.12.1993 e 04.01.1994"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 327 Complementação dos proventos de aposentadoria. Diferença. Prescrição parcial.\nEm se tratando de pedido de diferença de complementação de aposentadoria oriunda de norma regulamentar, a prescrição aplicável é a parcial, não atingindo o direito de ação, mas, tão-somente, as parcelas anteriores ao biênio."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-328","tribunal":"TST","tipo":"sumula","numero":328,"teor":"FÉRIAS. TERÇO CONSTITUCIONAL.\n\nO pagamento das férias, integrais ou proporcionais, gozadas ou não, na vigência da CF/1988, sujeita-se ao acréscimo do terço previsto no respectivo art. 7º, XVII.","status":"em_vigor","temas":["Férias, 13º e descansos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"CONSTITUCIONAL (mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 20/1993","data":"1993-12-28","observacao":"Redação original - Res. 20/1993, DJ 21, 28.12.1993 e 04.01.1994"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 328 Férias - Terço constitucional.\nO pagamento das férias, integrais ou proporcionais, gozadas ou não, na vigência da Constituição da República de 1988, sujeita-se ao acréscimo do terço previsto em seu art. 7º, inciso XVII."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-329","tribunal":"TST","tipo":"sumula","numero":329,"teor":"HONORÁRIOS ADVOCATÍCIOS. ART. 133 DA CF/1988.\n\nMesmo após a promulgação da CF/1988, permanece válido o entendimento consubstanciado na Súmula nº 219 do Tribunal Superior do Trabalho.","status":"cancelada","temas":["Honorários, custas e justiça gratuita"],"historico":[{"evento":"Cancelamento","ato":"Res. 225/2025","data":"2025-07-02","observacao":"Cancelada por perda de eficácia a partir de 11.11.2017, pela Lei 13.467/2017. Res. 225/2025, DEJT divulgado em 30.06, 01 e 02.07.2025"},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 21/1993","data":"1993-12-28","observacao":"Redação original - Res. 21/1993, DJ 21, 28.12.1993 e 04.01.1994"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 329 Honorários advocatícios. Art. 133 da Constituição da República de 1988\nMesmo após a promulgação da Constituição da República de 1988, permanece válido o entendimento consubstanciado no Enunciado nº 219 do Tribunal Superior do Trabalho."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-330","tribunal":"TST","tipo":"sumula","numero":330,"teor":"QUITAÇÃO. VALIDADE.\n\nA quitação passada pelo empregado, com assistência de entidade sindical de sua categoria, ao empregador, com observância dos requisitos exigidos nos parágrafos do art. 477 da CLT, tem eficácia liberatória em relação às parcelas expressamente consignadas no recibo, salvo se oposta re
