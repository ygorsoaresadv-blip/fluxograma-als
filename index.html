"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-149","tribunal":"TST","tipo":"sumula","numero":149,"teor":"TAREFEIRO. FÉRIAS.\n\nA remuneração das férias do tarefeiro deve ser calculada com base na média da produção do período aquisitivo, aplicando-se-lhe a tarifa da data da concessão (ex-Prejulgado nº 22).","status":"em_vigor","temas":["Férias, 13º e descansos","Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 102/1982","data":"1982-10-11","observacao":"Redação original - RA 102/1982, DJ 11.10.1982 e DJ 15.10.1982"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 149 A remuneração das férias do tarefeiro deve ser a base média da produção do período aquisitivo, aplicando-se-lhe a tarifa da data da concessão (ex-Prejulgado nº 22)."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-150","tribunal":"TST","tipo":"sumula","numero":150,"teor":"DEMISSÃO. INCOMPETÊNCIA DA JUSTIÇA DO TRABALHO.\n\nFalece competência à Justiça do Trabalho para determinar a reintegração ou a indenização de empregado demitido com base nos atos institucionais (ex-Prejulgado nº 23).","status":"cancelada","temas":["Estabilidade e garantias de emprego","Competência da Justiça do Trabalho"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 102/1982","data":"1982-10-11","observacao":"Redação original - RA 102/1982, DJ 11.10.1982 e DJ 15.10.1982"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-151","tribunal":"TST","tipo":"sumula","numero":151,"teor":"FÉRIAS. REMUNERAÇÃO.\n\nA remuneração das férias inclui a das horas extraordinárias habitualmente prestadas (ex-Prejulgado nº 24).","status":"cancelada","temas":["Jornada e horas extras","Férias, 13º e descansos","Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 102/1982","data":"1982-10-11","observacao":"Redação original - RA 102/1982, DJ 11.10.1982 e DJ 15.10.1982"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-152","tribunal":"TST","tipo":"sumula","numero":152,"teor":"GRATIFICAÇÃO. AJUSTE TÁCITO.\n\nO fato de constar do recibo de pagamento de gratificação o caráter de liberalidade não basta, por si só, para excluir a existência de ajuste tácito (ex-Prejulgado nº 25).","status":"cancelada","temas":["Salário e remuneração"],"historico":[{"evento":"Cancelamento","ato":"Res. 225/2025","data":"2025-07-02","observacao":"Cancelada por perda de eficácia a partir de 11.11.2017, pela Lei 13.467/2017, Res. 225/2025 - DEJT divulgado em 30.06, 01 e 02.07.2025"},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 102/1982","data":"1982-10-11","observacao":"Redação original - RA 102/1982, DJ 11.10.1982 e DJ 15.10.1982"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 152 O fato de constar do recibo de pagamento de gratificação o caráter de liberalidade não basta, por si só, para excluir a existência de um ajuste tácito (ex-Prejulgado nº 25)."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-153","tribunal":"TST","tipo":"sumula","numero":153,"teor":"PRESCRIÇÃO.\n\nNão se conhece de prescrição não argüida na instância ordinária (ex-Prejulgado nº 27).","status":"em_vigor","temas":["Prescrição e decadência"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 102/1982","data":"1982-10-11","observacao":"Redação original - RA 102/1982, DJ 11.10.1982 e DJ 15.10.1982"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-154","tribunal":"TST","tipo":"sumula","numero":154,"teor":"MANDADO DE SEGURANÇA.\n\nDa decisão do Tribunal Regional do Trabalho em mandado de segurança cabe recurso ordinário, no prazo de 10 dias, para o Tribunal Superior do Trabalho (ex-Prejulgado nº 28).","status":"cancelada","temas":["Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Revista pela Súmula nº 201 - Res. 7/1985, DJ 11, 12 e 15.07.1985"},{"evento":"Redação original","ato":"RA 102/1982","data":"1982-10-11","observacao":"Redação original - RA 102/1982, DJ 11.10.1982 e DJ 15.10.1982"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 154 Da decisão de Tribunal Regional do Trabalho em mandado de segurança cabe recurso ordinário, no prazo de dez dias, para o Tribunal Superior do Trabalho (ex-Prejulgado nº 28)."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-155","tribunal":"TST","tipo":"sumula","numero":155,"teor":"AUSÊNCIA AO SERVIÇO.\n\nAs horas em que o empregado falta ao serviço para comparecimento necessário, como parte, à Justiça do Trabalho não serão descontadas de seus salários (ex-Prejulgado nº 30).","status":"em_vigor","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 102/1982","data":"1982-10-11","observacao":"Redação original - RA 102/1982, DJ 11.10.1982 e DJ 15.10.1982"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 155 As horas em que o empregado falta ao serviço para comparecimento necessário, como parte, à Justiça do Trabalho, não serão descontadas de seus salários (ex-Prejulgado nº 30)."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-156","tribunal":"TST","tipo":"sumula","numero":156,"teor":"PRESCRIÇÃO. PRAZO.\n\nDa extinção do último contrato começa a fluir o prazo prescricional do direito de ação em que se objetiva a soma de períodos descontínuos de trabalho (ex-Prejulgado nº 31).","status":"em_vigor","temas":["Prescrição e decadência"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003). - Entendimento reafirmado no IRR nº 287.\nIRR-287 PRESCRIÇÃO. PRAZO. (RR-0010046-29.2017.5.15.0028, Tribunal Pleno, publicado em 03.09.2025, rel. Min. Aloysio Silva Corrêa da Veiga)\nDa extinção do último contrato começa a fluir o prazo prescricional da pretensão em que se objetiva a soma de períodos descontínuos de trabalho."},{"evento":"Redação original","ato":"RA 102/1982","data":"1982-10-11","observacao":"Redação original - RA 102/1982, DJ 11.10.1982 e DJ 15.10.1982"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 156 Da extinção do último contrato é que começa a fluir o prazo prescricional do direito de ação objetivando a soma de períodos descontínuos de trabalho (ex-Prejulgado nº 31)."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-157","tribunal":"TST","tipo":"sumula","numero":157,"teor":"GRATIFICAÇÃO.\n\nA gratificação instituída pela Lei nº 4.090, de 13.07.1962, é devida na resilição contratual de iniciativa do empregado (ex-Prejulgado nº 32).","status":"em_vigor","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 102/1982","data":"1982-10-11","observacao":"Redação original - RA 102/1982, DJ 11.10.1982 e DJ 15.10.1982"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 157 A gratificação instituída pela Lei nº 4.090, de 1962, é devida na resilição contratual de iniciativa do empregado (ex-Prejulgado nº 32)."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-158","tribunal":"TST","tipo":"sumula","numero":158,"teor":"AÇÃO RESCISÓRIA.\n\nDa decisão de Tribunal Regional do Trabalho, em ação rescisória, é cabível recurso ordinário para o Tribunal Superior do Trabalho, em face da organização judiciária trabalhista (ex-Prejulgado nº 35).","status":"em_vigor","temas":["Rescisão e verbas rescisórias","Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 102/1982","data":"1982-10-11","observacao":"Redação original - RA 102/1982, DJ 11.10.1982 e DJ 15.10.1982"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 158 Da decisão de Tribunal Regional do Trabalho, em ação rescisória, cabível é o recurso ordinário para o Tribunal Superior do Trabalho, em face da organização judiciária trabalhista (ex-Prejulgado nº 35)."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-159","tribunal":"TST","tipo":"sumula","numero":159,"teor":"SUBSTITUIÇÃO DE CARÁTER NÃO EVENTUAL E VACÂNCIA DO CARGO.\n\nI - Enquanto perdurar a substituição que não tenha caráter meramente eventual, inclusive nas férias, o empregado substituto fará jus ao salário contratual do substituído. (ex-Súmula nº 159 - alterada pela Res. 121/2003, DJ 21.11.2003)\nII - Vago o cargo em definitivo, o empregado que passa a ocupá-lo não tem direito a salário igual ao do antecessor. (ex-OJ nº 112 da SBDI-1 - inserida em 01.10.1997)","status":"em_vigor","temas":["Férias, 13º e descansos","Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"(incorporada a Orientação Jurisprudencial nº 112 da SBDI-1) - Res. 129/2005, DJ 20, 22 e 25.04.2005."},{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula alterada - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 159 Substituição\nEnquanto perdurar a substituição que não tenha caráter meramente eventual, inclusive nas férias, o empregado substituto fará jus ao salário contratual do substituído."},{"evento":"Redação original","ato":"RA 102/1982","data":"1982-10-11","observacao":"Redação original - RA 102/1982, DJ 11.10.1982 e DJ 15.10.1982"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 159 Enquanto perdurar a substituição que não tenha caráter meramente eventual, o empregado substituto fará jus ao salário contratual do substituído (ex-Prejulgado nº 36)."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-160","tribunal":"TST","tipo":"sumula","numero":160,"teor":"APOSENTADORIA POR INVALIDEZ.\n\nCancelada a aposentadoria por invalidez, mesmo após cinco anos, o trabalhador terá direito de retornar ao emprego, facultado, porém, ao empregador, indenizá-lo na forma da lei (ex-Prejulgado nº 37).","status":"em_vigor","temas":["Acidente e doença do trabalho"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 102/1982","data":"1982-10-11","observacao":"Redação original - RA 102/1982, DJ 11.10.1982 e DJ 15.10.1982"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-161","tribunal":"TST","tipo":"sumula","numero":161,"teor":"DEPÓSITO. CONDENAÇÃO A PAGAMENTO EM PECÚNIA.\n\nSe não há condenação a pagamento em pecúnia, descabe o depósito de que tratam os §§ 1º e 2º do art. 899 da CLT (ex-Prejulgado nº 39).","status":"em_vigor","temas":["Recursos e prazos","Honorários, custas e justiça gratuita"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 102/1982","data":"1982-10-11","observacao":"Redação original - RA 102/1982, DJ 11.10.1982 e DJ 15.10.1982"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 161 Não havendo condenação em pecúnia, descabe o depósito prévio de que tratam os §§ 1º e 2º do art. 899 da Consolidação das Leis do Trabalho (ex-Prejulgado nº 39)."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-162","tribunal":"TST","tipo":"sumula","numero":162,"teor":"INSALUBRIDADE.\n\nÉ constitucional o art. 3º do Decreto-Lei nº 389, de 26.12.1968 (ex-Prejulgado nº 41).","status":"cancelada","temas":["Adicionais (insalubridade, periculosidade e outros)"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelamento mantido) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Cancelamento","ato":"Res. 59/1996","data":"1996-06-28","observacao":"Súmula cancelada - Res. 59/1996, DJ 28.06.1996, 03, 04 e 05.07.1996"},{"evento":"Redação original","ato":"RA 102/1982","data":"1982-10-11","observacao":"Redação original - RA 102/1982, DJ 11.10.1982 e DJ 15.10.1982"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-163","tribunal":"TST","tipo":"sumula","numero":163,"teor":"AVISO PRÉVIO. CONTRATO DE EXPERIÊNCIA.\n\nCabe aviso prévio nas rescisões antecipadas dos contratos de experiência, na forma do art. 481 da CLT (ex-Prejulgado nº 42).","status":"em_vigor","temas":["Estabilidade e garantias de emprego","Rescisão e verbas rescisórias","Contrato e vínculo de emprego"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 102/1982","data":"1982-10-11","observacao":"Redação original - RA 102/1982, DJ 11.10.1982 e DJ 15.10.1982"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-164","tribunal":"TST","tipo":"sumula","numero":164,"teor":"PROCURAÇÃO. JUNTADA.\n\nO não-cumprimento das determinações dos §§ 1º e 2º do art. 5º da Lei nº 8.906, de 04.07.1994 e do art. 37, parágrafo único, do Código de Processo Civil importa o não-conhecimento de recurso, por inexistente, exceto na hipótese de mandato tácito.","status":"convertida","temas":["Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 210/2016","data":"2016-07-04","observacao":"(cancelada em decorrência da sua incorporação à nova redação da Súmula nº 383) - Res. 210/2016, DEJT divulgado em 30.06.2016 e 01 e 04.07.2016"},{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Nova redação - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 102/1982","data":"1982-10-11","observacao":"Redação original - RA 102/1982, DJ 11.10.1982 e DJ 15.10.1982"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 164 O não cumprimento das determinações dos §§ 1º e 2º do art. 70 da Lei nº 4.215, de 27.4.63, e do art. 37, e parágrafo único, do Código de Processo Civil, importa no não conhecimento de qualquer recurso, por inexistente, exceto na hipótese de mandato tácito (ex-Prejulgado nº 43)."}],"observacao":"Cancelada em decorrência da sua incorporação à nova redação da Súmula nº 383 do TST.","alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-165","tribunal":"TST","tipo":"sumula","numero":165,"teor":"DEPÓSITO. RECURSO. CONTA VINCULADA.\n\nO depósito, para fins de recurso, realizado fora da conta vinculada do trabalhador, desde que feito na sede do juízo, ou realizado na conta vinculada do trabalhador, apesar de fora da sua sede do juízo, uma vez que permaneça à disposição deste, não impedirá o conhecimento do apelo (ex-Prejulgado nº 45).","status":"cancelada","temas":["Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelamento mantido) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Cancelamento","ato":"Res. 87/1998","data":"1998-10-19","observacao":"Súmula cancelada - Res. 87/1998, DJ 15, 16 e 19.10.1998"},{"evento":"Redação original","ato":"RA 102/1982","data":"1982-10-11","observacao":"Redação original - RA 102/1982, DJ 11.10.1982 e DJ 15.10.1982"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-166","tribunal":"TST","tipo":"sumula","numero":166,"teor":"BANCÁRIO. CARGO DE CONFIANÇA. JORNADA DE TRABALHO.\n\nO bancário que exerce a função a que se refere o § 2º do art. 224 da CLT e recebe gratificação não inferior a um terço de seu salário já tem remuneradas as duas horas extraordinárias excedentes de seis (ex-Prejulgado nº 46).","status":"convertida","temas":["Jornada e horas extras","Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"(cancelada em decorrência da sua incorporação à nova redação da Súmula nº 102) - Res. 129/2005, DJ 20, 22 e 25.04.2005"},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 102/1982","data":"1982-10-11","observacao":"Redação original - RA 102/1982, DJ 11.10.1982 e DJ 15.10.1982"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 166 O bancário exercente de função a que se refere o § 2º do art. 224 da CLT e que recebe gratificação não inferior a um terço do seu salário, já tem remuneradas as duas horas extraordinárias que excederem de seis (ex-Prejulgado nº 46)."}],"observacao":"Cancelada em decorrência da sua incorporação à nova redação da Súmula nº 102 do TST.","alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-167","tribunal":"TST","tipo":"sumula","numero":167,"teor":"VOGAL. INVESTIDURA. RECURSO.\n\nDas decisões proferidas pelos Tribunais Regionais, em processo de impugnação ou contestação à investidura de vogal, cabe recurso para o Tribunal Superior do Trabalho (ex-Prejulgado nº 47).","status":"cancelada","temas":["Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 102/1982","data":"1982-10-11","observacao":"Redação original - RA 102/1982, DJ 11.10.1982 e DJ 15.10.1982"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-168","tribunal":"TST","tipo":"sumula","numero":168,"teor":"PRESCRIÇÃO. PRESTAÇÕES PERIÓDICAS. CONTAGEM.\n\nNa lesão de direito que atinja prestações periódicas, de qualquer natureza, devidas ao empregado, a prescrição é sempre parcial e se conta do vencimento de cada uma delas e não do direito do qual se origina (ex-Prejulgado nº 48).","status":"cancelada","temas":["Prescrição e decadência"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelamento mantido) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Cancelamento","ato":"Res. 4/1989","data":"1989-04-19","observacao":"Cancelada pela Súmula nº 294 - Res. 4/1989, DJ 14, 18 e 19.04.1989"},{"evento":"Redação original","ato":"RA 102/1982","data":"1982-10-11","observacao":"Redação original - RA 102/1982, DJ 11.10.1982 e DJ 15.10.1982"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-169","tribunal":"TST","tipo":"sumula","numero":169,"teor":"AÇÃO RESCISÓRIA. JUSTIÇA DO TRABALHO. DEPÓSITO PRÉVIO.\n\nNas ações rescisórias ajuizadas na Justiça do Trabalho e que só serão admitidas nas hipóteses dos arts. 798 a 800 do Código de Processo Civil de 1939, desnecessário o depósito a que aludem os arts. 488, II, e 494 do Código de Processo Civil de 1973 (ex-Prejulgado nº 49).","status":"cancelada","temas":["Rescisão e verbas rescisórias"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Revista pela Súmula nº 194 - Res. 2/1984, DJ 04.10.1984"},{"evento":"Redação original","ato":"RA 102/1982","data":"1982-10-11","observacao":"Redação original - RA 102/1982, DJ 11.10.1982 e DJ 15.10.1982"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-170","tribunal":"TST","tipo":"sumula","numero":170,"teor":"SOCIEDADE DE ECONOMIA MISTA. CUSTAS.\n\nOs privilégios e isenções no foro da Justiça do Trabalho não abrangem as sociedades de economia mista, ainda que gozassem desses benefícios anteriormente ao Decreto-Lei nº 779, de 21.08.1969 (ex-Prejulgado nº 50).","status":"em_vigor","temas":["Honorários, custas e justiça gratuita","Ente público como empregador"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 102/1982","data":"1982-10-11","observacao":"Redação original - RA 102/1982, DJ 11.10.1982 e DJ 15.10.1982"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 170 Os privilégios e isenções no foro da Justiça do Trabalho não abrangem as sociedades de economia mista, ainda que gozassem desses benefícios anteriormente ao Decreto-lei nº 779, de 1969 (ex-Prejulgado nº 50)."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-171","tribunal":"TST","tipo":"sumula","numero":171,"teor":"FÉRIAS PROPORCIONAIS. CONTRATO DE TRABALHO. EXTINÇÃO.\n\nSalvo na hipótese de dispensa do empregado por justa causa, a extinção do contrato de trabalho sujeita o empregador ao pagamento da remuneração das férias proporcionais, ainda que incompleto o período aquisitivo de 12 (doze) meses (art. 147 da CLT) (ex-Prejulgado nº 51).","status":"em_vigor","temas":["Férias, 13º e descansos","Salário e remuneração","Rescisão e verbas rescisórias"],"historico":[{"evento":"Nova redação","ato":null,"data":"2004-05-05","observacao":"(republicada em razão de erro material no registro da referência legislativa), DJ 05.05.2004"},{"evento":"Nova redação","ato":null,"data":"2004-04-27","observacao":"Republicada em razão de erro material no registro da referência legislativa - DJ 27.04.2004"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 171 Férias proporcionais. Contrato de trabalho.\nSalvo na hipótese de dispensa do empregado por justa causa, a extinção do contrato de trabalho sujeita o empregador ao pagamento da remuneração das férias proporcionais, ainda que incompleto o período aquisitivo de 12 (doze) meses (art. 142 da CLT)."},{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula alterada - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 171 Férias proporcionais. Contrato de trabalho. Extinção\nSalvo na hipótese de dispensa do empregado por justa causa, a extinção do contrato de trabalho sujeita o empregador ao pagamento da remuneração das férias proporcionais, ainda que incompleto o período aquisitivo de 12 (doze) meses (art. 142, parágrafo único, combinado com o art. 132, da CLT)."},{"evento":"Redação original","ato":"RA 102/1982","data":"1982-10-11","observacao":"Redação original - RA 102/1982, DJ 11.10.1982 e DJ 15.10.1982"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 171 Salvo na hipótese de dispensa do empregado por justa causa, a extinção do contrato de trabalho, com mais de um ano, sujeita o empregador ao pagamento da remuneração das férias proporcionais, ainda que incompleto o período aquisitivo de doze meses (art. 142, parágrafo único, combinado com o art. 132 da CLT)"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-172","tribunal":"TST","tipo":"sumula","numero":172,"teor":"REPOUSO REMUNERADO. HORAS EXTRAS. CÁLCULO.\n\nComputam-se no cálculo do repouso remunerado as horas extras habitualmente prestadas. (ex-Prejulgado nº 52).","status":"em_vigor","temas":["Jornada e horas extras"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003). - Entendimento reafirmado no IRR nº 256.\nIRR-256 HORAS EXTRAORDINÁRIAS HABITUAIS. INCIDÊNCIA NO CÁLCULO DO REPOUSO REMUNERADO. (RR-0020154-89.2022.5.04.0015, Tribunal Pleno, publicado em 02.09.2025, rel. Min. Aloysio Silva Corrêa da Veiga)\nComputam-se no cálculo do repouso remunerado as horas extraordinárias habitualmente prestadas."},{"evento":"Redação original","ato":"RA 102/1982","data":"1982-10-11","observacao":"Redação original - RA 102/1982, DJ 11.10.1982 e DJ 15.10.1982"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-173","tribunal":"TST","tipo":"sumula","numero":173,"teor":"SALÁRIO. EMPRESA. CESSAÇÃO DE ATIVIDADES.\n\nExtinto, automaticamente, o vínculo empregatício com a cessação das atividades da empresa, os salários só são devidos até a data da extinção (ex-Prejulgado nº 53).","status":"em_vigor","temas":["Salário e remuneração","Contrato e vínculo de emprego"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 102/1982","data":"1982-10-11","observacao":"Redação original - RA 102/1982, DJ 11.10.1982 e DJ 15.10.1982"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-174","tribunal":"TST","tipo":"sumula","numero":174,"teor":"PREVIDÊNCIA. LEI Nº 3.841/1960. APLICAÇÃO.\n\nAs disposições da Lei nº 3.841, de 15.12.1960, dirigidas apenas ao sistema previdenciário oficial, não se aplicam aos empregados vinculados ao regime de seguro social de caráter privado (ex-Prejulgado nº 54).","status":"cancelada","temas":["Outros"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 102/1982","data":"1982-10-11","observacao":"Redação original - RA 102/1982, DJ 11.10.1982 e DJ 15.10.1982"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-175","tribunal":"TST","tipo":"sumula","numero":175,"teor":"RECURSO ADESIVO. ART. 500 DO CPC. INAPLICABILIDADE.\n\nO recurso adesivo, previsto no art. 500 do Código de Processo Civil, é incompatível com o processo do trabalho (ex-Prejulgado nº 55).","status":"cancelada","temas":["Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Revista pela Súmula nº 196 - Res. 2/1985, DJ 01.04.1985 - Republicada com correção DJ 12.04.1985"},{"evento":"Redação original","ato":"RA 102/1982","data":"1982-10-11","observacao":"Redação original - RA 102/1982, DJ 11.10.1982 e DJ 15.10.1982"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-176","tribunal":"TST","tipo":"sumula","numero":176,"teor":"FUNDO DE GARANTIA. LEVANTAMENTO DO DEPÓSITO.\n\nA Justiça do Trabalho só tem competência para autorizar o levantamento do depósito do Fundo de Garantia do Tempo de Serviço na ocorrência de dissídio entre empregado e empregador.","status":"cancelada","temas":["FGTS"],"historico":[{"evento":"Nova redação","ato":"Res. 130/2005","data":"2005-05-13","observacao":"(cancelada) - Res. 130/2005, DJ 13.05.2005"},{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula alterada - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 102/1982","data":"1982-10-11","observacao":"Redação original - RA 102/1982, DJ 11.10.1982 e DJ 15.10.1982"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 176 A Justiça do Trabalho só tem competência para autorizar o levantamento do depósito do Fundo de Garantia do Tempo de Serviço na ocorrência de dissídio entre empregado e empregador e após o trânsito em julgado da sentença (ex-Prejulgado nº 57)."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-177","tribunal":"TST","tipo":"sumula","numero":177,"teor":"DISSÍDIO COLETIVO. SINDICATO. REPRESENTAÇÃO.\n\nEstá em plena vigência o art. 859 da Consolidação das Leis do Trabalho, cuja redação é a seguinte: \"A representação dos sindicatos para instauração da instância fica subordinada à aprovação de assembléia, da qual participem os associados interessados na solução do dissídio coletivo, em primeira convocação, por maioria de 2/3 dos mesmos, ou, em Segunda convocação, por 2/3 dos presentes\" (ex-Prejulgado nº 58).","status":"cancelada","temas":["Direito coletivo e sindical","Provas e ônus da prova"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 102/1982","data":"1982-09-11","observacao":"Redação original - RA 102/1982, DJ 11.09.1982 e DJ 15.10.1982"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-178","tribunal":"TST","tipo":"sumula","numero":178,"teor":"TELEFONISTA. ART. 227, E PARÁGRAFOS, DA CLT. APLICABILIDADE.\n\nÉ aplicável à telefonista de mesa de empresa que não explora o serviço de telefonia o disposto no art. 227, e seus parágrafos, da CLT (ex-Prejulgado nº 59).","status":"em_vigor","temas":["Jornada e horas extras"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 102/1982","data":"1982-10-11","observacao":"Redação original - RA 102/1982, DJ 11.10.1982 e DJ 15.10.1982"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-179","tribunal":"TST","tipo":"sumula","numero":179,"teor":"INCONSTITUCIONALIDADE. ART. 22 DA LEI Nº 5.107/1966.\n\nÉ inconstitucional o art. 22 da Lei nº 5.107, de 13.09.1966, na sua parte final, em que dá competência à Justiça do Trabalho para julgar dissídios coletivos \"quando o BNH e a Previdência Social figurarem no feito como litisconsorte\" (ex-Prejulgado nº 60).","status":"cancelada","temas":["Competência da Justiça do Trabalho"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"RA 102/1982","data":"1982-10-11","observacao":"Redação original - RA 102/1982, DJ 11.10.1982 e DJ 15.10.1982"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-180","tribunal":"TST","tipo":"sumula","numero":180,"teor":"AÇÃO DE CUMPRIMENTO. SUBSTITUIÇÃO PROCESSUAL. DESISTÊNCIA.\n\nNas ações de cumprimento, o substituído processualmente pode, a qualquer tempo, desistir da ação, desde que, comprovadamente, tenha havido transação.","status":"cancelada","temas":["Provas e ônus da prova"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Revista pela Súmula nº 255 - Res. 3/1986, DJ 02,03 e 04.07.1986"},{"evento":"Redação original","ato":"Res. 1/1983","data":"1983-10-19","observacao":"Redação original - Res. 1/1983, DJ 19.10.1983"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-181","tribunal":"TST","tipo":"sumula","numero":181,"teor":"ADICIONAL. TEMPO DE SERVIÇO. REAJUSTE SEMESTRAL. LEI Nº 6.708/1979.\n\nO adicional por tempo de serviço, quando estabelecido em importe fixo, está sujeito ao reajuste da Lei nº 6.708/1979.","status":"cancelada","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 2/1983","data":"1983-10-19","observacao":"Redação original - Res. 2/1983, DJ 19.10.1983"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-182","tribunal":"TST","tipo":"sumula","numero":182,"teor":"AVISO PRÉVIO. INDENIZAÇÃO COMPENSATÓRIA. LEI Nº 6.708, DE 30.10.1979.\n\nO tempo do aviso prévio, mesmo indenizado, conta-se para efeito da indenização adicional prevista no art. 9º da Lei nº 6.708, de 30.10.1979.","status":"em_vigor","temas":["Rescisão e verbas rescisórias","Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003). - Entendimento reafirmado no IRR nº 228.\nIRR-228 AVISO PRÉVIO. PROJEÇÃO. INDENIZAÇÃO ADICIONAL. DISPENSA SEM JUSTA CAUSA NOS TRINTA DIAS QUE ANTECEDEM A DATA DA CORREÇÃO SALARIAL. (RR-0000312-60.2024.5.12.0006, Tribunal Pleno, publicado em 02.09.2025, rel. Min. Aloysio Silva Corrêa da Veiga)\nO tempo do aviso prévio, mesmo indenizado, conta-se para efeito da indenização adicional prevista no art. 9º da Lei nº 6.708, de 30.10.1979, e no art. 9º da Lei nº 7.238, de 29.10.1984."},{"evento":"Nova redação","ato":"Res. 5/1983","data":"1983-11-09","observacao":"Súmula alterada - Res. 5/1983, DJ 09.11.1983"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 182 O tempo do aviso prévio, mesmo indenizado, conta-se para efeito de indenização adicional do art. 9º, da Lei 6.708/79."},{"evento":"Redação original","ato":"Res. 3/1983","data":"1983-10-19","observacao":"Redação original - Res. 3/1983, DJ 19.10.1983"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 182 O tempo do aviso prévio, mesmo indenizado, conta-se para efeito de indenização compensatória do art. 9º, da Lei 6.708/79."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-183","tribunal":"TST","tipo":"sumula","numero":183,"teor":"EMBARGOS. RECURSO DE REVISTA. DESPACHO DENEGATÓRIO. AGRAVO DE INSTRUMENTO. NÃO CABIMENTO.\n\nSão incabíveis embargos para o Tribunal Pleno contra decisão em agravo de instrumento oposto a despacho denegatório de recurso de revista, inexistindo ofensa ao art. 153, § 4º, da Constituição Federal.","status":"cancelada","temas":["Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Revista pela Súmula nº 335 - Res. 27/1994, DJ 12, 17 e 19.05.1994"},{"evento":"Nova redação","ato":"Res. 1/1984","data":"1984-02-28","observacao":"Súmula alterada - Res. 1/1984, DJ 28.02.1984"},{"evento":"Redação original","ato":"Res. 4/1983","data":"1983-10-19","observacao":"Redação original - Res. 4/1983, DJ 19.10.1983"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 183 São incabíveis Embargos para o Tribunal Pleno contra Agravo de Instrumento oposto a despacho denegatório de Recurso de Revista, inexistindo ofensa ao artigo 153, § 4º, da Constituição Federal."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-184","tribunal":"TST","tipo":"sumula","numero":184,"teor":"EMBARGOS DECLARATÓRIOS. OMISSÃO EM RECURSO DE REVISTA . PRECLUSÃO.\n\nOcorre preclusão se não forem opostos embargos declaratórios para suprir omissão apontada em recurso de revista ou de embargos.","status":"em_vigor","temas":["Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 6/1983","data":"1983-11-09","observacao":"Redação original - Res. 6/1983, DJ 09.11.1983"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 184 Ocorre preclusão quando não forem opostos embargos declaratórios para suprir omissão apontada em recurso de revista ou de embargos."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-185","tribunal":"TST","tipo":"sumula","numero":185,"teor":"EMBARGOS SOB INTERVENÇÃO DO BANCO CENTRAL. LIQUIDAÇÃO EXTRAJUDICIAL. JUROS. CORREÇÃO MONETÁRIA. LEI Nº 6.024/1974.\n\nAplicada a Lei nº 6.024/1974, fica suspensa a incidência de juros e correção monetária nas liquidações de empresas sob intervenção do Banco Central.","status":"cancelada","temas":["Execução e penhora","Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Revista pela Súmula nº 284 - Res. 17/1988, DJ 18, 21 e 22.03.1988"},{"evento":"Redação original","ato":"Res. 7/1983","data":"1983-11-09","observacao":"Redação original - Res. 7/1983, DJ 09.11.1983"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-186","tribunal":"TST","tipo":"sumula","numero":186,"teor":"LICENÇA-PRÊMIO. CONVERSÃO EM PECÚNIA. REGULAMENTO DA EMPRESA.\n\nA licença-prêmio, na vigência do contrato de trabalho, não pode ser convertida em pecúnia, salvo se expressamente admitida a conversão no regulamento da empresa.","status":"em_vigor","temas":["Salário e remuneração","Contrato e vínculo de emprego"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(nova redação) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 8/1983","data":"1983-11-09","observacao":"Redação original - Res. 8/1983, DJ 09.11.1983"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 186 A licença-prêmio não pode ser convertida em pecúnia, salvo se expressamente admitida no regulamento da empresa."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-187","tribunal":"TST","tipo":"sumula","numero":187,"teor":"CORREÇÃO MONETÁRIA. INCIDÊNCIA.\n\nA correção monetária não incide sobre o débito do trabalhador reclamante.","status":"em_vigor","temas":["Execução e penhora"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 9/1983","data":"1983-11-09","observacao":"Redação original - Res. 9/1983, DJ 09.11.1983"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-188","tribunal":"TST","tipo":"sumula","numero":188,"teor":"CONTRATO DE TRABALHO. EXPERIÊNCIA. PRORROGAÇÃO.\n\nO contrato de experiência pode ser prorrogado, respeitado o limite máximo de 90 (noventa) dias.","status":"em_vigor","temas":["Contrato e vínculo de emprego"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 10/1983","data":"1983-11-09","observacao":"Redação original - Res. 10/1983, DJ 09.11.1983"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 188 O contrato de experiência pode ser prorrogado, respeitado o limite máximo de 90 dias."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-189","tribunal":"TST","tipo":"sumula","numero":189,"teor":"GREVE. COMPETÊNCIA DA JUSTIÇA DO TRABALHO. ABUSIVIDADE.\n\nA Justiça do Trabalho é competente para declarar a abusividade, ou não, da greve.","status":"em_vigor","temas":["Greve","Competência da Justiça do Trabalho"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(nova redação) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 11/1983","data":"1983-11-09","observacao":"Redação original - Res. 11/1983, DJ 09.11.1983"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 189 A Justiça do Trabalho é competente para declarar a legalidade ou ilegalidade da greve."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-190","tribunal":"TST","tipo":"sumula","numero":190,"teor":"PODER NORMATIVO DO TST. CONDIÇÕES DE TRABALHO. INCONSTITUCIONALIDADE. DECISÕES CONTRÁRIAS AO STF.\n\nAo julgar ou homologar ação coletiva ou acordo nela havido, o Tribunal Superior do Trabalho exerce o poder normativo constitucional, não podendo criar ou homologar condições de trabalho que o Supremo Tribunal Federal julgue iterativamente inconstitucionais.","status":"em_vigor","temas":["Direito coletivo e sindical"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 12/1983","data":"1983-11-09","observacao":"Redação original - Res. 12/1983, DJ 09.11.1983"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 190 Decidindo ação coletiva ou homologando acordo nela havido, o Tribunal Superior do Trabalho exerce o poder normativo constitucional, não podendo criar ou homologar condições de trabalho que o Supremo Tribunal Federal julgue iterativamente inconstitucionais."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-191","tribunal":"TST","tipo":"sumula","numero":191,"teor":"ADICIONAL DE PERICULOSIDADE. INCIDÊNCIA. BASE DE CÁLCULO.\n\nI - O adicional de periculosidade incide apenas sobre o salário básico e não sobre este acrescido de outros adicionais.\nII - O adicional de periculosidade do empregado eletricitário, contratado sob a égide da Lei nº 7.369/1985, deve ser calculado sobre a totalidade das parcelas de natureza salarial. Não é válida norma coletiva mediante a qual se determina a incidência do referido adicional sobre o salário básico.\nIII - A alteração da base de cálculo do adicional de periculosidade do eletricitário promovida pela Lei nº 12.740/2012 atinge somente contrato de trabalho firmado a partir de sua vigência, de modo que, nesse caso, o cálculo será realizado exclusivamente sobre o salário básico, conforme determina o § 1º do art. 193 da CLT.","status":"em_vigor","temas":["Adicionais (insalubridade, periculosidade e outros)","Salário e remuneração","Contrato e vínculo de emprego"],"historico":[{"evento":"Nova redação","ato":"Res. 214/2016","data":"2016-12-02","observacao":"(cancelada a parte final da antiga redação e inseridos os itens II e III) - Res. 214/2016, DEJT divulgado em 30.11.2016 e 01 e 02.12.2016"},{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Nova redação - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 191 Adicional. Periculosidade. Incidência\nO adicional de periculosidade incide apenas sobre o salário básico e não sobre este acrescido de outros adicionais. Em relação aos eletricitários, o cálculo do adicional de periculosidade deverá ser efetuado sobre a totalidade das parcelas de natureza salarial."},{"evento":"Redação original","ato":"Res. 13/1983","data":"1983-11-09","observacao":"Redação original - Res. 13/1983, DJ 09.11.1983"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 191 O adicional de periculosidade incide, apenas, sobre o salário básico, e não sobre este acrescido de outros adicionais."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-192","tribunal":"TST","tipo":"sumula","numero":192,"teor":"AÇÃO RESCISÓRIA. COMPETÊNCIA.\n\nI - Se não houver o conhecimento de recurso de revista ou de embargos, a competência para julgar ação que vise a rescindir a decisão de mérito é do Tribunal Regional do Trabalho, ressalvado o disposto no item II.\nII - Acórdão rescindendo do Tribunal Superior do Trabalho que não conhece de recurso de embargos ou de revista, analisando arguição de violação de dispositivo de lei material ou decidindo em consonância com súmula de direito material ou com iterativa, notória e atual jurisprudência de direito material da Seção de Dissídios Individuais (Súmula nº 333), examina o mérito da causa, cabendo ação rescisória da competência do Tribunal Superior do Trabalho. (ex-Súmula nº 192 - alterada pela Res. 121/2003, DJ 21.11.2003)\nIII - Sob a égide do art. 512 do CPC de 1973, é juridicamente impossível o pedido explícito de desconstituição de sentença quando substituída por acórdão do Tribunal Regional ou superveniente sentença homologatória de acordo que puser fim ao litígio.\nIV - Na vigência do CPC de 1973, é manifesta a impossibilidade jurídica do pedido de rescisão de julgado proferido em agravo de instrumento que, limitando-se a aferir o eventual desacerto do juízo negativo de admissibilidade do recurso de revista, não substitui o acórdão regional, na forma do art. 512 do CPC. (ex-OJ nº 105 da SBDI-2 - DJ 29.04.2003)\nV - A decisão proferida pela SBDI, em agravo regimental, calcada na Súmula nº 333, substitui acórdão de Turma do TST, porque emite juízo de mérito, comportando, em tese, o corte rescisório. (ex-OJ nº 133 da SBDI-2 - DJ 04.05.2004).","status":"em_vigor","temas":["Rescisão e verbas rescisórias","Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 212/2016","data":"2016-09-22","observacao":"(atualizada em decorrência do CPC de 2015) - Res. 212/2016, DEJT divulgado em 20, 21 e 22.09.2016"},{"evento":"Nova redação","ato":"Res. 153/2008","data":"2008-11-24","observacao":"Súmula alterada - Res. 153/2008, DEJT divulgado em 20, 21 e 24.11.2008"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 192. Ação rescisória. Competência e possibilidade jurídica do pedido (inciso III alterado\nI - Se não houver o conhecimento de recurso de revista ou de embargos, a competência para julgar ação que vise a rescindir a decisão de mérito é do Tribunal Regional do Trabalho, ressalvado o disposto no item II. (ex-Súmula nº 192 - alterada pela Res. 121/2003, DJ 21.11.2003)\nII - Acórdão rescindendo do Tribunal Superior do Trabalho que não conhece de recurso de embargos ou de revista, analisando argüição de violação de dispositivo de lei material ou decidindo em consonância com súmula de direito material ou com iterativa, notória e atual jurisprudência de direito material da Seção de Dissídios Individuais (Súmula nº 333), examina o mérito da causa, cabendo ação rescisória da competência do Tribunal Superior do Trabalho. (ex-Súmula nº 192 - alterada pela Res. 121/2003, DJ 21.11.2003)\nIII - Em face do disposto no art. 512 do CPC, é juridicamente impossível o pedido explícito de desconstituição de sentença quando substituída por acórdão do Tribunal Regional ou superveniente sentença homologatória de acordo que puser fim ao litígio.\nIV - É manifesta a impossibilidade jurídica do pedido de rescisão de julgado proferido em agravo de instrumento que, limitando-se a aferir o eventual desacerto do juízo negativo de admissibilidade do recurso de revista, não substitui o acórdão regional, na forma do art. 512 do CPC. (ex-OJ nº 105 da SBDI-II - DJ 29.04.2003)\nV - A decisão proferida pela SBDI, em sede de agravo regimental, calcada na Súmula nº 333, substitui acórdão de Turma do TST, porque emite juízo de mérito, comportando, em tese, o corte rescisório. (ex-OJ nº 133 da SBDI-II - DJ 04.05.2004)"},{"evento":"Nova redação","ato":"Res. 137/2005","data":"2005-08-24","observacao":"Súmula alterada - Res. 137/2005, DJ 22, 23 e 24.08.2005"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 192. Ação rescisória. Competência e possibilidade jurídica do pedido (incorporadas as Orientações Jurisprudenciais nºs 48, 105 e 133 da SBDI-2)\nI - Se não houver o conhecimento de recurso de revista ou de embargos, a competência para julgar ação que vise a rescindir a decisão de mérito\né do Tribunal Regional do Trabalho, ressalvado o disposto no item II. (ex-Súmula nº 192 - alterada pela Res. 121/2003, DJ 21.11.2003)\nII - Acórdão rescindendo do Tribunal Superior do Trabalho que não conhece de recurso de embargos ou de revista, analisando argüição de violação de\ndispositivo de lei material ou decidindo em consonância com súmula de direito material ou com iterativa, notória e atual jurisprudência de direito material\nda Seção de Dissídios Individuais (Súmula nº 333), examina o mérito da causa, cabendo ação rescisória da competência do Tribunal Superior do Trabalho.\n(ex-Súmula nº 192 - alterada pela Res. 121/2003, DJ 21.11.2003)\nIII - Em face do disposto no art. 512 do CPC, é juridicamente impossível o pedido explícito de desconstituição de sentença quando substituída por acórdão Regional. (ex-OJ nº 48 da SBDI-2 - inserida em 20.09.2000)\nIV - É manifesta a impossibilidade jurídica do pedido de rescisão de julgado proferido em agravo de instrumento que, limitando-se a aferir o eventual desacerto do juízo negativo de admissibilidade do recurso de revista, não substitui o acórdão regional, na forma do art. 512 do CPC. (ex-OJ nº 105 da SBDI-2 - DJ 29.04.2003)\nV - A decisão proferida pela SBDI, em sede de agravo regimental, calcada na Súmula nº 333, substitui acórdão de Turma do TST, porque emite juízo de mérito, comportando, em tese, o corte rescisório. (ex-OJ nº 133 da SBDI-2 - DJ 04.05.2004)"},{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula alterada - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 192. Ação rescisória. Competência.\nI - Se não houver o conhecimento de recurso de revista ou de embargos, a competência para julgar ação que vise a rescindir a decisão de mérito é\ndo Tribunal Regional do Trabalho, ressalvado o disposto no item II.\nII - Acórdão rescindendo do Tribunal Superior do Trabalho que não conhece de recurso de embargos ou de revista, analisando argüição de violação de dispositivo de lei material ou decidindo em consonância com enunciado de direito material ou com iterativa, notória e atual jurisprudência de direito material da Seção de Dissídios Individuais (Súmula nº 333), examina o mérito da causa, cabendo ação rescisória da competência do Tribunal Superior do Trabalho."},{"evento":"Redação original","ato":"Res. 14/1983","data":"1983-11-09","observacao":"Redação original - Res. 14/1983, DJ 09.11.1983"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 192 Não sendo conhecidos o recurso de revista e o de embargos, a competência para julgar a ação que vise a rescindir a decisão de mérito é do Tribunal Regional do Trabalho."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-193","tribunal":"TST","tipo":"sumula","numero":193,"teor":"CORREÇÃO MONETÁRIA. JUROS. CÁLCULO. EXECUÇÃO DE SENTENÇA. PESSOA JURÍDICA DE DIREITO PÚBLICO.\n\nNos casos de execução de sentença contra pessoa jurídica de direito público, os juros e a correção monetária serão calculados até o pagamento do valor principal da condenação.","status":"cancelada","temas":["Estabilidade e garantias de emprego","Execução e penhora"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelamento mantido) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Cancelamento","ato":"Res. 105/2000","data":"2000-12-20","observacao":"Súmula cancelada - Res. 105/2000, DJ 18, 19 e 20.12.2000"},{"evento":"Redação original","ato":"Res. 15/1983","data":"1983-11-09","observacao":"Redação original - Res. 15/1983, DJ 09.11.1983"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-194","tribunal":"TST","tipo":"sumula","numero":194,"teor":"AÇÃO RESCISÓRIA. JUSTIÇA DO TRABALHO. DEPÓSITO PRÉVIO.\n\nAs ações rescisórias ajuizadas na Justiça do Trabalho serão admitidas, instruídas e julgadas conforme os arts. 485 \"usque\" 495 do Código de Processo Civil de 1973, sendo, porém, desnecessário o depósito prévio a que aludem os respectivos arts. 488, II, e 494.","status":"cancelada","temas":["Rescisão e verbas rescisórias"],"historico":[{"evento":"Nova redação","ato":"Res. 142/2007","data":"2007-10-15","observacao":"(cancelada) - Res. 142/2007, DJ 10, 11 e 15.10.2007"},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 2/1984","data":"1984-10-04","observacao":"Redação original (revisão da Súmula nº 169) - Res. 2/1984, DJ 04.10.1984"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 194 As ações rescisórias ajuizadas na Justiça do Trabalho serão admitidas, instruídas e julgadas conforme os arts. 485 usque 495 do Código de Processo Civil de 1973, sendo, porém, desnecessário o depósito prévio a que aludem os respectivos artigos 488, inciso II, e 494 do mesmo código."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-195","tribunal":"TST","tipo":"sumula","numero":195,"teor":"EMBARGOS. AGRAVO REGIMENTAL. CABIMENTO.\n\nNão cabem embargos para o Pleno de decisão de Turma do Tribunal Superior do Trabalho, prolatada em agravo regimental.","status":"cancelada","temas":["Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Revista pela Súmula nº 353 - Res. 70/1997, DJ 30.05.1997, 04, 05 e 06.06.1997"},{"evento":"Redação original","ato":"Res. 1/1985","data":"1985-04-03","observacao":"Redação original - Res. 1/1985, DJ 01, 02 e 03.04.1985"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-196","tribunal":"TST","tipo":"sumula","numero":196,"teor":"RECURSO ADESIVO. PRAZO.\n\nO recurso adesivo é compatível com o processo do trabalho, onde cabe, no prazo de 8 (oito) dias, no recurso ordinário, na revista, nos embargos para o Pleno e no agravo de petição.","status":"cancelada","temas":["Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Revista pela Súmula nº 283 - Res. 16/1988, DJ 18, 21 e 22..03.1988."},{"evento":"Redação original","ato":"Res. 2/1985","data":"1985-04-01","observacao":"Redação original (revisão da Súmula nº 175) - Res. 2/1985, DJ 01.04.1985 - Republicada com correção DJ 12, 15 e 16.04.1985"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-197","tribunal":"TST","tipo":"sumula","numero":197,"teor":"PRAZO.\n\nO prazo para recurso da parte que, intimada, não comparecer à audiência em prosseguimento para a prolação da sentença conta-se de sua publicação.","status":"em_vigor","temas":["Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003). - Entendimento reafirmado no IRR nº 217.\nIRR-217 PUBLICAÇÃO DA SENTENÇA. PRAZO RECURSAL. (RR-0000022-36.2024.5.09.0133, Tribunal Pleno, publicado em 02.09.2025, rel. Min. Aloysio Silva Corrêa da Veiga)\nO prazo para recurso da parte que, intimada, não comparecer à audiência em prosseguimento para a prolação da sentença conta-se de sua publicação."},{"evento":"Redação original","ato":"Res. 3/1985","data":"1985-04-03","observacao":"Redação original - Res. 3/1985, DJ 01, 02 e 03.04.1985"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 197 O prazo para recurso da parte que, intimada, não comparecer à audiência em prosseguimento para a prolação da sentença, conta-se de sua publicação."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-198","tribunal":"TST","tipo":"sumula","numero":198,"teor":"PRESCRIÇÃO.\n\nNa lesão de direito individual que atinja prestações periódicas devidas ao empregado, à exceção da que decorre de ato único do empregador, a prescrição é sempre parcial e se conta do vencimento de cada uma dessas prestações, e não da lesão do direito.","status":"cancelada","temas":["Prescrição e decadência"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelamento mantido) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Cancelamento","ato":"Res. 4/1989","data":"1989-04-19","observacao":"Cancelada pela Súmula nº 294 - Res. 4/1989, DJ 14, 18 e 19.04.1989"},{"evento":"Redação original","ato":"Res. 4/1985","data":"1985-04-03","observacao":"Redação original - Res. 4/1985, DJ 01, 02 e 03.04.1985"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-199","tribunal":"TST","tipo":"sumula","numero":199,"teor":"BANCÁRIO. PRÉ-CONTRATAÇÃO DE HORAS EXTRAS.\n\nI - A contratação do serviço suplementar, quando da admissão do trabalhador bancário, é nula. Os valores assim ajustados apenas remuneram a jornada normal, sendo devidas as horas extras com o adicional de, no mínimo, 50% (cinqüenta por cento), as quais não configuram pré-contratação, se pactuadas após a admissão do bancário. (ex-Súmula nº 199 - alterada pela Res. 41/1995, DJ 21.02.1995 - e ex-OJ nº 48 da SBDI-1 - inserida em 25.11.1996)\nII - Em se tratando de horas extras pré-contratadas, opera-se a prescrição total se a ação não for ajuizada no prazo de cinco anos, a partir da data em que foram suprimidas. (ex-OJ nº 63 da SBDI-1 - inserida em 14.03.1994)","status":"em_vigor","temas":["Jornada e horas extras","Prescrição e decadência"],"historico":[{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"(incorporadas as Orientações Jurisprudenciais nºs 48 e 63 da SBDI-1) - Res. 129/2005, DJ 20, 22 e 25.04.2005"},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Nova redação","ato":"Res. 41/1995","data":"1995-02-21","observacao":"Súmula alterada - Res. 41/1995, DJ 17, 20 e 21.02.1995"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 199 Bancário. Pré-contratação de horas extras\nA contratação do serviço suplementar, quando da admissão do trabalhador bancário, é nula. Os valores assim ajustados apenas remuneram a jornada normal, sendo devidas as horas extras com o adicional de, no mínimo, 50% (cinqüenta por cento)."},{"evento":"Redação original","ato":"Res. 5/1985","data":"1985-05-14","observacao":"Redação original - Res. 5/1985, DJ 10, 13 e 14.05.1985"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 199 A contratação do serviço suplementar, quando da admissão do trabalhador bancário, é nula. Os valores assim ajustados apenas remuneram a jornada normal, sendo devidas as horas extras com o adicional de 25% (vinte e cinco por cento)."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-200","tribunal":"TST","tipo":"sumula","numero":200,"teor":"JUROS DE MORA. INCIDÊNCIA.\n\nOs juros de mora incidem sobre a importância da condenação já corrigida monetariamente.","status":"em_vigor","temas":["Execução e penhora"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 6/1985","data":"1985-06-18","observacao":"Redação original - Res. 6/1985, DJ 18.06.1985 e 24, 25 e 26.06.1985"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 200 Juros da mora. Incidência\nOs juros da mora incidem sobre a importância da condenação já corrigida monetariamente."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-201","tribunal":"TST","tipo":"sumula","numero":201,"teor":"RECURSO ORDINÁRIO EM MANDADO DE SEGURANÇA.\n\nDa decisão de Tribunal Regional do Trabalho em mandado de segurança cabe recurso ordinário, no prazo de 8 (oito) dias, para o Tribunal Superior do Trabalho, e igual dilação para o recorrido e interessados apresentarem razões de contrariedade.","status":"em_vigor","temas":["Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 7/1985","data":"1985-07-15","observacao":"Redação original (revisão da Súmula nº 154) - Res. 7/1985, DJ 11, 12 e 15.07.1985"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 201 Recurso ordinário em mandado de segurança\nDa decisão de Tribunal Regional do Trabalho em mandado de segurança cabe recurso ordinário, no prazo de oito (8) dias, para o Tribunal Superior do Trabalho, correspondendo igual dilação para o recorrido e interessados apresentarem razões de contrariedade."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-202","tribunal":"TST","tipo":"sumula","numero":202,"teor":"GRATIFICAÇÃO POR TEMPO DE SERVIÇO. COMPENSAÇÃO.\n\nExistindo, ao mesmo tempo, gratificação por tempo de serviço outorgada pelo empregador e outra da mesma natureza prevista em acordo coletivo, convenção coletiva ou sentença normativa, o empregado tem direito a receber, exclusivamente, a que lhe seja mais benéfica.","status":"em_vigor","temas":["Salário e remuneração","Direito coletivo e sindical","Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 8/1985","data":"1985-07-15","observacao":"Redação original - Res. 8/1985, DJ 11, 12 e 15.07.1985"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-203","tribunal":"TST","tipo":"sumula","numero":203,"teor":"GRATIFICAÇÃO POR TEMPO DE SERVIÇO. NATUREZA SALARIAL.\n\nA gratificação por tempo de serviço integra o salário para todos os efeitos legais.","status":"em_vigor","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 9/1985","data":"1985-07-15","observacao":"Redação original - Res. 9/1985, DJ 11, 12 e 15.07.1985"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-204","tribunal":"TST","tipo":"sumula","numero":204,"teor":"BANCÁRIO. CARGO DE CONFIANÇA. CARACTERIZAÇÃO.\n\nA configuração, ou não, do exercício da função de confiança a que se refere o art. 224, § 2º, da CLT, dependente da prova das reais atribuições do empregado, é insuscetível de exame mediante recurso de revista ou de embargos.","status":"convertida","temas":["Recursos e prazos","Provas e ônus da prova"],"historico":[{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"(cancelada em decorrência da sua incorporação à nova redação da Súmula nº 102) - Res. 129/2005, DJ 20, 22 e 25.04.2005"},{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula alterada - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 10/1985","data":"1985-07-15","observacao":"Redação original - Res. 10/1985, DJ 11, 12 e 15.07.1985 - Republicada com correção DJ 30.09.1985 e 04, 07 e 08.10.1985"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 204 Bancário. Cargo de confiança. Caracterização\nAs circunstâncias que caracterizam o bancário como exercente de função de confiança são previstas no art. 224, § 2º da Consolidação das Leis do Trabalho, não exigindo amplos poderes de mando, representação e substituição do empregador, de que cogita o art. 62, alínea b , consolidado."}],"observacao":"Cancelada em decorrência da sua incorporação à nova redação da Súmula nº 102 do TST.","alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-205","tribunal":"TST","tipo":"sumula","numero":205,"teor":"GRUPO ECONÔMICO. EXECUÇÃO. SOLIDARIEDADE.\n\nO responsável solidário, integrante do grupo econômico, que não participou da relação processual como reclamado e que, portanto, não consta no título executivo judicial como devedor, não pode ser sujeito passivo na execução.","status":"cancelada","temas":["Terceirização e responsabilidade","Execução e penhora"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 20, 22 e 25.04.2005"},{"evento":"Redação original","ato":"Res. 11/1985","data":"1985-07-15","observacao":"Redação original - Res. 11/1985, DJ 11, 12 e 15.07.1985"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-206","tribunal":"TST","tipo":"sumula","numero":206,"teor":"FGTS. INCIDÊNCIA SOBRE PARCELAS PRESCRITAS.\n\nA prescrição da pretensão relativa às parcelas remuneratórias alcança o respectivo recolhimento da contribuição para o FGTS.","status":"em_vigor","temas":["FGTS","Prescrição e decadência"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(nova redação - Res. 121/2003, DJ 20, 22 e 25.04.2005). - Entendimento reafirmado no IRR nº 251.\nIRR-251 FGTS. INCIDÊNCIA SOBRE PARCELAS PRESCRITAS. (RR-0010826-76.2024.5.03.0021, Tribunal Pleno, publicado em 02.09.2025, rel. Min. Aloysio Silva Corrêa da Veiga)\nA prescrição da pretensão relativa às parcelas remuneratórias alcança o respectivo recolhimento da contribuição para o FGTS."},{"evento":"Redação original","ato":"Res. 12/1985","data":"1985-07-15","observacao":"Redação original - Res. 12/1985, DJ 11, 12 e 15.07.1985"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 206 FGTS. Incidência sobre parcelas prescritas\nA prescrição bienal relativa às parcelas remuneratórias alcança o respectivo recolhimento da contribuição para o FGTS."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-207","tribunal":"TST","tipo":"sumula","numero":207,"teor":"CONFLITOS DE LEIS TRABALHISTAS NO ESPAÇO. PRINCÍPIO DA \"LEX LOCI EXECUTIONIS\".\n\nA relação jurídica trabalhista é regida pelas leis vigentes no país da prestação de serviço e não por aquelas do local da contratação.","status":"cancelada","temas":["Contrato e vínculo de emprego"],"historico":[{"evento":"Nova redação","ato":"Res. 181/2012","data":"2012-04-23","observacao":"(cancelada) - Res. 181/2012, DEJT divulgado em 19, 20 e 23.04.2012"},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 13/1985","data":"1985-07-15","observacao":"Redação original - Res. 13/1985, DJ 11, 12 e 15.07.1985"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-208","tribunal":"TST","tipo":"sumula","numero":208,"teor":"RECURSO DE REVISTA. ADMISSIBILIDADE. INTERPRETAÇÃO DE CLÁUSULA DE NATUREZA CONTRATUAL.\n\nA divergência jurisprudencial, suficiente a ensejar a admissibilidade ou o conhecimento do recurso de revista, diz respeito a interpretação de lei, sendo imprestável aquela referente ao alcance de cláusula contratual, ou de regulamento de empresa.","status":"cancelada","temas":["Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelamento mantido) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Cancelamento","ato":"Res. 59/1996","data":"1996-06-28","observacao":"Súmula cancelada - Res. 59/1996, DJ 28.06.1996 e 03, 04 e 05.07.1996"},{"evento":"Redação original","ato":"Res. 14/1985","data":"1985-09-19","observacao":"Redação original - Res. 14/1985, DJ 19.09.1985 e 24, 25 e 26.09.1985"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-209","tribunal":"TST","tipo":"sumula","numero":209,"teor":"CARGO EM COMISSÃO. REVERSÃO.\n\nA reversão do empregado ao cargo efetivo implica a perda das vantagens salariais inerentes ao cargo em comissão, salvo se nele houver permanecido 10 (dez) ou mais anos ininterruptos.","status":"cancelada","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelamento mantido) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Cancelamento","ato":"RA 81/1985","data":"1985-12-05","observacao":"Súmula cancelada - RA 81/1985, DJ 03, 04 e 05.12.1985"},{"evento":"Redação original","ato":"Res. 14/1985","data":"1985-09-19","observacao":"Redação original - Res. 14/1985, DJ 19.09.1985 - Republicada DJ 04, 07 e 08.10.1985"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 209 Cargo em comissão - Reversão.\nA reversão do empregado ao cargo efetivo implica na perda das vantagens salariais inerentes ao cargo em comissão, salvo se nele houver permanecido dez ou mais anos ininterruptos."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-210","tribunal":"TST","tipo":"sumula","numero":210,"teor":"RECURSO DE REVISTA. EXECUÇÃO DE SENTENÇA.\n\nA admissibilidade do recurso de revista contra acórdão proferido em execução de sentença depende de demonstração inequívoca de violação direta à Constituição Federal.","status":"cancelada","temas":["Execução e penhora","Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Revista pela Súmula nº 266 - Res. 1/1987, DJ 23.10.1987 e DJ 10, 11 e 14.12.1987."},{"evento":"Redação original","ato":"Res. 14/1985","data":"1985-09-19","observacao":"Redação original - Res. 14/1985, DJ 19.09.1985 e 24, 25 e 26.09.1985"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-211","tribunal":"TST","tipo":"sumula","numero":211,"teor":"JUROS DE MORA E CORREÇÃO MONETÁRIA. INDEPENDÊNCIA DO PEDIDO INICIAL E DO TÍTULO EXECUTIVO JUDICIAL.\n\nOs juros de mora e a correção monetária incluem-se na liquidação, ainda que omisso o pedido inicial ou a condenação.","status":"em_vigor","temas":["Execução e penhora"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"JUDICIAL (mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 14/1985","data":"1985-09-19","observacao":"Redação original - Res. 14/1985, DJ 19.09.1985 e 24, 25 e 26.09.1985"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 211 Juros da mora e correção monetária. Independência do pedido inicial e do título executivo judicial.\nOs juros de mora e correção monetária incluem-se na liquidação, ainda que omisso o pedido inicial ou a condenação."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-212","tribunal":"TST","tipo":"sumula","numero":212,"teor":"DESPEDIMENTO. ÔNUS DA PROVA.\n\nO ônus de provar o término do contrato de trabalho, quando negados a prestação de serviço e o despedimento, é do empregador, pois o princípio da continuidade da relação de emprego constitui presunção favorável ao empregado.","status":"em_vigor","temas":["Provas e ônus da prova","Contrato e vínculo de emprego"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003). - Entendimento reafirmado no IRR nº 278.\nIRR-278 DESPEDIMENTO. ÔNUS DA PROVA. (RRAg-0000062-67.2023.5.09.0322, Tribunal Pleno, publicado em 03.09.2025, rel. Min. Aloysio Silva Corrêa da Veiga)\nO ônus de provar o término do contrato de trabalho, quando negados a prestação de serviço e o despedimento, é do empregador, pois o princípio da continuidade da relação de emprego constitui presunção favorável ao empregado."},{"evento":"Redação original","ato":"Res. 14/1985","data":"1985-09-19","observacao":"Redação original - Res. 14/1985, DJ 19.09.1985 e 24, 25 e 26.09.1985"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-213","tribunal":"TST","tipo":"sumula","numero":213,"teor":"EMBARGOS DE DECLARAÇÃO. SUSPENSÃO DO PRAZO RECURSAL.\n\nOs embargos de declaração suspendem o prazo do recurso principal, para ambas as partes, não se computando o dia da sua interposição.","status":"cancelada","temas":["Estabilidade e garantias de emprego","Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelamento mantido) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Cancelamento","ato":"Res. 46/1995","data":"1995-04-25","observacao":"Súmula cancelada - Res. 46/1995, DJ 20, 24 e 25.04.1995"},{"evento":"Redação original","ato":"Res. 14/1985","data":"1985-09-19","observacao":"Redação original - Res. 14/1985, DJ 19.09.1985 e 24, 25 e 26.09.1985"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-214","tribunal":"TST","tipo":"sumula","numero":214,"teor":"DECISÃO INTERLOCUTÓRIA. IRRECORRIBILIDADE.\n\nNa Justiça do Trabalho, nos termos do art. 893, § 1º, da CLT, as decisões interlocutórias não ensejam recurso imediato, salvo nas hipóteses de decisão: a) de Tribunal Regional do Trabalho contrária à Súmula ou Orientação Jurisprudencial do Tribunal Superior do Trabalho; b) suscetível de impugnação mediante recurso para o mesmo Tribunal; c) que acolhe exceção de incompetência territorial, com a remessa dos autos para Tribunal Regional distinto daquele a que se vincula o juízo e
