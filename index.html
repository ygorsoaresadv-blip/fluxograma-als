mento. Art. 514, II, do CPC.\nNão se conhece de recurso para o TST, pela ausência do requisito de admissibilidade inscrito no art. 514, II, do CPC, quando as razões do recorrente não impugnam os fundamentos da decisão recorrida, nos termos em que fora proposta. (ex-OJ nº 90 da SBDI-2 - inserida em 27.05.2002)"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-423","tribunal":"TST","tipo":"sumula","numero":423,"teor":"TURNO ININTERRUPTO DE REVEZAMENTO. FIXAÇÃO DE JORNADA DE TRABALHO MEDIANTE NEGOCIAÇÃO COLETIVA. VALIDADE.\n\nEstabelecida jornada superior a seis horas e limitada a oito horas por meio de regular negociação coletiva, os empregados submetidos a turnos ininterruptos de revezamento não tem direito ao pagamento da 7ª e 8ª horas como extras.","status":"cancelada","temas":["Jornada e horas extras","Direito coletivo e sindical"],"historico":[{"evento":"Cancelamento","ato":"Res. 225/2025","data":"2025-07-02","observacao":"Cancelada por perda de eficácia considerando a decisão do ARE 1.121.633, a partir da publicação da ata de julgamento em 14.06.2022. Res. 225/2025, DEJT divulgado em 30.06, 01 e 02.07.2025"},{"evento":"Conversão","ato":"Res. 139/2006","data":"2006-10-13","observacao":"Conversão da Orientação Jurisprudencial nº 169 da SBDI-1 - Res. 139/2006, DJ 10, 11 e 13.10.2006"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-424","tribunal":"TST","tipo":"sumula","numero":424,"teor":"RECURSO ADMINISTRATIVO. PRESSUPOSTO DE ADMISSIBILIDADE. DEPÓSITO PRÉVIO DA MULTA ADMINISTRATIVA. NÃO RECEPÇÃO PELA CONSTITUIÇÃO FEDERAL DO § 1º DO ART. 636 DA CLT.\n\nO § 1º do art. 636 da CLT, que estabelece a exigência de prova do depósito prévio do valor da multa cominada em razão de autuação administrativa como pressuposto de admissibilidade de recurso administrativo, não foi recepcionado pela Constituição Federal de 1988, ante a sua incompatibilidade com o inciso LV do art. 5º.","status":"em_vigor","temas":["Recursos e prazos","Provas e ônus da prova"],"historico":[{"evento":"Nova redação","ato":"Res. 160/2009","data":"2009-11-25","observacao":"Res. 160/2009, DEJT divulgado em 23, 24 e 25.11.2009"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-425","tribunal":"TST","tipo":"sumula","numero":425,"teor":"JUS POSTULANDI NA JUSTIÇA DO TRABALHO. ALCANCE.\n\nO jus postulandi das partes, estabelecido no art. 791 da CLT, limita-se às Varas do Trabalho e aos Tribunais Regionais do Trabalho, não alcançando a ação rescisória, a ação cautelar, o mandado de segurança e os recursos de competência do Tribunal Superior do Trabalho.","status":"em_vigor","temas":["Rescisão e verbas rescisórias","Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 165/2010","data":"2010-05-04","observacao":"Res. 165/2010, DEJT divulgado em 30.04.2010 e 03 e 04.05.2010"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-426","tribunal":"TST","tipo":"sumula","numero":426,"teor":"DEPÓSITO RECURSAL. UTILIZAÇÃO DA GUIA GFIP. OBRIGATORIEDADE.\n\nNos dissídios individuais o depósito recursal será efetivado mediante a utilização da Guia de Recolhimento do FGTS e Informações à Previdência Social - GFIP, nos termos dos §§ 4º e 5º do art. 899 da CLT, admitido o depósito judicial, realizado na sede do juízo e à disposição deste, na hipótese de relação de trabalho não submetida ao regime do FGTS.","status":"cancelada","temas":["FGTS","Honorários, custas e justiça gratuita"],"historico":[{"evento":"Cancelamento","ato":"Res. 225/2025","data":"2025-07-02","observacao":"Cancelada por perda de eficácia a partir de 11.11.2017, pela Lei 13.467/2017. Res. 225/2025, DEJT divulgado em 30.06, 01 e 02.07.2025"},{"evento":"Redação original","ato":"Res. 174/2011","data":"2011-05-31","observacao":"Editada em decorrência do julgamento do processo TST-IUJEEDRR 91700-09.2006.5.18.0006 - Res. 174/2011, DEJT divulgado em 27, 30 e 31.05.2011"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-427","tribunal":"TST","tipo":"sumula","numero":427,"teor":"INTIMAÇÃO. PLURALIDADE DE ADVOGADOS. PUBLICAÇÃO EM NOME DE ADVOGADO DIVERSO DAQUELE EXPRESSAMENTE INDICADO. NULIDADE.\n\nHavendo pedido expresso de que as intimações e publicações sejam realizadas exclusivamente em nome de determinado advogado, a comunicação em nome de outro profissional constituído nos autos é nula, salvo se constatada a inexistência de prejuízo.","status":"em_vigor","temas":["Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 174/2011","data":"2011-05-31","observacao":"(editada em decorrência do julgamento do processo TST-IUJERR 5400-31.2004.5.09.0017 - Res. 174/2011, DEJT divulgado em 27, 30 e 31.05.2011). - Entendimento reafirmado no IRR nº 305.\nIRR-305 INTIMAÇÃO. PLURALIDADE DE ADVOGADOS. PUBLICAÇÃO EM NOME DE ADVOGADO DIVERSO DAQUELE EXPRESSAMENTE INDICADO. NULIDADE. (RR-0000437-14.2021.5.07.0025, Tribunal Pleno, publicado em 15.09.2025, rel. Min. Aloysio Silva Corrêa da Veiga)\nHavendo pedido expresso de que as intimações e publicações sejam realizadas exclusivamente em nome de determinado advogado, a comunicação em nome de outro profissional constituído nos autos é nula, salvo se constatada a inexistência de prejuízo."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-428","tribunal":"TST","tipo":"sumula","numero":428,"teor":"SOBREAVISO APLICAÇÃO ANALÓGICA DO ART. 244, § 2º DA CLT.\n\nI - O uso de instrumentos telemáticos ou informatizados fornecidos pela empresa ao empregado, por si só, não caracteriza o regime de sobreaviso.\nII - Considera-se em sobreaviso o empregado que, à distância e submetido a controle patronal por instrumentos telemáticos ou informatizados, permanecer em regime de plantão ou equivalente, aguardando a qualquer momento o chamado para o serviço durante o período de descanso.","status":"em_vigor","temas":["Jornada e horas extras","Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 185/2012","data":"2012-09-27","observacao":"(redação alterada na sessão do Tribunal Pleno realizada em 14.09.2012) - Res. 185/2012, DEJT divulgado em 25, 26 e 27.09.2012"},{"evento":"Redação original","ato":"Res. 174/2011","data":"2011-05-31","observacao":"Redação original - - Res. 174/2011, DEJT divulgado em 27, 30 e 31.05.2011"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 428 Sobreaviso (conversão da Orientação Jurisprudencial n.º 49 da SBDI-1)\nO uso de aparelho de intercomunicação, a exemplo de BIP, \"pager\" ou aparelho celular, pelo empregado, por si só, não caracteriza o regime de sobreaviso, uma vez que o empregado não permanece em sua residência aguardando, a qualquer momento, convocação para o serviço."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-429","tribunal":"TST","tipo":"sumula","numero":429,"teor":"TEMPO À DISPOSIÇÃO DO EMPREGADOR. ART. 4º DA CLT. PERÍODO DE DESLOCAMENTO ENTRE A PORTARIA E O LOCAL DE TRABALHO.\n\nConsidera-se à disposição do empregador, na forma do art. 4º da CLT, o tempo necessário ao deslocamento do trabalhador entre a portaria da empresa e o local de trabalho, desde que supere o limite de 10 (dez) minutos diários.","status":"cancelada","temas":["Jornada e horas extras"],"historico":[{"evento":"Cancelamento","ato":"Res. 225/2025","data":"2025-07-02","observacao":"Cancelada por perda de eficácia a partir de 11.11.2017, pela Lei 13.467/2017. Res. 225/2025, DEJT divulgado em 30.06, 01 e 02.07.2025"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Res. 174/2011, DEJT divulgado em 27, 30 e 31.05.2011"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-430","tribunal":"TST","tipo":"sumula","numero":430,"teor":"ADMINISTRAÇÃO PÚBLICA INDIRETA. CONTRATAÇÃO. AUSÊNCIA DE CONCURSO PÚBLICO. NULIDADE. ULTERIOR PRIVATIZAÇÃO. CONVALIDAÇÃO. INSUBSISTÊNCIA DO VÍCIO\n\nConvalidam-se os efeitos do contrato de trabalho que, considerado nulo por ausência de concurso público, quando celebrado originalmente com ente da Administração Pública Indireta, continua a existir após a sua privatização.","status":"em_vigor","temas":["Ente público como empregador","Contrato e vínculo de emprego"],"historico":[{"evento":"Nova redação","ato":"Res. 177/2012","data":"2012-02-15","observacao":"- Res. 177/2012, DEJT divulgado em"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-431","tribunal":"TST","tipo":"sumula","numero":431,"teor":"SALÁRIO-HORA. EMPREGADO SUJEITO AO REGIME GERAL DE TRABALHO (ART. 58, CAPUT, DA CLT). 40 HORAS SEMANAIS. CÁLCULO. APLICAÇÃO DO DIVISOR 200.\n\nPara os empregados a que alude o art. 58, caput, da CLT, quando sujeitos a 40 horas semanais de trabalho, aplica-se o divisor 200 (duzentos) para o cálculo do valor do salário-hora.","status":"em_vigor","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 185/2012","data":"2012-09-27","observacao":"(redação alterada na sessão do tribunal pleno realizada em 14.09.2012 - Res. 185/2012, DEJT divulgado em 25, 26 e 27.09.2012). - Entendimento reafirmado no IRR nº 260.\nIRR-260 SALÁRIO-HORA. EMPREGADO SUJEITO AO REGIME GERAL DE TRABALHO (ART. 58, CAPUT, DA CLT). 40 HORAS SEMANAIS. CÁLCULO. APLICAÇÃO DO DIVISOR 200. (RR-0020243-94.2022.5.04.0021, Tribunal Pleno, publicado em 02.09.2025, rel. Min. Aloysio Silva Corrêa da Veiga)\nPara os empregados a que alude o art. 58, caput, da CLT, quando sujeitos a 40 horas semanais de trabalho, aplica-se o divisor 200 (duzentos) para o cálculo do valor do salário-hora."},{"evento":"Redação original","ato":"Res. 177/2012","data":"2012-02-15","observacao":"Redação original - Res. 177/2012, DEJT divulgado em 13, 14 e 15.02.2012"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 431 Salário-hora. 40 horas semanais. Cálculo. Aplicação do divisor 200. - Aplica-se o divisor 200 (duzentos) para o cálculo do valor do salário-hora do empregado sujeito a 40 (quarenta) horas semanais de trabalho."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-432","tribunal":"TST","tipo":"sumula","numero":432,"teor":"CONTRIBUIÇÃO SINDICAL RURAL. AÇÃO DE COBRANÇA. PENALIDADE POR ATRASO NO RECOLHIMENTO. INAPLICABILIDADE DO ART. 600 DA CLT. INCIDÊNCIA DO ART. 2º DA LEI Nº 8.022/1990.\n\nO recolhimento a destempo da contribuição sindical rural não acarreta a aplicação da multa progressiva prevista no art. 600 da CLT, em decorrência da sua revogação tácita pela Lei nº 8.022, de 12 de abril de 1990.","status":"em_vigor","temas":["Direito coletivo e sindical","Recursos e prazos","Contrato e vínculo de emprego"],"historico":[{"evento":"Nova redação","ato":"Res. 177/2012","data":"2012-02-15","observacao":"Res. 177/2012, DEJT divulgado em 13, 14 e 15.02.2012"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-433","tribunal":"TST","tipo":"sumula","numero":433,"teor":"EMBARGOS. ADMISSIBILIDADE. PROCESSO EM FASE DE EXECUÇÃO. ACÓRDÃO DE TURMA PUBLICADO NA VIGÊNCIA DA LEI Nº 11.496, DE 26.06.2007. DIVERGÊNCIA DE INTERPRETAÇÃO DE DISPOSITIVO CONSTITUCIONAL.\n\nA admissibilidade do recurso de embargos contra acórdão de Turma em Recurso de Revista em fase de execução, publicado na vigência da Lei nº 11.496, de 26.06.2007, condiciona-se à demonstração de divergência jurisprudencial entre Turmas ou destas e a Seção Especializada em Dissídios Individuais do Tribunal Superior do Trabalho em relação à interpretação de dispositivo constitucional.","status":"em_vigor","temas":["Execução e penhora","Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 177/2012","data":"2012-02-15","observacao":"Res. 177/2012, DEJT divulgado em 13, 14 e 15.02.2012"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-434","tribunal":"TST","tipo":"sumula","numero":434,"teor":"RECURSO. INTERPOSIÇÃO ANTES DA PUBLICAÇÃO DO ACÓRDÃO IMPUGNADO. EXTEMPORANEIDADE.\n\nI) É extemporâneo recurso interposto antes de publicado o acórdão impugnado.(ex-OJ nº 357 da SBDI-1 - inserida em 14.03.2008)\n\nII) A interrupção do prazo recursal em razão da interposição de embargos de declaração pela parte adversa não acarreta qualquer prejuízo àquele que apresentou seu recurso tempestivamente.","status":"cancelada","temas":["Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 177/2012","data":"2012-02-15","observacao":"(Conversão da Orientação Jurisprudencial nº 357 da SBDI-1 e inserção do item II à redação) Res. 177/2012"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-435","tribunal":"TST","tipo":"sumula","numero":435,"teor":"DECISÃO MONOCRÁTICA. RELATOR. ART. 932 DO CPC DE 2015. ART. 557 DO CPC DE 1973. APLICAÇÃO SUBSIDIÁRIA AO PROCESSO DO TRABALHO.\n\nAplica-se subsidiariamente ao processo do trabalho o art. 932 do CPC de 2015 (art. 557 do CPC de 1973).","status":"em_vigor","temas":["Terceirização e responsabilidade","Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 208/2016","data":"2016-04-26","observacao":"(atualizada em decorrência do CPC de 2015) - Res. 208/2016, DEJT divulgado em 22, 25 e 26.04.2016"},{"evento":"Redação original","ato":"Res. 185/2012","data":"2012-09-27","observacao":"Redação original - Res. 185/2012, DEJT divulgado em 25, 26 e 27.09.2012"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 435. Art. 557 do CPC. Aplicação subsidiária ao processo do trabalho (conversão da Orientação Jurisprudencial nº 73 da SBDI-2 com nova redação)\nAplica-se subsidiariamente ao processo do trabalho o art. 557 do Código de Processo Civil."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-436","tribunal":"TST","tipo":"sumula","numero":436,"teor":"REPRESENTAÇÃO PROCESSUAL. PROCURADOR DA UNIÃO, ESTADOS, MUNICÍPIOS E DISTRITO FEDERAL, SUAS AUTARQUIAS E FUNDAÇÕES PÚBLICAS. JUNTADA DE INSTRUMENTO DE MANDATO.\n\nI - A União, Estados, Municípios e Distrito Federal, suas autarquias e fundações públicas, quando representadas em juízo, ativa e passivamente, por seus procuradores, estão dispensadas da juntada de instrumento de mandato e de comprovação do ato de nomeação.\n\nII - Para os efeitos do item anterior, é essencial que o signatário ao menos declare-se exercente do cargo de procurador, não bastando a indicação do número de inscrição na Ordem dos Advogados do Brasil.","status":"em_vigor","temas":["Rescisão e verbas rescisórias","Provas e ônus da prova","Ente público como empregador"],"historico":[{"evento":"Nova redação","ato":"Res. 185/2012","data":"2012-09-27","observacao":"(conversão da Orientação Jurisprudencial nº 52 da SBDI-I e inserção do item II à redação) - Res. 185/2012, DEJT divulgado em 25, 26 e 27.09.2012"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-437","tribunal":"TST","tipo":"sumula","numero":437,"teor":"INTERVALO INTRAJORNADA PARA REPOUSO E ALIMENTAÇÃO. APLICAÇÃO DO ART. 71 DA CLT.\n\nI - Após a edição da Lei nº 8.923/94, a não-concessão ou a concessão parcial do intervalo intrajornada mínimo, para repouso e alimentação, a empregados urbanos e rurais, implica o pagamento total do período correspondente, e não apenas daquele suprimido, com acréscimo de, no mínimo, 50% sobre o valor da remuneração da hora normal de trabalho (art. 71 da CLT), sem prejuízo do cômputo da efetiva jornada de labor para efeito de remuneração.\n\nII - É inválida cláusula de acordo ou convenção coletiva de trabalho contemplando a supressão ou redução do intervalo intrajornada porque este constitui medida de higiene, saúde e segurança do trabalho, garantido por norma de ordem pública (art. 71 da CLT e art. 7º, XXII, da CF/1988), infenso à negociação coletiva.\n\nIII - Possui natureza salarial a parcela prevista no art. 71, § 4º, da CLT, com redação introduzida pela Lei nº 8.923, de 27 de julho de 1994, quando não concedido ou reduzido pelo empregador o intervalo mínimo intrajornada para repouso e alimentação, repercutindo, assim, no cálculo de outras parcelas salariais.\n\nIV - Ultrapassada habitualmente a jornada de seis horas de trabalho, é devido o gozo do intervalo intrajornada mínimo de uma hora, obrigando o empregador a remunerar o período para descanso e alimentação não usufruído como extra, acrescido do respectivo adicional, na forma prevista no art. 71, caput e § 4º da CLT.","status":"cancelada","temas":["Jornada e horas extras","Salário e remuneração","Direito coletivo e sindical"],"historico":[{"evento":"Cancelamento","ato":"Res. 225/2025","data":"2025-07-02","observacao":"Cancelada por perda de eficácia a partir de 11.11.2017, pela Lei 13.467/2017. Res. 225/2025, DEJT divulgado em 30.06, 01 e 02.07.2025"},{"evento":"Conversão","ato":"Res. 185/2012","data":"2012-09-27","observacao":"Conversão das Orientações Jurisprudenciais nºs 307, 342, 354, 380 e 381 da SBDI-1 - Res. 185/2012, DEJT divulgado em 25, 26 e 27.09.2012"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-438","tribunal":"TST","tipo":"sumula","numero":438,"teor":"INTERVALO PARA RECUPERAÇÃO TÉRMICA DO EMPREGADO. AMBIENTE ARTIFICIALMENTE FRIO. HORAS EXTRAS. ART. 253 DA CLT. APLICAÇÃO ANALÓGICA.\n\nO empregado submetido a trabalho contínuo em ambiente artificialmente frio, nos termos do parágrafo único do art. 253 da CLT, ainda que não labore em câmara frigorífica, tem direito ao intervalo intrajornada previsto no caput do art. 253 da CLT.","status":"em_vigor","temas":["Jornada e horas extras"],"historico":[{"evento":"Nova redação","ato":"Res. 185/2012","data":"2012-09-27","observacao":"Res. 185/2012, DEJT divulgado em 25, 26 e 27.09.2012"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-439","tribunal":"TST","tipo":"sumula","numero":439,"teor":"DANOS MORAIS. JUROS DE MORA E ATUALIZAÇÃO MONETÁRIA. TERMO INICIAL.\n\nNas condenações por dano moral, a atualização monetária é devida a partir da data da decisão de arbitramento ou de alteração do valor. Os juros incidem desde o ajuizamento da ação, nos termos do art. 883 da CLT.","status":"cancelada","temas":["Execução e penhora"],"historico":[{"evento":"Cancelamento","ato":"Res. 225/2025","data":"2025-07-02","observacao":"Cancelada por perda de eficácia considerando a decisão da ADI 5867, ADI 6012, ADC 58 e ADC 59, a partir da publicação da ata de julgamento dos embargos de declaração em 09.12.2021. Res. 225/2025, DEJT divulgado em 30.06, 01 e 02.07.2025"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Res. 185/2012, DEJT divulgado em 25, 26 e 27.09.2012"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-440","tribunal":"TST","tipo":"sumula","numero":440,"teor":"AUXÍLIO-DOENÇA ACIDENTÁRIO. APOSENTADORIA POR INVALIDEZ. SUSPENSÃO DO CONTRATO DE TRABALHO. RECONHECIMENTO DO DIREITO À MANUTENÇÃO DE PLANO DE SAÚDE OU DE ASSISTÊNCIA MÉDICA.\n\nAssegura-se o direito à manutenção de plano de saúde ou de assistência médica oferecido pela empresa ao empregado, não obstante suspenso o contrato de trabalho em virtude de auxílio-doença acidentário ou de aposentadoria por invalidez.","status":"em_vigor","temas":["Acidente e doença do trabalho","Contrato e vínculo de emprego"],"historico":[{"evento":"Suspensão","ato":"Res. 185/2012","data":"2012-09-27","observacao":"(Res. 185/2012, DEJT divulgado em 25, 26 e 27.09.2012). - Entendimento reafirmado no IRR nº 220.\nIRR-220 AUXÍLIO-DOENÇA ACIDENTÁRIO. APOSENTADORIA POR INVALIDEZ. SUSPENSÃO DO CONTRATO DE TRABALHO. RECONHECIMENTO DO DIREITO À MANUTENÇÃO DE PLANO DE SAÚDE OU DE ASSISTÊNCIA MÉDICA. (RR-0000103-05.2024.5.05.0421, Tribunal Pleno, publicado em 05.09.2025, rel. Min. Aloysio Silva Corrêa da Veiga)\nAssegura-se o direito à manutenção de plano de saúde ou de assistência médica oferecido pela empresa ao empregado, não obstante suspenso o contrato de trabalho em razão de auxílio-doença acidentário ou de aposentadoria por invalidez, nas mesmas condições em que usufruída a vantagem no período anterior à suspensão contratual."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-441","tribunal":"TST","tipo":"sumula","numero":441,"teor":"AVISO PRÉVIO. PROPORCIONALIDADE.\n\nO direito ao aviso prévio proporcional ao tempo de serviço somente é assegurado nas rescisões de contrato de trabalho ocorridas a partir da publicação da Lei nº 12.506, em 13 de outubro de 2011.","status":"em_vigor","temas":["Rescisão e verbas rescisórias","Contrato e vínculo de emprego"],"historico":[{"evento":"Nova redação","ato":"Res. 185/2012","data":"2012-09-27","observacao":"Res. 185/2012, DEJT divulgado em 25, 26 e 27.09.2012"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-442","tribunal":"TST","tipo":"sumula","numero":442,"teor":"PROCEDIMENTO SUMARÍSSIMO. RECURSO DE REVISTA FUNDAMENTADO EM CONTRARIEDADE A ORIENTAÇÃO JURISPRUDENCIAL. INADMISSIBILIDADE. ART. 896, § 6º, DA CLT, ACRESCENTADO PELA LEI Nº 9.957, DE 12.01.2000.\n\nNas causas sujeitas ao procedimento sumaríssimo, a admissibilidade de recurso de revista está limitada à demonstração de violação direta a dispositivo da Constituição Federal ou contrariedade a Súmula do Tribunal Superior do Trabalho, não se admitindo o recurso por contrariedade a Orientação Jurisprudencial deste Tribunal (Livro II, Título II, Capítulo III, do RITST), ante a ausência de previsão no art. 896, § 6º, da CLT.","status":"em_vigor","temas":["Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 185/2012","data":"2012-09-27","observacao":"(conversão da Orientação Jurisprudencial nº 352 da SBDI-1) - Res. 185/2012, DEJT divulgado em 25, 26 e 27.09.2012"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-443","tribunal":"TST","tipo":"sumula","numero":443,"teor":"DISPENSA DISCRIMINATÓRIA. PRESUNÇÃO. EMPREGADO PORTADOR DE DOENÇA GRAVE. ESTIGMA OU PRECONCEITO. DIREITO À REINTEGRAÇÃO.\n\nPresume-se discriminatória a despedida de empregado portador do vírus HIV ou de outra doença grave que suscite estigma ou preconceito. Inválido o ato, o empregado tem direito à reintegração no emprego.","status":"em_vigor","temas":["Estabilidade e garantias de emprego","Rescisão e verbas rescisórias","Provas e ônus da prova"],"historico":[{"evento":"Nova redação","ato":"Res. 185/2012","data":"2012-09-27","observacao":"Res. 185/2012, DEJT divulgado em 25, 26 e 27.09.2012. - Entendimento reafirmado no IRR nº 254.\nIRR-254 DISPENSA DISCRIMINATÓRIA. PRESUNÇÃO. EMPREGADO PORTADOR DE DOENÇA GRAVE. ESTIGMA OU PRECONCEITO. DIREITO À REINTEGRAÇÃO. (RR-0011349-11.2022.5.15.0026, Tribunal Pleno, publicado em 05.09.2025, rel. Min. Aloysio Silva Corrêa da Veiga)\nPresume-se discriminatória a despedida de empregado portador do vírus HIV ou de outra doença grave que suscite estigma ou preconceito. Inválido o ato, o empregado tem direito à reintegração no emprego."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-444","tribunal":"TST","tipo":"sumula","numero":444,"teor":"JORNADA DE TRABALHO. NORMA COLETIVA. LEI. ESCALA DE 12 POR 36. VALIDADE.\n\nÉ valida, em caráter excepcional, a jornada de doze horas de trabalho por trinta e seis de descanso, prevista em lei ou ajustada exclusivamente mediante acordo coletivo de trabalho ou convenção coletiva de trabalho, assegurada a remuneração em dobro dos feriados trabalhados. O empregado não tem direito ao pagamento de adicional referente ao labor prestado na décima primeira e décima segunda horas.","status":"cancelada","temas":["Jornada e horas extras","Férias, 13º e descansos","Salário e remuneração"],"historico":[{"evento":"Cancelamento","ato":"Res. 225/2025","data":"2025-07-02","observacao":"Cancelada por perda de eficácia a partir de 11.11.2017, pela Lei 13.467/2017. Res. 225/2025, DEJT divulgado em 30.06, 01 e 02.07.2025"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Res. 185/2012, DEJT divulgado em 25, 26 e 27.09.2012 - republicada em decorrência do despacho proferido no processo TST-PA-504.280/2012.2, DEJT divulgado em 26.11.2012"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-445","tribunal":"TST","tipo":"sumula","numero":445,"teor":"INADIMPLEMENTO DE VERBAS TRABALHISTAS. FRUTOS. POSSE DE MÁ-FÉ. ART. 1.216 DO CÓDIGO CIVIL. INAPLICABILIDADE AO DIREITO DO TRABALHO.\n\nA indenização por frutos percebidos pela posse de má-fé, prevista no art. 1.216 do Código Civil, por tratar-se de regra afeta a direitos reais, mostra-se incompatível com o Direito do Trabalho, não sendo devida no caso de inadimplemento de verbas trabalhistas.","status":"em_vigor","temas":["Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 189/2013","data":"2013-03-15","observacao":"Res. 189/2013, DEJT divulgado em 13, 14 e 15.03.2013"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-446","tribunal":"TST","tipo":"sumula","numero":446,"teor":"SÚMULA Nº 446 MAQUINISTA FERROVIÁRIO. INTERVALO INTRAJORNADA. SUPRESSÃO PARCIAL OU TOTAL. HORAS EXTRAS DEVIDAS. COMPATIBILIDADE ENTRE OS ARTS. 71, § 4º, E 238, § 5º, DA CLT.\n\nA garantia ao intervalo intrajornada, prevista no art. 71 da CLT, por constituir-se em medida de higiene, saúde e segurança do empregado, é aplicável também ao ferroviário maquinista integrante da categoria \"c\" (equipagem de trem em geral), não havendo incompatibilidade entre as regras inscritas nos arts. 71, § 4º, e 238, § 5º, da CLT.","status":"em_vigor","temas":["Jornada e horas extras","Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 193/2013","data":"2013-12-17","observacao":"Res. 193/2013, DEJT divulgado em 13, 16 e 17.12.2013"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-447","tribunal":"TST","tipo":"sumula","numero":447,"teor":"SÚMULA Nº 447 ADICIONAL DE PERICULOSIDADE. PERMANÊNCIA A BORDO DURANTE O ABASTECIMENTO DA AERONAVE. INDEVIDO.\n\nOs tripulantes e demais empregados em serviços auxiliares de transporte aéreo que, no momento do abastecimento da aeronave, permanecem a bordo não têm direito ao adicional de periculosidade a que aludem o art. 193 da CLT e o Anexo 2, item 1, \"c\", da NR 16 do MTE.","status":"em_vigor","temas":["Adicionais (insalubridade, periculosidade e outros)"],"historico":[{"evento":"Nova redação","ato":"Res. 193/2013","data":"2013-12-17","observacao":"Res. 193/2013, DEJT divulgado em 13, 16 e 17.12.2013"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-448","tribunal":"TST","tipo":"sumula","numero":448,"teor":"ATIVIDADE INSALUBRE. CARACTERIZAÇÃO. PREVISÃO NA NORMA REGULAMENTADORA Nº 15 DA PORTARIA DO MINISTÉRIO DO TRABALHO Nº 3.214/78. INSTALAÇÕES SANITÁRIAS.\n\nI - Não basta a constatação da insalubridade por meio de laudo pericial para que o empregado tenha direito ao respectivo adicional, sendo necessária a classificação da atividade insalubre na relação oficial elaborada pelo Ministério do Trabalho.\nII - A higienização de instalações sanitárias de uso público ou coletivo de grande circulação, e a respectiva coleta de lixo, por não se equiparar à limpeza em residências e escritórios, enseja o pagamento de adicional de insalubridade em grau máximo, incidindo o disposto no Anexo 14 da NR-15 da Portaria do MTE nº 3.214/78 quanto à coleta e industrialização de lixo urbano.","status":"em_vigor","temas":["Adicionais (insalubridade, periculosidade e outros)"],"historico":[{"evento":"Nova redação","ato":"Res. 194/2014","data":"2014-05-23","observacao":"(conversão da Orientação Jurisprudencial nº 4 da SBDI-1 com nova redação do item II) - Res. 194/2014, DEJT divulgado em 21, 22 e 23.05.2014"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-449","tribunal":"TST","tipo":"sumula","numero":449,"teor":"MINUTOS QUE ANTECEDEM E SUCEDEM A JORNADA DE TRA-BALHO. LEI Nº 10.243, DE 19.06.2001. NORMA COLETIVA. FLEXIBILIZAÇÃO. IMPOSSIBILIDADE.\n\nA partir da vigência da Lei nº 10.243, de 19.06.2001, que acrescentou o § 1º ao art. 58 da CLT, não mais prevalece cláusula prevista em convenção ou acordo coletivo que elastece o limite de 5 minutos que antecedem e sucedem a jornada de trabalho para fins de apuração das horas extras.","status":"cancelada","temas":["Jornada e horas extras","Salário e remuneração","Direito coletivo e sindical"],"historico":[{"evento":"Cancelamento","ato":"Res. 225/2025","data":"2025-07-02","observacao":"Cancelada por perda de eficácia a partir de 11.11.2017, pela Lei 13.467/2017. Res. 225/2025, DEJT divulgado em 30.06, 01 e 02.07.2025"},{"evento":"Conversão","ato":"Res. 194/2014","data":"2014-05-23","observacao":"Conversão da Orientação Jurisprudencial nº 372 da SBDI-1 - Res. 194/2014, DEJT divulgado em DEJT divulgado em 21, 22 e 23.05.2014"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-450","tribunal":"TST","tipo":"sumula","numero":450,"teor":"FÉRIAS. GOZO NA ÉPOCA PRÓPRIA. PAGAMENTO FORA DO PRAZO. DOBRA DEVIDA. ARTS. 137 E 145 DA CLT.\n\nÉ devido o pagamento em dobro da remuneração de férias, incluído o terço constitucional, com base no art. 137 da CLT, quando, ainda que gozadas na época própria, o empregador tenha descumprido o prazo previsto no art. 145 do mesmo diploma legal.","status":"cancelada","temas":["Férias, 13º e descansos","Salário e remuneração"],"historico":[{"evento":"Cancelamento","ato":"Res. 225/2025","data":"2025-07-02","observacao":"Cancelada por perda de eficácia considerando a decisão da ADPF 501, a partir da publicação da ata de julgamento em 15.08.2022. Res. 225/2025, DEJT divulgado em 30.06, 01 e 02.07.2025"},{"evento":"Suspensão","ato":null,"data":"2022-08-18","observacao":"Súmula declarada inconstitucional pelo Supremo Tribunal Federal, no julgamento da ADPF nº 501/SC, Rel Min. Alexandre de Moraes, DJE de 18/08/2022"},{"evento":"Conversão","ato":"Res. 194/2014","data":"2014-05-23","observacao":"Conversão da Orientação Jurisprudencial nº 386 da SBDI-I - Res. 194/2014, DEJT divulgado em 21, 22 e 23.05.2014"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-451","tribunal":"TST","tipo":"sumula","numero":451,"teor":"PARTICIPAÇÃO NOS LUCROS E RESULTADOS. RESCISÃO CONTRATUAL ANTERIOR À DATA DA DISTRIBUIÇÃO DOS LU-CROS. PAGAMENTO PROPORCIONAL AOS MESES TRABALHADOS. PRINCÍPIO DA ISONOMIA.\n\nFere o princípio da isonomia instituir vantagem mediante acordo coletivo ou norma regulamentar que condiciona a percepção da parcela participação nos lucros e resultados ao fato de estar o contrato de trabalho em vigor na data prevista para a distribuição dos lucros. Assim, inclusive na rescisão contra-tual antecipada, é devido o pagamento da parcela de forma proporcional aos meses trabalhados, pois o ex-empregado concorreu para os resultados positivos da empresa.","status":"em_vigor","temas":["Estabilidade e garantias de emprego","Rescisão e verbas rescisórias","Direito coletivo e sindical"],"historico":[{"evento":"Nova redação","ato":"Res. 194/2014","data":"2014-05-23","observacao":"(conversão da Orientação Jurisprudencial nº 390 da SBDI-1) - Res. 194/2014, DEJT divulgado em 21, 22 e 23.05.2014"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-452","tribunal":"TST","tipo":"sumula","numero":452,"teor":"DIFERENÇAS SALARIAIS. PLANO DE CARGOS E SALÁRIOS. DESCUMPRIMENTO. CRITÉRIOS DE PROMOÇÃO NÃO OBSERVADOS. PRESCRIÇÃO PARCIAL.\n\nTratando-se de pedido de pagamento de diferenças salariais decorrentes da inobservância dos critérios de promoção estabelecidos em Plano de Cargos e Salários criado pela empresa, a prescrição aplicável é a parcial, pois a lesão é sucessiva e se renova mês a mês.","status":"cancelada","temas":["Salário e remuneração","Prescrição e decadência"],"historico":[{"evento":"Cancelamento","ato":"Res. 225/2025","data":"2025-07-02","observacao":"Cancelada por perda de eficácia a partir de 11.11.2017, pela Lei 13.467/2017. Res. 225/2025, DEJT divulgado em 30.06, 01 e 02.07.2025"},{"evento":"Conversão","ato":"Res. 194/2014","data":"2014-05-23","observacao":"Conversão da Orientação Jurisprudencial nº 404 da SBDI-1 - Res. 194/2014, DEJT divulgado em 21, 22 e 23.05.2014"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-453","tribunal":"TST","tipo":"sumula","numero":453,"teor":"ADICIONAL DE PERICULOSIDADE. PAGAMENTO ESPONTÂNEO. CARACTERIZAÇÃO DE FATO INCONTROVERSO. DESNECES-SÁRIA A PERÍCIA DE QUE TRATA O ART. 195 DA CLT.\n\nO pagamento de adicional de periculosidade efetuado por mera liberalidade da empresa, ainda que de forma proporcional ao tempo de exposição ao risco ou em percentual inferior ao máximo legalmente previsto, dispensa a realização da prova técnica exigida pelo art. 195 da CLT, pois torna incontroversa a existência do trabalho em condições perigosas.","status":"em_vigor","temas":["Adicionais (insalubridade, periculosidade e outros)","Rescisão e verbas rescisórias","Provas e ônus da prova"],"historico":[{"evento":"Nova redação","ato":"Res. 194/2014","data":"2014-05-23","observacao":"(conversão da Orientação Jurisprudencial nº 406 da SBDI-1 - Res. 194/2014, DEJT divulgado em 21, 22 e 23.05.2014). - Entendimento reafirmado no IRR nº 266.\nIRR-266 ADICIONAL DE PERICULOSIDADE. PAGAMENTO ESPONTÂNEO. CARACTERIZAÇÃO DE FATO INCONTROVERSO. DESNECESSÁRIA A PERÍCIA DE QUE TRATA O ART. 195 DA CLT. (RR-0021134-05.2023.5.04.0014, Tribunal Pleno, publicado em 02.09.2025, rel. Min. Aloysio Silva Corrêa da Veiga)\nO pagamento de adicional de periculosidade efetuado por mera liberalidade da empresa, ainda que de modo proporcional ao tempo de exposição ao risco ou em percentual inferior ao máximo legalmente previsto, dispensa a realização da prova técnica exigida pelo art. 195 da CLT, pois torna presumida a existência do trabalho em condições perigosas."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-454","tribunal":"TST","tipo":"sumula","numero":454,"teor":"COMPETÊNCIA DA JUSTIÇA DO TRABALHO. EXECUÇÃO DE OFÍCIO. CONTRIBUIÇÃO SOCIAL REFERENTE AO SEGURO DE ACIDENTE DE TRABALHO (SAT). ARTS. 114, VIII, E 195, I, \"A\", DA CONSTITUIÇÃO DA REPÚBLICA.\n\nCompete à Justiça do Trabalho a execução, de ofício, da contribuição referente ao Seguro de Acidente de Trabalho (SAT), que tem natureza de contribuição para a seguridade social (arts. 114, VIII, e 195, I, \"a\", da CF), pois se destina ao financiamento de benefícios relativos à incapacidade do empregado decorrente de infortúnio no trabalho (arts. 11 e 22 da Lei nº 8.212/1991).","status":"em_vigor","temas":["Acidente e doença do trabalho","Competência da Justiça do Trabalho","Execução e penhora"],"historico":[{"evento":"Nova redação","ato":"Res. 194/2014","data":"2014-05-23","observacao":"(conversão da Orientação Jurisprudencial nº 414 da SBDI-1 - Res. 194/2014, DEJT divulgado em 21, 22 e 23.05.2014). - Entendimento reafirmado no IRR nº 229.\nIRR-229 COMPETÊNCIA DA JUSTIÇA DO TRABALHO. EXECUÇÃO DE OFÍCIO. CONTRIBUIÇÃO SOCIAL REFERENTE AO SEGURO DE ACIDENTE DE TRABALHO (SAT). ARTS. 114, VIII, E 195, I, -A-, DA CONSTITUIÇÃO DA REPÚBLICA DE 1988. (RR-0000420-65.2024.5.13.0005, Tribunal Pleno, publicado em 09.09.2025, rel. Min. Aloysio Silva Corrêa da Veiga)\nCompete à Justiça do Trabalho a execução, de ofício, da contribuição referente ao Seguro de Acidente de Trabalho (SAT),que tem natureza de contribuição para a seguridade social (arts.114, VIII, e 195, I, -a\", da Constituição da República de 1988),pois se destina ao financiamento de benefícios relativos à incapacidade do empregado decorrente de infortúnio no trabalho (arts. 11 e 22 da Lei nº 8.212/1991)."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-455","tribunal":"TST","tipo":"sumula","numero":455,"teor":"EQUIPARAÇÃO SALARIAL. SOCIEDADE DE ECONOMIA MISTA. ART. 37, XIII, DA CF/1988. POSSIBILIDADE.\n\nÀ sociedade de economia mista não se aplica a vedação à equiparação prevista no art. 37, XIII, da CF/1988, pois, ao admitir empregados sob o regime da CLT, equipara-se a empregador privado, conforme disposto no art. 173, § 1º, II, da CF/1988.","status":"em_vigor","temas":["Salário e remuneração","Recursos e prazos","Ente público como empregador"],"historico":[{"evento":"Nova redação","ato":"Res. 194/2014","data":"2014-05-23","observacao":"(conversão da Orientação Jurisprudencial nº 353 da SBDI-1 com nova redação) - Res. 194/2014, DEJT divulgado em 21, 22 e 23.05.2014"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-456","tribunal":"TST","tipo":"sumula","numero":456,"teor":"REPRESENTAÇÃO. PESSOA JURÍDICA. PROCURAÇÃO. INVALIDADE. IDENTIFICAÇÃO DO OUTORGANTE E DE SEU REPRESENTANTE.\n\nI - É inválido o instrumento de mandato firmado em nome de pessoa jurídica que não contenha, pelo menos, o nome do outorgante e do signatário da procuração, pois estes dados constituem elementosque os individualizam.\nII - Verificada a irregularidade de representação da parte na instância originária, o juiz designará prazo de 5 (cinco) dias para que seja sanado o vício. Descumprida a determinação, extinguirá o processo, sem resolução de mérito, se a providência couber ao reclamante, ou considerará revel o reclamado, se a providência lhe couber (art. 76, § 1º, do CPC de 2015).\nIII - Caso a irregularidade de representação da parte seja constatada em fase recursal, o relator designará prazo de 5 (cinco) dias para que seja sanado o vício. Descumprida a determinação, o relator não conhecerá do recurso, se a providência couber ao recorrente, ou determinará o desentranhamento das contrarrazões, se a providência couber ao recorrido (art. 76, § 2º, do CPC de2015).","status":"em_vigor","temas":["Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 211/2016","data":"2016-08-26","observacao":"(inseridos os itens II e III em decorrência do CPC de 2015) - Res. 211/2016, DEJT divulgado em 24, 25 e 26.08.2016"},{"evento":"Redação original","ato":"Res. 194/2014","data":"2014-05-23","observacao":"Redação original (conversão da Orientação Jurisprudencial nº 373 da SBDI-1 com nova redação) - Res. 194/2014, DEJT divulgado em 21, 22 e 23.05.2014"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"É inválido o instrumento de mandato firmado em nome de pessoa jurídica que não contenha, pelo menos, o nome do outorgante e do signatário da procuração, pois estes dados constituem elementos que os individualizam."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-457","tribunal":"TST","tipo":"sumula","numero":457,"teor":"HONORÁRIOS PERICIAIS. BENEFICIÁRIO DA JUSTIÇA GRATUITA. RESPONSABILIDADE DA UNIÃO PELO PAGAMENTO. RE-SOLUÇÃO Nº 66/2010 DO CSJT. OBSERVÂNCIA.\n\nA União é responsável pelo pagamento dos honorários de perito quando a parte sucumbente no objeto da perícia for beneficiária da assistência judiciária gratuita, observado o procedimento disposto nos arts. 1º, 2º e 5º da Resolução n.º 66/2010 do Conselho Superior da Justiça do Trabalho - CSJT.","status":"em_vigor","temas":["Honorários, custas e justiça gratuita","Provas e ônus da prova"],"historico":[{"evento":"Conversão","ato":"Res. 194/2014","data":"2014-05-23","observacao":"Conversão da Orientação Jurisprudencial nº 387 da SBDI-1 com nova redação - Res. 194/2014, DEJT divulgado em 21, 22 e 23.05.2014. - Entendimento reafirmado no IRR nº 188.\nIRR-188 HONORÁRIOS PERICIAIS. BENEFICIÁRIO DA JUSTIÇA GRATUITA. RESPONSABILIDADE DA UNIÃO PELO PAGAMENTO. (RRAg-1000508-69.2023.5.02.0024, Tribunal Pleno, publicado em 03.07.2025, rel. Min. Aloysio Silva Corrêa da Veiga)\nA União é responsável pelo pagamento dos honorários de perito quando a parte sucumbente no objeto da perícia for beneficiária da assistência judiciária gratuita, observado o disposto na Resolução n.º 247/2019 do Conselho Superior da Justiça do Trabalho - CSJT."},{"evento":"Conversão","ato":null,"data":null,"observacao":"Conversão da Orientação Jurisprudencial nº 387 da SBDI-1 com nova redação."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-458","tribunal":"TST","tipo":"sumula","numero":458,"teor":"EMBARGOS. PROCEDIMENTO SUMARÍSSIMO. CONHECIMEN-TO. RECURSO INTERPOSTO APÓS VIGÊNCIA DA LEI Nº 11.496, DE 22.06.2007, QUE CONFERIU NOVA REDAÇÃO AO ART. 894, DA CLT.\n\nEm causas sujeitas ao procedimento sumaríssimo, em que pese a limitação imposta no art. 896, § 6º, da CLT à interposição de recurso de revista, admitem-se os embargos interpostos na vigência da Lei nº 11.496, de 22.06.2007, que conferiu nova redação ao art. 894 da CLT, quando demonstrada a divergência jurisprudencial entre Turmas do TST, fundada em interpretações diversas acerca da aplicação de mesmo dispositivo constitucional ou de matéria sumulada.","status":"em_vigor","temas":["Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 194/2014","data":"2014-05-23","observacao":"(conversão da Orientação Jurisprudencial nº 405 da SBDI-1 com nova redação) - Res. 194/2014, DEJT divulgado em 21, 22 e 23.05.2014"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-459","tribunal":"TST","tipo":"sumula","numero":459,"teor":"RECURSO DE REVISTA. NULIDADE POR NEGATIVA DE PRESTAÇÃO JURISDICIONAL.\n\nO conhecimento do recurso de revista, quanto à preliminar de nulidade, por negativa de prestação jurisdicional, supõe indicação de violação do art. 832 da CLT, do art. 489 do CPC de 2015 (art. 458 do CPC de 1973) ou do art. 93, IX, da CF/1988.","status":"em_vigor","temas":["Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 219/2017","data":"2017-07-14","observacao":"(atualizada em decorrência do CPC de 2015) - Res. 219/2017, DEJT divulgado em 28, 29 e 30.06.2017 - Republicada, DEJT divulgado em 12, 13 e 14.07.2017"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"(conversão da Orientação Jurisprudencial nº 115 da SBDI-1) - Res. 197/2015, DEJT divulgado em 14, 15 e 18.05.2015\nO conhecimento do recurso de revista, quanto à preliminar de nulidade por negativa de prestação jurisdicional, supõe indicação de violação do art. 832 da CLT, do art. 458 do CPC ou do art. 93, IX, da CF/1988."},{"evento":"Redação original","ato":"Res. 194/2014","data":"2014-05-23","observacao":"Redação original (conversão da Orientação Jurisprudencial nº 373 da SBDI-1 com nova redação) - Res. 194/2014, DEJT divulgado em 21, 22 e 23.05.2014"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-460","tribunal":"TST","tipo":"sumula","numero":460,"teor":"VALE-TRANSPORTE. ÔNUS DA PROVA.\n\nÉ do empregador o ônus de comprovar que o empregado não satisfaz os requisitos indispensáveis para a concessão do vale-transporte ou não pretenda fazer uso do benefício.","status":"em_vigor","temas":["Salário e remuneração","Provas e ônus da prova"],"historico":[{"evento":"Nova redação","ato":"Res. 209/2016","data":"2016-06-03","observacao":"Res. 209/2016, DEJT divulgado em 01, 02 e 03.06.2016. - Entendimento reafirmado no IRR nº 232.\nIRR-232 VALE-TRANSPORTE. ÔNUS DA PROVA. (RR-0000517-12.2024.5.19.0001, Tribunal Pleno, publicado em 02.09.2025, rel. Min. Aloysio Silva Corrêa da Veiga)\nÉ do empregador o ônus de comprovar que o empregado não satisfaz os requisitos indispensáveis para a concessão do vale-transporte ou não pretenda fazer uso do benefício."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-461","tribunal":"TST","tipo":"sumula","numero":461,"teor":"FGTS. DIFERENÇAS. RECOLHIMENTO. ÔNUS DA PROVA.\n\nÉ do empregador o ônus da prova em relação à regularidade dos depósitos do FGTS, pois o pagamento é fato extintivo do direito do autor (art. 373, II, do CPC de 2015).","status":"em_vigor","temas":["FGTS","Provas e ônus da prova"],"historico":[{"evento":"Nova redação","ato":"Res. 209/2016","data":"2016-06-03","observacao":"Res. 209/2016, DEJT divulgado em 01, 02 e 03.06.2016. - Entendimento reafirmado no IRR nº 273.\nIRR-273 FGTS. DIFERENÇAS. RECOLHIMENTO. (RR-1001992-22.2023.5.02.0606, Tribunal Pleno, publicado em 02.09.2025, rel. Min. Aloysio Silva Corrêa da Veiga)\nÉ do empregador o ônus da prova em relação à regularidade dos depósitos do FGTS, pois o pagamento é fato extintivo do direito do autor (art. 373, II, do CPC de 2015)."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-462","tribunal":"TST","tipo":"sumula","numero":462,"teor":"MULTA DO ART. 477, § 8º, DA CLT. INCIDÊNCIA. RECONHECIMENTO JUDICIAL DA RELAÇÃO DE EMPREGO.\n\nA circunstância de a relação de emprego ter sido reconhecida apenas em juízo não tem o condão de afastar a incidência da multa prevista no art. 477, §8º, da CLT. A referida multa não será devida apenas quando, comprovadamente, o empregado der causa à mora no pagamento das verbas rescisórias.","status":"em_vigor","temas":["Rescisão e verbas rescisórias","Recursos e prazos","Provas e ônus da prova"],"historico":[{"evento":"Nova redação","ato":"Res. 209/2016","data":"2016-06-03","observacao":"Res. 209/2016, DEJT divulgado em 01, 02 e 03.06.2016 - Republicada em razão de erro material, DEJT divulgado em 30.06.2016. - Entendimento reafirmado no IRR nº 168.\nIRR-168 MULTA DO ART. 477, § 8º, DA CLT. VÍNCULO DE EMPREGO RECONHECIDO EM JUÍZO. MULTA DEVIDA. (RR-1341-76.2023.5.12.0008, Tribunal Pleno, publicado em 03.07.2025, rel. Min. Aloysio Silva Corrêa da Veiga).\nO reconhecimento do vínculo de emprego em juízo não obsta a aplicação da multa prevista no art. 477, § 8º, da CLT, salvo quando o empregado comprovadamente der causa à mora."},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Res. 209/2016, DEJT divulgado em 01, 02 e 03.06.2016\nA circunstância de a relação de emprego ter sido reconhecido apenas em juízo não tem o condão de afastar a incidência da multa prevista no art. 477, § 8º, da CLT. A referida multa não será devida apenas quando, comprovadamente, o empregado der causa à mora no pagamento das verbas rescisórias."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-463","tribunal":"TST","tipo":"sumula","numero":463,"teor":"ASSISTÊNCIA JUDICIÁRIA GRATUITA. COMPROVAÇÃO.\n\nI - A partir de 26.06.2017, para a concessão da assistência judiciária gratuita à pessoa natural, basta a declaração de hipossuficiência econômica firmada pela parte ou por seu advogado, desde que munido de procuração com poderes específicos para esse fim (art. 105 do CPC de 2015);\nII - No caso de pessoa jurídica, não basta a mera declaração: é necessária a demonstração cabal de impossibilidade de a parte arcar com as despesas do processo.","status":"em_vigor","temas":["Honorários, custas e justiça gratuita","Provas e ônus da prova"],"historico":[{"evento":"Nova redação","ato":"Res. 219/2017","data":"2017-07-14","observacao":"(conversão da Orientação Jurisprudencial nº 304 da SBDI-1, com alterações decorrentes do CPC de 2015) - Res. 219/2017, DEJT divulgado em 28, 29 e 30.06.2017 - Republicada, DEJT divulgado em 12, 13 e 14.07.2017"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"stf-35","tribunal":"STF","tipo":"sumula","numero":35,"teor":"Em caso de acidente do trabalho ou de transporte, a concubina tem direito de ser indenizada pela morte do amásio, se entre êles não havia impedimento para o matrimônio.","status":"em_vigor","temas":["Acidente e doença do trabalho"],"historico":[{"evento":"Redação original","ato":null,"data":"1963-12-13","observacao":"Data de aprovação do enunciado: Sessão Plenária de 13-12-1963."}],"observacao":null,"alerta":null,"fonte_url":"https://portal.stf.jus.br/jurisprudencia/sumariosumulas.asp?base=30&sumula=3074","verificado":true,"verificado_em":"2026-09-21"},{"id":"stf-194","tribunal":"STF","tipo":"sumula","numero":194,"teor":"É competente o Ministro do Trabalho para a especificação das atividades insalubres.","status":"em_vigor","temas":["Adicionais (insalubridade, periculosidade e outros)"],"historico":[{"evento":"Redação original","ato":null,"data":"1963-12-13","observacao":"Data de aprovação do enunciado: DJ de 13-12-1963."}],"observacao":null,"alerta":null,"fonte_url":"https://portal.stf.jus.br/jurisprudencia/sumariosumulas.asp?base=30&sumula=3554","verificado":true,"verificado_em":"2026-09-21"},{"id":"stf-195","tribunal":"STF","tipo":"sumula","numero":195,"teor":"Contrato de trabalho para obra certa, ou de prazo determinado, transforma-se em contrato de prazo indeterminado, quando prorrogado por mais de quatro anos.","status":"em_vigor","temas":["Contrato e vínculo de emprego"],"historico":[{"evento":"Redação original","ato":null,"data":"1963-12-13","observacao":"Data de publicação do enunciado: DJ de 13-12-1963."}],"observacao":null,"alerta":null,"fonte_url":"https://portal.stf.jus.br/jurisprudencia/sumariosumulas.asp?base=30&sumula=3298","verificado":true,"verificado_em":"2026-09-21"},{"id":"stf-196","tribunal":"STF","tipo":"sumula","numero":196,"teor":"Ainda que exerça atividade rural, o empregado de empresa industrial ou comercial é classificado de acordo com a categoria do empregador.","status":"em_vigor","temas":["Contrato e vínculo de emprego","Direito coletivo e sindical"],"historico":[{"evento":"Redação original","ato":null,"data":"1963-12-13","observacao":"Data de aprovação do enunciado: DJ de 13-12-1963."}],"observacao":null,"alerta":null,"fonte_url":"https://portal.stf.jus.br/jurisprudencia/sumariosumulas.asp?base=30&sumula=3559","verificado":true,"verificado_em":"2026-09-21"},{"id":"stf-197","tribunal":"STF","tipo":"sumula","numero":197,"teor":"O empregado com representação sindical só pode ser despedido mediante inquérito em que se apure falta grave.","status":"em_vigor","temas":["Estabilidade e garantias de emprego","Direito coletivo e sindical"],"historico":[{"evento":"Redação original","ato":null,"data":"1963-12-13","observacao":"Data de aprovação do enunciado: DJ de 13-12-1963."}],"observacao":null,"alerta":null,"fonte_url":"https://portal.stf.jus.br/jurisprudencia/sumariosumulas.asp?base=30&sumula=2208","verificado":true,"verificado_em":"2026-09-21"},{"id":"stf-198","tribunal":"STF","tipo":"sumula","numero":198,"teor":"As ausências motivadas por acidente do trabalho não são descontáveis do período aquisitivo das férias.","status":"em_vigor","temas":["Férias, 13º e descansos","Acidente e doença do trabalho"],"historico":[{"evento":"Redação original","ato":null,"data":"1963-12-13","observacao":"Data de aprovação do enunciado: DJ de 13-12-1963."}],"observacao":null,"alerta":null,"fonte_url":"https://portal.stf.jus.br/jurisprudencia/sumariosumulas.asp?base=30&sumula=4211","verificado":true,"verificado_em":"2026-09-21"},{"id":"stf-199","tribunal":"STF","tipo":"sumula","numero":199,"teor":"O salário das férias do empregado horista corresponde à média do período aquisitivo, não podendo ser inferior ao mínimo.","status":"em_vigor","temas":["Férias, 13º e descansos","Salário e remuneração"],"historico":[{"evento":"Redação original","ato":null,"data":"1963-12-13","observacao":"Data de aprovação do enunciado: DJ de 13-12-1963."}],"observacao":null,"alerta":null,"fonte_url":"https://portal.stf.jus.br/jurisprudencia/sumariosumulas.asp?base=30&sumula=3561","verificado":true,"verificado_em":"2026-09-21"},{"id":"stf-200","tribunal":"STF","tipo":"sumula","numero":200,"teor":"Não é inconstitucional a Lei 1.530, de 26.12.1951, que manda incluir na indenização por despedida injusta parcela correspondente a férias proporcionais.","status":"em_vigor","temas":["Rescisão e verbas rescisórias","Férias, 13º e descansos"],"historico":[{"evento":"Redação original","ato":null,"data":"1963-12-13","observacao":"Data de aprovação do enunciado: DJ de 13-12-1963."}],"observacao":null,"alerta":null,"fonte_url":"https://porta icado_em":"2026-09-21"},{"id":"stf-505","tribunal":"STF","tipo":"sumula","numero":505,"teor":"Salvo quando contrariarem a Constituição, não cabe recurso para o Supremo Tribunal Federal, de quaisquer decisões da Justiça do Trabalho, inclusive dos presidentes de seus tribunais.","status":"em_vigor","temas":["Recursos e prazos","Competência da Justiça do Trabalho"],"historico":[{"evento":"Redação original","ato":null,"data":"1969-12-12","observacao":"Data de publicação do enunciado: DJ de 12-12-1969."}],"observacao":null,"alerta":null,"fonte_url":"https://portal.stf.jus.br/jurisprudencia/sumariosumulas.asp?base=30&sumula=2656","verificado":true,"verificado_em":"2026-09-21"},{"id":"stf-529","tribunal":"STF","tipo":"sumula","numero":529,"teor":"Subsiste a responsabilidade do empregador pela indenização decorrente de acidente do trabalho, quando o segurador, por haver entrado em liquidação, ou por outro motivo, não se encontrar em condições financeiras, de efetuar, na forma da lei, o pagamento que o seguro obrigatório visava garantir.","status":"em_vigor","temas":["Acidente e doença do trabalho"],"historico":[{"evento":"Redação original","ato":null,"data":"1969-12-12","observacao":"Data de publicação do enunciado: DJ de 12-12-1969."}],"observacao":null,"alerta":null,"fonte_url":"https://portal.stf.jus.br/jurisprudencia/sumariosumulas.asp?base=30&sumula=3270","verificado":true,"verificado_em":"2026-09-21"},{"id":"stf-531","tribunal":"STF","tipo":"sumula","numero":531,"teor":"É inconstitucional o Decreto 51668, de 17-01-1963, que estabeleceu salário profissional para trabalhadores de transportes marítimos, fluviais e lacustres.","status":"em_vigor","temas":["Salário e remuneração"],"historico":[{"evento":"Redação original","ato":null,"data":"1969-12-12","observacao":"Data de publicação do enunciado: DJ de 12-12-1969."}],"observacao":null,"alerta":null,"fonte_url":"https://portal.stf.jus.br/jurisprudencia/sumariosumulas.asp?base=30&sumula=2318","verificado":true,"verificado_em":"2026-09-21"},{"id":"stf-552","tribunal":"STF","tipo":"sumula","numero":552,"teor":"Com a regulamentação do art. 15 da Lei 5.316/1967, pelo Decreto 71.037/1972, tornou-se exequível a exigência da exaustão da via administrativa antes do início da ação de acidente do trabalho.","status":"em_vigor","temas":["Acidente e doença do trabalho"],"historico":[{"evento":"Redação original","ato":null,"data":"1977-01-05","observacao":"Data de publicação do enunciado: DJ de 5-1-1977."}],"observacao":null,"alerta":null,"fonte_url":"https://portal.stf.jus.br/jurisprudencia/sumariosumulas.asp?base=30&sumula=1610","verificado":true,"verificado_em":"2026-09-21"},{"id":"stf-593","tribunal":"STF","tipo":"sumula","numero":593,"teor":"Incide o percentual do Fundo de Garantia do Tempo de Serviço (FGTS) sobre a parcela da remuneração correspondente a horas extraordinárias de trabalho.","status":"em_vigor","temas":["FGTS","Jornada e horas extras"],"historico":[{"evento":"Redação original","ato":null,"data":"1977-01-05","observacao":"Data de publicação do enunciado: DJ de 5-1-1977."}],"observacao":null,"alerta":null,"fonte_url":"https://portal.stf.jus.br/jurisprudencia/sumariosumulas.asp?base=30&sumula=3575","verificado":true,"verificado_em":"2026-09-21"},{"id":"stf-633","tribunal":"STF","tipo":"sumula","numero":633,"teor":"É incabível a condenação em verba honorária nos recursos extraordinários interpostos em processo trabalhista, exceto nas hipóteses previstas na Lei 5584/1970.","status":"em_vigor","temas":["Honorários, custas e justiça gratuita","Recursos e prazos"],"historico":[{"evento":"Redação original","ato":null,"data":"2003-10-13","observacao":"Data de publicação do enunciado: DJ de 13-10-2003."}],"observacao":null,"alerta":null,"fonte_url":"https://portal.stf.jus.br/jurisprudencia/sumariosumulas.asp?base=30&sumula=2302","verificado":true,"verificado_em":"2026-09-21"},{"id":"stf-666","tribunal":"STF","tipo":"sumula","numero":666,"teor":"A contribuição confederativa de que trata o art. 8º, IV, da Constituição, só é exigível dos filiados ao sindicato respectivo.","status":"convertida","temas":["Direito coletivo e sindical"],"historico":[{"evento":"Redação original","ato":null,"data":"2003-10-13","observacao":"Data de publicação do enunciado: DJ de 13-10-2003."}],"observacao":"Convertida na Súmula Vinculante 40 do STF.","alerta":{"texto":"A observação oficial do verbete informa a conversão na Súmula Vinculante 40.","fonte_url":"https://portal.stf.jus.br/jurisprudencia/sumariosumulas.asp?base=30&sumula=1642"},"fonte_url":"https://portal.stf.jus.br/jurisprudencia/sumariosumulas.asp?base=30&sumula=1642","verificado":true,"verificado_em":"2026-09-21"},{"id":"stf-671","tribunal":"STF","tipo":"sumula","numero":671,"teor":"Os servidores públicos e os trabalhadores em geral têm direito, no que concerne à URP de abril/maio de 1988, apenas ao valor correspondente a 7/30 de 16,19% sobre os vencimentos e salários pertinentes aos meses de abril e maio de 1988, não cumulativamente, devidamente corrigido até o efetivo pagamento.","status":"em_vigor","temas":["Salário e remuneração"],"historico":[{"evento":"Redação original","ato":null,"data":"2003-10-13","observacao":"Data de publicação do enunciado: DJ de 13-10-2003."}],"observacao":null,"alerta":null,"fonte_url":"https://portal.stf.jus.br/jurisprudencia/sumariosumulas.asp?base=30&sumula=2520","verificado":true,"verificado_em":"2026-09-21"},{"id":"stf-675","tribunal":"STF","tipo":"sumula","numero":675,"teor":"Os intervalos fixados para descanso e alimentação durante a jornada de seis horas não descaracterizam o sistema de turnos ininterruptos de revezamento para o efeito do art. 7º, XIV, da Constituição.","status":"em_vigor","temas":["Jornada e horas extras"],"historico":[{"evento":"Redação original","ato":null,"data":"2003-10-13","observacao":"Data de publicação do enunciado: DJ de 13-10-2003."}],"observacao":null,"alerta":null,"fonte_url":"https://portal.stf.jus.br/jurisprudencia/sumariosumulas.asp?base=30&sumula=2312","verificado":true,"verificado_em":"2026-09-21"},{"id":"stf-676","tribunal":"STF","tipo":"sumula","numero":676,"teor":"A garantia da estabilidade provisória prevista no art. 10, II, \"a\", do Ato das Disposições Constitucionais Transitórias, também se aplica ao suplente do cargo de direção de comissões internas de prevenção de acidentes (CIPA).","status":"em_vigor","temas":["Estabilidade e garantias de emprego"],"historico":[{"evento":"Redação original","ato":null,"data":"2003-10-13","observacao":"Data de publicação do enunciado: DJ de 13-10-2003."}],"observacao":null,"alerta":null,"fonte_url":"https://portal.stf.jus.br/jurisprudencia/sumariosumulas.asp?base=30&sumula=2314","verificado":true,"verificado_em":"2026-09-21"},{"id":"stf-677","tribunal":"STF","tipo":"sumula","numero":677,"teor":"Até que lei venha a dispor a respeito, incumbe ao Ministério do Trabalho proceder ao registro das entidades sindicais e zelar pela observância do princípio da unicidade.","status":"em_vigor","temas":["Direito coletivo e sindical"],"historico":[{"evento":"Redação original","ato":null,"data":"2003-10-13","observacao":"Data de publicação do enunciado: DJ de 13-10-2003."}],"observacao":null,"alerta":{"texto":"A observação oficial do verbete registra o Tema 488 da repercussão geral, com repercussão reconhecida.","fonte_url":"https://portal.stf.jus.br/jurisprudencia/sumariosumulas.asp?base=30&sumula=2316"},"fonte_url":"https://portal.stf.jus.br/jurisprudencia/sumariosumulas.asp?base=30&sumula=2316","verificado":true,"verificado_em":"2026-09-21"},{"id":"stf-736","tribunal":"STF","tipo":"sumula","numero":736,"teor":"Compete à justiça do trabalho julgar as ações que tenham como causa de pedir o descumprimento de normas trabalhistas relativas à segurança, higiene e saúde dos trabalhadores.","status":"em_vigor","temas":["Competência da Justiça do Trabalho"],"historico":[{"evento":"Redação original","ato":null,"data":"2003-12-11","observacao":"Data de publicação do enunciado: DJ de 11-12-2003."}],"observacao":null,"alerta":null,"fonte_url":"https://portal.stf.jus.br/jurisprudencia/sumariosumulas.asp?base=30&sumula=2243","verificado":true,"verificado_em":"2026-09-21"},{"id":"sv-1","tribunal":"STF","tipo":"sumula_vinculante","numero":1,"teor":"Ofende a garantia constitucional do ato jurídico perfeito a decisão que, sem ponderar as circunstâncias do caso concreto, desconsidera a validez e a eficácia de acordo constante de termo de adesão instituído pela Lei Complementar 110/2001.","status":"em_vigor","temas":["FGTS"],"historico":[{"evento":"Redação original","ato":null,"data":"2007-06-06","observacao":"Data de publicação do enunciado: DJE de 6-6-2007."}],"observacao":null,"alerta":null,"fonte_url":"https://portal.stf.jus.br/jurisprudencia/sumariosumulas.asp?base=26&sumula=1185","verificado":true,"verificado_em":"2026-09-21"},{"id":"sv-4","tribunal":"STF","tipo":"sumula_vinculante","numero":4,"teor":"Salvo nos casos previstos na Constituição, o salário mínimo não pode ser usado como indexador de base de cálculo de vantagem de servidor público ou de empregado, nem ser substituído por decisão judicial.","status":"em_vigor","temas":["Adicionais (insalubridade, periculosidade e outros)","Salário e remuneração"],"historico":[{"evento":"Redação original","ato":null,"data":"2008-05-09","observacao":"Data de publicação do enunciado: DJE de 9-5-2008."}],"observacao":null,"alerta":null,"fonte_url":"https://portal.stf.jus.br/jurisprudencia/sumariosumulas.asp?base=26&sumula=1195","verificado":true,"verificado_em":"2026-09-21"},{"id":"sv-22","tribunal":"STF","tipo":"sumula_vinculante","numero":22,"teor":"A Justiça do Trabalho é competente para processar e julgar as ações de indenização por danos morais e patrimoniais decorrentes de acidente de trabalho propostas por empregado contra empregador, inclusive aquelas que ainda não possuíam sentença de mérito em primeiro grau quando da promulgação da Emenda Constitucional 45/2004.","status":"em_vigor","temas":["Competência da Justiça do Trabalho","Acidente e doença do trabalho"],"historico":[{"evento":"Redação original","ato":null,"data":"2009-12-11","observacao":"Data de publicação do enunciado: DJE de 11-12-2009."}],"observacao":null,"alerta":null,"fonte_url":"https://portal.stf.jus.br/jurisprudencia/sumariosumulas.asp?base=26&sumula=1259","verificado":true,"verificado_em":"2026-09-21"},{"id":"sv-23","tribunal":"STF","tipo":"sumula_vinculante","numero":23,"teor":"A Justiça do Trabalho é competente para processar e julgar ação possessória ajuizada em decorrência do exercício do direito de greve pelos trabalhadores da iniciativa privada.","status":"em_vigor","temas":["Competência da Justiça do Trabalho","Greve"],"historico":[{"evento":"Redação original","ato":null,"data":"2009-12-11","observacao":"Data de publicação do enunciado: DJE de 11-12-2009."}],"observacao":null,"alerta":null,"fonte_url":"https://portal.stf.jus.br/jurisprudencia/sumariosumulas.asp?base=26&sumula=1262","verificado":true,"verificado_em":"2026-09-21"},{"id":"sv-40","tribunal":"STF","tipo":"sumula_vinculante","numero":40,"teor":"A contribuição confederativa de que trata o art. 8º, IV, da Constituição Federal, só é exigível dos filiados ao sindicato respectivo.","status":"em_vigor","temas":["Direito coletivo e sindical"],"historico":[{"evento":"Redação original","ato":null,"data":"2015-03-20","observacao":"Data de publicação do enunciado: DJE de 20-3-2015."}],"observacao":null,"alerta":null,"fonte_url":"https://portal.stf.jus.br/jurisprudencia/sumariosumulas.asp?base=26&sumula=2204","verificado":true,"verificado_em":"2026-09-21"},{"id":"sv-53","tribunal":"STF","tipo":"sumula_vinculante","numero":53,"teor":"A competência da Justiça do Trabalho prevista no art. 114, VIII, da Constituição Federal alcança a execução de ofício das contribuições previdenciárias relativas ao objeto da condenação constante das sentenças que proferir e acordos por ela homologados.","status":"em_vigor","temas":["Competência da Justiça do Trabalho","Execução e penhora"],"historico":[{"evento":"Redação original","ato":null,"data":"2015-06-23","observacao":"Data de publicação do enunciado: DJE de 23-6-2015."}],"observacao":null,"alerta":null,"fonte_url":"https://portal.stf.jus.br/jurisprudencia/sumariosumulas.asp?base=26&sumula=2613","verificado":true,"verificado_em":"2026-09-21"}]
