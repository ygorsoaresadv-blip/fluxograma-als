xcepcionado, consoante o disposto no art. 799, § 2º, da CLT.","status":"em_vigor","temas":["Competência da Justiça do Trabalho","Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 127/2005","data":"2005-03-16","observacao":"(nova redação) - Res. 127/2005, DJ 14, 15 e 16.03.2005"},{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula alterada - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 214 Decisão interlocutória. Irrecorribilidade\nNa Justiça do Trabalho, as decisões interlocutórias somente ensejam recurso imediato quando suscetíveis de impugnação mediante recurso para o mesmo Tribunal ou na hipótese de acolhimento de exceção de incompetência, com a remessa dos autos para Tribunal Regional distinto daquele a que se vincula o juízo excepcionado, consoante disposto no art. 799, § 2º, da CLT."},{"evento":"Nova redação","ato":"Res. 43/1995","data":"1995-02-21","observacao":"Súmula alterada - Res. 43/1995, DJ 17, 20 e 21.02.1995 - Republicada DJ 22, 23 e 24.03.1995."},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 214 Decisão interlocutória. Irrecorribilidade\nAs decisões interlocutórias, na Justiça do Trabalho, só são recorríveis de imediato quando terminativas do feito, podendo ser impugnadas na oportunidade da interposição de recurso contra decisão definitiva, salvo quando proferidas em acórdão sujeito a recurso para o mesmo Tribunal."},{"evento":"Redação original","ato":"Res. 14/1985","data":"1985-09-19","observacao":"Redação original - Res. 14/1985, DJ 19.09.1985 e 24, 25 e 26.09.1985"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 214 Decisão interlocutória. Irrecorribilidade\nSalvo quando terminativas do feito na Justiça do Trabalho, as decisões interlocutórias não são recorríveis de imediato, podendo ser impugnadas quando da interposição de recurso contra a decisão definitiva."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-215","tribunal":"TST","tipo":"sumula","numero":215,"teor":"HORAS EXTRAS NÃO CONTRATADAS EXPRESSAMENTE. ADICIONAL DEVIDO.\n\nInexistindo acordo escrito para prorrogação da jornada de trabalho, o adicional referente às horas extras é devido na base de 25% (vinte e cinco por cento).","status":"cancelada","temas":["Jornada e horas extras"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelamento mantido) - Res. 121/2003, DJ 19, 20 e 21.11.2003 - Referência art. 7º, XVI, CF/1988"},{"evento":"Cancelamento","ato":"Res. 28/1994","data":"1994-05-18","observacao":"Súmula cancelada - Res. 28/1994, DJ 12, 16 e 18.05.1994"},{"evento":"Redação original","ato":"Res. 14/1985","data":"1985-09-19","observacao":"Redação original - Res. 14/1985, DJ 19.09.1985 e 24, 25 e 26.09.1985"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-216","tribunal":"TST","tipo":"sumula","numero":216,"teor":"DESERÇÃO. RELAÇÃO DE EMPREGADOS. AUTENTICAÇÃO MECÂNICA DESNECESSÁRIA.\n\nSão juridicamente desnecessárias a autenticação mecânica do valor do depósito recursal na relação de empregados (RE) e a individualização do processo na guia de recolhimento (GR), pelo que a falta não importa em deserção.","status":"cancelada","temas":["Honorários, custas e justiça gratuita","Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelamento mantido) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Cancelamento","ato":"Res. 87/1998","data":"1998-10-19","observacao":"Súmula cancelada - Res. 87/1998, DJ 15, 16 e 19.10.1998"},{"evento":"Redação original","ato":"Res. 14/1985","data":"1985-09-19","observacao":"Redação original - Res. 14/1985, DJ 19.09.1985 e 24, 25 e 26.09.1985"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-217","tribunal":"TST","tipo":"sumula","numero":217,"teor":"DEPÓSITO RECURSAL. CREDENCIAMENTO BANCÁRIO. PROVA DISPENSÁVEL.\n\nO credenciamento dos bancos para o fim de recebimento do depósito recursal é fato notório, independendo da prova.","status":"em_vigor","temas":["Honorários, custas e justiça gratuita","Provas e ônus da prova"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 14/1985","data":"1985-09-19","observacao":"Redação original - Res. 14/1985, DJ 19.09.1985 e 24, 25 e 26.09.1985"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-218","tribunal":"TST","tipo":"sumula","numero":218,"teor":"RECURSO DE REVISTA. ACÓRDÃO PROFERIDO EM AGRAVO DE INSTRUMENTO.\n\nÉ incabível recurso de revista interposto de acórdão regional prolatado em agravo de instrumento.","status":"em_vigor","temas":["Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"INSTRUMENTO (mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 14/1985","data":"1985-09-19","observacao":"Redação original - Res. 14/1985, DJ 19.09.1985 e 24, 25 e 26.09.1985"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 218 Recurso de revista contra acórdão proferido em agravo de instrumento\nÉ incabível recurso de revista contra acórdão regional prolatado em agravo de instrumento."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-219","tribunal":"TST","tipo":"sumula","numero":219,"teor":"HONORÁRIOS ADVOCATÍCIOS. CABIMENTO.\n\nI - Na Justiça do Trabalho, a condenação ao pagamento de honorários advocatícios não decorre pura e simplesmente da sucumbência, devendo a parte, concomitantemente: a) estar assistida por sindicato da categoria profissional; b) comprovar a percepção de salário inferior ao dobro do salário mínimo ou encontrar-se em situação econômica que não lhe permita demandar sem prejuízo do próprio sustento ou da respectiva família. (art.14,§1º, da Lei nº 5.584/1970). (ex-OJ nº 305da SBDI-I).\nII - É cabível a condenação ao pagamento de honorários advocatícios em ação rescisória no processo trabalhista.\nIII - São devidos os honorários advocatícios nas causas em que o ente sindical figure como substituto processual e nas lides que não derivem da relação de emprego.\nIV - Na ação rescisória e nas lides que não derivem de relação de emprego, a responsabilidade pelo pagamento dos honorários advocatícios da sucumbência submete-se à disciplina do Código de Processo Civil (arts. 85, 86, 87 e 90).\nV - Em caso de assistência judiciária sindical, revogado o art. 11 da Lei nº 1060/50 (CPC de 2015, art. 1072, inc. III), os honorários advocatícios assistenciais são devidos entre o mínimo de dez e o máximo de vinte por cento sobre o valor da condenação, do proveito econômico obtido ou, não sendo possível mensurá-lo, sobre o valor atualizado da causa (CPC de 2015, art. 85, § 2º).\nVI - Nas causas em que a Fazenda Pública for parte, aplicar-se-ão os percentuais específicos de honorários advocatícios contemplados no Código de Processo Civil.","status":"cancelada","temas":["Salário e remuneração","Rescisão e verbas rescisórias","Direito coletivo e sindical"],"historico":[{"evento":"Cancelamento","ato":"Res. 225/2025","data":"2025-07-02","observacao":"Cancelada por perda de eficácia a partir de 11.11.2017, pela Lei 13.467/2017. Res. 225/2025, DEJT divulgado em 30.06, 01 e 02.07.2025"},{"evento":"Nova redação","ato":"Res. 204/2016","data":"2016-03-21","observacao":"Alterada a redação do item I e acrescidos os itens IV a VI em decorrência do CPC de 2015 - Res. 204/2016, DEJT divulgado em 17, 18 e 21.03.2016"},{"evento":"Nova redação","ato":"Res. 197/2015","data":"2015-05-18","observacao":"Incorporada a Orientação Jurisprudencial nº 305 da SBDI-1 ao item I - Res. 197/2015, DEJT divulgado em 14, 15 e 18.05.2015"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 219 Honorários advocatícios. Cabimento\nI - Na Justiça do Trabalho, a condenação ao pagamento de honorários advocatícios, nunca superiores a 15% (quinze por cento), não decorre pura e simplesmente da sucumbência, devendo a parte, concomitantemente: a) estar assistida por sindicato da categoria profissional; b) comprovar a percepção de salário inferior ao dobro do salário mínimo ou encontrar-se em situação econômica que não lhe permita demandar sem prejuízo do próprio sustento ou da respectiva família. (art.14,§1º, da Lei nº 5.584/1970). (ex-OJ nº 305da SBDI-I)"},{"evento":"Nova redação","ato":"Res. 174/2011","data":"2011-05-31","observacao":"Nova redação: item II e inserido o item III à redação - Res. 174/2011, DEJT divulgado em 27, 30 e 31.05.2011"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 219 Honorários advocatícios. Hipótese de cabimento\nI - Na Justiça do Trabalho, a condenação ao pagamento de honorários advocatícios, nunca superiores a 15% (quinze por cento), não decorre pura e simplesmente da sucumbência, de-vendo a parte estar assistida por sindicato da categoria profissional e comprovar a percepção de salário inferior ao dobro do salário mínimo ou encontrar-se em situação econômica que não lhe permita demandar sem prejuízo do próprio sustento ou da respectiva família. (ex-Súmula nº 219 - Res. 14/1985, DJ 26.09.1985"},{"evento":"Nova redação","ato":"Res. 137/2005","data":"2005-08-24","observacao":"Súmula alterada - Res. 137/2005, DJ 22, 23 e 24.08.2005"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 219 Honorários advocatícios. Hipótese de cabimento (incorporada a Orientação Juris-prudencial nº 27 da SBDI-2)\n(...)\nII - É incabível a condenação ao pagamento de honorários advocatícios em ação rescisória no processo trabalhista, salvo se preenchidos os requisitos da Lei nº 5.584/1970. (ex-OJ nº 27 da SBDI-2 - inserida em 20.09.2000)"},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 14/1985","data":"1985-09-19","observacao":"Redação original - Res. 14/1985, DJ 19.09.1985 e 24, 25 e 26.09.1985"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 219. Honorários advocatícios. Hipótese de cabimento\nNa Justiça do Trabalho, a condenação em honorários advocatícios, nunca superiores a 15%, não decorre pura e simplesmente da sucumbência, devendo a parte estar assistida por sindi-cato da categoria profissional e comprovar a percepção de salário inferior ao dobro do mí-nimo legal, ou encontrar-se em situação econômica que não lhe permita demandar sem pre-juízo do próprio sustento ou da respectiva família."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-220","tribunal":"TST","tipo":"sumula","numero":220,"teor":"HONORÁRIOS ADVOCATÍCIOS. SUBSTITUIÇÃO PROCESSUAL.\n\nAtendidos os requisitos da Lei nº 5.584/1970, são devidos os honorários advocatícios, ainda que o sindicato figure como substituto processual.","status":"cancelada","temas":["Direito coletivo e sindical","Honorários, custas e justiça gratuita"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelamento mantido) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Cancelamento","ato":"Res. 55/1996","data":"1996-04-23","observacao":"Súmula cancelada - Res. 55/1996, DJ 19, 22 e 23.04.1996"},{"evento":"Redação original","ato":"Res. 14/1985","data":"1985-09-19","observacao":"Redação original - Res. 14/1985, DJ 19.09.1985 e 24, 25 e 26.09.1985"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-221","tribunal":"TST","tipo":"sumula","numero":221,"teor":"RECURSO DE REVISTA. VIOLAÇÃO DE LEI. INDICAÇÃO DE PRECEITO.\n\nA admissibilidade do recurso de revista por violação tem como pressuposto a indicação expressa do dispositivo de lei ou da Constituição tido como violado.","status":"em_vigor","temas":["Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 185/2012","data":"2012-09-27","observacao":"(cancelado o item II e conferida nova redação na sessão do Tribunal Pleno realizada em 14.09.2012) - Res. 185/2012, DEJT divulgado em 25, 26 e 27.09.2012"},{"evento":"Nova redação","ato":"Res. 181/2012","data":"2012-04-23","observacao":"Súmula alterada - (alterada em decorrência da redação do inciso II do art. 894 da CLT, incluído pela Lei nº 11.496/2007) - Res. 181/2012, DEJT divulgado em 19, 20 e 23.04.2012"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 221 Recurso de revista. Violação de lei. Indicação de preceito. Interpretação razoável\nI - A admissibilidade do recurso de revista por violação tem como pressuposto a indicação expressa do dispositivo de lei ou da Constituição tido como violado. (ex-OJ nº 94 da SBDI-1 - inserida em 30.05.1997)\nII - Interpretação razoável de preceito de lei, ainda que não seja a melhor, não dá ensejo à admissibilidade ou ao conhecimento de recurso de revista com base na alínea \"c\" do art. 896 da CLT. A violação há de estar ligada à literalidade do preceito. (ex-Súmula nº 221 - alterada pela Res. 121/2003, DJ 21.11.2003)"},{"evento":"Nova redação","ato":null,"data":null,"observacao":"Súmula alterada - incorporação da OJ nº 94 da SBDI-1"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 221 Recursos de revista ou de embargos. Violação de lei. Indicação de preceito. Interpretação razoável\nI - A admissibilidade do recurso de revista e de embargos por violação tem como pressuposto a indicação expressa do dispositivo de lei ou da Constituição tido como violado. (ex-OJ nº 94 da SBDI-1 - inserida em 30.05.1997)\nII - Interpretação razoável de preceito de lei, ainda que não seja a melhor, não dá ensejo à admissibilidade ou ao conhecimento de recurso de revista ou de embargos com base, respectivamente, na alínea \"c\" do art. 896 e na alínea \"b\" do art. 894 da CLT. A violação há de estar ligada à literalidade do preceito. (ex-Súmula nº 221 - alterada pela Res. 121/2003, DJ 21.11.2003)"},{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula alterada - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 221 Recursos de revista ou de embargos. Interpretação razoável. Admissibilidade vedada\nInterpretação razoável de preceito de lei, ainda que não seja a melhor, não dá ensejo à admissibilidade ou ao conhecimento de recurso de revista ou de embargos com base, respectivamente, na alínea c do art. 896 e na alínea b do art. 894 da CLT. A violação há de estar ligada à literalidade do preceito."},{"evento":"Redação original","ato":"Res. 14/1985","data":"1985-09-19","observacao":"Redação original - Res. 14/1985, DJ 19.09.1985 e 24, 25 e 26.09.1985"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 221 Recursos de revista ou de embargos. Interpretação razoável. Admissibilidade vedada\nInterpretação razoável de preceito de lei, ainda que não seja a melhor, não dá ensejo à admissibilidade ou ao conhecimento dos recursos de revista ou de embargos com base, respectivamente, nas alíneas \"b\" dos artigos 896 e 894, da Consolidação das Leis do Trabalho. A violação há que estar ligada à literalidade do preceito."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-222","tribunal":"TST","tipo":"sumula","numero":222,"teor":"DIRIGENTES DE ASSOCIAÇÕES PROFISSIONAIS. ESTABILIDADE PROVISÓRIA.\n\nOs dirigentes de associações profissionais, legalmente registradas, gozam de estabilidade provisória no emprego.","status":"cancelada","temas":["Estabilidade e garantias de emprego"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelamento mantido) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Cancelamento","ato":"Res. 84/1998","data":"1998-08-24","observacao":"Súmula cancelada - Res. 84/1998, DJ 20, 21 e 24.08.1998"},{"evento":"Redação original","ato":"Res. 14/1985","data":"1985-09-19","observacao":"Redação original - Res. 14/1985, DJ 19.09.1985 e 24, 25 e 26.09.1985"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-223","tribunal":"TST","tipo":"sumula","numero":223,"teor":"PRESCRIÇÃO. OPÇÃO PELO SISTEMA DO FUNDO DE GARANTIA DO TEMPO DE SERVIÇO. TERMO INICIAL.\n\nO termo inicial da prescrição para anular a opção pelo Fundo de Garantia do Tempo de Serviço coincide com a data em que formalizado o ato opcional, e não com a cessação do contrato de trabalho.","status":"cancelada","temas":["FGTS","Prescrição e decadência","Contrato e vínculo de emprego"],"historico":[{"evento":"Cancelamento","ato":"Res. 121/2003","data":"2003-11-21","observacao":"cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 14/1985","data":"1985-09-19","observacao":"Redação original - Res. 14/1985, DJ 19.09.1985 e 24, 25 e 26.09.1985"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-224","tribunal":"TST","tipo":"sumula","numero":224,"teor":"COMPETÊNCIA. AÇÃO DE CUMPRIMENTO. SINDICATO. DESCONTO ASSISTENCIAL.\n\nA Justiça do Trabalho é incompetente para julgar ação na qual o sindicato, em nome próprio, pleiteia o recolhimento de desconto assistencial previsto em sentença normativa, convenção ou acordo coletivos.","status":"cancelada","temas":["Direito coletivo e sindical"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Revista pela Súmula nº 334 - Res. 26/1994, DJ 12, 17 e 19.05.1994."},{"evento":"Redação original","ato":"Res. 14/1985","data":"1985-09-19","observacao":"Redação original - Res. 14/1985, DJ 19.09.1985 e 24, 25 e 26.09.1985"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-225","tribunal":"TST","tipo":"sumula","numero":225,"teor":"REPOUSO SEMANAL. CÁLCULO. GRATIFICAÇÕES POR TEMPO DE SERVIÇO E PRODUTIVIDADE.\n\nAs gratificações por tempo de serviço e produtividade, pagas mensalmente, não repercutem no cálculo do repouso semanal remunerado.","status":"em_vigor","temas":["Férias, 13º e descansos","Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 14/1985","data":"1985-09-19","observacao":"Redação original - Res. 14/1985, DJ 19.09.1985 e 24, 25 e 26.09.1985"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 225 Repouso semanal. Cálculo. Gratificações de produtividade e por tempo de serviço\nAs gratificações de produtividade e por tempo de serviço, pagas mensalmente, não repercutem no cálculo do repouso semanal remunerado."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-226","tribunal":"TST","tipo":"sumula","numero":226,"teor":"BANCÁRIO. GRATIFICAÇÃO POR TEMPO DE SERVIÇO. INTEGRAÇÃO NO CÁLCULO DAS HORAS EXTRAS.\n\nA gratificação por tempo de serviço integra o cálculo das horas extras.","status":"em_vigor","temas":["Jornada e horas extras","Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 14/1985","data":"1985-09-19","observacao":"Redação original - Res. 14/1985, DJ 19.09.1985 e 24, 25 e 26.09.1985"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-227","tribunal":"TST","tipo":"sumula","numero":227,"teor":"SALÁRIO-FAMÍLIA. TRABALHADOR RURAL.\n\nO salário-família somente é devido aos trabalhadores urbanos, não alcançando os rurais, ainda que prestem serviços, no campo, à empresa agroindustrial.","status":"cancelada","temas":["Salário e remuneração","Contrato e vínculo de emprego"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Revista pela Súmula nº 344 - Res. 51/1995, DJ 21, 22 e 25.09.1995"},{"evento":"Redação original","ato":"Res. 14/1985","data":"1985-09-19","observacao":"Redação original - Res. 14/1985, DJ 19.09.1985 e 24, 25 e 26.09.1985"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-228","tribunal":"TST","tipo":"sumula","numero":228,"teor":"ADICIONAL DE INSALUBRIDADE. BASE DE CÁLCULO.\n\nA partir de 9 de maio de 2008, data da publicação da Súmula Vinculante nº 4 do Supremo Tribunal Federal, o adicional de insalubridade será calculado sobre o salário básico, salvo critério mais vantajoso fixado em instrumento coletivo.","status":"cancelada","temas":["Adicionais (insalubridade, periculosidade e outros)","Salário e remuneração"],"historico":[{"evento":"Cancelamento","ato":null,"data":"2025-07-02","observacao":"Cancelada por perda de eficácia considerando a decisão da Rcl 6266, a partir da publicação em 18/04/2018 - DEJT divulgado em 30.06, 01 e 02.07.2025"},{"evento":"Suspensão","ato":"Res. 148/2008","data":"2008-06-26","observacao":"Redação alterada na sessão do Tribunal Pleno em 26.06.2008 - Res. 148/2008, DJ 04 e 07.07.2008 - Republicada DJ 08, 09 e 10.07.2008. SÚMULA CUJA EFICÁCIA ESTÁ SUSPENSA POR DECISÃO LIMINAR DO SUPREMO TRIBUNAL FEDERAL - Res. 185/2012, DEJT divulgado em 25, 26 e 27.09.2012"},{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"Súmula alterada - (incorporadas as Orientações Jurisprudenciais nºs 88 e 196 da SBDI-1) - Res. 129/2005, DJ 20, 22 e 25.04.2005"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"III - Não há direito da empregada gestante à estabilidade provisória na hipótese de admissão mediante contrato de experiência, visto que a extinção da relação de emprego, em face do término do prazo, não constitui dispensa arbitrária ou sem justa causa. (ex-OJ nº 196 da SBDI-1 - inserida em 08.11.2000)"},{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Nova redação - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 228 Adicional de insalubridade. Base de cálculo\nO percentual do adicional de insalubridade incide sobre o salário mínimo de que cogita o art. 76 da CLT, salvo as hipóteses previstas na Súmula nº 17."},{"evento":"Redação original","ato":"Res. 14/1985","data":"1985-09-19","observacao":"Redação original - Res. 14/1985, DJ 19.09.1985 e 24, 25 e 26.09.1985"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 228 Adicional de Insalubridade. Base de cálculo\nO percentual do adicional de insalubridade incide sobre o salário-mínimo de que cogita o art. 76 da Consolidação das Leis do Trabalho."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-229","tribunal":"TST","tipo":"sumula","numero":229,"teor":"SOBREAVISO. ELETRICITÁRIOS.\n\nPor aplicação analógica do art. 244, § 2º, da CLT, as horas de sobreaviso dos eletricitários são remuneradas à base de 1/3 sobre a totalidade das parcelas de natureza salarial.","status":"em_vigor","temas":["Jornada e horas extras"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(nova redação) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 14/1985","data":"1985-09-19","observacao":"Redação original - Res. 14/1985, DJ 19.09.1985 e 24, 25 e 26.09.1985"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 229 Sobreaviso - Eletricitários\nPor aplicação analógica do art. 244, § 2º, da Consolidação das Leis do Trabalho, as horas de sobreaviso dos eletricitários são remuneradas à razão de 1/3 do salário normal."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-230","tribunal":"TST","tipo":"sumula","numero":230,"teor":"AVISO PRÉVIO. SUBSTITUIÇÃO PELO PAGAMENTO DAS HORAS REDUZIDAS DA JORNADA DE TRABALHO.\n\nÉ ilegal substituir o período que se reduz da jornada de trabalho, no aviso prévio, pelo pagamento das horas correspondentes.","status":"em_vigor","temas":["Jornada e horas extras","Rescisão e verbas rescisórias"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 14/1985","data":"1985-09-19","observacao":"Redação original - Res. 14/1985, DJ 19.09.1985 e 24, 25 e 26.09.1985"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-231","tribunal":"TST","tipo":"sumula","numero":231,"teor":"QUADRO DE CARREIRA. HOMOLOGAÇÃO PELO CONSELHO NACIONAL DE POLÍTICA SALARIAL. EFICÁCIA.\n\nÉ eficaz para efeito do art. 461, § 2º, da CLT a homologação de quadro organizado em carreira pelo Conselho Nacional de Política Salarial.","status":"cancelada","temas":["Rescisão e verbas rescisórias"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 14/1985","data":"1985-09-19","observacao":"Redação original - Res. 14/1985, DJ 19.09.1985 e 24, 25 e 26.09.1985"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-232","tribunal":"TST","tipo":"sumula","numero":232,"teor":"BANCÁRIO. CARGO DE CONFIANÇA. JORNADA. HORAS EXTRAS.\n\nO bancário sujeito à regra do art. 224, § 2º, da CLT cumpre jornada de trabalho de 8 (oito) horas, sendo extraordinárias as trabalhadas além da oitava.","status":"convertida","temas":["Jornada e horas extras"],"historico":[{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"(cancelada em decorrência da sua incorporação à nova redação da Súmula nº 102) - Res. 129/2005, DJ 20, 22 e 25.04.2005"},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 14/1985","data":"1985-09-19","observacao":"Redação original - Res. 14/1985, DJ 19.09.1985 e 24, 25 e 26.09.1985"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 232 Bancário - Cargo de confiança - Jornada - Horas extras.\nO bancário sujeito à regra do artigo 224, § 2º, da Consolidação das Leis do Trabalho cumpre jornada de trabalho de oito horas, sendo extraordinárias as trabalhadas além da oitava."}],"observacao":"Cancelada em decorrência da sua incorporação à nova redação da Súmula nº 102 do TST.","alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-233","tribunal":"TST","tipo":"sumula","numero":233,"teor":"BANCÁRIO. CHEFE.\n\nO bancário no exercício da função de chefia, que recebe gratificação não inferior a 1/3 do salário do cargo efetivo, está inserido na exceção do § 2º do art. 224 da CLT, não fazendo jus ao pagamento das sétima e oitava horas como extras.","status":"cancelada","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 14/1985","data":"1985-09-19","observacao":"Redação original - Res. 14/1985, DJ 19.09.1985 e 24, 25 e 26.09.1985"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-234","tribunal":"TST","tipo":"sumula","numero":234,"teor":"BANCÁRIO. SUBCHEFE.\n\nO bancário no exercício da função de subchefia, que recebe gratificação não inferior a 1/3 do salário do cargo efetivo, está inserido na exceção do § 2º do art. 224 da CLT, não fazendo jus ao pagamento das sétima e oitava horas como extras.","status":"cancelada","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 14/1985","data":"1985-09-19","observacao":"Redação original - Res. 14/1985, DJ 19.09.1985 e 24, 25 e 26.09.1985"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-235","tribunal":"TST","tipo":"sumula","numero":235,"teor":"DISTRITO FEDERAL E AUTARQUIAS. CORREÇÃO AUTOMÁTICA DOS SALÁRIOS. INAPLICABILIDADE DA LEI Nº 6.708/1979.\n\nAos servidores do Distrito Federal e respectivas autarquias, submetidos ao regime da CLT, não se aplica a Lei nº 6.708/1979, que determina a correção automática dos salários.","status":"cancelada","temas":["Salário e remuneração","Ente público como empregador"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 15/1985","data":"1985-12-09","observacao":"Redação original - Res. 15/1985, DJ 05, 06 e 09.12.1985"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-236","tribunal":"TST","tipo":"sumula","numero":236,"teor":"HONORÁRIOS PERICIAIS. RESPONSABILIDADE.\n\nA responsabilidade pelo pagamento dos honorários periciais é da parte sucumbente na pretensão relativa ao objeto da perícia.","status":"cancelada","temas":["Honorários, custas e justiça gratuita","Provas e ônus da prova"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 15/1985","data":"1985-12-09","observacao":"Redação original - Res. 15/1985, DJ 05, 06 e 09.12.1985"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-237","tribunal":"TST","tipo":"sumula","numero":237,"teor":"BANCÁRIO. TESOUREIRO.\n\nO bancário investido na função de tesoureiro, que recebe gratificação não inferior a 1/3 do salário do cargo efetivo, está inserido na exceção do § 2º do art. 224 da CLT, não fazendo jus ao pagamento das sétima e oitava horas como extras.","status":"cancelada","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 15/1985","data":"1985-12-09","observacao":"Redação original - Res. 15/1985, DJ 05, 06 e 09.12.1985"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-238","tribunal":"TST","tipo":"sumula","numero":238,"teor":"BANCÁRIO. SUBGERENTE.\n\nO bancário no exercício da função de subgerente, que recebe gratificação não inferior a 1/3 do salário do cargo efetivo, está inserido na exceção do § 2º do art. 224 da CLT, não fazendo jus ao pagamento das sétima e oitava horas como extras.","status":"cancelada","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"O bancário no exercício da função de subgerente, que recebe gratificação não inferior a 1/3 (um terço) do salário do cargo efetivo, está inserido na exceção do § 2º do artigo 224 da Consolidação das Leis do Trabalho, não fazendo jus ao pagamento da sétima e oitava horas como extras."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-239","tribunal":"TST","tipo":"sumula","numero":239,"teor":"BANCÁRIO. EMPREGADO DE EMPRESA DE PROCESSAMENTO DE DADOS.\n\nÉ bancário o empregado de empresa de processamento de dados que presta serviço a banco integrante do mesmo grupo econômico, exceto quando a empresa de processamento de dados presta serviços a banco e a empresas não bancárias do mesmo grupo econômico ou a terceiros. (primeira parte - ex-Súmula nº 239 - Res. 15/1985, DJ 09.12.1985; segunda parte - ex-OJs nºs 64 e 126 da SBDI-1 - inseridas, respectivamente, em 13.09.1994 e 20.04.1998)","status":"em_vigor","temas":["Terceirização e responsabilidade"],"historico":[{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"(incorporadas as Orientações Jurisprudenciais nºs 64 e 126 da SBDI-1) - Res. 129/2005, DJ 20, 22 e 25.04.2005"},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 15/1985","data":"1985-12-09","observacao":"Redação original - Res. 15/1985, DJ 05, 06 e 09.12.1985"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 239 Bancário. Empregado de empresa de processamento de dados\nÉ bancário o empregado de empresa de processamento de dados que presta serviço a banco integrante do mesmo grupo econômico."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-240","tribunal":"TST","tipo":"sumula","numero":240,"teor":"BANCÁRIO. GRATIFICAÇÃO DE FUNÇÃO E ADICIONAL POR TEMPO DE SERVIÇO.\n\nO adicional por tempo de serviço integra o cálculo da gratificação prevista no art. 224, § 2º, da CLT.","status":"em_vigor","temas":["Salário e remuneração","Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 15/1985","data":"1985-12-09","observacao":"Redação original - Res. 15/1985, DJ 05, 06 e 09.12.1985"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-241","tribunal":"TST","tipo":"sumula","numero":241,"teor":"SALÁRIO-UTILIDADE. ALIMENTAÇÃO.\n\nO vale para refeição, fornecido por força do contrato de trabalho, tem caráter salarial, integrando a remuneração do empregado, para todos os efeitos legais.","status":"em_vigor","temas":["Salário e remuneração","Contrato e vínculo de emprego"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 15/1985","data":"1985-12-09","observacao":"Redação original - Res. 15/1985, DJ 05, 06 e 09.12.1985"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-242","tribunal":"TST","tipo":"sumula","numero":242,"teor":"INDENIZAÇÃO ADICIONAL. VALOR.\n\nA indenização adicional, prevista no art. 9º da Lei nº 6.708, de 30.10.1979 e no art. 9º da Lei nº 7.238, de 28.10.1984, corresponde ao salário mensal, no valor devido na data da comunicação do despedimento, integrado pelos adicionais legais ou convencionados, ligados à unidade de tempo mês, não sendo computável a gratificação natalina.","status":"em_vigor","temas":["Férias, 13º e descansos","Salário e remuneração","Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 15/1985","data":"1985-12-09","observacao":"Redação original - Res. 15/1985, DJ 05, 06 e 09.12.1985"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 242 Indenização adicional - Valor.\nA indenização adicional, prevista no artigo 9º das Leis 6708/79 e 7238/84, corresponde ao salário mensal, no valor devido à data da comunicação do despedimento, integrado pelos adicionais legais ou convencionados, ligados à unidade de tempo mês, não sendo computável a gratificação natalina."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-243","tribunal":"TST","tipo":"sumula","numero":243,"teor":"OPÇÃO PELO REGIME TRABALHISTA. SUPRESSÃO DAS VANTAGENS ESTATUTÁRIAS.\n\nExceto na hipótese de previsão contratual ou legal expressa, a opção do funcionário público pelo regime trabalhista implica a renúncia dos direitos inerentes ao regime estatutário.","status":"em_vigor","temas":["Contrato e vínculo de emprego","Ente público como empregador"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 15/1985","data":"1985-12-09","observacao":"Redação original - Res. 15/1985, DJ 05, 06 e 09.12.1985"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 243 Opção pelo regime trabalhista - Supressão das vantagens estatutárias.\nExceto na hipótese de previsão contratual ou legal expressa, a opção do funcionário público pelo regime trabalhista implica na renúncia dos direitos inerentes ao sistema estatutário."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-244","tribunal":"TST","tipo":"sumula","numero":244,"teor":"GESTANTE. ESTABILIDADE PROVISÓRIA.\n\nI - O desconhecimento do estado gravídico pelo empregador não afasta o direito ao pagamento da indenização decorrente da estabilidade (art. 10, II, \"b\" do ADCT).\nII - A garantia de emprego à gestante só autoriza a reintegração se esta se der durante o período de estabilidade. Do contrário, a garantia restringe-se aos salários e demais direitos correspondentes ao período de estabilidade.\nIII - A empregada gestante tem direito à estabilidade provisória prevista no art. 10, inciso II, alínea \"b\", do Ato das Disposições Constitucionais Transitórias, mesmo na hipótese de admissão mediante contrato por tempo determinado.","status":"em_vigor","temas":["Salário e remuneração","Estabilidade e garantias de emprego","Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 185/2012","data":"2012-09-27","observacao":"(redação do item III alterada na sessão do Tribunal Pleno realizada em 14.09.2012) - Res. 185/2012, DEJT divulgado em 25, 26 e 27.09.2012"},{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"Súmula alterada - (incorporadas as Orientações Jurisprudenciais nºs 88 e 196 da SBDI-1) - Res. 129/2005, DJ 20, 22 e 25.04.2005"},{"evento":"Nova redação","ato":null,"data":"2000-11-08","observacao":"Item III - Não há direito da empregada gestante à estabilidade provisória na hipótese de admissão mediante contrato de experiência, visto que a extinção da relação de emprego, em face do término do prazo, não constitui dispensa arbitrária ou sem justa causa. (ex-OJ nº 196 da SBDI-1 - inserida em 08.11.2000)"},{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula alterada - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 244 Gestante. Garantia de emprego\nA garantia de emprego à gestante só autoriza a reintegração se esta se der durante o período de estabilidade. Do contrário, a garantia restringe-se aos salários e demais direitos correspondentes ao período de estabilidade."},{"evento":"Redação original","ato":"Res. 15/1985","data":"1985-12-09","observacao":"Redação original - Res. 15/1985, DJ 05, 06 e 09.12.1985"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 244 Gestante - Garantia de emprego\nA garantia de emprego à gestante não autoriza a reintegração, assegurando-lhe apenas o direito a salários e vantagens correspondentes ao período e seus reflexos."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-245","tribunal":"TST","tipo":"sumula","numero":245,"teor":"DEPÓSITO RECURSAL. PRAZO.\n\nO depósito recursal deve ser feito e comprovado no prazo alusivo ao recurso. A interposição antecipada deste não prejudica a dilação legal.","status":"em_vigor","temas":["Estabilidade e garantias de emprego","Honorários, custas e justiça gratuita","Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 15/1985","data":"1985-12-09","observacao":"Redação original - Res. 15/1985, DJ 05, 06 e 09.12.1985"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 245 Depósito recursal. Prazo\nO depósito recursal deve ser feito e comprovado no prazo alusivo ao recurso, sendo que a interposição antecipada deste não prejudica a dilação legal."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-246","tribunal":"TST","tipo":"sumula","numero":246,"teor":"AÇÃO DE CUMPRIMENTO. TRÂNSITO EM JULGADO DA SENTENÇA NORMATIVA.\n\nÉ dispensável o trânsito em julgado da sentença normativa para a propositura da ação de cumprimento.","status":"em_vigor","temas":["Direito coletivo e sindical"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003). - Entendimento reafirmado no IRR nº 219.\nIRR-219 AÇÃO DE CUMPRIMENTO. TRÂNSITO EM JULGADO DA SENTENÇA NORMATIVA. (RR-0000097-89.2024.5.07.0017, Tribunal Pleno, publicado em 02.09.2025, rel. Min. Aloysio Silva Corrêa da Veiga)\nÉ dispensável o trânsito em julgado da sentença normativa para a propositura da ação de cumprimento."},{"evento":"Redação original","ato":"Res. 15/1985","data":"1985-12-09","observacao":"Redação original - Res. 15/1985, DJ 05, 06 e 09.12.1985"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 246 Ação de cumprimento - Trânsito em julgado da sentença normativa.\nÉ dispensável o trânsito em julgado da sentença normativa para propositura da ação de cumprimento."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-247","tribunal":"TST","tipo":"sumula","numero":247,"teor":"QUEBRA DE CAIXA. NATUREZA JURÍDICA.\n\nA parcela paga aos bancários sob a denominação \"quebra de caixa\" possui natureza salarial, integrando o salário do prestador de serviços, para todos os efeitos legais.","status":"em_vigor","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 16/1985","data":"1986-01-15","observacao":"Redação original - Res. 16/1985, DJ 13, 14 e 15.01.1986"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 247 Quebra-de-caixa - Natureza jurídica.\nA parcela paga aos bancários sob a denominação Quebra-de-Caixa possui natureza salarial, integrando o salário do prestador dos serviços, para todos os efeitos legais."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-248","tribunal":"TST","tipo":"sumula","numero":248,"teor":"ADICIONAL DE INSALUBRIDADE. DIREITO ADQUIRIDO.\n\nA reclassificação ou a descaracterização da insalubridade, por ato da autoridade competente, repercute na satisfação do respectivo adicional, sem ofensa a direito adquirido ou ao princípio da irredutibilidade salarial.","status":"em_vigor","temas":["Adicionais (insalubridade, periculosidade e outros)"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 17/1985","data":"1986-01-15","observacao":"Redação original - Res. 17/1985, DJ 13, 14 e 15.01.1986"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 248 Adicional de Insalubridade - Direito adquirido.\nA reclassificação ou descaracterização da insalubridade, por ato da autoridade competente, repercute na satisfação do respectivo adicional, sem ofensa a direito adquirido ou ao princípio da irredutibilidade salarial."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-249","tribunal":"TST","tipo":"sumula","numero":249,"teor":"AUMENTO SALARIAL SETORIZADO. TABELA ÚNICA.\n\nLegítima é a concessão de aumento salarial por região do país, desfazendo identidade anterior, baseada em tabela única de âmbito nacional.","status":"cancelada","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 17/1985","data":"1986-01-15","observacao":"Redação original - Res. 17/1985, DJ 13, 14 e 15.01.1986"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-250","tribunal":"TST","tipo":"sumula","numero":250,"teor":"PLANO DE CLASSIFICAÇÃO. PARCELAS ANTIGÜIDADE E DESEMPENHO. AGLUTINAÇÃO AO SALÁRIO.\n\nLícita é a incorporação ao salário-base das parcelas pagas a título de antigüidade e desempenho, quando não há prejuízo para o empregado.","status":"cancelada","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 17/1985","data":"1986-01-15","observacao":"Redação original - Res. 17/1985, DJ 13, 14 e 15.01.1986"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-251","tribunal":"TST","tipo":"sumula","numero":251,"teor":"PARTICIPAÇÃO NOS LUCROS. NATUREZA SALARIAL.\n\nA parcela participação nos lucros da empresa, habitualmente paga, tem natureza salarial, para todos os efeitos legais.","status":"cancelada","temas":["Estabilidade e garantias de emprego"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelamento mantido) - Referência art. 7º, XI, CF/1988 - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Cancelamento","ato":"Res. 33/1994","data":"1994-05-19","observacao":"Súmula cancelada - Res. 33/1994, DJ 12, 17 e 19.05.1994"},{"evento":"Redação original","ato":"Res. 17/1985","data":"1986-01-15","observacao":"Redação original - Res. 17/1985, DJ 13, 14 e 15.01.1986"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-252","tribunal":"TST","tipo":"sumula","numero":252,"teor":"FUNCIONÁRIO PÚBLICO. CEDIDO. REAJUSTE SALARIAL.\n\nOs funcionários públicos cedidos à Rede Ferroviária Federal S.A. têm direito ao reajustamento salarial previsto no art. 5º da Lei nº 4.345/1964, compensável com o deferido pelo art. 1º da Lei nº 4.564/1964 e observados os padrões de vencimentos, à época dos cargos idênticos ou assemelhados do serviço público, a teor do disposto no art. 20, item I, da Lei nº 4.345/1964 e nos termos dos acórdãos proferidos no DC 2/1966. O paradigma previsto neste último dispositivo legal será determinado através de perícia, se as partes não o indicarem de comum acordo.","status":"cancelada","temas":["Salário e remuneração","Provas e ônus da prova"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Nova redação","ato":"Res. 107/2001","data":"2001-03-21","observacao":"Súmula alterada (revisão da Súmula nº 116) - Res. 107/2001, DJ 21.03.2001 - Republicada DJ 26, 27 e 28.03.2001"},{"evento":"Redação original","ato":"Res. 18/1985","data":"1986-01-15","observacao":"Redação original - Res. 18/1985, DJ 13, 14 e 15.01.1986"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 252 Os funcionários públicos cedidos à Rede Ferroviária Federal S/A têm direito ao reajustamento salarial previsto no artigo 5º da Lei nº 4.345/1964, compensável com o deferido pelo artigo 1º, da Lei nº 4.564/1964 e observados os padrões de vencimentos, à época, dos cargos idênticos ou assemelhados do serviço público, a teor do disposto no artigo 20, item 1, da Lei nº 4.345/1964 e nos termos dos acórdãos proferidos no DC 2/1966. (Altera a Súmula nº 116)."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-253","tribunal":"TST","tipo":"sumula","numero":253,"teor":"GRATIFICAÇÃO SEMESTRAL. REPERCUSSÕES.\n\nA gratificação semestral não repercute no cálculo das horas extras, das férias e do aviso prévio, ainda que indenizados. Repercute, contudo, pelo seu duodécimo na indenização por antigüidade e na gratificação natalina.","status":"em_vigor","temas":["Jornada e horas extras","Férias, 13º e descansos","Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(nova redação) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 1/1986","data":"1986-05-28","observacao":"Redação original - Res. 1/1986, DJ 23, 27 e 28.05.1986"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 253 Gratificação semestral. Repercussão nas férias, aviso prévio e horas extras\nA gratificação semestral não repercute nos cálculos das horas extras, das férias e do aviso prévio, ainda que indenizados."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-254","tribunal":"TST","tipo":"sumula","numero":254,"teor":"SALÁRIO-FAMÍLIA. TERMO INICIAL DA OBRIGAÇÃO.\n\nO termo inicial do direito ao salário-família coincide com a prova da filiação. Se feita em juízo, corresponde à data de ajuizamento do pedido, salvo se comprovado que anteriormente o empregador se recusara a receber a respectiva certidão.","status":"em_vigor","temas":["Salário e remuneração","Provas e ônus da prova"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003). - Entendimento reafirmado no IRR nº 259.\nIRR-259 SALÁRIO-FAMÍLIA. TERMO INICIAL DA OBRIGAÇÃO. (RR-0020233-77.2022.5.04.0012, Tribunal Pleno, publicado em 02.09.2025, rel. Min. Aloysio Silva Corrêa da Veiga)\nO termo inicial do direito ao salário-família coincide com a prova da filiação. Se feita em juízo, corresponde à data de ajuizamento do pedido, salvo se comprovado que anteriormente o empregador se recusara a receber a respectiva certidão."},{"evento":"Redação original","ato":"Res. 2/1986","data":"1986-07-04","observacao":"Redação original - Res. 2/1986, DJ 02, 03 e 04.07.1986"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 254 Salário-família. Termo inicial da obrigação\nO termo inicial do direito ao salário-família coincide com a prova da filiação. Se feita em juízo, corresponde à data de ajuizamento do pedido, salvo se comprovado que anteriormente o empregador se recusara a receber a certidão respectiva."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-255","tribunal":"TST","tipo":"sumula","numero":255,"teor":"SUBSTITUIÇÃO PROCESSUAL. DESISTÊNCIA.\n\nO substituído processualmente pode, antes da sentença de primeiro grau, desistir da ação.","status":"cancelada","temas":["Direito coletivo e sindical"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 3/1986","data":"1986-07-04","observacao":"Redação original (revisão da Súmula nº 180) - Res. 3/1986, DJ 02, 03 e 04.07.1986"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-256","tribunal":"TST","tipo":"sumula","numero":256,"teor":"CONTRATO DE PRESTAÇÃO DE SERVIÇOS. LEGALIDADE.\n\nSalvo os casos de trabalho temporário e de serviço de vigilância, previstos nas Leis nºs 6.019, de 03.01.1974, e 7.102, de 20.06.1983, é ilegal a contratação de trabalhadores por empresa interposta, formando-se o vínculo empregatício diretamente com o tomador dos serviços.","status":"cancelada","temas":["Terceirização e responsabilidade","Contrato e vínculo de emprego"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Revista pela Súmula nº 331 - Res. 23/1993, DJ 21.12.1993 e 04.01.1994"},{"evento":"Redação original","ato":"Res. 4/1986","data":"1986-09-30","observacao":"Redação original - Res. 4/1986, DJ 30.09.1986, 01 e 02.10.1986"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-257","tribunal":"TST","tipo":"sumula","numero":257,"teor":"VIGILANTE.\n\nO vigilante, contratado diretamente por banco ou por intermédio de empresas especializadas, não é bancário.","status":"em_vigor","temas":["Contrato e vínculo de emprego"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 5/1986","data":"1986-10-31","observacao":"Redação original - Res. 5/1986, DJ 31.10.1986, 03 e 04.11.1986"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-258","tribunal":"TST","tipo":"sumula","numero":258,"teor":"SALÁRIO-UTILIDADE. PERCENTUAIS.\n\nOs percentuais fixados em lei relativos ao salário \"in natura\" apenas se referem às hipóteses em que o empregado percebe salário mínimo, apurando-se, nas demais, o real valor da utilidade.","status":"em_vigor","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(nova redação) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 6/1986","data":"1986-10-31","observacao":"Redação original - Res. 6/1986, DJ 31.10.1986, 03 e 04.11.1986"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 258 Salário - utilidade - Percentuais.\nOs percentuais fixados em lei relativos ao salário in natura apenas pertinem às hipóteses em que o empregado percebe salário-mínimo, apurando-se, nas demais, o real valor da utilidade."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-259","tribunal":"TST","tipo":"sumula","numero":259,"teor":"TERMO DE CONCILIAÇÃO. AÇÃO RESCISÓRIA.\n\nSó por ação rescisória é impugnável o termo de conciliação previsto no parágrafo único do art. 831 da CLT.","status":"em_vigor","temas":["Rescisão e verbas rescisórias"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 7/1986","data":"1986-10-31","observacao":"Redação original - Res. 7/1986, DJ 31.10.1986, 03 e 04.11.1986"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 259 Termo de Conciliação - Ação rescisória.\nSó por ação rescisória é atacável o termo de conciliação previsto no parágrafo único do art. 831 da Consolidação das Leis do Trabalho."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-260","tribunal":"TST","tipo":"sumula","numero":260,"teor":"SALÁRIO-MATERNIDADE. CONTRATO DE EXPERIÊNCIA.\n\nNo contrato de experiência, extinto antes do período de 4 (quatro) semanas que precede ao parto, a empregada não tem direito a receber, do empregador, o salário-maternidade.","status":"cancelada","temas":["Salário e remuneração","Contrato e vínculo de emprego"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 8/1986","data":"1986-10-31","observacao":"Redação original - Res. 8/1986, DJ 31.10.1986, 03 e 04.11.1986 - Republicada com correção DJ 06, 07 e 10.11.1986"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-261","tribunal":"TST","tipo":"sumula","numero":261,"teor":"FÉRIAS PROPORCIONAIS. PEDIDO DE DEMISSÃO. CONTRATO VIGENTE HÁ MENOS DE UM ANO.\n\nO empregado que se demite antes de complementar 12 (doze) meses de serviço tem direito a férias proporcionais.","status":"em_vigor","temas":["Férias, 13º e descansos","Rescisão e verbas rescisórias"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(nova redação - Res. 121/2003, DJ 19, 20 e 21.11.2003). - Entendimento reafirmado no IRR nº 236.\nIRR-236 FÉRIAS PROPORCIONAIS. PEDIDO DE DEMISSÃO. (RR-0001221-90.2024.5.13.0001, Tribunal Pleno, publicado em 02.09.2025, rel. Min. Aloysio Silva Corrêa da Veiga)\nO empregado que se demite antes de complementar 12 (doze) meses de serviço tem direito a férias proporcionais."},{"evento":"Redação original","ato":"Res. 9/1986","data":"1986-10-31","observacao":"Redação original - Res. 9/1986, DJ 31.10.1986, 03 e 04.11.1986 - Republicada com correção DJ 06, 07 e 10.11.1986"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 261 Férias proporcionais - Pedido de demissão - Contrato vigente há menos ano.\nO empregado que, espontaneamente, pede demissão, antes de completar doze meses de serviço, não tem direito a férias proporcionais."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-262","tribunal":"TST","tipo":"sumula","numero":262,"teor":"PRAZO JUDICIAL. NOTIFICAÇÃO OU INTIMAÇÃO EM SÁBADO. RECESSO FORENSE.\n\nI - Intimada ou notificada a parte no sábado, o início do prazo se dará no primeiro dia útil imediato e a contagem, no subseqüente. (ex-Súmula nº 262 - Res. 10/1986, DJ 31.10.1986)\nII - O recesso forense e as férias coletivas dos Ministros do Tribunal Superior do Trabalho suspendem os prazos recursais. (ex-OJ nº 209 da SBDI-1 - inserida em 08.11.2000)","status":"em_vigor","temas":["Férias, 13º e descansos"],"historico":[{"evento":"Nova redação","ato":"Res. 194/2014","data":"2014-05-23","observacao":"(redação do item II alterada na sessão do Tribunal Pleno realizada em 19.05.2014) - Res. 194/2014, DEJT divulgado em 21, 22 e 23.05.2014"},{"evento":"Redação original","ato":"Res. 129/2005","data":"2005-04-25","observacao":"Redação original - Res. 129/2005, DJ 20, 22 e 25.04.2005"},{"evento":"Nova redação","ato":null,"data":"2000-11-08","observacao":"Item II - O recesso forense e as férias coletivas dos Ministros do Tribunal Superior do Tra-balho (art. 177, § 1º, do RITST) suspendem os prazos recursais. (ex-OJ nº 209 da SBDI-1 - inserida em 08.11.2000)"},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 10/1986","data":"1986-10-31","observacao":"Redação original - Res. 10/1986, DJ 31.10.1986"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 262 Prazo judicial. Notificação ou intimação em sábado\nIntimada ou notificada a parte no sábado, o início do prazo dar-se-á no primeiro dia útil imediato e a contagem, no subseqüente."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-263","tribunal":"TST","tipo":"sumula","numero":263,"teor":"PETIÇÃO INICIAL. INDEFERIMENTO. INSTRUÇÃO OBRIGATÓRIA DEFICIENTE.\n\nSalvo nas hipóteses do art. 330 do CPC de 2015 (art. 295 do CPC de 1973), o indeferimento da petição inicial, por encontrar-se desacompanhada de documento indispensável à propositura da ação ou não preencher outro requisito legal, somente é cabível se, após intimada para suprir a irregularidade em 15 (quinze) dias, mediante indicação precisa do que deve ser corrigido ou completado, a parte não o fizer (art. 321 do CPC de 2015).","status":"em_vigor","temas":["Outros"],"historico":[{"evento":"Nova redação","ato":"Res. 208/2016","data":"2016-04-26","observacao":"(nova redação em decorrência do CPC de 2015) - Res. 208/2016, DEJT divulgado em 22, 25 e 26.04.2016"},{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula alterada - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 263. Petição inicial. Indeferimento. Instrução obrigatória deficiente (nova redação)\nSalvo nas hipóteses do art. 295 do CPC, o indeferimento da petição inicial, por encontrar-se desacompanhada de documento indispensável à propositura da ação ou não preencher outro requisito legal, somente é cabível se, após intimada para suprir a irregularidade em 10 (dez) dias, a parte não o fizer."},{"evento":"Redação original","ato":"Res. 11/1986","data":"1986-10-31","observacao":"Redação original - Res. 11/1986, DJ 31.10.1986, 03 e 04.11.1986"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 263 Petição inicial - Indeferimento - Instrução obrigatória deficiente.\nO indeferimento da petição inicial, por encontrar-se desacompanhada de documento indispensável à propositura da ação ou não preencher outro requisito legal, somente é cabível se, após intimada para suprir a irregularidade em dez dias, a parte não o fizer."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-264","tribunal":"TST","tipo":"sumula","numero":264,"teor":"HORA SUPLEMENTAR. CÁLCULO.\n\nA remuneração do serviço suplementar é composta do valor da hora normal, integrado por parcelas de natureza salarial e acrescido do adicional previsto em lei, contrato, acordo, convenção coletiva ou sentença normativa.","status":"em_vigor","temas":["Salário e remuneração","Direito coletivo e sindical"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003). - Entendimento reafirmado no IRR nº 280.\nIRR-280 HORAS EXTRAORDINÁRIAS. BASE DE CÁLCULO. (RR-0000254-24.2023.5.09.0411, Tribunal Pleno, publicado em 25.08.2025, rel. Min. Aloysio Silva Corrêa da Veiga)\nA remuneração das horas extraordinárias é composta do valor da hora normal, integrado por parcelas de natureza salarial e acrescido do adicional previsto em lei, contrato, acordo, convenção coletiva ou sentença normativa."},{"evento":"Redação original","ato":"Res. 12/1986","data":"1986-10-31","observacao":"Redação original - Res. 12/1986, DJ 31.10.1986, 03 e 04.11.1986"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-265","tribunal":"TST","tipo":"sumula","numero":265,"teor":"ADICIONAL NOTURNO. ALTERAÇÃO DE TURNO DE TRABALHO. POSSIBILIDADE DE SUPRESSÃO.\n\nA transferência para o período diurno de trabalho implica a perda do direito ao adicional noturno.","status":"em_vigor","temas":["Adicionais (insalubridade, periculosidade e outros)","Contrato e vínculo de emprego"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003). - Entendimento reafirmado no IRR nº 243.\nIRR-243 ADICIONAL NOTURNO. ALTERAÇÃO DE TURNO DE TRABALHO. POSSIBILIDADE DE SUPRESSÃO. (RR-0010348-50.2023.5.03.0006, Tribunal Pleno, publicado em 02.09.2025, rel. Min. Aloysio Silva Corrêa da Veiga)\nA transferência para o período diurno de trabalho implica a perda do direito ao adicional noturno."},{"evento":"Redação original","ato":"Res. 13/1986","data":"1987-01-20","observacao":"Redação original - Res. 13/1986, DJ 20.01.1987, 22, 23 e 26.01.1987"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 265 Adicional noturno - Alteração de turno de trabalho - Possibilidade de supressão.\nA transferência para o período diurno de trabalho implica na perda do direito ao adicional noturno."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-266","tribunal":"TST","tipo":"sumula","numero":266,"teor":"RECURSO DE REVISTA. ADMISSIBILIDADE. EXECUÇÃO DE SENTENÇA.\n\nA admissibilidade do recurso de revista interposto de acórdão proferido em agravo de petição, na liquidação de sentença ou em processo incidente na execução, inclusive os embargos de terceiro, depende de demonstração inequívoca de violência direta à Constituição Federal.","status":"em_vigor","temas":["Execução e penhora","Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 1/1987","data":"1987-10-23","observacao":"Redação original (revisão da Súmula nº 210) - Res. 1/1987, DJ 23.10.1987 e DJ 10, 11 e 14.12.1987"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 266 A admissibilidade do recurso de revista contra acórdão proferido em agravo de petição, na liquidação de sentença ou em processo incidente na execução, inclusive os embargos de terceiro, depende de demonstração inequívoca de violência direta à Constituição Federal."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-267","tribunal":"TST","tipo":"sumula","numero":267,"teor":"BANCÁRIO. VALOR DO SALÁRIO-HORA. DIVISOR.\n\nO bancário sujeito à jornada de 8 (oito) horas (art. 224, § 2º, da CLT) tem salário-hora calculado com base no divisor 240 (duzentos e quarenta) e não 180 (cento e oitenta), que é relativo à jornada de 6 (seis) horas.","status":"cancelada","temas":["Jornada e horas extras","Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Revista pela Súmula nº 343 - Res. 48/1995, DJ 30 e 31.08.1995 e 01.09.1995"},{"evento":"Redação original","ato":"Res. 2/1987","data":"1987-12-14","observacao":"Redação original - Res. 2/1987, DJ 10, 11 e 14.12.1987"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-268","tribunal":"TST","tipo":"sumula","numero":268,"teor":"PRESCRIÇÃO. INTERRUPÇÃO. AÇÃO TRABALHISTA ARQUIVADA.\n\nA ação trabalhista, ainda que arquivada, interrompe a prescrição somente em relação aos pedidos idênticos.","status":"cancelada","temas":["Prescrição e decadência"],"historico":[{"evento":"Cancelamento","ato":"Res. 225/2025","data":"2025-07-02","observacao":"Cancelada por perda de eficácia a partir de 11.11.2017, pela Lei 13.467/2017. Res. 225/2025 - DEJT divulgado em 30.06, 01 e 02.07.2025"},{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Nova redação - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 1/1988","data":"1988-03-03","observacao":"Redação original - Res. 1/1988, DJ 01, 02 e 03.03.1988"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 268 Prescrição. Interrupção. Demanda trabalhista arquivada\nA demanda trabalhista, ainda que arquivada, interrompe a prescrição."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-269","tribunal":"TST","tipo":"sumula","numero":269,"teor":"DIRETOR ELEITO. CÔMPUTO DO PERÍODO COMO TEMPO DE SERVIÇO.\n\nO empregado eleito para ocupar cargo de diretor tem o respectivo contrato de trabalho suspenso, não se computando o tempo de serviço desse período, salvo se permanecer a subordinação jurídica inerente à relação de emprego.","status":"em_vigor","temas":["Contrato e vínculo de emprego"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 2/1988","data":"1988-03-03","observacao":"Redação original - Res. 2/1988, DJ 01, 02 e 03.03.1988"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 269 Diretor eleito - Cômputo do período como tempo de serviço."},{"evento":"Suspensão","ato":null,"data":null,"observacao":"O empregado eleito para ocupar cargo de diretor tem o respectivo contrato de trabalho suspenso, não se computando o tempo de serviço deste período, salvo se permanecer a subordinação jurídica inerente à relação de emprego."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-270","tribunal":"TST","tipo":"sumula","numero":270,"teor":"REPRESENTAÇÃO PROCESSUAL. MANDATO EXPRESSO. AUSÊNCIA DE FIRMA RECONHECIDA.\n\nA ausência de reconhecimento de firma no instrumento de mandato - procuração - torna irregular a representação processual, impossibilitando o conhecimento do recurso, por inexistente.","status":"cancelada","temas":["Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelamento mantido) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Cancelamento","ato":"Res. 49/1995","data":"1995-08-31","observacao":"Súmula cancelada - Res. 49/1995, DJ 30 e 31.08.1995 e 01.09.1995"},{"evento":"Redação original","ato":"Res. 3/1988","data":"1988-03-03","observacao":"Redação original - Res. 3/1988, DJ 01, 02 e 03.03.1988"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-271","tribunal":"TST","tipo":"sumula","numero":271,"teor":"SUBSTITUIÇÃO PROCESSUAL. ADICIONAIS DE INSALUBRIDADE E DE PERICULOSIDADE.\n\nLegítima é a substituição processual dos empregados associados, pelo sindicato que congrega a categoria profissional, na demanda trabalhista cujo objeto seja adicional de insalubridade ou periculosidade.","status":"cancelada","temas":["Adicionais (insalubridade, periculosidade e outros)","Direito coletivo e sindical"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 4/1988","data":"1988-03-03","observacao":"Redação original - Res. 4/1988, DJ 01, 02 e 03.03.1988"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-272","tribunal":"TST","tipo":"sumula","numero":272,"teor":"AGRAVO DE INSTRUMENTO. TRASLADO DEFICIENTE.\n\nNão se conhece do agravo para subida de recurso de revista, quando faltarem no traslado o despacho agravado, a decisão recorrida, a petição de recurso de revista, a procuração subscrita pelo agravante, ou qualquer peça essencial à compreensão da controvérsia.","status":"cancelada","temas":["Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 5/1988","data":"1988-03-03","observacao":"Redação original - Res. 5/1988, DJ 01, 02 e 03.03.1988"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-273","tribunal":"TST","tipo":"sumula","numero":273,"teor":"CONSTITUCIONALIDADE. DECRETOS-LEIS NºS 2.012/1983 E 2.045/1983.\n\nSão constitucionais os Decretos-Leis nºs 2.012/1983 e 2.045/1983.","status":"cancelada","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 6/1988","data":"1988-03-03","observacao":"Redação original - Res. 6/1988, DJ 01, 02 e 03.03.1988"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-274","tribunal":"TST","tipo":"sumula","numero":274,"teor":"PRESCRIÇÃO PARCIAL. EQUIPARAÇÃO SALARIAL.\n\nNa ação de equiparação salarial, a prescrição só alcança as diferenças salariais vencidas no período de 5 (cinco) anos que precedeu o ajuizamento.","status":"convertida","temas":["Salário e remuneração","Prescrição e decadência"],"historico":[{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"(cancelada em decorrência da sua incorporação à nova redação da Súmula nº 6) - Res. 129/2005, DJ 20, 22 e 25.04.2005"},{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula alterada - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 7/1988","data":"1988-03-03","observacao":"Redação original - Res. 7/1988, DJ 01, 02 e 03.03.1988"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 274 Prescrição parcial - Equiparação salarial.\nNa demanda de equiparação salarial a prescrição só alcança as diferenças salariais vencidas no período anterior aos dois anos que precederam o ajuizamento."}],"observacao":"Cancelada em decorrência da sua incorporação à nova redação da Súmula nº 6 do TST.","alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-275","tribunal":"TST","tipo":"sumula","numero":275,"teor":"PRESCRIÇÃO. DESVIO DE FUNÇÃO E REENQUADRAMENTO.\n\nI - Na ação que objetive corrigir desvio funcional, a prescrição só alcança as diferenças salariais vencidas no período de 5 (cinco) anos que precedeu o ajuizamento. (ex-Súmula nº 275 - alterada pela Res. 121/2003, DJ 21.11.2003)\nII - Em se tratando de pedido de reenquadramento, a prescrição é total, contada da data do enquadramento do empregado. (ex-OJ nº 144 da SBDI-1 - inserida em 27.11.1998)","status":"em_vigor","temas":["Prescrição e decadência"],"historico":[{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"(incorporada a Orientação Jurisprudencial nº 144 da SBDI-1) - Res. 129/2005, DJ 20, 22 e 25.04.2005"},{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula alterada - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 275 Prescrição parcial. Desvio de função\nNa ação que objetive corrigir desvio funcional, a prescrição só alcança as diferenças salariais vencidas no período de 5 (cinco) anos que precedeu o ajuizamento."},{"evento":"Redação original","ato":"Res. 8/1988","data":"1988-03-03","observacao":"Redação original - Res. 8/1988, DJ 01, 02 e 03.03.1988"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 275 Na demanda que objetive corrigir desvio funcional, a prescrição só alcança as diferenças salariais vencidas no período anterior aos dois anos que precederam o ajuizamento."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-276","tribunal":"TST","tipo":"sumula","numero":276,"teor":"AVISO PRÉVIO. RENÚNCIA PELO EMPREGADO.\n\nO direito ao aviso prévio é irrenunciável pelo empregado. O pedido de dispensa de cumprimento não exime o empregador de pagar o respectivo valor, salvo comprovação de haver o prestador dos serviços obtido novo emprego.","status":"em_vigor
