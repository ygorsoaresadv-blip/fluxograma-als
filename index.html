o_em":"2026-09-21"},{"id":"tst-373","tribunal":"TST","tipo":"sumula","numero":373,"teor":"GRATIFICAÇÃO SEMESTRAL. CONGELAMENTO. PRESCRIÇÃO PARCIAL.\n\nTratando-se de pedido de diferença de gratificação semestral que teve seu valor congelado, a prescrição aplicável é a parcial. (ex-OJ nº 46 da SBDI-1 - inserida em 29.03.1996).","status":"em_vigor","temas":["Salário e remuneração","Prescrição e decadência"],"historico":[{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"(conversão da Orientação Jurisprudencial nº 46 da SBDI-1) - Res. 129/2005, DJ 20, 22 e 25.04.2005"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-374","tribunal":"TST","tipo":"sumula","numero":374,"teor":"NORMA COLETIVA. CATEGORIA DIFERENCIADA. ABRANGÊNCIA.\n\nEmpregado integrante de categoria profissional diferenciada não tem o direito de haver de seu empregador vantagens previstas em instrumento coletivo no qual a empresa não foi representada por órgão de classe de sua categoria. (ex-OJ nº 55 da SBDI-1 - inserida em 25.11.1996)","status":"em_vigor","temas":["Direito coletivo e sindical","Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"(conversão da Orientação Jurisprudencial nº 55 da SBDI-1 - Res. 129/2005, DJ 20, 22 e 25.04.2005). - Entendimento reafirmado no IRR nº 258.\nIRR-258 NORMA COLETIVA. CATEGORIA DIFERENCIADA. ABRANGÊNCIA. (RR- 0020184-87.2023.5.04.0016, Tribunal Pleno, publicado em 02.09.2025, rel. Min. Aloysio Silva Corrêa da Veiga)\nEmpregado integrante de categoria profissional diferenciada não tem o direito de haver de seu empregador vantagens previstas em instrumento coletivo no qual a empresa não foi representada por órgão de classe de sua categoria."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-375","tribunal":"TST","tipo":"sumula","numero":375,"teor":"REAJUSTES SALARIAIS PREVISTOS EM NORMA COLETIVA. PREVALÊNCIA DA LEGISLAÇÃO DE POLÍTICA SALARIAL.\n\nOs reajustes salariais previstos em norma coletiva de trabalho não prevalecem frente à legislação superveniente de política salarial. (ex-OJs nºs 69 da SBDI-1 - inserida em 14.03.1994 - e 40 da SBDI-2 - inserida em 20.09.2000).","status":"cancelada","temas":["Salário e remuneração"],"historico":[{"evento":"Cancelamento","ato":"Res. 225/2025","data":"2025-07-02","observacao":"Cancelada por perda de eficácia considerando a decisão do ARE 1.121.633, a partir da publicação da ata de julgamento em 14.06.2022. Res. 225/2025 - DEJT divulgado em 30.06, 01 e 02.07.2025"},{"evento":"Conversão","ato":"Res. 129/2005","data":"2005-04-25","observacao":"Conversão da Orientação Jurisprudencial nº 69 da SBDI-1 e da Orientação Jurisprudencial nº 40 da SBDI-2 - Res. 129/2005, DJ 20, 22 e 25.04.2005."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-376","tribunal":"TST","tipo":"sumula","numero":376,"teor":"HORAS EXTRAS. LIMITAÇÃO. ART. 59 DA CLT. REFLEXOS.\n\nI - A limitação legal da jornada suplementar a duas horas diárias não exime o empregador de pagar todas as horas trabalhadas. (ex-OJ nº 117 da SBDI-1 - inserida em 20.11.1997)\nII - O valor das horas extras habitualmente prestadas integra o cálculo dos haveres trabalhistas, independentemente da limitação prevista no \"caput\" do art. 59 da CLT. (ex-OJ nº 89 da SBDI-1 - inserida em 28.04.1997)","status":"em_vigor","temas":["Jornada e horas extras","Salário e remuneração","Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"(conversão das Orientações Jurisprudenciais nºs 89 e 117 da SBDI-1) - Res. 129/2005, http://www.tst.jus.br/web/guest/sumulas"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-377","tribunal":"TST","tipo":"sumula","numero":377,"teor":"PREPOSTO. EXIGÊNCIA DA CONDIÇÃO DE EMPREGADO.\n\nExceto quanto à reclamação de empregado doméstico, ou contra micro ou pequeno empresário, o preposto deve ser necessariamente empregado do reclamado. Inteligência do art. 843, § 1º, da CLT e do art. 54 da Lei Complementar nº 123, de 14 de dezembro de 2006.","status":"cancelada","temas":["Contrato e vínculo de emprego"],"historico":[{"evento":"Cancelamento","ato":"Res. 225/2025","data":"2025-07-02","observacao":"Cancelada por perda de eficácia a partir de 11.11.2017, pela Lei 13.467/2017. Res. 225/2025, DEJT divulgado em 30.06, 01 e 02.07.2025"},{"evento":"Nova redação","ato":"Res. 146/2008","data":"2008-04-28","observacao":"Nova redação - Res. 146/2008, DJ 28.04.2008, 02 e 05.05.2008"},{"evento":"Redação original","ato":"Res. 129/2005","data":"2005-04-25","observacao":"Redação Original (conversão da Orientação Jurisprudencial nº 99 da SBDI-1) - Res. 129/2005, DJ 20, 22 e 25.04.2005"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 377 Preposto. Exigência da condição de empregado.\nExceto quanto à reclamação de empregado doméstico, o preposto deve ser necessariamente empregado do reclamado. Inteligência do art. 843, § 1º, da CLT. (ex-OJ nº 99 - inserida em 30.05.1997)"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-378","tribunal":"TST","tipo":"sumula","numero":378,"teor":"ESTABILIDADE PROVISÓRIA. ACIDENTE DO TRABALHO. ART. 118 DA LEI Nº 8.213/1991.\n\nI - É constitucional o artigo 118 da Lei nº 8.213/1991 que assegura o direito à estabilidade provisória por período de 12 meses após a cessação do auxílio-doença ao empregado acidentado. (ex-OJ nº 105 da SBDI-1 - inserida em 01.10.1997)\nII - São pressupostos para a concessão da estabilidade o afastamento superior a 15 dias e a conseqüente percepção do auxílio-doença acidentário, salvo se constatada, após a despedida, doença profissional que guarde relação de causalidade com a execução do contrato de emprego. (primeira parte - ex-OJ nº 230 da SBDI-1 - inserida em 20.06.2001)\nIII - O empregado submetido a contrato de trabalho por tempo determinado goza da garantia provisória de emprego decorrente de acidente de trabalho prevista no n no art. 118 da Lei nº 8.213/91.","status":"em_vigor","temas":["Acidente e doença do trabalho","Estabilidade e garantias de emprego","Rescisão e verbas rescisórias"],"historico":[{"evento":"Nova redação","ato":"Res. 185/2012","data":"2012-09-27","observacao":"(inserido item III) - Res. 185/2012, DEJT divulgado em 25, 26 e 27.09.2012"},{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"Súmula alterada - (conversão das Orientações Jurisprudenciais nºs 105 e 230 da SBDI-1) - Res. 129/2005, DJ 20, 22 e 25.04.2005"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Estabilidade provisória. Acidente do trabalho. ART. 118 da Lei nº 8.213/1991. Constitucionalidade. Pressupostos."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-379","tribunal":"TST","tipo":"sumula","numero":379,"teor":"DIRIGENTE SINDICAL. DESPEDIDA. FALTA GRAVE. INQUÉRITO JUDICIAL. NECESSIDADE.\n\nO dirigente sindical somente poderá ser dispensado por falta grave mediante a apuração em inquérito judicial, inteligência dos arts. 494 e 543, §3º, da CLT. (ex-OJ nº 114 da SBDI-1 - inserida em 20.11.1997)","status":"em_vigor","temas":["Estabilidade e garantias de emprego","Rescisão e verbas rescisórias","Direito coletivo e sindical"],"historico":[{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"(conversão da Orientação Jurisprudencial nº 114 da SBDI-1 - Res. 129/2005, DJ 20, 22 e 25.04.2005). - Entendimento reafirmado no IRR nº 257.\nIRR-257 DIRIGENTE SINDICAL. DESPEDIDA. FALTA GRAVE. INQUÉRITO JUDICIAL. NECESSIDADE. (RR-0020182-22.2020.5.04.0211, Tribunal Pleno, publicado em 02.09.2025, rel. Min. Aloysio Silva Corrêa da Veiga)\nA resolução do contrato de trabalho em que o empregado seja dirigente sindical somente poderá operar-se por decisão proferida em inquérito judicial, conforme previsto nos artigos 494 e 543, paragrafo 3º, da CLT."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-380","tribunal":"TST","tipo":"sumula","numero":380,"teor":"AVISO PRÉVIO. INÍCIO DA CONTAGEM. ART. 132 DO CÓDIGO CIVIL DE 2002.\n\nAplica-se a regra prevista no \"caput\" do art. 132 do Código Civil de 2002 à contagem do prazo do aviso prévio, excluindo-se o dia do começo e incluindo o do vencimento. (ex-OJ nº 122 da SBDI-1 - inserida em 20.04.1998)","status":"em_vigor","temas":["Rescisão e verbas rescisórias","Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"(conversão da Orientação Jurisprudencial nº 122 da SBDI-1) - Res. 129/2005, DJ 20, 22 e 25.04.2005"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-381","tribunal":"TST","tipo":"sumula","numero":381,"teor":"CORREÇÃO MONETÁRIA. SALÁRIO. ART. 459 DA CLT.\n\nO pagamento dos salários até o 5º dia útil do mês subseqüente ao vencido não está sujeito à correção monetária. Se essa data limite for ultrapassada, incidirá o índice da correção monetária do mês subseqüente ao da prestação dos serviços, a partir do dia 1º. (ex-OJ nº 124 da SBDI-1 - inserida em 20.04.1998)","status":"em_vigor","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"(conversão da Orientação Jurisprudencial nº 124 da SBDI-1) - Res. 129/2005, DJ 20, 22 e 25.04.2005"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-382","tribunal":"TST","tipo":"sumula","numero":382,"teor":"MUDANÇA DE REGIME CELETISTA PARA ESTATUTÁRIO. EXTINÇÃO DO CONTRATO. PRESCRIÇÃO BIENAL.\n\nA transferência do regime jurídico de celetista para estatutário implica extinção do contrato de trabalho, fluindo o prazo da prescrição bienal a partir da mudança de regime. (ex-OJ nº 128 da SBDI-1 - inserida em 20.04.1998)","status":"em_vigor","temas":["Prescrição e decadência","Contrato e vínculo de emprego"],"historico":[{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"(conversão da Orientação Jurisprudencial nº 128 da SBDI-1 - Res. 129/2005, DJ 20, 22 e 25.04.2005). - Entendimento reafirmado no IRR nº 218.\nIRR-218 MUDANÇA DE REGIME CELETISTA PARA ESTATUTÁRIO. EXTINÇÃO DO CONTRATO. PRESCRIÇÃO BIENAL. (RR-0000034-30.2019.5.05.0491, Tribunal Pleno, publicado em 02.09.2025, rel. Min. Aloysio Silva Corrêa da Veiga)\nA transferência do regime jurídico de celetista para estatutário implica extinção do contrato de trabalho, fluindo o prazo da prescrição bienal a partir da mudança de regime."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-383","tribunal":"TST","tipo":"sumula","numero":383,"teor":"RECURSO. MANDATO. IRREGULARIDADE DE REPRESENTAÇÃO. CPC DE 2015, ARTS. 104 E 76, § 2º.\n\nI - É inadmissível recurso firmado por advogado sem procuração juntada aos autos até o momento da sua interposição, salvo mandato tácito. Em caráter excepcional (art. 104 do CPC de 2015), admite-se que o advogado, independentemente de intimação, exiba a procuração no prazo de 5 (cinco) dias após a interposição do recurso, prorrogável por igual período mediante despacho do juiz. Caso não a exiba, considera-se ineficaz o ato praticado e não se conhece do recurso.\nII - Verificada a irregularidade de representação da parte em fase recursal, em procuração ou substabelecimento já constante dos autos, o relator ou o órgão competente para julgamento do recurso designará prazo de 5 (cinco) dias para que seja sanado o vício. Descumprida a determinação, o relator não conhecerá do recurso, se a providência couber ao recorrente, ou determinará o desentranhamento das contrarrazões, se a providência couber ao recorrido (art. 76, § 2º, do CPC de 2015).","status":"em_vigor","temas":["Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 210/2016","data":"2016-07-04","observacao":"(nova redação em decorrência do CPC de 2015) - Res. 210/2016, DEJT divulgado em 30.06.2016 e 01 e 04.07.2016"},{"evento":"Redação original","ato":null,"data":null,"observacao":"Redação original - (conversão das Orientações Jurisprudenciais nºs 149 e 311 da SBDI-1)"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"- Res. 129/2005, DJ 20, 22 e 25.04.2005\nMandato. Arts. 13 e 37 do CPC. Fase recursal. Inaplicabilidade.\nI - É inadmissível, em instância recursal, o oferecimento tardio de procuração, nos termos do art. 37 do CPC, ainda que mediante protesto por posterior juntada, já que a interposição de recurso não pode ser reputada ato urgente. (ex-OJ nº 311 da SBDI-1 - DJ 11.08.2003)\nII - Inadmissível na fase recursal a regularização da representação processual, na forma do art. 13 do CPC, cuja aplicação se restringe ao Juízo de 1º grau. (ex-OJ nº 149 da SBDI-1 - inserida em 27.11.1998)"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-384","tribunal":"TST","tipo":"sumula","numero":384,"teor":"MULTA CONVENCIONAL. COBRANÇA.\n\nI - O descumprimento de qualquer cláusula constante de instrumentos normativos diversos não submete o empregado a ajuizar várias ações, pleiteando em cada uma o pagamento da multa referente ao descumprimento de obrigações previstas nas cláusulas respectivas. (ex-OJ nº 150 da SBDI-1 - inserida em 27.11.1998)\nII - É aplicável multa prevista em instrumento normativo (sentença normativa, convenção ou acordo coletivo) em caso de descumprimento de obrigação prevista em lei, mesmo que a norma coletiva seja mera repetição de texto legal. (ex-OJ nº 239 da SBDI-1 - inserida em 20.06.2001). - Entendimento do item II reafirmado no IRR nº 282.","status":"em_vigor","temas":["Direito coletivo e sindical","Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"(conversão das Orientações Jurisprudenciais nºs 150 e 239 da SBDI-1 - Res. 129/2005, DJ 20, 22 e 25.04.2005).\nIRR-282 MULTA CONVENCIONAL. DESCUMPRIMENTO DE OBRIGAÇÃO TAMBÉM PREVISTA EM LEI. (RR-0000341-87.2024.5.12.0046, Tribunal Pleno, publicado em 03.09.2025, rel. Min. Aloysio Silva Corrêa da Veiga)\nÉ aplicável multa prevista em instrumento normativo (sentença normativa, convenção ou acordo coletivo) em caso de descumprimento de obrigação prevista em lei, mesmo que a norma coletiva seja mera repetição de texto legal."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-385","tribunal":"TST","tipo":"sumula","numero":385,"teor":"FERIADO LOCAL OU FORENSE. AUSÊNCIA DE EXPEDIENTE. PRAZO RECURSAL. PRORROGAÇÃO. COMPROVAÇÃO. NECESSIDADE.\n\nI - Incumbe à parte o ônus de provar, quando da interposição do recurso, a existência de feriado local que autorize a prorrogação do prazo recursal (art. 1.003, § 6º, do CPC de 2015). No caso de o recorrente alegar a existência de feriado local e não o comprovar no momento da interposição do recurso, cumpre ao relator conceder o prazo de 5 (cinco) dias para que seja sanado o vício (art. 932, parágrafo único, do CPC de 2015), sob pena de não conhecimento se da comprovação depender a tempestividade recursal;\nII - Na hipótese de feriado forense, incumbirá à autoridade que proferir a decisão de admissibilidade certificar o expediente nos autos;\nIII - Admite-se a reconsideração da análise da tempestividade do recurso, mediante prova documental superveniente, em agravo de instrumento, agravo interno, agravo regimental, ou embargos de declaração, desde que, em momento anterior, não tenha havido a concessão de prazo para a comprovação da ausência de expediente forense.","status":"em_vigor","temas":["Férias, 13º e descansos","Recursos e prazos","Provas e ônus da prova"],"historico":[{"evento":"Nova redação","ato":"Res. 220/2017","data":"2017-09-25","observacao":"(alterada em decorrência do CPC de 2015) - Res. 220/2017, DEJT divulgado em 21, 22 e 25.09.2017"},{"evento":"Nova redação","ato":"Res. 185/2012","data":"2012-09-27","observacao":"Súmula alterada - Res. 185/2012 - DEJT divulgado em 25, 26 e 27.09.2012"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 385 Feriado local. Ausência de expediente forense. Prazo recursal. Prorrogação. Comprovação. Necessidade ato administrativo do juízo \"a quo\" (redação alterada na sessão do Tribunal Pleno realizada em 14.09.2012)\nI - Incumbe à parte o ônus de provar, quando da interposição do recurso, a existência de feriado local que autorize a prorrogação do prazo recursal.\nII - Na hipótese de feriado forense, incumbirá à autoridade que proferir a decisão de admissibilidade certificar o expediente nos autos.\nIII - Na hipótese do inciso II, admite-se a reconsideração da análise da tempestividade do recurso, mediante prova documental superveniente, em Agravo Regimental, Agravo de Instrumento ou Embargos de Declaração.Redação original - Res. 129/2005, DJ 20, 22 e 25.04.2005\nNº 385 Feriado local. Ausência de expediente forense. Prazo recursal. Prorrogação. Comprovação. Necessidade (conversão da Orientação Jurisprudencial nº 161 da SBDI-1)\nCabe à parte comprovar, quando da interposição do recurso, a existência de feriado local ou de dia útil em que não haja expediente forense, que justifique a prorrogação do prazo recursal. (ex-OJ nº 161 da SBDI-1 - inserida em 26.03.1999)"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-386","tribunal":"TST","tipo":"sumula","numero":386,"teor":"POLICIAL MILITAR. RECONHECIMENTO DE VÍNCULO EMPREGATÍCIO COM EMPRESA PRIVADA.\n\nPreenchidos os requisitos do art. 3º da CLT, é legítimo o reconhecimento de relação de emprego entre policial militar e empresa privada, independentemente do eventual cabimento de penalidade disciplinar prevista no Estatuto do Policial Militar. (ex-OJ nº 167 da SBDI-1 - inserida em 26.03.1999)","status":"em_vigor","temas":["Recursos e prazos","Contrato e vínculo de emprego"],"historico":[{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"(conversão da Orientação Jurisprudencial nº 167 da SBDI-1 - Res. 129/2005, DJ 20, 22 e 25.04.2005). - Entendimento reafirmado no IRR nº 270.\nIRR-270 POLICIAL MILITAR. RECONHECIMENTO DE VÍNCULO EMPREGATÍCIO COM EMPRESA PRIVADA. (RR-1001078-02.2023.5.02.0462, Tribunal Pleno, publicado em 02.09.2025, rel. Min. Aloysio Silva Corrêa da Veiga)\nPreenchidos os requisitos do art. 3º da CLT, é legítimo o reconhecimento de relação de emprego entre policial militar e empresa privada, independentemente do eventual cabimento de penalidade disciplinar prevista no Estatuto do Policial Militar."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-387","tribunal":"TST","tipo":"sumula","numero":387,"teor":"RECURSO. FAC-SÍMILE. LEI Nº 9.800/1999.\n\nI - A Lei nº 9.800, de 26.05.1999, é aplicável somente a recursos interpostos após o início de sua vigência. (ex-OJ nº 194 da SBDI-1 - inserida em 08.11.2000)\nII - A contagem do quinquídio para apresentação dos originais de recurso interposto por intermédio de fac-símile começa a fluir do dia subsequente ao término do prazo recursal, nos termos do art. 2º da Lei nº 9.800, de 26.05.1999, e não do dia seguinte à interposição do recurso, se esta se deu antes do termo final do prazo. (ex-OJ nº 337 da SBDI-1 - primeira parte - DJ 04.05.2004)\nIII - Não se tratando a juntada dos originais de ato que dependa de notificação, pois a parte, ao interpor o recurso, já tem ciência de seu ônus processual, não se aplica a regra do art. 224 do CPC de 2015 (art. 184 do CPC de 1973) quanto ao \"dies a quo\", podendo coincidir com sábado, domingo ou feriado. (ex-OJ nº 337 da SBDI-1 - \"in fine\" - DJ 04.05.2004)\nIV - A autorização para utilização do fac-símile, constante do art. 1º da Lei n.º 9.800, de 26.05.1999, somente alcança as hipóteses em que o documento é dirigido diretamente ao órgão jurisdicional, não se aplicando à transmissão ocorrida entre particulares.","status":"em_vigor","temas":["Férias, 13º e descansos","Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 208/2016","data":"2016-04-26","observacao":"(atualizada em decorrência do CPC de 2015) - Res. 208/2016, DEJT divulgado em 22, 25 e 26.04.2016"},{"evento":"Nova redação","ato":"Res. 174/2011","data":"2011-05-31","observacao":"Súmula alterada - Res. 174/2011, DEJT divulgado em 27, 30 e 31.05.2011"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 387. Recurso. Fac-símile. Lei nº 9.800/1999 (inserido o item IV à redação)\nI - A Lei nº 9.800, de 26.05.1999, é aplicável somente a recursos interpostos após o início de sua vigência. (ex-OJ nº 194 da SBDI-1 - inserida em 08.11.2000)\nII - A contagem do quinquidio para apresentação dos originais de recurso interposto por intermédio de fac-símile começa a fluir do dia subsequente ao término do prazo recursal, nos termos do art. 2º da Lei nº 9.800, de 26.05.1999, e não do dia seguinte à interposição do recurso, se esta se deu antes do termo final do prazo. (ex-OJ nº 337 da SBDI-1 - primeira parte - DJ 04.05.2004)\nIII - Não se tratando a juntada dos originais de ato que dependa de notificação, pois a parte, ao interpor o recurso, já tem ciência de seu ônus processual, não se aplica a regra do art. 184 do CPC quanto ao \"dies a quo\", podendo coincidir com sábado, domingo ou feriado. (ex-OJ nº 337 da SBDI-1 - \"in fine\" - DJ 04.05.2004)\nIV - A autorização para utilização do fac-símile, constante do art. 1º da Lei n.º 9.800, de 26.05.1999, somente alcança as hipóteses em que o documento é dirigido diretamente ao órgão jurisdicional, não se aplicando à transmissão ocorrida entre particulares."},{"evento":"Redação original","ato":"Res. 129/2005","data":"2005-04-25","observacao":"Redação original - Res. 129/2005, DJ 20, 22 e 25.04.2005"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 387 Recurso. Fac-símile. Lei nº 9.800/1999 (conversão das Orientações Jurisprudenciais nºs 194 e 337 da SBDI-1)\n(...)"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-388","tribunal":"TST","tipo":"sumula","numero":388,"teor":"MASSA FALIDA. ARTS. 467 E 477 DA CLT. INAPLICABILIDADE.\n\nA Massa Falida não se sujeita à penalidade do art. 467 e nem à multa do § 8º do art. 477, ambos da CLT. (ex-Ojs da SBDI-1 nºs 201 - DJ 11.08.2003 - e 314 - DJ 08.11.2000)","status":"em_vigor","temas":["Rescisão e verbas rescisórias"],"historico":[{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"(conversão das Orientações Jurisprudenciais nºs 201 e 314 da SBDI-1) - Res. 129/2005, DJ 20, 22 e 25.04.2005"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-389","tribunal":"TST","tipo":"sumula","numero":389,"teor":"SEGURO-DESEMPREGO. COMPETÊNCIA DA JUSTIÇA DO TRABALHO. DIREITO À INDENIZAÇÃO POR NÃO LIBERAÇÃO DE GUIAS.\n\nI - Inscreve-se na competência material da Justiça do Trabalho a lide entre empregado e empregador tendo por objeto indenização pelo não-fornecimento das guias do seguro-desemprego. (ex-OJ nº 210 da SBDI-1 - inserida em 08.11.2000)\nII - O não-fornecimento pelo empregador da guia necessária para o recebimento do seguro-desemprego dá origem ao direito à indenização. (ex-OJ nº 211 da SBDI-1 - inserida em 08.11.2000)","status":"em_vigor","temas":["Competência da Justiça do Trabalho"],"historico":[{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"(conversão das Orientações Jurisprudenciais nºs 210 e 211 da SBDI-1) - Res. 129/2005, DJ 20, 22 e 25.04.2005"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-390","tribunal":"TST","tipo":"sumula","numero":390,"teor":"ESTABILIDADE. ART. 41 DA CF/1988. CELETISTA. ADMINISTRAÇÃO DIRETA, AUTÁRQUICA OU FUNDACIONAL. APLICABILIDADE. EMPREGADO DE EMPRESA PÚBLICA E SOCIEDADE DE ECONOMIA MISTA. INAPLICÁVEL.\n\nI - O servidor público celetista da administração direta, autárquica ou fundacional é beneficiário da estabilidade prevista no art. 41 da CF/1988. (ex-OJs nºs 265 da SBDI-1 - inserida em 27.09.2002 - e 22 da SBDI-2 - inserida em 20.09.2000)\nII - Ao empregado de empresa pública ou de sociedade de economia mista, ainda que admitido mediante aprovação em concurso público, não é garantida a estabilidade prevista no art. 41 da CF/1988. (ex-OJ nº 229 da SBDI-1 - inserida em 20.06.2001)","status":"em_vigor","temas":["Estabilidade e garantias de emprego","Recursos e prazos","Provas e ônus da prova"],"historico":[{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"(conversão das Orientações Jurisprudenciais nºs 229 e 265 da SBDI-1 e da Orientação Jurisprudencial nº 22 da SBDI-2) - Res. 129/2005, DJ 20, 22 e 25.04.2005"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-391","tribunal":"TST","tipo":"sumula","numero":391,"teor":"PETROLEIROS. LEI Nº 5.811/72. TURNO ININTERRUPTO DE REVEZAMENTO. HORAS EXTRAS E ALTERAÇÃO DA JORNADA PARA HORÁRIO FIXO.\n\nI - A Lei nº 5.811/1972 foi recepcionada pela CF/1988 no que se refere à duração da jornada de trabalho em regime de revezamento dos petroleiros. (ex-OJ nº 240 da SBDI-1 - inserida em 20.06.2001)\nII - A previsão contida no art. 10 da Lei nº 5.811/1972, possibilitando a mudança do regime de revezamento para horário fixo, constitui alteração lícita, não violando os arts. 468 da CLT e 7º, VI, da CF/1988. (ex-OJ nº 333 da SBDI-1 - DJ 09.12.2003)","status":"em_vigor","temas":["Jornada e horas extras"],"historico":[{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"(conversão das Orientações Jurisprudenciais nºs 240 e 333 da SBDI-1) - Res. 129/2005, DJ 20, 22 e 25.04.2005"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-392","tribunal":"TST","tipo":"sumula","numero":392,"teor":"DANO MORAL E MATERIAL. RELAÇÃO DE TRABALHO. COMPETÊNCIA DA JUSTIÇA DO TRABALHO.\n\nNos termos do art. 114, inc. VI, da Constituição da República, a Justiça do Trabalho é competente para processar e julgar ações de indenização por dano moral e material, decorrentes da relação de trabalho, inclusive as oriundas de acidente de trabalho e doenças a ele equiparadas, ainda que propostas pelos dependentes ou sucessores do trabalhador falecido.","status":"em_vigor","temas":["Acidente e doença do trabalho","Competência da Justiça do Trabalho"],"historico":[{"evento":"Nova redação","ato":"Res. 200/2015","data":"2015-11-04","observacao":"(redação alterada em sessão do Tribunal Pleno realizada em 27.10.2015 - Res. 200/2015, DEJT divulgado em 29.10.2015 e 03 e 04.11.2015). - Entendimento reafirmado no IRR nº 224.\nIRR-224 DANO MORAL E MATERIAL. RELAÇÃO DE TRABALHO. COMPETÊNCIA DA JUSTIÇA DO TRABALHO. (RR-0000146-58.2022.5.05.0017, Tribunal Pleno, publicado em 02.09.2025, rel. Min. Aloysio Silva Corrêa da Veiga)\nNos termos do art. 114, inc. VI, da Constituição da República, a Justiça do Trabalho é competente para processar e julgar ações de indenização por dano moral e material, decorrentes da relação de trabalho, inclusive as oriundas de acidente de trabalho e doenças a ele equiparadas, ainda que propostas pelos dependentes ou sucessores do trabalhador falecido."},{"evento":"Nova redação","ato":"Res. 193/2013","data":"2013-12-17","observacao":"Nova redação - Res. 193/2013, DEJT divulgado em 13, 16 e 17.12.2013"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 392 Dano moral e material. Relação de trabalho. Competência da Justiça do Trabalho\nNos termos do art. 114, inc. VI, da Constituição da República, a Justiça do Trabalho é competente para processar\ne julgar ações de indenização por dano moral e material, decorrentes da relação de trabalho, inclusive as oriundas\nde acidente de trabalho e doenças a ele equiparadas."},{"evento":"Redação original","ato":null,"data":null,"observacao":"Redação original (conversão da Orientação Jurisprudencial nº 327 da SBDI-1)"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"- Res. 129/2005, DJ 20, 22 e 25.04.2005\nNº 392 Dano moral. Competência da Justiça do Trabalho\nNos termos do art. 114 da CF/1988, a Justiça do Trabalho\né competente para dirimir controvérsias referentes à indenização\npor dano moral, quando decorrente da relação de trabalho.\n(ex-OJ nº 327 da SBDI-1 - DJ 09.12.2003)"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-393","tribunal":"TST","tipo":"sumula","numero":393,"teor":"RECURSO ORDINÁRIO. EFEITO DEVOLUTIVO EM PROFUNDIDADE. ART. 1.013, § 1º, DO CPC DE 2015. ART. 515, § 1º, DO CPC DE 1973.\n\nI - O efeito devolutivo em profundidade do recurso ordinário, que se extrai do § 1º do art. 1.013 do CPC de 2015 (art. 515, §1º, do CPC de 1973), transfere ao Tribunal a apreciação dos fundamentos da inicial ou da defesa, não examinados pela sentença, ainda que não renovados em contrarrazões, desde que relativos ao capítulo impugnado.\nII - Se o processo estiver em condições, o tribunal, ao julgar o recurso ordinário, deverá decidir desde logo o mérito da causa, nos termos do § 3º do art. 1.013 do CPC de 2015, inclusive quando constatar a omissão da sentença no exame de um dos pedidos.","status":"em_vigor","temas":["Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 208/2016","data":"2016-04-26","observacao":"(nova redação em decorrência do CPC de 2015) - Res. 208/2016, DEJT divulgado em 22, 25 e 26.04.2016"},{"evento":"Nova redação","ato":"Res. 169/2010","data":"2010-11-23","observacao":"Súmula alterada - Res. 169/2010, DEJT divulgado em 19, 22 e 23.11.2010"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 393. Recurso ordinário. Efeito devolutivo em profundidade. Art. 515, § 1º, do CPC (redação alterada pelo Tribunal Pleno na sessão realizada em 16.11.2010)\nO efeito devolutivo em profundidade do recurso ordinário, que se extrai do § 1º do art. 515 do CPC, transfere ao Tribunal a apreciação dos fundamentos da inicial ou da defesa, não examinados pela sentença, ainda que não renovados em contrarrazões. Não se aplica, todavia, ao caso de pedido não apreciado na sentença, salvo a hipótese contida no § 3º do art. 515 do CPC."},{"evento":"Redação original","ato":"Res. 129/2005","data":"2005-04-25","observacao":"Redação original (conversão da Orientação Jurisprudencial nº 340 da SBDI-1) - Res. 129/2005 - DJ 20,22 e 25.04.2005"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 393 Recurso ordinário. Efeito devolutivo em profundidade. Art. 515, § 1º, do CPC\nO efeito devolutivo em profundidade do recurso ordinário, que se extrai do § 1º do art. 515 do CPC, transfere automaticamente ao Tribunal a apreciação de fundamento da defesa não examinado pela sentença, ainda que não renovado em contra-razões. Não se aplica, todavia, ao caso de pedido não apreciado na sentença. (ex-OJ nº 340 da SBDI-1 - DJ 22.06.2004)"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-394","tribunal":"TST","tipo":"sumula","numero":394,"teor":"FATO SUPERVENIENTE. ART. 493 DO CPC DE 2015. ART. 462 DO CPC DE 1973.\n\nO art. 493 do CPC de 2015 (art. 462 do CPC de 1973), que admite a invocação de fato constitutivo, modificativo ou extintivo do direito, superveniente à propositura da ação, é aplicável de ofício aos processos em curso em qualquer instância trabalhista. Cumpre ao juiz ou tribunal ouvir as partes sobre o fato novo antes de decidir.","status":"em_vigor","temas":["Outros"],"historico":[{"evento":"Nova redação","ato":"Res. 208/2016","data":"2016-04-26","observacao":"(atualizada em decorrência do CPC de 2015) - Res. 208/2016, DEJT divulgado em 22, 25 e 26.04.2016"},{"evento":"Redação original","ato":"Res. 129/2005","data":"2005-04-25","observacao":"Redação original - Res. 129/2005 - DJ 20,22 e 25.04.2005"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 394. Art. 462 do CPC. Fato superveniente (conversão da Orientação Jurisprudencial nº 81 da SBDI-1)\nO art. 462 do CPC, que admite a invocação de fato constitutivo, modificativo ou extintivo do direito, superveniente à propositura da ação, é aplicável de ofício aos processos em curso em qualquer instância trabalhista. (ex-OJ nº 81 da SBDI-1 - inserida em 28.04.1997)"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-395","tribunal":"TST","tipo":"sumula","numero":395,"teor":"MANDATO E SUBSTABELECIMENTO. CONDIÇÕES DE VALIDADE.\n\nI - Válido é o instrumento de mandato com prazo determinado que contém cláusula estabelecendo a prevalência dos poderes para atuar até o final da demanda (§ 4º do art. 105 do CPC de 2015). (ex -OJ nº 312 da SBDI-1 - DJ 11.08.2003)\nII - Se há previsão, no instrumento de mandato, de prazo para sua juntada, o mandato só tem validade se anexado ao processo o respectivo instrumento no aludido prazo. (ex-OJ nº 313 da SBDI-1 - DJ 11.08.2003)\nIII - São válidos os atos praticados pelo substabelecido, ainda que não haja, no mandato, poderes expressos para substabelecer (art. 667, e parágrafos, do Código Civil de 2002). (ex-OJ nº 108 da SBDI-1 - inserida em 01.10.1997)\nIV - Configura-se a irregularidade de representação se o substabelecimento é anterior à outorga passada ao substabelecente. (ex-OJ nº 330 da SBDI-1 - DJ 09.12.2003)\nV - Verificada a irregularidade de representação nas hipóteses dos itens II e IV, deve o juiz suspender o processo e designar prazo razoável para que seja sanado o vício, ainda que em instânciarecursal (art. 76 do CPC de 2015).","status":"em_vigor","temas":["Outros"],"historico":[{"evento":"Nova redação","ato":"Res. 211/2016","data":"2016-08-26","observacao":"(nova redação dos itens I e II e acrescido o item V em decorrência do CPC de 2015) - Res. 211/2016, DEJT divulgado em 24, 25 e 26.08.2016."},{"evento":"Redação original","ato":null,"data":null,"observacao":"Redação original (conversão das Orientações Jurisprudenciais nºs 108, 312, 313 e 330 da SBDI-1)"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"- Res. 129/2005, DJ 20, 22 e 25.04.2005\nI - Válido é o instrumento de mandato com prazo determinado que contém cláusula estabelecendo a prevalência dos poderes para atuar até o final da demanda.\n(ex-OJ nº 312 da SBDI-1 - DJ 11.08.2003)\nII - Diante da existência de previsão, no mandato, fixando termo para sua juntada, o instrumento de mandato só tem validade se anexado ao processo dentro do aludido prazo. (ex-OJ nº 313 da SBDI-1 - DJ 11.08.2003)"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-396","tribunal":"TST","tipo":"sumula","numero":396,"teor":"ESTABILIDADE PROVISÓRIA. PEDIDO DE REINTEGRAÇÃO. CONCESSÃO DO SALÁRIO RELATIVO AO PERÍODO DE ESTABILIDADE JÁ EXAURIDO. INEXISTÊNCIA DE JULGAMENTO \"EXTRA PETITA\".\n\nI - Exaurido o período de estabilidade, são devidos ao empregado apenas os salários do período compreendido entre a data da despedida e o final do período de estabilidade, não lhe sendo assegurada a reintegração no emprego. (ex-OJ nº 116 da SBDI-1 - inserida em 01.10.1997)\nII - Não há nulidade por julgamento \"extra petita\" da decisão que deferir salário quando o pedido for de reintegração, dados os termos do art. 496 da CLT. (ex-OJ nº 106 da SBDI-1 - inserida em 20.11.1997)","status":"em_vigor","temas":["Salário e remuneração","Estabilidade e garantias de emprego","Rescisão e verbas rescisórias"],"historico":[{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"(conversão das Orientações Jurisprudenciais nºs 106 e 116 da SBDI-1) - Res. 129/2005, DJ 20, 22 e 25.04.2005"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-397","tribunal":"TST","tipo":"sumula","numero":397,"teor":"AÇÃO RESCISÓRIA. ART. 485, IV, DO CPC. AÇÃO DE CUMPRIMENTO. OFENSA À COISA JULGADA EMANADA DE SENTENÇA NORMATIVA MODIFICADA EM GRAU DE RECURSO. INVIABILIDADE. CABIMENTO DE MANDADO DE SEGURANÇA.\n\nNão procede ação rescisória calcada em ofensa à coisa julgada perpetrada por decisão proferida em ação de cumprimento, em face de a sentença normativa, na qual se louvava, ter sido modificada em grau de recurso, porque em dissídio coletivo somente se consubstancia coisa julgada formal. Assim, os meios processuais aptos a atacarem a execução da cláusula reformada são a exceção de pré-executividade e o mandado de segurança, no caso de descumprimento do art. 572 do CPC. (ex-OJ nº 116 da SBDI-2 - DJ 11.08.2003)","status":"em_vigor","temas":["Rescisão e verbas rescisórias","Direito coletivo e sindical","Execução e penhora"],"historico":[{"evento":"Nova redação","ato":"Res. 208/2016","data":"2005-08-24","observacao":"(atualizada em decorrência do CPC de 2015) - Res. 208/2016, DEJT divulgado em 22, 25 e 26.04.2016"},{"evento":"Redação original","ato":"Res. 137/2005","data":"2005-08-24","observacao":"Redação original - Res. 137/2005, DJ 22, 23 e 24.08.2005"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 397. Ação rescisória. Art. 485, IV, do CPC. Ação de cumprimento. Ofensa à coisa julgada emanada de sentença normativa modificada em grau de recurso. Inviabilidade. Cabimento de mandado de segurança (conversão da Orientação Jurisprudencial nº 116 da SBDI-2)\nNão procede ação rescisória calcada em ofensa à coisa julgada perpetrada por decisão proferida em ação de cumprimento, em face de a sentença normativa, na qual se louvava, ter sido modificada em grau de recurso, porque em dissídio coletivo somente se consubstancia coisa julgada formal. Assim, os meios processuais aptos a atacarem a execução da cláusula reformada são a exceção de pré-executividade e o mandado de segurança, no caso de descumprimento do art. 572 do CPC. (ex-OJ nº 116 da SBDI-2 - DJ 11.08.2003)"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-398","tribunal":"TST","tipo":"sumula","numero":398,"teor":"AÇÃO RESCISÓRIA. AUSÊNCIA DE DEFESA. INAPLICÁVEIS OS EFEITOS DA REVELIA.\n\nNa ação rescisória, o que se ataca é a decisão, ato oficial do Estado, acobertado pelo manto da coisa julgada. Assim, e considerando que a coisa julgada envolve questão de ordem pública, a revelia não produz confissão na ação rescisória. (ex-OJ nº 126 da SBDI-2 - DJ 09.12.2003)","status":"em_vigor","temas":["Rescisão e verbas rescisórias","Provas e ônus da prova"],"historico":[{"evento":"Nova redação","ato":"Res. 219/2017","data":"2017-07-14","observacao":"(alterada em decorrência do CPC de 2015) - Res. 219/2017, DEJT divulgado em 28, 29 e 30.06.2017 - Republicada - DEJT divulgado em 12, 13 e 14.07.2017"},{"evento":"Redação original","ato":"Res. 137/2005","data":"2005-08-24","observacao":"Redação original (conversão da Orientação Jurisprudencial nº 126 da SBDI-2) - Res. 137/2005, DJ 22, 23 e 24.08.2005"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 398 (...)\nNa ação rescisória, o que se ataca na ação é a sentença, ato oficial do Estado, acobertado pelo manto da coisa julgada. Assim sendo, e considerando que a coisa julgada envolve questão de ordem pública, a revelia não produz confissão na ação rescisória. (ex-OJ nº 126 da SBDI-2 - DJ 09.12.2003)"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-399","tribunal":"TST","tipo":"sumula","numero":399,"teor":"AÇÃO RESCISÓRIA. CABIMENTO. SENTENÇA DE MÉRITO. DECISÃO HOMOLOGATÓRIA DE ADJUDICAÇÃO, DE ARREMATAÇÃO E DE CÁLCULOS.\n\nI - É incabível ação rescisória para impugnar decisão homologatória de adjudicação ou arrematação. (ex-OJs nºs 44 e 45 da SBDI-2 - inseridas em 20.09.2000)\nII - A decisão homologatória de cálculos apenas comporta rescisão quando enfrentar as questões envolvidas na elaboração da conta de liquidação, quer solvendo a controvérsia das partes quer explicitando, de ofício, os motivos pelos quais acolheu os cálculos oferecidos por uma das partes ou pelo setor de cálculos, e não contestados pela outra.\n(ex-OJ nº 85 da SBDI-2 - primeira parte - inserida em 13.03.2002 e alterada em 26.11.2002).","status":"em_vigor","temas":["Rescisão e verbas rescisórias","Execução e penhora"],"historico":[{"evento":"Nova redação","ato":"Res. 137/2005","data":"2005-08-24","observacao":"(conversão das Orientações Jurisprudenciais nºs 44, 45 e 85, primeira parte, da SBDI-2) - Res. 137/2005, DJ 22, 23 e 24.08.2005"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-400","tribunal":"TST","tipo":"sumula","numero":400,"teor":"AÇÃO RESCISÓRIA DE AÇÃO RESCISÓRIA. VIOLAÇÃO MANIFESTA DE NORMA JURÍDICA. INDICAÇÃO DA MESMA NORMA JURÍDICA APONTADA NA RESCISÓRIA PRIMITIVA (MESMO DISPOSITIVO DE LEI SOB O CPC DE 1973).\n\nEm se tratando de rescisória de rescisória, o vício apontado deve nascer na decisão rescindenda, não se admitindo a rediscussão do acerto do julgamento da rescisória anterior. Assim, não procede rescisória calcada no inciso V do art. 966 do CPC de 2015 (art. 485, V, do CPC de 1973) para discussão, por má aplicação da mesma norma jurídica, tida por violada na rescisória anterior, bem como para arguição de questões inerentes à ação rescisória primitiva. (ex-OJ nº 95 da SBDI-2 - inserida em 27.09.2002 e alterada DJ 16.04.2004)","status":"em_vigor","temas":["Rescisão e verbas rescisórias"],"historico":[{"evento":"Nova redação","ato":"Res. 208/2016","data":"2016-04-26","observacao":"(nova redação em decorrência do CPC de 2015) - Res. 208/2016, DEJT divulgado em 22, 25 e 26.04.2016"},{"evento":"Redação original","ato":"Res. 137/2005","data":"2005-08-24","observacao":"Redação original - Res. 137/2005, DJ 22, 23 e 24.08.2005"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 400. Ação rescisória de ação rescisória. Violação de lei. Indicação dos mesmos dispositivos legais apontados na rescisória primitiva (conversão da Orientação Jurisprudencial nº 95 da SBDI-2)\nEm se tratando de rescisória de rescisória, o vício apontado deve nascer na decisão rescindenda, não se admitindo a rediscussão do acerto do julgamento da rescisória anterior. Assim, não se admite rescisória calcada no inciso V do art. 485 do CPC para discussão, por má aplicação dos mesmos dispositivos de lei, tidos por violados na rescisória anterior, bem como para argüição de questões inerentes à ação rescisória primitiva. (ex-OJ nº 95 da SBDI-2 - inserida em 27.09.2002 e alterada DJ 16.04.2004)"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-401","tribunal":"TST","tipo":"sumula","numero":401,"teor":"AÇÃO RESCISÓRIA. DESCONTOS LEGAIS. FASE DE EXECUÇÃO. SENTENÇA EXEQÜENDA OMISSA. INEXISTÊNCIA DE OFENSA À COISA JULGADA.\n\nOs descontos previdenciários e fiscais devem ser efetuados pelo juízo executório, ainda que a sentença exeqüenda tenha sido omissa sobre a questão, dado o caráter de ordem pública ostentado pela norma que os disciplina. A ofensa à coisa julgada somente poderá ser caracterizada na hipótese de o título exeqüendo, expressamente, afastar a dedução dos valores a título de imposto de renda e de contribuição previdenciária. (ex-OJ nº 81 da SBDI-2 - inserida em 13.03.2002)","status":"em_vigor","temas":["Rescisão e verbas rescisórias","Execução e penhora"],"historico":[{"evento":"Nova redação","ato":"Res. 137/2005","data":"2005-08-24","observacao":"(conversão da Orientação Jurisprudencial nº 81 da SBDI-2) - Res. 137/2005 - DJ 22, 23 e 24.08.2005"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-402","tribunal":"TST","tipo":"sumula","numero":402,"teor":"AÇÃO RESCISÓRIA. PROVA NOVA. DISSÍDIO COLETIVO. SENTENÇA NORMATIVA.\n\nI - Sob a vigência do CPC de 2015 (art. 966, inciso VII), para efeito de ação rescisória, considera-se prova nova a cronologicamente velha, já existente ao tempo do trânsito em julgado da decisão rescindenda, mas ignorada pelo interessado ou de impossível utilização, à época, no processo.\nII - Não é prova nova apta a viabilizar a desconstituição de julgado:\na) sentença normativa proferida ou transitada em julgado posteriormente à sentença rescindenda;\nb) sentença normativa preexistente à sentença rescindenda, mas não exibida no processo principal, em virtude de negligência da parte, quando podia e deveria louvar-se de documento já existente e não ignorado quando emitida a decisão rescindenda. (ex-OJ nº 20 da SBDI-2 - inserida em 20.09.2000).","status":"em_vigor","temas":["Estabilidade e garantias de emprego","Rescisão e verbas rescisórias","Direito coletivo e sindical"],"historico":[{"evento":"Nova redação","ato":"Res. 217/2017","data":"2017-04-25","observacao":"(nova redação em decorrência do CPC de 2015) - Res. 217/2017 - DEJT divulgado em 20, 24 e 25.04.2017"},{"evento":"Redação original","ato":"Res. 137/2005","data":"2005-08-24","observacao":"Redação original - Res. 137/2005, DJ 22, 23 e 24.08.2005"},{"evento":"Conversão","ato":null,"data":null,"observacao":"Conversão da Orientação Jurisprudencial nº 20 da SBDI-2"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 402 Ação rescisória. Documento novo. Dissídio coletivo. Sentença normativa\nDocumento novo é o cronologicamente velho, já existente ao tempo da decisão rescindenda, mas ignorado pelo interessado ou de impossível utilização, à época, no processo. Não é documento novo apto a viabilizar a desconstituição de julgado:\na) sentença normativa proferida ou transitada em julgado posteriormente à sentença rescindenda;\nb) sentença normativa preexistente à sentença rescindenda, mas não exibida no processo principal, em virtude de negligência da parte, quando podia e deveria louvar-se de documento já existente e não ignorado quando emitida a decisão rescindenda. (ex-OJ nº 20 da SBDI-2 - inserida em 20.09.2000)"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-403","tribunal":"TST","tipo":"sumula","numero":403,"teor":"AÇÃO RESCISÓRIA. DOLO DA PARTE VENCEDORA EM DETRIMENTO DA VENCIDA. ART. 485, III, DO CPC.\n\nI - Não caracteriza dolo processual, previsto no art. 485, III, do CPC, o simples fato de a parte vencedora haver silenciado a respeito de fatos contrários a ela, porque o procedimento, por si só, não constitui ardil do qual resulte cerceamento de defesa e, em conseqüência, desvie o juiz de uma sentença não-condizente com a verdade. (ex-OJ nº 125 da SBDI-2 - DJ 09.12.2003)\nII - Se a decisão rescindenda é homologatória de acordo, não há parte vencedora ou vencida, razão pela qual não é possível a sua desconstituição calcada no inciso III do art. 485 do CPC (dolo da parte vencedora em detrimento da vencida), pois constitui fundamento de rescindibilidade que supõe solução jurisdicional para a lide. (ex-OJ nº 111 da SBDI-2 - DJ 29.04.2003)","status":"em_vigor","temas":["Rescisão e verbas rescisórias"],"historico":[{"evento":"Nova redação","ato":"Res. 137/2005","data":"2005-08-24","observacao":"(conversão das Orientações Jurisprudenciais nºs 111 e 125 da SBDI-2) - Res. 137/2005, DJ 22, 23 e 24.08.2005"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-404","tribunal":"TST","tipo":"sumula","numero":404,"teor":"AÇÃO RESCISÓRIA. FUNDAMENTO PARA INVALIDAR CONFISSÃO. CONFISSÃO FICTA. INADEQUAÇÃO DO ENQUADRAMENTO NO ART. 485, VIII, DO CPC DE 1973.\n\nO art. 485, VIII, do CPC de 1973, ao tratar do fundamento para invalidar a confissão como hipótese de rescindibilidade da decisão judicial, referia-se à confissão real, fruto de erro, dolo ou coação, e não à confissão ficta resultante de revelia.","status":"em_vigor","temas":["Rescisão e verbas rescisórias","Provas e ônus da prova"],"historico":[{"evento":"Nova redação","ato":"Res. 209/2016","data":"2016-06-03","observacao":"(atualizada em decorrência do CPC de 2015) - Res. 209/2016, DEJT divulgado em 01, 02 e 03.06.2016"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Res. 137/2005, DJ 22, 23 e 24.08.2005"},{"evento":"Conversão","ato":null,"data":null,"observacao":"Conversão da Orientação Jurisprudencial nº 108 da SBDI-2"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 404 Ação rescisória. Fundamento para invalidar confissão. Confissão ficta. Inadequação do enquadramento no art. 485, VIII, do CPC."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-405","tribunal":"TST","tipo":"sumula","numero":405,"teor":"AÇÃO RESCISÓRIA. TUTELA PROVISÓRIA.\n\nEm face do que dispõem a MP 1.984-22/2000 e o art. 969 do CPC de 2015, é cabível o pedido de tutela provisória formulado na petição inicial de ação rescisória ou na fase recursal, visando a suspender a execução da decisão rescindenda.","status":"em_vigor","temas":["Rescisão e verbas rescisórias","Execução e penhora"],"historico":[{"evento":"Nova redação","ato":"Res. 208/2016","data":"2016-04-26","observacao":"(nova redação em decorrência do CPC de 2015) - Res. 208/2016, DEJT divulgado em 22, 25 e 26.04.2016"},{"evento":"Redação original","ato":"Res. 137/2005","data":"2005-08-24","observacao":"Redação original - Res. 137/2005, DJ 22, 23 e 24.08.2005"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 405. Ação rescisória. Liminar. Antecipação de tutela (conversão das Orientações Jurisprudenciais nºs 1, 3 e 121 da SBDI-2)\nI - Em face do que dispõe a MP 1.984-22/2000 e reedições e o artigo 273, § 7º, do CPC, é cabível o pedido liminar formulado na petição inicial de ação rescisória ou na fase recursal, visando a suspender a execução da decisão rescindenda.\nII - O pedido de antecipação de tutela, formulado nas mesmas condições, será recebido como medida acautelatória em ação rescisória, por não se admitir tutela antecipada em sede de ação rescisória. (ex-OJs nºs 1 e 3 da SBDI-2 - inseridas em 20.09.2000 - e 121 da SBDI-2 - DJ 11.08.2003)"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-406","tribunal":"TST","tipo":"sumula","numero":406,"teor":"AÇÃO RESCISÓRIA. LITISCONSÓRCIO. NECESSÁRIO NO PÓLO PASSIVO E FACULTATIVO NO ATIVO. INEXISTENTE QUANTO AOS SUBSTITUÍDOS PELO SINDICATO.\n\nI - O litisconsórcio, na ação rescisória, é necessário em relação ao pólo passivo da demanda, porque supõe uma comunidade de direitos ou de obrigações que não admite solução díspar para os litisconsortes, em face da indivisibilidade do objeto. Já em relação ao pólo ativo, o litisconsórcio é facultativo, uma vez que a aglutinação de autores se faz por conveniência e não pela necessidade decorrente da natureza do litígio, pois não se pode condicionar o exercício do direito individual de um dos litigantes no processo originário à anuência dos demais para retomar a lide. (ex-OJ nº 82 da SBDI-2 - inserida em 13.03.2002)\nII - O Sindicato, substituto processual e autor da reclamação trabalhista, em cujos autos fora proferida a decisão rescindenda, possui legitimidade para figurar como réu na ação rescisória, sendo descabida a exigência de citação de todos os empregados substituídos, porquanto inexistente litisconsórcio passivo necessário. (ex-OJ nº 110 da SBDI-2 - DJ 29.04.2003)","status":"em_vigor","temas":["Rescisão e verbas rescisórias","Direito coletivo e sindical"],"historico":[{"evento":"Nova redação","ato":"Res. 137/2005","data":"2005-08-24","observacao":"(conversão das Orientações Jurisprudenciais nºs 82 e 110 da SBDI-2) - Res. 137/2005, DJ 22, 23 e 24.08.2005"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-407","tribunal":"TST","tipo":"sumula","numero":407,"teor":"AÇÃO RESCISÓRIA. MINISTÉRIO PÚBLICO. LEGITIMIDADE \"AD CAUSAM\" PREVISTA NO ART. 967, III, \"A\", \"B\" E \"C\" DO CPC DE 2015. ART. 487, III, \"A\" E \"B\", DO CPC DE 1973. HIPÓTESES MERAMENTE EXEMPLIFICATIVAS.\n\nA legitimidade \"ad causam\" do Ministério Público para propor ação rescisória, ainda que não tenha sido parte no processo que deu origem à decisão rescindenda, não está limitada às alíneas \"a\", \"b\" e \"c\" do inciso III do art. 967 do CPC de 2015 (art. 487, III, \"a\" e \"b\", do CPC de 1973), uma vez que traduzem hipóteses meramente exemplificativas (ex-OJ nº 83 da SBDI-2 - inserida em 13.03.2002).","status":"em_vigor","temas":["Rescisão e verbas rescisórias","Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 208/2016","data":"2016-04-26","observacao":"(nova redação em decorrência do CPC de 2015) - Res. 208/2016, DEJT divulgado em 22, 25 e 26.04.2016"},{"evento":"Redação original","ato":"Res. 137/2005","data":"2005-08-24","observacao":"Redação original - Res. 137/2005, DJ 22, 23 e 24.08.2005"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 407. Ação rescisória. Ministério Público. Legitimidade \"ad causam\" prevista no art. 487, III, \"A\" e \"B\", do CPC. As hipóteses são meramente exemplificativas (conversão da Orientação Jurisprudencial nº 83 da SBDI-2)\nA legitimidade \"ad causam\" do Ministério Público para propor ação rescisória, ainda que não tenha sido parte no processo que deu origem à decisão rescindenda, não está limitada às alíneas \"a\" e \"b\" do inciso III do art. 487 do CPC, uma vez que traduzem hipóteses meramente exemplificativas. (ex-OJ nº 83 da SBDI-2 - inserida em 13.03.2002)"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-408","tribunal":"TST","tipo":"sumula","numero":408,"teor":"AÇÃO RESCISÓRIA. PETIÇÃO INICIAL. CAUSA DE PEDIR. AUSÊNCIA DE CAPITULAÇÃO OU CAPITULAÇÃO ERRÔNEA NO ART. 966 DO CPC DE 2015. ART. 485 DO CPC DE 1973. PRINCÍPIO \"IURA NOVIT CURIA\".\n\nNão padece de inépcia a petição inicial de ação rescisória apenas porque omite a subsunção do fundamento de rescindibilidade no art. 966 do CPC de 2015 (art. 485 do CPC de 1973) ou o capitula erroneamente em um de seus incisos. Contanto que não se afaste dos fatos e fundamentos invocados como causa de pedir, ao Tribunal é lícito emprestar-lhes a adequada qualificação jurídica (\"iura novit curia\"). No entanto, fundando-se a ação rescisória no art. 966, inciso V, do CPC de 2015 (art. 485, inciso V, do CPC de 1973), é indispensável expressa indicação, na petição inicial da ação rescisória, da norma jurídica manifestamente violada (dispositivo legal violado sob o CPC de 1973), por se tratar de causa de pedir da rescisória, não se aplicando, no caso, o princípio \"iura novit curia\". (ex-Ojs nºs 32 e 33 da SBDI-2 - inseridas em 20.09.2000)","status":"em_vigor","temas":["Rescisão e verbas rescisórias"],"historico":[{"evento":"Nova redação","ato":"Res. 208/2016","data":"2016-04-26","observacao":"(nova redação em decorrência do CPC de 2015) - Res. 208/2016, DEJT divulgado em 22, 25 e 26.04.2016"},{"evento":"Redação original","ato":"Res. 137/2005","data":"2005-08-24","observacao":"Redação original - Res. 137/2005, DJ 22, 23 e 24.08.2005"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 408. Ação rescisória. Petição inicial. Causa de pedir. Ausência de capitulação ou capitulação errônea no art. 485 do CPC. Princípio \"iura novit curia\" (conversão das Orientações Jurisprudenciais nºs 32 e 33 da SBDI-2)\nNão padece de inépcia a petição inicial de ação rescisória apenas porque omite a subsunção do fundamento de rescindibilidade no art. 485 do CPC ou o capitula erroneamente em um de seus incisos. Contanto que não se afaste dos fatos e fundamentos invocados como causa de pedir, ao Tribunal é lícito emprestar-lhes a adequada qualificação jurídica (\"iura novit curia\"). No entanto, fundando-se a ação rescisória no art. 485, inc. V, do CPC, é indispensável expressa indicação, na petição inicial da ação rescisória, do dispositivo legal violado, por se tratar de causa de pedir da rescisória, não se aplicando, no caso, o princípio \"iura novit curia\". (ex-Ojs nºs 32 e 33 da SBDI-2 - inseridas em 20.09.2000)"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-409","tribunal":"TST","tipo":"sumula","numero":409,"teor":"AÇÃO RESCISÓRIA. PRAZO PRESCRICIONAL. TOTAL OU PARCIAL. VIOLAÇÃO DO ART. 7º, XXIX, DA CF/1988. MATÉRIA INFRACONSTITUCIONAL.\n\nNão procede ação rescisória calcada em violação do art. 7º, XXIX, da CF/1988 quando a questão envolve discussão sobre a espécie de prazo prescricional aplicável aos créditos trabalhistas, se total ou parcial, porque a matéria tem índole infraconstitucional, construída, na Justiça do Trabalho, no plano jurisprudencial. (ex-OJ nº 119 da SBDI-2 - DJ 11.08.2003)","status":"em_vigor","temas":["Rescisão e verbas rescisórias"],"historico":[{"evento":"Nova redação","ato":"Res. 137/2005","data":"2005-08-24","observacao":"(conversão da Orientação Jurisprudencial nº 119 da SBDI-2) - Res. 137/2005, DJ 22, 23 e 24.08.2005"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-410","tribunal":"TST","tipo":"sumula","numero":410,"teor":"AÇÃO RESCISÓRIA. REEXAME DE FATOS E PROVAS. INVIABILIDADE.\n\nA ação rescisória calcada em violação de lei não admite reexame de fatos e provas do processo que originou a decisão rescindenda. (ex-OJ nº 109 da SBDI-2 - DJ 29.04.2003).","status":"em_vigor","temas":["Rescisão e verbas rescisórias","Provas e ônus da prova"],"historico":[{"evento":"Nova redação","ato":"Res. 137/2005","data":"2005-08-24","observacao":"(conversão da Orientação Jurisprudencial nº 109 da SBDI-2) - Res. 137/2005, DJ 22, 23 e 24.08.2005"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-411","tribunal":"TST","tipo":"sumula","numero":411,"teor":"AÇÃO RESCISÓRIA. SENTENÇA DE MÉRITO. DECISÃO DE TRIBUNAL REGIONAL DO TRABALHO EM AGRAVO REGIMENTAL CONFIRMANDO DECISÃO MONOCRÁTICA DO RELATOR QUE, APLICANDO A SÚMULA Nº 83 DO TST, INDEFERIU A PETIÇÃO INICIAL DA AÇÃO RESCISÓRIA. CABIMENTO.\n\nSe a decisão recorrida, em agravo regimental, aprecia a matéria na fundamentação, sob o enfoque das Súmulas nºs 83 do TST e 343 do STF, constitui sentença de mérito, ainda que haja resultado no indeferimento da petição inicial e na extinção do processo sem julgamento do mérito. Sujeita-se, assim, à reforma pelo TST, a decisão do Tribunal que, invocando controvérsia na interpretação da lei, indefere a petição inicial de ação rescisória. (ex-OJ nº 43 da SBDI-2 - inserida em 20.09.2000)","status":"em_vigor","temas":["Rescisão e verbas rescisórias","Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 137/2005","data":"2005-08-24","observacao":"(conversão da Orientação Jurisprudencial nº 43 da SBDI-2) - Res. 137/2005, DJ 22, 23 e 24.08.2005"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-412","tribunal":"TST","tipo":"sumula","numero":412,"teor":"AÇÃO RESCISÓRIA. REGÊNCIA PELO CPC DE 1973. SENTENÇA DE MÉRITO. QUESTÃO PROCESSUAL.\n\nSob a égide do CPC de 1973, pode uma questão processual ser objeto de rescisão desde que consista em pressuposto de validade de uma sentença de mérito. (ex-OJ nº 46 da SBDI-2 - inserida em20.09.2000).","status":"em_vigor","temas":["Rescisão e verbas rescisórias"],"historico":[{"evento":"Nova redação","ato":"Res. 217/2017","data":"2017-04-25","observacao":"(nova redação em decorrência do CPC de 2015) - Res. 217/2017 - DEJT divulgado em 20, 24 e 25.04.2017."},{"evento":"Redação original","ato":"Res. 137/2005","data":"2005-08-24","observacao":"Redação original - Res. 137/2005, DJ 22, 23 e 24.08.2005."},{"evento":"Conversão","ato":null,"data":null,"observacao":"Conversão da Orientação Jurisprudencial nº 46 da SBDI-2."},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 412 Ação rescisória. Sentença de mérito. Questão processual.\nPode uma questão processual ser objeto de rescisão desde que consista em pressuposto de validade de uma sentença de mérito. (ex-OJ nº 46 da SBDI-2 - inserida em 20.09.2000)."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-413","tribunal":"TST","tipo":"sumula","numero":413,"teor":"AÇÃO RESCISÓRIA. SENTENÇA DE MÉRITO. VIOLAÇÃO DO ART. 896, \"A\", DA CLT.\n\nÉ incabível ação rescisória, por violação do art. 896, \"a\", da CLT, contra decisão transitada em julgado sob a égide do CPC de 1973 que não conhece de recurso de revista, com base em divergência jurisprudencial, pois não se cuidava de sentença de mérito (art. 485 do CPC de 1973). (ex-OJ nº 47 da SBDI-2 - inserida em 20.09.2000)","status":"em_vigor","temas":["Rescisão e verbas rescisórias","Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 209/2016","data":"2016-06-03","observacao":"(nova redação em decorrência do CPC de 2015) - Res. 209/2016, DEJT divulgado em 01, 02 e 03.06.2016"},{"evento":"Redação original","ato":"Res. 137/2005","data":"2005-08-24","observacao":"Redação original - Res. 137/2005, DJ 22, 23 e 24.08.2005 - Conversão da Orientação Jurisprudencial nº 47 da SBDI-2"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"413. Ação rescisória. Sentença de mérito. Violação do art. 896, \"a\", da CLT.\nÉ incabível ação rescisória, por violação do art. 896, \"a\", da CLT, contra decisão que não conhece de recurso de revista, com base em divergência jurisprudencial, pois não se cuida de sentença de mérito (art. 485 do CPC). (ex-OJ nº 47 da SBDI-2 - inserida em 20.09.2000)."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-414","tribunal":"TST","tipo":"sumula","numero":414,"teor":"MANDADO DE SEGURANÇA. TUTELA PROVISÓRIA CONCEDIDA ANTES OU NA SENTENÇA.\n\nI - A tutela provisória concedida na sentença não comporta impugnação pela via do mandado de segurança, por ser impugnável mediante recurso ordinário. É admissível a obtenção de efeito suspensivo ao recurso ordinário mediante requerimento dirigido ao tribunal, ao relator ou ao presidente ou ao vice-presidente do\ntribunal recorrido, por aplicação subsidiária ao processo do trabalho do artigo 1.029, § 5º, do CPC de 2015.\nII - No caso de a tutela provisória haver sido concedida ou indeferida antes da sentença, cabe mandado de segurança, em face da inexistência de recurso próprio.\nIII - A superveniência da sentença, nos autos originários, faz perder o objeto do mandado de segurança que impugnava a concessão ou o indeferimento da tutela provisória.","status":"em_vigor","temas":["Terceirização e responsabilidade","Salário e remuneração","Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 217/2017","data":"2017-04-25","observacao":"(nova redação em decorrência do CPC de 2015) - Res. 217/2017 - DEJT divulgado em 20, 24 e 25.04.2017"},{"evento":"Redação original","ato":"Res. 137/2005","data":"2005-08-24","observacao":"Redação original - Res. 137/2005, DJ 22, 23 e 24.08.2005 - conversão das Orientações Jurisprudencias nºs 50, 51, 58, 86 e 139 da SBDI-2"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"414 Mandado de Segurança. Antecipação de tutela (ou liminar) concedida antes ou na sentença"},{"evento":"Suspensão","ato":null,"data":"2000-09-20","observacao":"I - A antecipação da tutela concedida na sentença não comporta impugnação pela via do mandado de segurança, por ser impugnável mediante recurso ordinário. A ação cautelar é o meio próprio para se obter efeito suspensivo a recurso. (ex-OJ nº 51 da SBDI-2 - inserida em 20.09.2000)"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"II - No caso da tutela antecipada (ou liminar) ser concedida antes da sentença, cabe a impetração do mandado de segurança, em face da inexistência de recurso próprio. (ex-OJs nºs 50 e 58 da SBDI-2 - inseridas em 20.09.2000)\nIII - A superveniência da sentença, nos autos originários, faz perder o objeto do mandado de segurança que impugnava a concessão da tutela antecipada (ou liminar). (ex-Ojs da SBDI-2 nºs 86 - inserida em 13.03.2002 - e 139 - DJ 04.05.2004)"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-415","tribunal":"TST","tipo":"sumula","numero":415,"teor":"MANDADO DE SEGURANÇA. PETIÇÃO INICIAL. ART. 321 DO CPC DE 2015. ART. 284 DO CPC DE 1973. INAPLICABILIDADE.\n\nExigindo o mandado de segurança prova documental pré-constituída, inaplicável o art. 321 do CPC de 2015 (art. 284 do CPC de 1973) quando verificada, na petição inicial do \"mandamus\", a ausência de documento indispensável ou de sua autenticação. (ex-OJ nº 52 da SBDI-2 - inserida em 20.09.2000).","status":"em_vigor","temas":["Provas e ônus da prova"],"historico":[{"evento":"Nova redação","ato":"Res. 208/2016","data":"2016-04-26","observacao":"(atualizada em decorrência do CPC de 2015) - Res. 208/2016, DEJT divulgado em 22, 25 e 26.04.2016"},{"evento":"Redação original","ato":"Res. 137/2005","data":"2005-08-24","observacao":"Redação original - Res. 137/2005, DJ 22, 23 e 24.08.2005"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 415. Mandado de segurança. Art. 284 do CPC. Aplicabilidade (conversão da Orientação Jurisprudencial nº 52 da SBDI-2)\nExigindo o mandado de segurança prova documental pré-constituída, inaplicável se torna o art. 284 do CPC quando verificada, na petição inicial do \"mandamus\", a ausência de documento indispensável ou de sua autenticação. (ex-OJ nº 52 da SBDI-2 - inserida em 20.09.2000)"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-416","tribunal":"TST","tipo":"sumula","numero":416,"teor":"MANDADO DE SEGURANÇA. EXECUÇÃO. LEI Nº 8.432/1992. ART. 897, § 1º, DA CLT. CABIMENTO.\n\nDevendo o agravo de petição delimitar justificadamente a matéria e os valores objeto de discordância, não fere direito líquido e certo o prosseguimento da execução quanto aos tópicos e valores não especificados no agravo. (ex-OJ nº 55 da SBDI-2 - inserida em 20.09.2000)","status":"em_vigor","temas":["Execução e penhora","Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 137/2005","data":"2005-08-24","observacao":"(conversão da Orientação Jurisprudencial nº 55 da SBDI-2) - Res. 137/2005, DJ 22, 23 e 24.08.2005"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-417","tribunal":"TST","tipo":"sumula","numero":417,"teor":"MANDADO DE SEGURANÇA. PENHORA EM DINHEIRO.\n\nI - Não fere direito líquido e certo do impetrante o ato judicial que determina penhora em dinheiro do executado para garantir crédito exequendo, pois é prioritária e obedece à gradação prevista no art. 835 do CPC de 2015 (art. 655 do CPC de 1973).\nII - Havendo discordância do credor, em execução definitiva, não tem o executado direito líquido e certo a que os valores penhorados em dinheiro fiquem depositados no próprio banco, ainda que atenda aos requisitos do art. 840, I, do CPC de 2015 (art. 666, I, do CPC de 1973). (ex-OJ nº 61 da SBDI-2 - inserida em 20.09.2000).","status":"em_vigor","temas":["Execução e penhora","Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 212/2016","data":"2016-09-22","observacao":"(alterado o item I, atualizado o item II e cancelado o item III, modulando-se os efeitos da presente redação de forma a atingir unicamente as penhoras em dinheiro em execução provisória efetivadas a partir de 18.03.2016, data de vigência do CPC de 2015) - Res. 212/2016, DEJT divulgado em 20, 21 e 22.09.2016"},{"evento":"Redação original","ato":"Res. 137/2005","data":"2005-08-24","observacao":"Redação original - (conversão das Orientações Jurisprudenciais nºs 60, 61 e 62 da SBDI-II) - Res. 137/2005, DJ 22, 23 e 24.08.2005) Res. 137/2005, DJ 22, 23 e 24.08.2005"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 417. Mandado de segurança. Penhora em dinheiro\nI - Não fere direito líquido e certo do impetrante o ato judicial que determina penhora em dinheiro do executado, em execução definitiva, para garantir crédito exeqüendo, uma vez que obedece à gradação prevista no art. 655 do CPC. (ex-OJ nº 60 da SBDI-II - inserida em 20.09.2000)\nII - Havendo discordância do credor, em execução definitiva, não tem o executado direito líquido e certo a que os valores penhorados em dinheiro fiquem depositados no próprio banco, ainda que atenda aos requisitos do art. 666, I, do CPC. (ex-OJ nº 61 da SBDI-II - inserida em 20.09.2000)\nIII - Em se tratando de execução provisória, fere direito líquido e certo do impetrante a determinação de penhora em dinheiro, quando nomeados outros bens à penhora, pois o executado tem direito a que a execução se processe da forma que lhe seja menos gravosa, nos termos do art. 620 do CPC. (ex-OJ nº 62 da SBDI-II - inserida em 20.09.2000)."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-418","tribunal":"TST","tipo":"sumula","numero":418,"teor":"MANDADO DE SEGURANÇA VISANDO À HOMOLOGAÇÃO DE ACORDO.\n\nA homologação de acordo constitui faculdade do juiz, inexistindo direito líquido e certo tutelável pela via do mandado de segurança.","status":"em_vigor","temas":["Rescisão e verbas rescisórias"],"historico":[{"evento":"Nova redação","ato":"Res. 217/2017","data":"2017-04-25","observacao":"(nova redação em decorrência do CPC de 2015) - Res. 217/2017, DEJT divulgado em 20, 24 e 25.04.2017"},{"evento":"Redação original","ato":"Res. 137/2005","data":"2005-08-24","observacao":"Redação original - Res. 137/2005, DJ 22, 23 e 24.08.2005 - conversão das Orientações Jurisprudencias nºs 120 e 141 da SBDI-2"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"418 Mandado de Segurança visando à concessão de liminar ou homologação de acordo\nA concessão de liminar ou a homologação de acordo constituem faculdade do juiz, inexistindo direito líquido e certo tutelável pela via do mandado de segurança. (ex-Ojs da SBDI-2 nºs 120 - DJ 11.08.2003 - e 141 - DJ 04.05.2004)"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-419","tribunal":"TST","tipo":"sumula","numero":419,"teor":"COMPETÊNCIA. EMBARGOS DE TERCEIRO. EXECUÇÃO POR CARTA PRECATÓRIA. JUÍZO DEPRECADO.\n\nNa execução por carta precatória, os embargos de terceiro serão oferecidos no juízo deprecado, salvo se indicado pelo juízo deprecante o bem constrito ou se já devolvida a carta (art. 676, parágrafo único, do CPC de 2015).","status":"em_vigor","temas":["Execução e penhora","Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 212/2016","data":"2016-09-22","observacao":"(alterada em decorrência do CPC de 2015) - Res. 212/2016, DEJT divulgado em 20, 21 e 22.09.2016"},{"evento":"Redação original","ato":"Res. 137/2005","data":"2005-08-24","observacao":"Redação original (conversão da Orientação Jurisprudencial nº 114 da SBDI-II) - Res. 137/2005, DJ 22, 23 e 24.08.2005"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 419. Competência. Execução por carta. Embargos de terceiro. Juízo deprecante\nNa execução por carta precatória, os embargos de terceiro serão oferecidos no juízo deprecante ou no juízo deprecado, mas a competência para julgá-los é do juízo deprecante, salvo se versarem, unicamente, sobre vícios ou irregularidades da penhora, avaliação ou alienação dos bens, praticados pelo juízo deprecado, em que a competência será deste último. (ex-OJ nº 114 da SBDI-II - DJ 11.08.2003)"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-420","tribunal":"TST","tipo":"sumula","numero":420,"teor":"COMPETÊNCIA FUNCIONAL. CONFLITO NEGATIVO. TRT E VARA DO TRABALHO DE IDÊNTICA REGIÃO. NÃO CONFIGURAÇÃO.\n\nNão se configura conflito de competência entre Tribunal Regional do Trabalho e Vara do Trabalho a ele vinculada. (ex-OJ nº 115 da SBDI-2 - DJ 11.08.2003)","status":"em_vigor","temas":["Competência da Justiça do Trabalho"],"historico":[{"evento":"Nova redação","ato":"Res. 137/2005","data":"2005-08-24","observacao":"(conversão da Orientação Jurisprudencial nº 115 da SBDI-2) - Res. 137/2005, DJ 22, 23 e 24.08.2005"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-421","tribunal":"TST","tipo":"sumula","numero":421,"teor":"EMBARGOS DE DECLARAÇÃO. CABIMENTO. DECISÃO MONOCRÁTICA DO RELATOR CALCADA NO ART. 932 DO CPC DE 2015. ART. 557 DO CPC DE 1973.\n\nI - Cabem embargos de declaração da decisão monocrática do relator prevista no art. 932 do CPC de 2015 (art. 557 do CPC de 1973), se a parte pretende tão somente juízo integrativo retificador da decisão e, não, modificação do julgado.\nII - Se a parte postular a revisão no mérito da decisão monocrática, cumpre ao relator converter os embargos de declaração em agravo, em face dos princípios da fungibilidade e celeridade processual, submetendo-o ao pronunciamento do Colegiado, após a intimação do recorrente para, no prazo de 5 (cinco) dias, complementar as razões recursais, de modo a ajustá-las às exigências do art. 1.021, § 1º, do CPC de 2015.","status":"em_vigor","temas":["Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 208/2016","data":"2016-04-26","observacao":"(atualizada em decorrência do CPC de 2015) - Res. 208/2016, DEJT divulgado em 22, 25 e 26.04.2016"},{"evento":"Redação original","ato":"Res. 137/2005","data":"2005-08-24","observacao":"Redação original - Res. 137/2005, DJ 22, 23 e 24.08.2005"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 421. Embargos declaratórios contra decisão monocrática do relator calcada no art. 557 do CPC. Cabimento (conversão da Orientação Jurisprudencial nº 74 da SBDI-2)\nI - Tendo a decisão monocrática de provimento ou denegação de recurso, prevista no art. 557 do CPC, conteúdo decisório definitivo e conclusivo da lide, comporta ser esclarecida pela via dos embargos de declaração, em decisão aclaratória, também monocrática, quando se pretende tão-somente suprir omissão e não, modificação do julgado.\nII - Postulando o embargante efeito modificativo, os embargos declaratórios deverão ser submetidos ao pronunciamento do Colegiado, convertidos em agravo, em face dos princípios da fungibilidade e celeridade processual. (ex-OJ nº 74 da SBDI-2 - inserida em 08.11.2000)"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-422","tribunal":"TST","tipo":"sumula","numero":422,"teor":"RECURSO. FUNDAMENTO AUSENTE OU DEFICIENTE. NÃO CONHECIMENTO.\n\nI - Não se conhece de recurso para o Tribunal Superior do Trabalho se as razões do recorrente não impugnam os fundamentos da decisão recorrida, nos termos em que proferida.\n\nII - O entendimento referido no item anterior não se aplica em relação à motivação secundária e impertinente, consubstanciada em despacho de admissibilidade de recurso ou em decisão monocrática.\n\nIII - Inaplicável a exigência do item I relativamente ao recurso ordinário da competência de Tribunal Regional do Trabalho, exceto em caso de recurso cuja motivação é inteiramente dissociada dos fundamentos da sentença.","status":"em_vigor","temas":["Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 199/2015","data":"2015-06-26","observacao":"(redação alterada, com inserção dos itens I, II e III) - Res. 199/2015, DEJT divulgado em 24, 25 e 26.06.2015. Com errata publicada no DEJT divulgado em 01.07.2015"},{"evento":"Redação original","ato":"Res. 137/2005","data":"2005-08-24","observacao":"Redação original (conversão da Orientação Jurisprudencial nº 90 da SBDI-2) - Res. 137/2005, DJ 22, 23 e 24.08.2005"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 422 Recurso. Apelo que não ataca os fundamentos da decisão recorrida. Não conheci-
