ssalva expressa e especificada ao valor dado à parcela ou parcelas impugnadas.\nI - A quitação não abrange parcelas não consignadas no recibo de quitação e, conseqüentemente, seus reflexos em outras parcelas, ainda que estas constem desse recibo.\nII - Quanto a direitos que deveriam ter sido satisfeitos durante a vigência do contrato de trabalho, a quitação é válida em relação ao período expressamente consignado no recibo de quitação.","status":"em_vigor","temas":["Direito coletivo e sindical","Contrato e vínculo de emprego"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Nova redação","ato":"Res. 108/2001","data":"2001-04-20","observacao":"Súmula alterada - Res. 108/2001, DJ 18, 19 e 20.04.2001"},{"evento":"Manutenção","ato":"RA nº 4/1994","data":"1994-02-28","observacao":"Súmula mantida e republicada com explicitação - RA nº 4/1994, DJ 18, 28.02.1994 e 02.03.1994"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 330 Quitação. Validade. Revisão da Súmula nº 41\nA quitação passada pelo empregado, com assistência de entidade sindical de sua categoria, ao empregador, com observância dos requisitos exigidos nos parágrafos do artigo 477, da Consolidação das Leis do Trabalho, tem eficácia liberatória em relação às parcelas expressamente consignadas no recibo, salvo se oposta ressalva expressa e especificada ao valor dado à parcela ou parcelas impugnadas."},{"evento":"Redação original","ato":"Res. 22/1993","data":"1993-12-28","observacao":"Redação original (revisão da Súmula nº 41) - Res. 22/1993, DJ 21, 28.12.1993 e 04.01.1994"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 330 Quitação. Validade. Revisão da Súmula nº 41\nA quitação passada pelo empregado, com assistência de Entidade Sindical de sua categoria, ao empregador, com observância dos requisitos exigidos nos parágrafos do art. 477 da Consolidação das Leis do Trabalho, tem eficácia liberatória em relação às parcelas expressamente consignadas no recibo."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-331","tribunal":"TST","tipo":"sumula","numero":331,"teor":"CONTRATO DE PRESTAÇÃO DE SERVIÇOS. LEGALIDADE.\n\nI - A contratação de trabalhadores por empresa interposta é ilegal, formando-se o vínculo diretamente com o tomador dos serviços, salvo no caso de trabalho temporário (Lei nº 6.019, de 03.01.1974). (item I cancelado por perda de eficácia a partir de 11.11.2017, pela Lei 13.467/2017. Res. 225/2025, DEJT divulgado em 30.06, 01 e 02.07.2025)\nII - A contratação irregular de trabalhador, mediante empresa interposta, não gera vínculo de emprego com os órgãos da Administração Pública direta, indireta ou fundacional (art. 37, II, da CF/1988).\nIII - Não forma vínculo de emprego com o tomador a contratação de serviços de vigilância (Lei nº 7.102, de 20.06.1983) e de conservação e limpeza, bem como a de serviços especializados ligados à atividade-meio do tomador, desde que inexistente a pessoalidade e a subordinação direta.\nIV - O inadimplemento das obrigações trabalhistas, por parte do empregador, implica a responsabilidade subsidiária do tomador dos serviços quanto àquelas obrigações, desde que haja participado da relação processual e conste também do título executivo judicial.\nV - Os entes integrantes da Administração Pública direta e indireta respondem subsidiariamente, nas mesmas condições do item IV, caso evidenciada a sua conduta culposa no cumprimento das obrigações da Lei n.º 8.666, de 21.06.1993, especialmente na fiscalização do cumprimento das obrigações contratuais e legais da prestadora de serviço como empregadora. A aludida responsabilidade não decorre de mero inadimplemento das obrigações trabalhistas assumidas pela empresa regularmente contratada.\nVI - A responsabilidade subsidiária do tomador de serviços abrange todas as verbas decorrentes da condenação referentes ao período da prestação laboral.","status":"em_vigor","temas":["Terceirização e responsabilidade","Salário e remuneração","Estabilidade e garantias de emprego"],"historico":[{"evento":"Cancelamento","ato":"Res. 225/2025","data":"2025-07-02","observacao":"Item I cancelado por perda de eficácia a partir de 11.11.2017, pela Lei 13.467/2017. Res. 225/2025, DEJT divulgado em 30.06, 01 e 02.07.2025"},{"evento":"Nova redação","ato":"Res. 174/2011","data":"2011-05-31","observacao":"Nova redação do item IV e inseridos os itens V e VI à redação - Res. 174/2011, DEJT divulgado em 27, 30 e 31.05.2011"},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Nova redação","ato":"Res. 96/2000","data":"2000-09-20","observacao":"Súmula alterada (inciso IV) - Res. 96/2000, DJ 18, 19 e 20.09.2000"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 331 (...)\nIV - O inadimplemento das obrigações trabalhistas, por parte do empregador, implica a responsabilidade subsidiária do tomador dos serviços, quanto àquelas obrigações, inclusive quanto aos órgãos da administração direta, das autarquias, das fundações públicas, das empresas públicas e das sociedades de economia mista, desde que hajam participado da relação processual e constem também do título executivo judicial (art. 71 da Lei nº 8.666, de 21.06.1993)."},{"evento":"Redação original","ato":"Res. 23/1993","data":"1993-12-28","observacao":"Redação original (revisão da Súmula nº 256) - Res. 23/1993, DJ 21, 28.12.1993 e 04.01.1994"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 331 (...)\nII - A contratação irregular de trabalhador, através de empresa interposta, não gera vínculo de emprego com os órgãos da Administração Pública Direta, Indireta ou Fundacional (art. 37, II, da Constituição da República).\n(...)\nIV - O inadimplemento das obrigações trabalhistas, por parte do empregador, implica na responsabilidade subsidiária do tomador dos serviços, quanto àquelas obrigações, desde que hajam participado da relação processual e constem também do título executivo judicial."}],"observacao":null,"alerta":{"texto":"No julgamento conjunto da ADPF 324 e do RE 958.252 (Tema 725 da repercussão geral) o STF fixou a licitude da terceirização de toda e qualquer atividade, inclusive a atividade fim. Confira o alcance atual dos itens que o TST manteve.","fonte_url":"https://portal.stf.jus.br/jurisprudenciaRepercussao/verAndamentoProcesso.asp?incidente=4952236&numeroProcesso=958252&classeProcesso=RE&numeroTema=725"},"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-332","tribunal":"TST","tipo":"sumula","numero":332,"teor":"COMPLEMENTAÇÃO DE APOSENTADORIA. PETROBRAS. MANUAL DE PESSOAL. NORMA PROGRAMÁTICA.\n\nAs normas relativas à complementação de aposentadoria, inseridas no Manual de Pessoal da Petrobras, têm caráter meramente programático, delas não resultando direito à referida complementação.","status":"em_vigor","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Manutenção","ato":"Res. 50/1995","data":"1995-09-25","observacao":"Súmula mantida - Res. 50/1995 - DJ 21, 22 e 25.09.1995"},{"evento":"Redação original","ato":"Res. 24/1994","data":"1994-05-18","observacao":"Redação original - Res. 24/1994, DJ 12, 16 e 18.05.1994"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-333","tribunal":"TST","tipo":"sumula","numero":333,"teor":"RECURSOS DE REVISTA. CONHECIMENTO.\n\nNão ensejam recurso de revista decisões superadas por iterativa, notória e atual jurisprudência do Tribunal Superior do Trabalho.","status":"em_vigor","temas":["Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 155/2009","data":"2009-03-02","observacao":"(alterada) - Res. 155/2009, DEJT 26 e 27.02.2009 e 02.03.2009"},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Nova redação","ato":"Res. 99/2000","data":"2000-09-20","observacao":"Súmula alterada - Res. 99/2000, DJ 18, 19 e 20.09.2000"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 333 Recursos de Revista e de Embargos. Conhecimento\nNão ensejam recursos de revista ou de embargos decisões superadas por iterativa, notória e atual jurisprudência do Tribunal Superior do Trabalho."},{"evento":"Redação original","ato":"Res. 25/1994","data":"1994-05-18","observacao":"Redação original (revisão da Súmula nº 42) - Res. 25/1994, DJ 12, 16 e 18.05.1994"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 333 Recurso de Revista. Embargos. Não conhecimento. Revisão do Enunciado nº 42\nNão ensejam recursos de revista ou de embargos decisões superadas por iterativa, notória e atual jurisprudência da Seção Especializada em Dissídios Individuais."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-334","tribunal":"TST","tipo":"sumula","numero":334,"teor":"COMPETÊNCIA. AÇÃO DE CUMPRIMENTO. SINDICATO. DESCONTO ASSISTENCIAL.\n\nA Justiça do Trabalho é incompetente para julgar ação na qual o sindicato, em nome próprio, pleiteia o recolhimento de desconto assistencial previsto em convenção ou acordo coletivos.","status":"cancelada","temas":["Direito coletivo e sindical"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelamento mantido) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Cancelamento","ato":"Res. 59/1996","data":"1996-06-28","observacao":"Súmula cancelada - Res. 59/1996, DJ 28.06.1996, 03, 04 e 05.07.1996"},{"evento":"Redação original","ato":"Res. 26/1994","data":"1994-05-19","observacao":"Redação original (revisão da Súmula nº 224) - Res. 26/1994, DJ 12, 17 e 19.05.1994"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-335","tribunal":"TST","tipo":"sumula","numero":335,"teor":"EMBARGOS PARA A SEÇÃO ESPECIALIZADA EM DISSÍDIOS INDIVIDUAIS CONTRA DECISÃO EM AGRAVO DE INSTRUMENTO OPOSTO A DESPACHO DENEGATÓRIO DE RECURSO DE REVISTA.\n\nSão incabíveis embargos para a Seção Especializada em Dissídios Individuais contra decisão proferida em agravo de instrumento oposto a despacho denegatório de recurso de revista, salvo quando a controvérsia se referir a pressupostos extrínsecos do próprio agravo.","status":"cancelada","temas":["Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Revista pela Súmula nº 353 - Res. 70/1997, DJ 30.05.1997 e 04, 05 e 06.06.1997"},{"evento":"Redação original","ato":"Res. 27/1994","data":"1994-05-19","observacao":"Redação original (revisão da Súmula nº 183) - Res. 27/1994, DJ 12, 17 e 19.05.1994"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-336","tribunal":"TST","tipo":"sumula","numero":336,"teor":"CONSTITUCIONALIDADE. § 2º DO ART. 9º DO DECRETO-LEI Nº 1.971, DE 30.11.1982.\n\nÉ constitucional o § 2º do art. 9º do Decreto-Lei nº 1.971, de 30.11.1982, com a redação dada pelo Decreto-Lei nº 2.100, de 28.12.1983.","status":"em_vigor","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 34/1994","data":"1994-10-14","observacao":"Redação original - Res. 34/1994, DJ 10, 13 e 14.10.1994"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-337","tribunal":"TST","tipo":"sumula","numero":337,"teor":"COMPROVAÇÃO DE DIVERGÊNCIA JURISPRUDENCIAL. RECURSOS DE REVISTA E DE EMBARGOS.\n\nI - Para comprovação da divergência justificadora do recurso, é necessário que o recorrente:\na) Junte certidão ou cópia autenticada do acórdão paradigma ou cite a fonte oficial ou o repositório autorizado em que foi publicado; e\nb) Transcreva, nas razões recursais, as ementas e/ou trechos dos acórdãos trazidos à configuração do dissídio, demonstrando o conflito de teses que justifique o conhecimento do recurso, ainda que os acórdãos já se encontrem nos autos ou venham a ser juntados com o recurso.\nII - A concessão de registro de publicação como repositório autorizado de jurisprudência do TST torna válidas todas as suas edições anteriores.\nIII - A mera indicação da data de publicação, em fonte oficial, de aresto paradigma é inválida para comprovação de divergência jurisprudencial, nos termos do item I, -a-, desta súmula, quando a parte pretende demonstrar o conflito de teses mediante a transcrição de trechos que integram a fundamentação do acórdão divergente, uma vez que só se publicam o dispositivo e a ementa dos acórdãos;\nIV - É válida para a comprovação da divergência jurisprudencial justificadora do recurso a indicação de aresto extraído de repositório oficial na internet, desde que o recorrente:\na) transcreva o trecho divergente;\nb) aponte o sítio de onde foi extraído; e\nc) decline o número do processo, o órgão prolator do acórdão e a data da respectiva publicação no Diário Eletrônico da Justiça do Trabalho.\nV - A existência do código de autenticidade na cópia, em formato pdf, do inteiro teor do aresto paradigma, juntada aos autos, torna-a equivalente ao documento original e também supre a ausência de indicação da fonte oficial de publicação.","status":"em_vigor","temas":["Salário e remuneração","Recursos e prazos","Provas e ônus da prova"],"historico":[{"evento":"Nova redação","ato":"Res. 220/2017","data":"2017-09-25","observacao":"(incluído o item V) - Res. 220/2017, DEJT divulgado em 21, 22 e 25.09.2017"},{"evento":"Nova redação","ato":"Res. 185/2012","data":"2012-09-14","observacao":"Súmula alterada - (redação do item IV alterada na sessão do Tribunal Pleno realizada em 14.09.2012) - Res. 185/2012, DEJT divulgado em 25, 26 e 27.09.2012"},{"evento":"Nova redação","ato":"Res. 173/2010","data":"2010-11-16","observacao":"Súmula alterada - (redação alterada pelo Tribunal Pleno em sessão realizada em 16.11.2010, em decorrência da inclusão dos itens III e IV) - Res. 173/2010, DEJT divulgado em 19, 22 e 23.11.2010"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"IV - É válida para a comprovação da divergência jurisprudencial justificadora do recurso a indicação de aresto extraído de repositório oficial na internet, sendo necessário que o recorrente transcreva o trecho divergente e aponte o sítio de onde foi extraído com a devida indicação do endereço do respectivo conteúdo na rede (URL - Universal Resource Locator)."},{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"Súmula alterada (Incorporada a Orientação Jurisprudencial nº 317 da SBDI-1) - Res. 129/2005, DJ 20, 22 e 25.04.2005"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 337 Comprovação de divergência jurisprudencial. Recursos de revista e de embargos\nI - Para comprovação da divergência justificadora do recurso, é necessário que o recorrente:\na) Junte certidão ou cópia autenticada do acórdão paradigma ou cite a fonte oficial ou o repositório autorizado em que foi publicado; e\nb) Transcreva, nas razões recursais, as ementas e/ou trechos dos acórdãos trazidos à configuração do dissídio, demonstrando o conflito de teses que justifique o conhecimento do recurso, ainda que os acórdãos já se encontrem nos autos ou venham a ser juntados com o recurso. (ex-Súmula nº 337 - alterada pela Res. 121/2003, DJ 21.11.2003)\nII - A concessão de registro de publicação como repositório autorizado de jurisprudência do TST torna válidas todas as suas edições anteriores. (ex-OJ nº 317 da SBDI-1 - DJ 11.08.2003)"},{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula alterada - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 337 Comprovação de divergência jurisprudencial. Recursos de revista e de embargos\nPara comprovação da divergência justificadora do recurso, é necessário que o recorrente:\nI - Junte certidão ou cópia autenticada do acórdão paradigma ou cite a fonte oficial ou o repositório autorizado em que foi publicado; e\nII - Transcreva, nas razões recursais, as ementas e/ou trechos dos acórdãos trazidos à configuração do dissídio, demonstrando o conflito de teses que justifique o conhecimento do recurso, ainda que os acórdãos já se encontrem nos autos ou venham a ser juntados com o recurso."},{"evento":"Redação original","ato":"Res. 35/1994","data":"1994-11-22","observacao":"Redação original (revisão da Súmula nº 38) - Res. 35/1994, DJ 18, 21 e 22.11.1994 - Republicada DJ 30.11, 01 e 02.12.1994"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 337 Comprovação de divergência jurisprudencial. Recursos de revista e de embargos.Revisão do Enunciado nº 38\nPara comprovação da divergência justificadora do recurso, é necessário que o recorrente:\nI - Junte certidão ou cópia autenticada do acórdão paradigma ou cite a fonte oficial ou repositório autorizado em que foi publicado; e\nII - Transcreva, nas razões recursais, as ementas e/ou trechos dos acórdãos trazidos à configuração do dissídio, mencionando as teses que identifiquem os casos confrontados, ainda que os acórdãos já se encontrem nos autos ou venham a ser juntados com o recurso."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-338","tribunal":"TST","tipo":"sumula","numero":338,"teor":"JORNADA DE TRABALHO. REGISTRO. ÔNUS DA PROVA.\n\nI - É ônus do empregador que conta com mais de 10 (dez) empregados o registro da jornada de trabalho na forma do art. 74, § 2º, da CLT. A não-apresentação injustificada dos controles de freqüência gera presunção relativa de veracidade da jornada de trabalho, a qual pode ser elidida por prova em contrário. (ex-Súmula nº 338 - alterada pela Res. 121/2003, DJ 21.11.2003)\nII - A presunção de veracidade da jornada de trabalho, ainda que prevista em instrumento normativo, pode ser elidida por prova em contrário. (ex-OJ nº 234 da SBDI-1 - inserida em 20.06.2001)\nIII - Os cartões de ponto que demonstram horários de entrada e saída uniformes são inválidos como meio de prova, invertendo-se o ônus da prova, relativo às horas extras, que passa a ser do empregador, prevalecendo a jornada da inicial se dele não se desincumbir. (ex-OJ nº 306 da SBDI-1- DJ 11.08.2003)","status":"em_vigor","temas":["Jornada e horas extras","Salário e remuneração","Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"(incorporadas as Orientações Jurisprudenciais nºs 234 e 306 da SBDI-1) - Res. 129/2005, DJ 20, 22 e 25.04.2005"},{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula alterada - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 338 Jornada. Registro. Ônus da prova\nÉ ônus do empregador que conta com mais de 10 (dez) empregados o registro da jornada de trabalho na forma do art. 74, § 2º, da CLT. A não apresentação injustificada dos controles de freqüência gera presunção relativa de veracidade da jornada de trabalho, a qual pode ser elidida por prova em contrário."},{"evento":"Redação original","ato":"Res. 36/1994","data":"1994-11-22","observacao":"Redação original - Res. 36/1994, DJ 18, 21 e 22.11.1994"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 338 Registro de horário. Inversão do ônus da prova\nA omissão injustificada por parte da empresa de cumprir determinação judicial de apresentação dos registros de horário (CLT, art. 74 § 2º) importa em presunção de veracidade da jornada de trabalho alegada na inicial, a qual pode ser elidida por prova em contrário."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-339","tribunal":"TST","tipo":"sumula","numero":339,"teor":"CIPA. SUPLENTE. GARANTIA DE EMPREGO. CF/1988.\n\nI - O suplente da CIPA goza da garantia de emprego prevista no art. 10, II, \"a\", do ADCT a partir da promulgação da Constituição Federal de 1988. (ex-Súmula nº 339 - Res. 39/1994, DJ 22.12.1994 - e ex-OJ nº 25 da SBDI-1 - inserida em 29.03.1996). - Entendimento do intem I reafirmado no IRR nº 284.\nII - A estabilidade provisória do cipeiro não constitui vantagem pessoal, mas garantia para as atividades dos membros da CIPA, que somente tem razão de ser quando em atividade a empresa. Extinto o estabelecimento, não se verifica a despedida arbitrária, sendo impossível a reintegração e indevida a indenização do período estabilitário. (ex-OJ nº 329 da SBDI-1 - DJ 09.12.2003). - Entendimento do item II reafirmado no IRR nº 281.","status":"em_vigor","temas":["Estabilidade e garantias de emprego","Rescisão e verbas rescisórias","Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"(incorporadas as Orientações Jurisprudenciais nºs 25 e 329 da SBDI-1 - Res. 129/2005, DJ 20, 22 e 25.04.2005).\nIRR-284 ESTABILIDADE PROVISÓRIA. SUPLENTE DA CIPA. GARANTIA DE EMPREGO. (RR-0001708-34.2023.5.12.0030, Tribunal Pleno, publicado em 03.09.2025, rel. Min. Aloysio Silva Corrêa da Veiga)\nO suplente da CIPA goza da garantia de emprego prevista no art. 10, II, \"a\", do ADCT a partir da promulgação da Constituição da República de 1988.\nIRR-281 MEMBRO DA CIPA. ESTABILIDADE PROVISÓRIA. EXTINÇÃO DO ESTABELECIMENTO. (RR-0000290-29.2024.5.21.0013, Tribunal Pleno, publicado em 03.09.2025, rel. Min. Aloysio Silva Corrêa da Veiga)\nA estabilidade provisória do cipeiro não constitui vantagem pessoal, mas garantia para as atividades dos membros da CIPA, que somente tem razão de ser quando em atividade a empresa. Extinto o estabelecimento, não se verifica a despedida arbitrária, sendo impossível a reintegração e indevida a indenização do período estabilitário."},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 39/1994","data":"1994-12-22","observacao":"Redação original - Res. 39/1994, DJ 20, 21 e 22.12.1994"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 339 CIPA. Suplente. Garantia de emprego. CF/88.\nO suplente da CIPA goza da garantia de emprego prevista no art. 10, inciso II, alínea a, do ADCT da Constituição da República de 1988."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-340","tribunal":"TST","tipo":"sumula","numero":340,"teor":"COMISSIONISTA. HORAS EXTRAS.\n\nO empregado, sujeito a controle de horário, remunerado à base de comissões, tem direito ao adicional de, no mínimo, 50% (cinqüenta por cento) pelo trabalho em horas extras, calculado sobre o valor-hora das comissões recebidas no mês, considerando-se como divisor o número de horas efetivamente trabalhadas.","status":"em_vigor","temas":["Jornada e horas extras","Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(nova redação) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 40/1995","data":"1995-02-21","observacao":"Redação original (revisão da Súmula nº 56) - Res. 40/1995, DJ 17, 20 e 21.02.1995"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 340 Comissionista. Horas extras. Revisão do Enunciado nº 56\nO empregado, sujeito a controle de horário, remunerado à base de comissões, tem direito ao adicional de, no mínimo, 50% (cinqüenta por cento) pelo trabalho em horas extras, calculado sobre o valor das comissões a elas referentes."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-341","tribunal":"TST","tipo":"sumula","numero":341,"teor":"HONORÁRIOS DO ASSISTENTE TÉCNICO.\n\nA indicação do perito assistente é faculdade da parte, a qual deve responder pelos respectivos honorários, ainda que vencedora no objeto da perícia.","status":"em_vigor","temas":["Honorários, custas e justiça gratuita","Provas e ônus da prova"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 44/1995","data":"1995-03-24","observacao":"Redação original - Res. 44/1995, DJ 22, 23 e 24.03.1995"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-342","tribunal":"TST","tipo":"sumula","numero":342,"teor":"DESCONTOS SALARIAIS. ART. 462 DA CLT.\n\nDescontos salariais efetuados pelo empregador, com a autorização prévia e por escrito do empregado, para ser integrado em planos de assistência odontológica, médico-hospitalar, de seguro, de previdência privada, ou de entidade cooperativa, cultural ou recreativo-associativa de seus trabalhadores, em seu benefício e de seus dependentes, não afrontam o disposto no art. 462 da CLT, salvo se ficar demonstrada a existência de coação ou de outro defeito que vicie o ato jurídico.","status":"em_vigor","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 47/1995","data":"1995-04-25","observacao":"Redação original - Res. 47/1995, DJ 20, 24 e 25.04.1995"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 342 Descontos salariais - Art. 462, CLT.\nDescontos salariais efetuados pelo empregador, com a autorização prévia e por escrito do empregado, para ser integrado em planos de assistência odontológica, médico-hospitalar, de seguro, de previdência privada, ou de entidade cooperativa, cultural ou recreativa associativa dos seus trabalhadores, em seu benefício e dos seus dependentes, não afrontam o disposto no art. 462 da CLT, salvo se ficar demonstrada a existência de coação ou de outro defeito que vicie o ato jurídico."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-343","tribunal":"TST","tipo":"sumula","numero":343,"teor":"BANCÁRIO. HORA DE SALÁRIO.\n\nO bancário sujeito à jornada de 8 (oito) horas (art. 224, § 2º, da CLT), após a CF/1988, tem salário-hora calculado com base no divisor 220 (duzentos e vinte), não mais 240 (duzentos e quarenta).","status":"cancelada","temas":["Jornada e horas extras","Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 185/2012","data":"2012-09-27","observacao":"(cancelada) - Res. 185/2012, DEJT divulgado em 25, 26 e 27.09.2012"},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 48/1995","data":"1995-09-01","observacao":"Redação original (revisão da Súmula nº 267) - Res. 48/1995, DJ 30, 31.08 e 01.09.1995"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 343 Bancário. Salário hora. Divisor. Revisão do Enunciado nº 267.\nO bancário sujeito à jornada de oito horas (art. 224, § 2º, da CLT), após a Constituição da República de 1988, tem salário-hora calculado com base no divisor 220, não mais 240."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-344","tribunal":"TST","tipo":"sumula","numero":344,"teor":"SALÁRIO-FAMÍLIA. TRABALHADOR RURAL.\n\nO salário-família é devido aos trabalhadores rurais somente após a vigência da Lei nº 8.213, de 24.07.1991.","status":"em_vigor","temas":["Salário e remuneração","Contrato e vínculo de emprego"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 51/1995","data":"1995-09-25","observacao":"Redação original (revisão da Súmula nº 227) - Res. 51/1995, DJ 21, 22 e 25.09.1995"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-345","tribunal":"TST","tipo":"sumula","numero":345,"teor":"BANDEPE. REGULAMENTO INTERNO DE PESSOAL NÃO CONFERE ESTABILIDADE AOS EMPREGADOS.\n\nO Regulamento Interno de Pessoal (RIP) do Banco do Estado de Pernambuco - BANDEPE, na parte que trata de seu regime disciplinar, não confere estabilidade aos seus empregados.","status":"em_vigor","temas":["Estabilidade e garantias de emprego"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 54/1996","data":"1996-04-23","observacao":"Redação original - Res. 54/1996, DJ 19, 22 e 23.04.1996 - Republicada DJ 09, 10 e 13.05.1996"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 345 Bandepe - Regulamento interno de pessoal não confere estabilidade aos empregados.\nO Regulamento Interno de Pessoal (RIP) do Banco do Estado de Pernambuco - BANDEPE, na parte que trata do seu regime disciplinar, não confere estabilidade em favor dos seus empregados."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-346","tribunal":"TST","tipo":"sumula","numero":346,"teor":"DIGITADOR. INTERVALOS INTRAJORNADA. APLICAÇÃO ANALÓGICA DO ART. 72 DA CLT.\n\nOs digitadores, por aplicação analógica do art. 72 da CLT, equiparam-se aos trabalhadores nos serviços de mecanografia (datilografia, escrituração ou cálculo), razão pela qual têm direito a intervalos de descanso de 10 (dez) minutos a cada 90 (noventa) de trabalho consecutivo.","status":"em_vigor","temas":["Jornada e horas extras"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 56/1996","data":"1996-07-05","observacao":"Redação original - Res. 56/1996, DJ 28.06, 03, 04 e 05.07.1996"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 346 Digitador. Intervalos intrajornada. Aplicação analógica do art. 72, CLT.\nOs digitadores, por aplicação analógica do art. 72 da CLT, equiparam-se aos trabalhadores nos serviços de mecanografia (datilografia, escrituração ou cálculo), razão pela qual têm direito a intervalos de descanso de dez (10) minutos a cada noventa (90) de trabalho consecutivo."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-347","tribunal":"TST","tipo":"sumula","numero":347,"teor":"HORAS EXTRAS HABITUAIS. APURAÇÃO. MÉDIA FÍSICA.\n\nO cálculo do valor das horas extras habituais, para efeito de reflexos em verbas trabalhistas, observará o número de horas efetivamente prestadas e a ele aplica-se o valor do salário-hora da época do pagamento daquelas verbas.","status":"em_vigor","temas":["Jornada e horas extras","Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 57/1996","data":"1996-07-05","observacao":"Redação original - Res. 57/1996, DJ 28.06, 03, 04 e 05.07.1996"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 347 Horas extras habituais. Apuração. Média.\nO cálculo do valor das horas extras habituais, para efeito de reflexos em verbas trabalhistas, observará o número das horas efetivamente prestadas e sobre ele aplica-se o valor do salário-hora da época do pagamento daquelas verbas."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-348","tribunal":"TST","tipo":"sumula","numero":348,"teor":"AVISO PRÉVIO. CONCESSÃO NA FLUÊNCIA DA GARANTIA DE EMPREGO. INVALIDADE.\n\nÉ inválida a concessão do aviso prévio na fluência da garantia de emprego, ante a incompatibilidade dos dois institutos.","status":"em_vigor","temas":["Estabilidade e garantias de emprego","Rescisão e verbas rescisórias"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003). - Entendimento reafirmado no IRR nº 262.\nIRR-262 AVISO-PRÉVIO. CONCESSÃO NA FLUÊNCIA DA GARANTIA DE EMPREGO. INVALIDADE. (RR-0020279-36.2023.5.04.0334, Tribunal Pleno, publicado em 29.08.2025, rel. Min. Aloysio Silva Corrêa da Veiga)\nÉ inválida a concessão do aviso-prévio na fluência da garantia de emprego, ante a incompatibilidade dos dois institutos."},{"evento":"Redação original","ato":"Res. 58/1996","data":"1996-07-05","observacao":"Redação original - Res. 58/1996, DJ 28.06, 03, 04 e 05.07.1996"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-349","tribunal":"TST","tipo":"sumula","numero":349,"teor":"ACORDO DE COMPENSAÇÃO DE HORÁRIO EM ATIVIDADE INSALUBRE, CELEBRADO POR ACORDO COLETIVO. VALIDADE.\n\nA validade de acordo coletivo ou convenção coletiva de compensação de jornada de trabalho em atividade insalubre prescinde da inspeção prévia da autoridade competente em matéria de higiene do trabalho (art. 7º, XIII, da CF/1988; art. 60 da CLT).","status":"cancelada","temas":["Adicionais (insalubridade, periculosidade e outros)","Jornada e horas extras","Direito coletivo e sindical"],"historico":[{"evento":"Nova redação","ato":"Res. 174/2011","data":"2011-05-31","observacao":"(cancelada) - Res. 174/2011, DEJT divulgado em 27, 30 e 31.05.2011"},{"evento":"Manutenção","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 60/1996","data":"1996-07-10","observacao":"Redação original - Res. 60/1996, DJ 08, 09 e 10.07.1996"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 349 Acordo de compensação de horário em atividade insalubre, celebrado por acordo coletivo. Validade.\nA validade do acordo coletivo ou convenção coletiva de compensação de jornada de trabalho em atividade insalubre prescinde da inspeção prévia da autoridade competente em matéria de higiene do trabalho. (art. 7º, XIII, da Constituição da República; art. 60 da CLT)"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-350","tribunal":"TST","tipo":"sumula","numero":350,"teor":"PRESCRIÇÃO. TERMO INICIAL. AÇÃO DE CUMPRIMENTO. SENTENÇA NORMATIVA.\n\nO prazo de prescrição com relação à ação de cumprimento de decisão normativa flui apenas da data de seu trânsito em julgado.","status":"em_vigor","temas":["Direito coletivo e sindical","Prescrição e decadência"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 62/1996","data":"1996-10-11","observacao":"Redação original - Res. 62/1996, DJ 04, 09 e 10 e 11.10.1996"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-351","tribunal":"TST","tipo":"sumula","numero":351,"teor":"PROFESSOR. REPOUSO SEMANAL REMUNERADO. ART. 7º, § 2º, DA LEI Nº 605, DE 05.01.1949 E ART. 320 DA CLT.\n\nO professor que recebe salário mensal à base de hora-aula tem direito ao acréscimo de 1/6 a título de repouso semanal remunerado, considerando-se para esse fim o mês de quatro semanas e meia.","status":"em_vigor","temas":["Férias, 13º e descansos","Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 68/1997","data":"1997-06-06","observacao":"Redação original - Res. 68/1997, DJ 30.05, 04, 05 e 06.06.1997"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 351 Professor. Repouso semanal remunerado. Lei nº 605/1949, art. 7º, § 2º, e art. 320 da CLT."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-352","tribunal":"TST","tipo":"sumula","numero":352,"teor":"CUSTAS - PRAZO PARA COMPROVAÇÃO.\n\nO prazo para comprovação do pagamento das custas, sempre a cargo da parte, é de 5 (cinco) dias contados do seu recolhimento (CLT art. 789, § 4º - CPC, art. 185).","status":"cancelada","temas":["Honorários, custas e justiça gratuita","Provas e ônus da prova"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelamento mantido) - Res. 121/2003, DJ 19, 20 e 21.11.2003 - Referência Lei nº 10.537/2002"},{"evento":"Cancelamento","ato":"Res. 114/2002","data":"2002-11-28","observacao":"Súmula cancelada - Res. 114/2002, DJ 28.11.2002"},{"evento":"Redação original","ato":"Res. 69/1997","data":"1997-06-06","observacao":"Redação original - Res. 69/1997, DJ 30.05, 04, 05 e 06.06.1997"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-353","tribunal":"TST","tipo":"sumula","numero":353,"teor":"EMBARGOS. AGRAVO. CABIMENTO.\n\nNão cabem embargos para a Seção de Dissídios Individuais de decisão de Turma proferida em agravo, salvo: a) da decisão que não conhece de agravo de instrumento ou de agravo pela ausência de pressupostos extrínsecos;\nb) da decisão que nega provimento a agravo contra decisão monocrática do Relator, em que se proclamou a ausência de pressupostos extrínsecos de agravo de instrumento;\nc) para revisão dos pressupostos extrínsecos de admissibilidade do recurso de revista, cuja ausência haja sido declarada originariamente pela Turma no julgamento do agravo;\nd) para impugnar o conhecimento de agravo de instrumento;\ne) para impugnar a imposição de multas previstas nos arts. 1.021, § 4º, do CPC de 2015 ou 1.026, § 2º, do CPC de 2015 (art. 538, parágrafo único, do CPC de 1973, ou art. 557, § 2º, do CPC de 1973).\nf) contra decisão de Turma proferida em agravo em recurso de revista, nos termos do art. 894, II, da CLT.","status":"em_vigor","temas":["Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 208/2016","data":"2016-04-26","observacao":"(atualizada em decorrência do CPC de 2015) - Res. 208/2016, DEJT divulgado em 22, 25 e 26.04.2016"},{"evento":"Nova redação","ato":"Res. 189/2013","data":"2013-03-15","observacao":"Súmula alterada - Res. 189/2013, DEJT divulgado em 13, 14 e 15.03.2013"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 353. Embargos. Agravo. Cabimento (nova redação da letra \"f\" em decorrência do julgamento do processo TST-IUJ-28000-95.2007.5.02.0062)\nNão cabem embargos para a Seção de Dissídios Individuais de decisão de Turma proferida em agravo, salvo:\na) da decisão que não conhece de agravo de instrumento ou de agravo pela ausência de pressupostos extrínsecos;\nb) da decisão que nega provimento a agravo contra decisão monocrática do Relator, em que se proclamou a ausência de pressupostos extrínsecos de agravo de instrumento;\nc) para revisão dos pressupostos extrínsecos de admissibilidade do recurso de revista, cuja ausência haja sido declarada originariamente pela Turma no julgamento do agravo;\nd) para impugnar o conhecimento de agravo de instrumento;\ne) para impugnar a imposição de multas previstas no art. 538, parágrafo único, do CPC, ou no art. 557, § 2º, do CPC.\nf) contra decisão de Turma proferida em agravo em recurso de revista, nos termos do art. 894, II, da CLT.\nLetra \"f\" alterada (incorporada a Orientação Jurisprudencial nº 293 da SBDI-1 com nova redação como letra f) - Res. 171/2010, DEJT 19, 22 e 23.11.2010\nf) contra decisão de Turma proferida em Agravo interposto de decisão monocrática\ndo relator, baseada no art. 557, § 1º-A, do CPC. (ex-OJ nº 293 da SBDI-1 com nova redação)"},{"evento":"Nova redação","ato":"Res. 128/2005","data":"2005-03-16","observacao":"Súmula alterada - (nova redação) - Res. 128/2005, DJ 14, 15 e 16.03.2005"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 353 Embargos. Agravo. Cabimento.\nNão cabem embargos para a Seção de Dissídios Individuais de decisão de Turma proferida em agravo, salvo: a) da decisão que não conhece de agravo de instrumento ou de agravo pela ausência de pressupostos extrínsecos; b) da decisão que nega provimento a agravo contra decisão monocrática do Relator, em que se proclamou a ausência de pressupostos extrínsecos de agravo de instrumento; c) para revisão dos pressupostos extrínsecos de admissibilidade do recurso de revista, cuja ausência haja sido declarada originariamente pela Turma no julgamento do agravo; d) para impugnar o conhecimento de agravo de instrumento; e) para impugnar a imposição de multas previstas no art. 538, parágrafo único, do CPC, ou no art. 557, § 2º, do CPC."},{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Súmula alterada - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 353 Embargos. Agravo. Cabimento.\nNão cabem embargos para a Seção de Dissídios Individuais de decisão de Turma proferida em agravo, salvo para reexame dos pressupostos extrínsecos do recurso a que se denegou seguimento no Tribunal Superior do Trabalho."},{"evento":"Redação original","ato":"Res. 70/1997","data":"1997-06-06","observacao":"Redação original - Res. 70/1997, DJ 30.05, 04, 05 e 06.06.1997"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 353 Embargos. Agravo de instrumento. Agravo regimental. Cabimento - Revisão dos Enunciados nºs 195 e 335\nNão cabem embargos para a Seção de Dissídios Individuais contra decisão de Turma proferida em Agravo de Instrumento e em Agravo Regimental, salvo para reexame dos pressupostos extrínsecos dos Agravos ou da Revista respectiva."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-354","tribunal":"TST","tipo":"sumula","numero":354,"teor":"GORJETAS. NATUREZA JURÍDICA. REPERCUSSÕES.\n\nAs gorjetas, cobradas pelo empregador na nota de serviço ou oferecidas espontaneamente pelos clientes, integram a remuneração do empregado, não servindo de base de cálculo para as parcelas de aviso-prévio, adicional noturno, horas extras e repouso semanal remunerado.","status":"em_vigor","temas":["Adicionais (insalubridade, periculosidade e outros)","Jornada e horas extras","Férias, 13º e descansos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida - Res. 121/2003, DJ 19, 20 e 21.11.2003). - Entendimento reafirmado no IRR nº 234.\nIRR-234 GORJETAS. NATUREZA JURÍDICA. REPERCUSSÕES. (RR-0000860-07.2024.5.13.0023, Tribunal Pleno, publicado em 29.08.2025, rel. Min. Aloysio Silva Corrêa da Veiga)\nAs gorjetas, cobradas pelo empregador na nota de serviço ou oferecidas espontaneamente pelos clientes, integram a remuneração do empregado, não servindo de base de cálculo para as parcelas de aviso-prévio, adicional noturno, horas extraordinárias e repouso semanal remunerado."},{"evento":"Redação original","ato":"Res. 71/1997","data":"1997-06-06","observacao":"Redação original (revisão da Súmula nº 290) - Res. 71/1997, DJ 30.05, 04.05 e 06.06.1997"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-355","tribunal":"TST","tipo":"sumula","numero":355,"teor":"CONAB. ESTABILIDADE. AVISO DIREH Nº 2 DE 12.12.1984.\n\nO aviso DIREH nº 2, de 12.12.1984, que concedia estabilidade aos empregados da CONAB, não tem eficácia, porque não aprovado pelo Ministério ao qual a empresa se subordina.","status":"em_vigor","temas":["Estabilidade e garantias de emprego","Provas e ônus da prova"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 72/1997","data":"1997-07-10","observacao":"Redação original - Res. 72/1997, DJ 03, 08, 09 e 10.07.1997"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-356","tribunal":"TST","tipo":"sumula","numero":356,"teor":"ALÇADA RECURSAL. VINCULAÇÃO AO SALÁRIO MÍNIMO.\n\nO art. 2º, § 4º, da Lei nº 5.584, de 26.06.1970, foi recepcionado pela CF/1988, sendo lícita a fixação do valor da alçada com base no salário mínimo.","status":"em_vigor","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida - Res. 121/2003, DJ DJ 19, 20 e 21.11.2003). - Entendimento reafirmado no IRR nº 235.\nIRR-235 ALÇADA RECURSAL. VINCULAÇÃO AO SALÁRIO MÍNIMO. (RR-0001018-76.2024.5.22.0002, Tribunal Pleno, publicado em 02.09.2025, rel. Min. Aloysio Silva Corrêa da Veiga)\nO art. 2º, § 4º, da Lei nº 5.584, de 26.06.1970, foi recepcionado pela Constituição da República de 1988, sendo lícita a fixação do valor da alçada com base no salário mínimo."},{"evento":"Redação original","ato":"Res. 75/1997","data":"1997-12-23","observacao":"Redação original - Res. 75/1997, DJ 19, 22 e 23.12.1997"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 356 Alçada recursal. Vinculação ao salário mínimo.\nO art. 2º, § 4º, da Lei nº 5.584/70 foi recepcionado pela Constituição da República de 1988, sendo lícita a fixação do valor da alçada com base no salário mínimo."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-357","tribunal":"TST","tipo":"sumula","numero":357,"teor":"TESTEMUNHA. AÇÃO CONTRA A MESMA RECLAMADA. SUSPEIÇÃO.\n\nNão torna suspeita a testemunha o simples fato de estar litigando ou de ter litigado contra o mesmo empregador.","status":"em_vigor","temas":["Provas e ônus da prova"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 76/1997","data":"1997-12-23","observacao":"Redação original - Res. 76/1997, DJ 19, 22 e 23.12.1997"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-358","tribunal":"TST","tipo":"sumula","numero":358,"teor":"RADIOLOGISTA. SALÁRIO PROFISSIONAL. LEI Nº 7.394, DE 29.10.1985.\n\nO salário profissional dos técnicos em radiologia é igual a 2 (dois) salários mínimos e não a 4 (quatro).","status":"em_vigor","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 77/1997","data":"1997-12-23","observacao":"Redação original - Res. 77/1997, DJ 19,22 e 23.12.1997"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 358 Radiologista. Salário profissional. Lei nº 7394/85.\nO salário profissional dos técnicos em radiologia é igual a dois salários mínimos e não a quatro."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-359","tribunal":"TST","tipo":"sumula","numero":359,"teor":"SUBSTITUIÇÃO PROCESSUAL. AÇÃO DE CUMPRIMENTO. ART. 872, PARÁGRAFO ÚNICO, DA CLT. FEDERAÇÃO. LEGITIMIDADE.\n\nA federação não tem legitimidade para ajuizar a ação de cumprimento prevista no art. 872, parágrafo único, da CLT na qualidade de substituto processual da categoria profissional inorganizada.","status":"cancelada","temas":["Direito coletivo e sindical","Recursos e prazos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(cancelada) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 78/1997","data":"1997-12-23","observacao":"Redação original - Res. 78/1997, DJ 19, 22 e 23.12.1997"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-360","tribunal":"TST","tipo":"sumula","numero":360,"teor":"TURNOS ININTERRUPTOS DE REVEZAMENTO. INTERVALOS INTRAJORNADA E SEMANAL.\n\nA interrupção do trabalho destinada a repouso e alimentação, dentro de cada turno, ou o intervalo para repouso semanal, não descaracteriza o turno de revezamento com jornada de 6 (seis) horas previsto no art. 7º, XIV, da CF/1988.","status":"em_vigor","temas":["Jornada e horas extras","Férias, 13º e descansos"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003."},{"evento":"Redação original","ato":"Res. 79/1997","data":"1998-01-15","observacao":"Redação original - Res. 79/1997, DJ 13, 14 e 15.01.1998"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 360 Turnos ininterruptos de revezamento. Intervalos intrajornada e semanal.\nA interrupção do trabalho destinada a repouso e alimentação, dentro de cada turno, ou o intervalo para repouso semanal, não descaracteriza o turno de revezamento com jornada de 6 horas previsto no art. 7º, inciso XIV, da Constituição da República de 1988."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-361","tribunal":"TST","tipo":"sumula","numero":361,"teor":"ADICIONAL DE PERICULOSIDADE. ELETRICITÁRIOS. EXPOSIÇÃO INTERMITENTE.\n\nO trabalho exercido em condições perigosas, embora de forma intermitente, dá direito ao empregado a receber o adicional de periculosidade de forma integral, porque a Lei nº 7.369, de 20.09.1985, não estabeleceu nenhuma proporcionalidade em relação ao seu pagamento.","status":"em_vigor","temas":["Adicionais (insalubridade, periculosidade e outros)"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(mantida) - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação original","ato":"Res. 83/1998","data":"1998-08-24","observacao":"Redação original - Res. 83/1998, DJ 20, 21 e 24.08.1998"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-362","tribunal":"TST","tipo":"sumula","numero":362,"teor":"FGTS. PRESCRIÇÃO.\n\nI - Para os casos em que a ciência da lesão ocorreu a partir de 13.11.2014, é quinquenal a prescrição do direito de reclamar contra o não-recolhimento de contribuição para o FGTS, observado o prazo de dois anos após o término do contrato;\nII - Para os casos em que o prazo prescricional já estava em curso em 13.11.2014, aplica-se o prazo prescricional que se consumar primeiro: trinta anos, contados do termo inicial, ou cinco anos, a partir de 13.11.2014 (STF-ARE-709212/DF).","status":"em_vigor","temas":["FGTS","Prescrição e decadência"],"historico":[{"evento":"Nova redação","ato":"Res. 198/2015","data":"2015-06-16","observacao":"(redação alterada) - Res. 198/2015, republicada em razão de erro material - DEJT divulgado em 12, 15 e 16.06.2015"},{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"Nova redação - Res. 121/2003, DJ 19, 20 e 21.11.2003"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 362 FGTS - Prescrição\nÉ trintenária a prescrição do direito de reclamar contra o não-recolhimento da contribuição para o FGTS, observado o prazo de 2 (dois) anos após o término do contrato de trabalho"},{"evento":"Redação original","ato":"Res. 90/1999","data":"1999-09-08","observacao":"Redação original - Res. 90/1999, DJ 03, 06 e 08.09.1999"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 362 FGTS - Prescrição\nExtinto o contrato de trabalho, é de dois anos o prazo prescricional para reclamar em Juízo o não-recolhimento da contribuição do Fundo de Garantia do Tempo de Serviço."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-363","tribunal":"TST","tipo":"sumula","numero":363,"teor":"CONTRATO NULO. EFEITOS.\n\nA contratação de servidor público, após a CF/1988, sem prévia aprovação em concurso público, encontra óbice no respectivo art. 37, II e § 2º, somente lhe conferindo direito ao pagamento da contraprestação pactuada, em relação ao número de horas trabalhadas, respeitado o valor da hora do salário mínimo, e dos valores referentes aos depósitos do FGTS.","status":"em_vigor","temas":["FGTS","Salário e remuneração","Provas e ônus da prova"],"historico":[{"evento":"Nova redação","ato":"Res. 121/2003","data":"2003-11-21","observacao":"(nova redação - Res. 121/2003, DJ 19, 20 e 21.11.2003). - Entendimento reafirmado no IRR nº 233.\nIRR-233 CONTRATO NULO. EFEITOS. (RR-0000796-12.2022.5.08.0118, Tribunal Pleno, publicado em 01.09.2025, rel. Min. Aloysio Silva Corrêa da Veiga)\nA contratação de servidor público, após a Constituição da República de 1988, sem prévia aprovação em concurso público, encontra óbice no respectivo art. 37, II e § 2º, somente lhe conferindo direito ao pagamento da contraprestação pactuada, em relação ao número de horas trabalhadas, respeitado o valor da hora do salário mínimo, e dos valores referentes aos depósitos do FGTS."},{"evento":"Nova redação","ato":"Res. 111/2002","data":"2002-04-15","observacao":"Súmula alterada - Res. 111/2002, DJ 11, 12 e 15.04.2002"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 363 Contrato nulo. Efeitos.\nA contratação de servidor público, após a Constituição de 1988, sem prévia aprovação em concurso público, encontra óbice no seu art. 37, II, e § 2º, somente conferindo-lhe direito ao pagamento da contraprestação pactuada, em relação ao número de horas trabalhadas, respeitado o salário-mínimo/hora."},{"evento":"Redação original","ato":"Res. 97/2000","data":"2000-09-20","observacao":"Redação original - Res. 97/2000, DJ 18, 19 e 20.09.2000 - Republicada DJ 13, 16 e 17.10.2000 - Republicada DJ 10, 13 e 14.11.2000"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"N º 363 Contrato nulo. Efeitos.\nA contratação de servidor público, após a Constituição Federal de 1988, sem prévia aprovação em concurso público, encontra óbice no seu art. 37, II, e § 2º, somente conferindo-lhe direito ao pagamento dos dias efetivamente trabalhados segundo a contraprestação pactuada."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-364","tribunal":"TST","tipo":"sumula","numero":364,"teor":"ADICIONAL DE PERICULOSIDADE. EXPOSIÇÃO EVENTUAL, PERMANENTE E INTERMITENTE.\n\nI - Tem direito ao adicional de periculosidade o empregado exposto permanentemente ou que, de forma intermitente, sujeita-se a condições de risco. Indevido, apenas, quando o contato dá-se de forma eventual, assim considerado o fortuito, ou o que, sendo habitual, dá-se por tempo extremamente reduzido. (ex-Ojs da SBDI-1 nºs 05 - inserida em 14.03.1994 - e 280 - DJ 11.08.2003)\nII - Não é válida a cláusula de acordo ou convenção coletiva de trabalho fixando o adicional de periculosidade em percentual inferior ao estabelecido em lei e proporcional ao tempo de exposição ao risco, pois tal parcela constitui medida de higiene, saúde e segurança do trabalho, garantida por norma de ordem pública (arts. 7º, XXII e XXIII, da CF e 193, §1º, da CLT).","status":"em_vigor","temas":["Adicionais (insalubridade, periculosidade e outros)","Direito coletivo e sindical"],"historico":[{"evento":"Nova redação","ato":"Res. 209/2016","data":"2016-06-03","observacao":"(inserido o item II) - Res. 209/2016, DEJT divulgado em 01, 02 e 03.06.2016"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Res. 174/2011, DEJT divulgado em 27, 30 e 31.05.2011 - cancelado o item II e dada nova redação ao item I"},{"evento":"Redação original","ato":"Res. 129/2005","data":"2005-04-25","observacao":"Redação original - Res. 129/2005, DJ 20, 22 e 25.04.2005"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 364 Adicional de periculosidade. Exposição eventual, permanente e intermitente (conversão das Orientações Jurisprudenciais nºs 5, 258 e 280 da SBDI-1)\nI - Faz jus ao adicional de periculosidade o empregado exposto permanentemente ou que, de forma intermitente, sujeita-se a condições de risco. Indevido, apenas, quando o contato dá-se de forma eventual, assim considerado o fortuito, ou o que, sendo habitual, dá-se por tempo extremamente reduzido. (ex-Ojs da SBDI-1 nºs 05 - inserida em 14.03.1994 - e 280 - DJ 11.08.2003)\nII - A fixação do adicional de periculosidade, em percentual inferior ao legal e proporcional ao tempo de exposição ao risco, deve ser respeitada, desde que pactuada em acordos ou convenções coletivos. (ex-OJ nº 258 da SBDI-1 - inserida em 27.09.2002)"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-365","tribunal":"TST","tipo":"sumula","numero":365,"teor":"ALÇADA. AÇÃO RESCISÓRIA E MANDADO DE SEGURANÇA.\n\nNão se aplica a alçada em ação rescisória e em mandado de segurança. (ex-OJs nºs 8 e 10 da SBDI-1 - inseridas em 01.02.1995)","status":"em_vigor","temas":["Rescisão e verbas rescisórias"],"historico":[{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"(conversão das Orientações Jurisprudenciais nºs 8 e 10 da SBDI-1) - Res. 129/2005, DJ 20, 22 e 25.04.2005"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-366","tribunal":"TST","tipo":"sumula","numero":366,"teor":"CARTÃO DE PONTO. REGISTRO. HORAS EXTRAS. MINUTOS QUE ANTECEDEM E SUCEDEM A JORNADA DE TRABALHO.\n\nNão serão descontadas nem computadas como jornada extraordinária as variações de horário do registro de ponto não excedentes de cinco minutos, observado o limite máximo de dez minutos diários. Se ultrapassado esse limite, será considerada como extra a totalidade do tempo que exceder a jornada normal, pois configurado tempo à disposição do empregador, não importando as atividades desenvolvidas pelo empregado ao longo do tempo residual (troca de uniforme, lanche, higiene pessoal, etc).","status":"cancelada","temas":["Jornada e horas extras"],"historico":[{"evento":"Cancelamento","ato":"Res. 225/2025","data":"2025-07-02","observacao":"Cancelada por perda de eficácia a partir de 11.11.2017, pela Lei 13.467/2017. Res. 225/2025, DEJT divulgado em 30.06, 01 e 02.07.2025"},{"evento":"Nova redação","ato":"Res. 197/2015","data":"2015-05-18","observacao":"Nova redação - Res. 197/2015, DEJT divulgado em 14, 15 e 18.05.2015"},{"evento":"Redação original","ato":"Res. 129/2005","data":"2005-04-25","observacao":"Redação original - Res. 129/2005, DJ 20, 22 e 25.04.2005"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 366 - CARTÃO DE PONTO. REGISTRO. HORAS EXTRAS. MINUTOS QUE ANTECE-DEM E SUCEDEM A JORNADA DE TRABALHO(conversão das Orientações Jurispruden-ciais nºs 23 e 326 da SBDI-1)\nNão serão descontadas nem computadas como jornada extraordinária as variações de horá-rio do registro de ponto não excedentes de cinco minutos, observado o limite máximo de dez minutos diários. Se ultrapassado esse limite, será considerada como extra a totalidade do tempo que exceder a jornada normal. (ex-Ojs da SBDI-1 nºs 23 - inserida em 03.06.1996 - e 326 - DJ 09.12.2003)"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-367","tribunal":"TST","tipo":"sumula","numero":367,"teor":"UTILIDADES \"IN NATURA\". HABITAÇÃO. ENERGIA ELÉTRICA. VEÍCULO. CIGARRO. NÃO INTEGRAÇÃO AO SALÁRIO.\n\nI - A habitação, a energia elétrica e veículo fornecidos pelo empregador ao empregado, quando indispensáveis para a realização do trabalho, não têm natureza salarial, ainda que, no caso de veículo, seja ele utilizado pelo empregado também em atividades particulares. (ex-Ojs da SBDI-1 nºs 131 - inserida em 20.04.1998 e ratificada pelo Tribunal Pleno em 07.12.2000 - e 246 - inserida em 20.06.2001)\nII - O cigarro não se considera salário utilidade em face de sua nocividade à saúde. (ex-OJ nº 24 da SBDI-1 - inserida em 29.03.1996)","status":"em_vigor","temas":["Salário e remuneração"],"historico":[{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"(conversão das Orientações Jurisprudenciais nºs 24, 131 e 246 da SBDI-1) - Res. 129/2005, DJ 20, 22 e 25.04.2005"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-368","tribunal":"TST","tipo":"sumula","numero":368,"teor":"DESCONTOS PREVIDENCIÁRIOS. IMPOSTO DE RENDA. COMPETÊNCIA. RESPONSABILIDADE PELO RECOLHIMENTO. FORMA DE CÁLCULO. FATO GERADOR.\n\nI - A Justiça do Trabalho é competente para determinar o recolhimento das contribuições fiscais. A competência da Justiça do Trabalho, quanto à execução das contribuições previdenciárias, limita-se às sentenças condenatórias em pecúnia que proferir e aos valores, objeto de acordo homologado, que integrem o salário de contribuição. (ex-OJ nº 141 da SBDI-1 - inserida em 27.11.1998).\nII - É do empregador a responsabilidade pelo recolhimento das contribuições previdenciárias e fiscais, resultantes de crédito do empregado oriundo de condenação judicial. A culpa do empregador pelo inadimplemento das verbas remuneratórias, contudo, não exime a responsabilidade do empregado pelos pagamentos do imposto de renda devido e da contribuição previdenciária que recaia sobre sua quota-parte. (ex-OJ nº 363 da SBDI-1, parte final)\nIII - Os descontos previdenciários relativos à contribuição do empregado, no caso de ações trabalhistas, devem ser calculados mês a mês, de conformidade com o art. 276, § 4º, do Decreto n º 3.048/1999 que regulamentou a Lei nº 8.212/1991, aplicando-se as alíquotas previstas no art. 198, observado o limite máximo do salário de contribuição (ex-OJs nºs 32 e 228 da SBDI-1 inseridas, respectivamente, em 14.03.1994 e 20.06.2001).\nIV - Considera-se fato gerador das contribuições previdenciárias decorrentes de créditos trabalhistas reconhecidos ou homologados em juízo, para os serviços prestados até 4.3.2009, inclusive, o efetivo pagamento das verbas, configurando-se a mora a partir do dia dois do mês seguinte ao da liquidação (art. 276, -caput-, do Decreto nº 3.048/1999). Eficácia não retroativa da alteração legislativa promovida pela Medida Provisória nº 449/2008, posteriormente convertida na Lei nº 11.941/2009, que deu nova redação ao art. 43 da Lei nº 8.212/91.\nV - Para o labor realizado a partir de 5.3.2009, considera-se fato gerador das contribuições previdenciárias decorrentes de créditos trabalhistas reconhecidos ou homologados em juízo a data da efetiva prestação dos serviços. Sobre as contribuições previdenciárias não recolhidas a partir da prestação dos serviços incidem juros de mora e, uma vez apurados os créditos previdenciários, aplica-se multa a partir do exaurimento do prazo de citação para pagamento, se descumprida a obrigação, observado o limite legal de 20% (art. 61, § 2º, da Lei nº 9.430/96).\nVI - O imposto de renda decorrente de crédito do empregado recebido acumuladamente deve ser calculado sobre o montante dos rendimentos pagos, mediante a utilização de tabela progressiva resultante da multiplicação da quantidade de meses a que se refiram os rendimentos pelos valores constantes da tabela progressiva mensal correspondente ao mês do recebimento ou crédito, nos termos do art. 12-A da Lei nº 7.713, de 22/12/1988, com a redação conferida pela Lei nº 13.149/2015, observado o procedimento previsto nas Instruções Normativas da Receita Federal do Brasil.","status":"em_vigor","temas":["Salário e remuneração","Competência da Justiça do Trabalho","Execução e penhora"],"historico":[{"evento":"Nova redação","ato":"Res. 219/2017","data":"2017-07-14","observacao":"(aglutinada a parte final da Orientação Jurisprudencial nº 363 da SBDI-I à redação do item II e incluídos os itens IV, V e VI em sessão do Tribunal Pleno realizada em 26.06.2017) - Res. 219/2017, republicada em razão de erro material - DEJT divulgado em 12, 13 e 14.07.2017"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Res. 219/2017, DEJT divulgado em 28, 29 e 30.06.2017\nNº 368 (...)\nV - Para o labor realizado a partir de 5.3.2009, considera-se fato gerador das contribuições previdenciárias decorrentes de créditos trabalhistas reconhecidos ou homologados em juízo a data da efetiva prestação dos serviços. Sobre as contribuições previdenciárias não recolhidas a partir da prestação dos serviços incidem juros de mora e, uma vez apurados os créditos previdenciários, aplica-se multa a partir do exaurimento do prazo de citação para pagamento, se descumprida a obrigação, observado o limite legal de 20% (art. 61, § 2º, da Lei nº 9.460/96)."},{"evento":"Nova redação","ato":"Res. 181/2012","data":"2012-04-16","observacao":"Súmula alterada - (redação do item II alterada na sessão do Tribunal Pleno realizada em 16.04.2012) - Res. 181/2012, DEJT divulgado em 19, 20 e 23.04.2012"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 368 Descntos previdenciários e fiscais. Competência. Responsabilidade pelo pagamento. Forma de cálculo\nI - A Justiça do Trabalho é competente para determinar o recolhimento das contribuições fiscais. A competência da Justiça do Trabalho, quanto à execução das contribuições previdenciárias, limita-se às sentenças condenatórias em pecúnia que proferir e aos valores, objeto de acordo homologado, que integrem o salário de contribuição. (ex-OJ nº 141 da SBDI-1 - inserida em 27.11.1998 )\nII - É do empregador a responsabilidade pelo recolhimento das contribuições previdenciárias e fiscais, resultante de crédito do empregado oriundo de condenação judicial, devendo ser calculadas, em relação à incidência dos descontos fiscais, mês a mês, nos termos do art. 12-A da Lei nº 7.713, de 22/12/1988.\nIII - Em se tratando de descontos previdenciários, o critério de apuração encontra-se disciplinado no art. 276, §4º, do Decreto n º 3.048/1999 que regulamentou a Lei nº 8.212/1991 e determina que a contribuição do empregado, no caso de ações trabalhistas, seja calculada mês a mês, aplicando-se as alíquotas previstas no art. 198, observado o limite máximo do salário de contribuição. (ex-OJs nºs 32 e 228 da SBDI-1 - inseridas, respectivamente, em 14.03.1994 e 20.06.2001)"},{"evento":"Nova redação","ato":"Res. 138/2005","data":"2005-11-25","observacao":"Súmula alterada - (inciso I alterado) - Res. 138/2005, DJ 23, 24 e 25.11.2005"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 368 (...)\nII. É do empregador a responsabilidade pelo recolhimento das contribuições previdenciárias e fiscais, resultante de crédito do empregado oriundo de condenação judicial, devendo incidir, em relação aos descontos fiscais, sobre o valor total da condenação, referente às parcelas tributáveis, calculado ao final, nos termos da Lei nº 8.541, de 23.12.1992, art. 46 e Provimento da CGJT nº 01/1996. (ex-OJs nºs 32 e 228 da SBDI-1 - inseridas, respectivamente, em 14.03.1994 e 20.06.2001)"},{"evento":"Nova redação","ato":null,"data":"2005-05-09","observacao":"Republicada em razão de erro material no item I - DJ 05, 06 e 09.05.2005"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 368 (...)\nI - A Justiça do Trabalho é competente para determinar o recolhimento das contribuições previdenciárias e fiscais provenientes das sentenças que proferir. A competência da Justiça do Trabalho para execução das contribuições previdenciárias alcança as parcelas integrantes do salário de contribuição, pagas em virtude de contrato de emprego reconhecido em juízo, ou decorrentes de anotação da Carteira de Trabalho e Previdência Social - CTPS, objeto de acordo homologado em juízo. (ex-OJ nº 141 da SBDI-1 - inserida em 27.11.1998)"},{"evento":"Redação original","ato":"Res. 129/2005","data":"2005-04-25","observacao":"Redação Original (conversão das Orientações Jurisprudenciais nºs 32, 141 e 228 da SBDI-1) - Res. 129/2005, DJ 20, 22 e 25.04.2005"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 368 (...)\nI - A Justiça do Trabalho é competente para determinar o recolhimento das contribuições previdenciárias e fiscais provenientes das sentenças que proferir. A competência da Justiça do Trabalho para execução das contribuições previdenciárias alcança as parcelas integrantes do salário de contribuição, pagas em virtude de contrato,ou de emprego reconhecido em juízo, ou decorrentes de anotação da Carteira de Trabalho e Previdência Social - CTPS, objeto de acordo homologado em juízo. (ex-OJ nº 141 da SBDI-1 - inserida em 27.11.1998)\nII - É do empregador a responsabilidade pelo recolhimento das contribuições previdenciárias e fiscais, resultante de crédito do empregado oriundo de condenação judicial, devendo incidir, em relação aos descontos fiscais, sobre o valor total da condenação, referente às parcelas tributáveis, calculado ao final, nos termos da Lei nº 8.541, de 23.12.1992, art. 46 e Provimento da CGJT nº 01/1996. (ex-OJ nº 32 da SBDI-1 -inserida em 14.03.1994 e OJ nº 228 da SBDI-1 - inserida em 20.06.2001)\nIII - Em se tratando de descontos previdenciários, o critério de apuração encontra-se disciplinado no art. 276, §4º, do Decreto n º 3.048/1999 que regulamentou a Lei nº 8.212/1991 e determina que a contribuição do empregado, no caso de ações trabalhistas, seja calculada mês a mês, aplicando-se as alíquotas previstas no art. 198, observado o limite máximo do salário de contribuição. (ex-OJ nº 32 da SBDI-1 - inserida em 14.03.1994 e OJ 228 - inserida em 20.06.2001)"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-369","tribunal":"TST","tipo":"sumula","numero":369,"teor":"DIRIGENTE SINDICAL. ESTABILIDADE PROVISÓRIA.\n\nI - É assegurada a estabilidade provisória ao empregado dirigente sindical, ainda que a comunicação do registro da candidatura ou da eleição e da posse seja realizada fora do prazo previsto no art. 543, § 5º, da CLT, desde que a ciência ao empregador, por qualquer meio, ocorra na vigência do contrato de trabalho.\nII - O art. 522 da CLT foi recepcionado pela Constituição Federal de 1988. Fica limitada, assim, a estabilidade a que alude o art. 543, § 3.º, da CLT a sete dirigentes sindicais e igual número de suplentes.\nIII - O empregado de categoria diferenciada eleito dirigente sindical só goza de estabilidade se exercer na empresa atividade pertinente à categoria profissional do sindicato para o qual foi eleito dirigente.\nIV - Havendo extinção da atividade empresarial no âmbito da base territorial do sindicato, não há razão para subsistir a estabilidade.\nV - O registro da candidatura do empregado a cargo de dirigente sindical durante o período de aviso prévio, ainda que indenizado, não lhe assegura a estabilidade, visto que inaplicável a regra do § 3º do art. 543 da Consolidação das Leis do Trabalho.","status":"em_vigor","temas":["Estabilidade e garantias de emprego","Rescisão e verbas rescisórias","Direito coletivo e sindical"],"historico":[{"evento":"Nova redação","ato":"Res. 185/2012","data":"2012-09-27","observacao":"(redação do item I alterada na sessão do Tribunal Pleno realizada em 14.09.2012) - Res. 185/2012, DEJT divulgado em 25, 26 e 27.09.2012"},{"evento":"Nova redação","ato":"Res. 174/2011","data":"2011-05-31","observacao":"Nova redação dada ao item II - Res. 174/2011, DEJT divulgado em 27, 30 e 31.05.2011"},{"evento":"Nova redação","ato":null,"data":"1994-04-29","observacao":"Item I alterado - É indispensável a comunicação, pela entidade sindical, ao empregador, na forma do § 5º do art. 543 da CLT. (ex-OJ nº 34 da SBDI-1 - inserida em 29.04.1994)"},{"evento":"Redação original","ato":"Res. 129/2005","data":"2005-04-25","observacao":"Redação Original - Res. 129/2005, DJ 20, 22 e 25.04.2005"},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Nº 369 Dirigente sindical. Estabilidade provisória (conversão das Orientações Jurisprudenciais nºs 34, 35, 86, 145 e 266 da SBDI-I)\n(...)\nII - O art. 522 da CLT, que limita a sete o número de dirigentes sindicais, foi recepcionado pela Constituição Federal de 1988. (ex-OJ nº 266 da SBDI-I - inserida em 27.09.2002)\n(...)"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-370","tribunal":"TST","tipo":"sumula","numero":370,"teor":"MÉDICO E ENGENHEIRO. JORNADA DE TRABALHO. LEIS NºS 3.999/1961 E 4.950-A/1966.\n\nTendo em vista que as Leis nº 3.999/1961 e 4.950-A/1966 não estipulam a jornada reduzida, mas apenas estabelecem o salário mínimo da categoria para uma jornada de 4 horas para os médicos e de 6 horas para os engenheiros, não há que se falar em horas extras, salvo as excedentes à oitava, desde que seja respeitado o salário mínimo/horário das categorias. (ex-OJs nºs 39 e 53 da SBDI-1 - inseridas, respectivamente, em 07.11.1994 e 29.04.199","status":"em_vigor","temas":["Jornada e horas extras","Salário e remuneração"],"historico":[{"evento":"Conversão","ato":"Res. 129/2005","data":"2005-04-25","observacao":"Conversão das Orientações Jurisprudenciais nºs 39 e 53 da SBDI-1 - Res. 129/2005, DJ 20, 22 e 25.04.2005. - Entendimento reafirmado no IRR nº 216.\nIRR-216 MÉDICO E ENGENHEIRO. JORNADA DE TRABALHO. LEIS Nos 3.999/1961 E 4.950-A/1966. (RR-0000014-52.2024.5.20.0004, Tribunal Pleno, publicado em 02.09.2025, rel. Min. Aloysio Silva Corrêa da Veiga)\nTendo em vista que as Leis nº 3.999/1961 e 4.950-A/1966 não estipulam a jornada reduzida, mas apenas estabelecem o salário mínimo da categoria para uma jornada de 4 horas para os médicos e de 6 horas para os engenheiros, não há que se falar em horas extras, salvo as excedentes à oitava, desde que seja respeitado o salário mínimo/horário das categorias."},{"evento":"Redação anterior","ato":null,"data":null,"observacao":"Ex-OJs nºs 39 e 53 da SBDI-I - inseridas, respectivamente, em 07.11.1994 e 29.04.1994."}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-371","tribunal":"TST","tipo":"sumula","numero":371,"teor":"AVISO PRÉVIO INDENIZADO. EFEITOS. SUPERVENIÊNCIA DE AUXÍLIO-DOENÇA NO CURSO DESTE.\n\nA projeção do contrato de trabalho para o futuro, pela concessão do aviso prévio indenizado, tem efeitos limitados às vantagens econômicas obtidas no período de pré-aviso, ou seja, salários, reflexos e verbas rescisórias. No caso de concessão de auxílio-doença no curso do aviso prévio, todavia, só se concretizam os efeitos da dispensa depois de expirado o benefício previdenciário. (ex-OJs nºs 40 e 135 da SBDI-1 - inseridas, respectivamente, em 28.11.1995 e 27.11.1998)","status":"em_vigor","temas":["Salário e remuneração","Acidente e doença do trabalho","Rescisão e verbas rescisórias"],"historico":[{"evento":"Nova redação","ato":"Res. 129/2005","data":"2005-04-25","observacao":"(conversão das Orientações Jurisprudenciais nºs 40 e 135 da SBDI-1) - Res. 129/2005, DJ 20, 22 e 25.04.2005"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificado_em":"2026-09-21"},{"id":"tst-372","tribunal":"TST","tipo":"sumula","numero":372,"teor":"GRATIFICAÇÃO DE FUNÇÃO. SUPRESSÃO OU REDUÇÃO. LIMITES.\n\nI - Percebida a gratificação de função por dez ou mais anos pelo empregado, se o empregador, sem justo motivo, revertê-lo a seu cargo efetivo, não poderá retirar-lhe a gratificação tendo em vista o princípio da estabilidade financeira. (item cancelado por perda de eficácia a partir de 11.11.2017, pela Lei 13.467/2017. Res. 225/2025, DEJT divulgado em 30.06, 01 e 02.07.2025)\nII - Mantido o empregado no exercício da função comissionada, não pode o empregador reduzir o valor da gratificação. (ex-OJ nº 303 da SBDI-1 - DJ 11.08.2003)","status":"em_vigor","temas":["Salário e remuneração","Estabilidade e garantias de emprego"],"historico":[{"evento":"Cancelamento","ato":"Res. 225/2025","data":"2025-07-02","observacao":"Item I cancelado por perda de eficácia a partir de 11/11/2017, pela Lei 13.467/2017. Res. 225/2025, DEJT divulgado em 30.06, 01 e 02.07.2025"},{"evento":"Conversão","ato":"Res. 129/2005","data":"2005-04-25","observacao":"Conversão das Orientações Jurisprudenciais nos 45 e 303 da SBDI-1 - Res. 129/2005, DJ 20, 22 e 25.04.2005"},{"evento":"Nova redação","ato":null,"data":"1996-11-25","observacao":"Item I - ex-OJ nº 45 da SBDI-1 - inserida em 25.11.1996"}],"observacao":null,"alerta":null,"fonte_url":"https://jurisprudencia.tst.jus.br/?tipoJuris=SUM&orgao=TST&pesquisar=1","verificado":true,"verificad
