<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Publicações · manual e fluxo do escritório</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --tinta:#0C3B2E; --ouro:#C6A35C; --papel:#FAF9F6; --carta:#FFFFFF;
  --texto:#23231F; --suave:#6B6B63; --linha:#E4E0D6; --linha-forte:#CFC8B8;
  --fatal:#8B2F2F;
  --conh:#1B6B4C; --conh-bg:#E9F1ED;
  --rec:#1C4E80;  --rec-bg:#E8EEF7;
  --exec:#A9761A; --exec-bg:#FBF1DC;
  --roxo:#5B2D8E; --roxo-bg:#F2ECFA; --roxo-linha:#D9C7EE;
  --display:"Cormorant Garamond",Georgia,serif;
  --corpo:"Montserrat",-apple-system,Segoe UI,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --rail:290px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--papel); color:var(--texto); font-family:var(--corpo);
  font-size:15px; line-height:1.62; -webkit-font-smoothing:antialiased;
}
a{color:inherit}
/* texto corrido justificado, com hifenização para evitar rios de espaço */
.hero .sub,.ident,.man p,.man .intro,.atencao p,.aviso-roxo p,.roxo-alerta p,
.marca p,.sem-agenda span,.vazio-busca,td,.regra p{
  text-align:justify;text-justify:inter-word;
  hyphens:auto;-webkit-hyphens:auto;-ms-hyphens:auto;
}
/* a última linha de um bloco justificado nunca é esticada */
.ident,.man p{text-align-last:left}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--ouro); outline-offset:2px; border-radius:3px}

/* ---------- estrutura ---------- */
.app{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100vh}
.rail{
  position:sticky;top:0;height:100vh;overflow-y:auto;
  background:var(--tinta);color:#EAF0EC;padding:22px 0 90px;
}
.palco{padding:0 0 120px;min-width:0}
.faixa{max-width:920px;margin:0 auto;padding:0 40px}

/* ---------- rail ---------- */
.marca{padding:0 22px 18px;border-bottom:1px solid rgba(255,255,255,.14);margin-bottom:16px}
.marca .sup{font-size:9.5px;letter-spacing:.22em;color:var(--ouro);font-weight:700;text-transform:uppercase}
.marca h1{font-family:var(--display);font-size:29px;font-weight:600;margin:6px 0 2px;line-height:1.06;letter-spacing:.01em}
.marca p{margin:0;font-size:11.5px;color:#9FB5AA;line-height:1.5}

.buscabox{padding:0 18px 14px}
.busca{
  width:100%;padding:9px 12px;border-radius:7px;border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.07);color:#fff;font-size:13px;font-family:var(--corpo);
}
.busca::placeholder{color:#8FA79B}
.busca:focus{background:rgba(255,255,255,.13);border-color:var(--ouro);outline:none}

.filtros{padding:0 18px 16px;display:flex;flex-wrap:wrap;gap:5px}
.chip{
  font-size:10px;letter-spacing:.09em;font-weight:600;text-transform:uppercase;
  padding:4px 9px;border-radius:99px;border:1px solid rgba(255,255,255,.24);color:#C3D3CB;
}
.chip[aria-pressed="true"]{background:var(--ouro);border-color:var(--ouro);color:#1A1508}

.grupo{padding:14px 18px 4px;font-size:9.5px;letter-spacing:.2em;font-weight:700;text-transform:uppercase;color:#7E9A8D}
.grupo .pino{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:7px;vertical-align:middle}
.item{
  display:flex;gap:9px;align-items:baseline;width:100%;text-align:left;
  padding:6px 18px 6px 20px;font-size:12.5px;line-height:1.38;color:#D5E1DA;border-left:3px solid transparent;
}
.item:hover{background:rgba(255,255,255,.07);color:#fff}
.item[aria-current="true"]{background:rgba(255,255,255,.11);border-left-color:var(--ouro);color:#fff;font-weight:600}
.item .cod{font-family:var(--mono);font-size:10.5px;color:#8FA79B;min-width:22px;flex:none}
.item[aria-current="true"] .cod{color:var(--ouro)}
.item.roxo{color:#D9C2F5}
.item.roxo .cod{color:#B694DF}
.vazio-busca{padding:10px 18px;font-size:12px;color:#8FA79B;font-style:italic}

/* ---------- topo do palco ---------- */
.barra{
  position:sticky;top:0;z-index:20;background:rgba(250,249,246,.93);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--linha);
}
.barra-in{max-width:920px;margin:0 auto;padding:11px 40px;display:flex;align-items:center;gap:14px}
.migalha{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--suave);font-weight:600;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acoes{display:flex;gap:7px;flex:none}
.btn{
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;
  padding:6px 12px;border-radius:6px;border:1px solid var(--linha-forte);color:var(--tinta);background:var(--carta);
  transition:background .15s,border-color .15s;
}
.btn:hover{background:var(--tinta);border-color:var(--tinta);color:#fff}
.btn.ouro{background:var(--tinta);border-color:var(--tinta);color:#fff}
.btn.ouro:hover{background:var(--ouro);border-color:var(--ouro);color:#1A1508}

/* ---------- abertura ---------- */
.hero{padding:64px 0 10px}
.hero .sup{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--ouro);font-weight:700}
.hero h2{font-family:var(--display);font-size:clamp(38px,5.6vw,60px);font-weight:600;line-height:1.02;margin:12px 0 0;letter-spacing:-.005em}
.hero .sub{max-width:620px;margin:16px 0 0;color:var(--suave);font-size:15px}
.regua-hero{
  margin:36px 0 8px;padding:22px 26px;background:var(--carta);border:1px solid var(--linha);border-radius:12px;
}
.regua-hero .rot{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--suave);font-weight:700;margin-bottom:16px}

/* régua PZ / FT: o elemento-assinatura */
.regua{display:flex;align-items:flex-start;gap:0;margin:0}
.no{flex:none;text-align:center;width:124px}
.no .bolha{width:13px;height:13px;border-radius:50%;margin:0 auto 9px;border:2px solid var(--tinta);background:var(--carta)}
.no.cheio .bolha{background:var(--tinta)}
.no.ft .bolha{border-color:var(--fatal);background:var(--fatal)}
.no .k{display:block;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.1em;color:var(--tinta)}
.no.ft .k{color:var(--fatal)}
.no .v{display:block;font-size:11px;color:var(--suave);line-height:1.4;margin-top:3px}
.no .cap{display:block;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--linha-forte);font-weight:700;margin-top:5px}
.no.ft .cap{color:#B98A8A}
.trecho{flex:1;position:relative;height:13px;min-width:26px}
.trecho:before{content:"";position:absolute;top:6px;left:-4px;right:-4px;height:1px;background:var(--linha-forte)}
.trecho.folga:before{background:repeating-linear-gradient(90deg,var(--linha-forte) 0 4px,transparent 4px 8px)}
.trecho .tag{
  position:absolute;top:15px;left:50%;transform:translateX(-50%);white-space:nowrap;
  font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--suave);font-weight:600;
}

/* ---------- aviso roxo ---------- */
.roxo-alerta{
  margin:34px 0 0;padding:20px 24px;border-radius:12px;background:var(--roxo-bg);
  border:1px solid var(--roxo-linha);border-left:5px solid var(--roxo);display:flex;gap:18px;align-items:flex-start;
}
.roxo-alerta .txt{flex:1;min-width:0}
.roxo-alerta h3{margin:0 0 5px;font-family:var(--display);font-size:21px;font-weight:700;color:var(--roxo)}
.roxo-alerta p{margin:0;font-size:13.5px;color:#3E2A55}
.pilula{
  display:inline-block;background:var(--roxo);color:#fff;font-size:10.5px;font-weight:700;
  letter-spacing:.13em;padding:5px 12px;border-radius:5px;font-family:var(--corpo);white-space:nowrap;
}

/* ---------- grade de cartões ---------- */
.sec-rot{
  display:flex;align-items:center;gap:12px;margin:52px 0 18px;
  font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--suave);
}
.sec-rot:after{content:"";flex:1;height:1px;background:var(--linha)}
.sec-rot .pino{width:9px;height:9px;border-radius:2px;flex:none}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:14px}
.cartao{
  text-align:left;background:var(--carta);border:1px solid var(--linha);border-radius:11px;padding:16px 17px 15px;
  display:flex;flex-direction:column;gap:8px;transition:transform .16s,box-shadow .16s,border-color .16s;
}
.cartao:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(12,59,46,.09);border-color:var(--linha-forte)}
.cartao .cod{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.06em}
.cartao h4{margin:0;font-family:var(--display);font-size:20px;font-weight:600;line-height:1.16}
.cartao .meta{margin-top:auto;padding-top:9px;border-top:1px solid var(--linha);display:flex;justify-content:space-between;gap:8px;
  font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--suave);font-weight:600}

/* ---------- detalhe do teor ---------- */
.det{padding:44px 0 0;animation:sobe .26s ease both}
@keyframes sobe{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.selos{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.selo{font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;font-weight:700;padding:4px 10px;border-radius:99px;color:#fff}
.selo.linha{background:transparent;border:1px solid currentColor}
.selo.cod{font-family:var(--mono);letter-spacing:.06em;background:transparent;color:var(--suave);border:1px solid var(--linha-forte)}
.det h2{font-family:var(--display);font-size:clamp(31px,4.4vw,45px);font-weight:600;line-height:1.06;margin:0 0 20px;letter-spacing:-.005em}
.ident{font-size:16px;line-height:1.66;max-width:660px;color:#33332C}
.ident b{font-weight:600}

.rot{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--suave);font-weight:700;margin:38px 0 12px}
.ag{background:var(--carta);border:1px solid var(--linha);border-radius:11px;padding:18px 20px;margin-bottom:12px}
.ag .tipo{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;margin-bottom:7px}
.ag .titulo{font-family:var(--mono);font-size:14.5px;font-weight:600;line-height:1.45;color:var(--tinta);white-space:pre-line;margin-bottom:14px}
.ag .quem{display:flex;flex-wrap:wrap;gap:6px 26px;padding-top:13px;border-top:1px solid var(--linha);margin-top:14px}
.ag .quem .k{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--suave);font-weight:700;display:block;margin-bottom:2px}
.ag .quem .v{font-size:13.5px;font-weight:600;white-space:pre-line}
.ag-unica{font-size:13px}
.ag-unica .k{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--suave);font-weight:700;display:block;margin-bottom:3px}

.sem-agenda{background:var(--carta);border:1px dashed var(--linha-forte);border-radius:11px;padding:26px 22px;text-align:center}
.sem-agenda strong{display:block;font-family:var(--display);font-size:25px;font-weight:700;margin-bottom:6px}
.sem-agenda span{font-size:13.5px;color:var(--suave)}

.atencao{border-radius:11px;padding:18px 22px;border-left:5px solid;margin-top:8px}
.atencao .k{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;margin-bottom:7px}
.atencao p{margin:0;font-size:14px;line-height:1.62}

.navpe{display:flex;justify-content:space-between;gap:12px;margin-top:52px;padding-top:20px;border-top:1px solid var(--linha)}
.navpe button{font-size:12px;color:var(--suave);text-align:left;max-width:47%}
.navpe button:hover{color:var(--tinta)}
.navpe .k{display:block;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;margin-bottom:2px}
.navpe .n{font-family:var(--display);font-size:17px;line-height:1.2;color:var(--texto)}
.navpe .dir{text-align:right}

/* ---------- manual ---------- */
.man{padding:44px 0 0;animation:sobe .26s ease both}
.man h2{font-family:var(--display);font-size:clamp(31px,4.4vw,45px);font-weight:600;line-height:1.06;margin:0 0 8px}
.man .intro{font-size:16px;color:var(--suave);max-width:640px;margin:0 0 34px}
.man h3{font-family:var(--display);font-size:26px;font-weight:600;margin:38px 0 10px;line-height:1.2}
.man p{font-size:15px;line-height:1.68;max-width:680px}
.man p b{font-weight:600}
.regra{display:flex;gap:20px;padding:24px 0;border-top:1px solid var(--linha)}
.regra .num{font-family:var(--display);font-size:42px;line-height:.9;color:var(--ouro);font-weight:600;flex:none;width:52px}
.regra h3{margin:0 0 6px;font-size:23px}
.regra p{margin:0 0 8px}
.exemplo{
  display:inline-block;font-family:var(--mono);font-size:16px;font-weight:600;color:var(--tinta);
  background:var(--conh-bg);border:1px solid #CBE0D5;border-radius:7px;padding:9px 15px;margin-top:6px;
}
table{width:100%;border-collapse:collapse;margin:16px 0 8px;font-size:13.5px}
th{background:var(--tinta);color:#fff;text-align:left;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  font-weight:700;padding:10px 13px}
td{padding:10px 13px;border-bottom:1px solid var(--linha);vertical-align:top;line-height:1.5}
tr:nth-child(even) td{background:var(--carta)}
td.k{font-weight:600;white-space:nowrap;text-align:left;hyphens:manual}
table.pessoas td:nth-child(2){white-space:nowrap;text-align:left;hyphens:manual}
table.roxa th{background:var(--roxo)}
table.roxa tr:nth-child(even) td{background:var(--roxo-bg)}
.mono-inline{font-family:var(--mono);font-weight:600;font-size:.95em;background:var(--conh-bg);padding:1px 6px;border-radius:4px}

.glo-grupo{margin-top:34px}
.glo-grupo h3{margin-bottom:4px}
.aviso-roxo{background:var(--roxo-bg);border:1px solid var(--roxo-linha);border-left:5px solid var(--roxo);
  border-radius:11px;padding:17px 21px;margin-bottom:11px}
.aviso-roxo .k{font-weight:700;color:var(--roxo);font-size:14px;margin-bottom:3px}
.aviso-roxo p{margin:0;font-size:13.5px;color:#3E2A55}

/* ---------- apresentação ---------- */
.tela{position:fixed;inset:0;z-index:100;background:var(--papel);display:none;flex-direction:column;padding:0}
.tela.on{display:flex}
.tela-topo{display:flex;align-items:center;gap:14px;padding:16px 34px;border-bottom:1px solid var(--linha)}
.tela-topo .conta{font-family:var(--mono);font-size:12px;color:var(--suave);flex:1}
.tela-corpo{flex:1;overflow-y:auto;padding:34px 34px 60px}
.tela-corpo .faixa{max-width:1100px}
.tela .det{padding-top:0}
.tela .det h2{font-size:clamp(34px,4.6vw,54px)}
.tela .ident{font-size:19px;max-width:820px}
.tela .grade-ap{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tela .ag .titulo{font-size:16px}
.progresso{position:fixed;bottom:0;left:0;height:3px;background:var(--ouro);transition:width .25s}

/* ---------- tribunais e OAB ---------- */
.trib-busca{
  width:100%;max-width:360px;padding:9px 12px;border-radius:7px;border:1px solid var(--linha-forte);
  background:var(--carta);font-size:13px;font-family:var(--corpo);color:var(--texto);margin-bottom:8px;
}
.trib-busca:focus{outline:none;border-color:var(--ouro)}
.trib-contador{font-size:11px;color:var(--suave);margin-bottom:30px}
.trib-bloco{margin-top:40px}
.trib-bloco h3{font-family:var(--display);font-size:24px;font-weight:600;margin:0 0 3px}
.trib-seg{display:inline-block;font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--suave);
  background:var(--carta);border:1px solid var(--linha-forte);border-radius:5px;padding:2px 8px;margin-bottom:9px}
.trib-fonte{font-size:11.5px;color:var(--suave);font-style:italic;margin:0 0 14px;max-width:680px}
table.trib td.sigla{font-family:var(--mono);font-weight:700;color:var(--tinta)}
table.trib td.cod{font-family:var(--mono);color:var(--suave);white-space:nowrap}
table.trib tr.oculta{display:none}
.trib-vazio{padding:20px;text-align:center;color:var(--suave);font-size:13px;font-style:italic}
table.oab td.principal{font-weight:700;color:var(--tinta)}

/* ---------- calculadora ---------- */
.calc-campo{
  background:var(--carta);border:1px solid var(--linha);border-radius:12px;padding:22px 26px;margin-bottom:26px;
}
.calc-campo label{display:block;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--suave);font-weight:700;margin-bottom:9px}
.calc-data{
  font-family:var(--mono);font-size:22px;font-weight:600;color:var(--tinta);
  border:1px solid var(--linha-forte);border-radius:8px;padding:11px 14px;background:var(--papel);
  width:100%;max-width:230px;
}
.calc-data:focus{outline:none;border-color:var(--ouro);background:#fff}
.calc-inicio{margin-top:14px;font-size:13px;color:var(--suave)}
.calc-inicio b{color:var(--texto);font-weight:600}
.calc-vazio{padding:34px 26px;text-align:center;color:var(--suave);font-size:13.5px;background:var(--carta);
  border:1px dashed var(--linha-forte);border-radius:12px}
.calc-grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-bottom:26px}
.calc-card{background:var(--carta);border:1px solid var(--linha);border-radius:11px;padding:17px 19px;display:flex;flex-direction:column;gap:6px}
.calc-card .n{font-family:var(--display);font-size:15px;font-weight:700;color:var(--tinta)}
.calc-card .peca{font-size:11px;color:var(--suave);line-height:1.4;min-height:15px}
.calc-card .data{font-family:var(--mono);font-size:19px;font-weight:600;color:var(--texto);margin-top:4px}
.calc-card .sem{font-family:var(--mono);font-size:19px;font-weight:600;color:var(--linha-forte)}
.calc-card .dia{font-size:11.5px;color:var(--suave)}
.calc-livre{background:var(--conh-bg);border:1px solid #CBE0D5}
.calc-livre input{
  font-family:var(--mono);font-size:15px;font-weight:600;width:64px;padding:5px 8px;border-radius:6px;
  border:1px solid var(--linha-forte);text-align:center;background:#fff;color:var(--tinta);
}
.calc-livre input:focus{outline:none;border-color:var(--conh)}
.calc-aviso{
  display:flex;gap:10px;align-items:flex-start;font-size:12px;color:var(--suave);
  background:var(--carta);border:1px solid var(--linha);border-radius:10px;padding:13px 16px;line-height:1.55;
}
.calc-aviso b{color:var(--texto)}
.calc-nota{font-size:11.5px;color:var(--suave);margin:-10px 0 22px;font-style:italic}

/* ---------- rodapé fixo ---------- */
.duvida{
  position:fixed;right:22px;bottom:18px;z-index:40;background:var(--tinta);color:#fff;
  padding:9px 16px;border-radius:99px;font-size:11.5px;box-shadow:0 6px 18px rgba(12,59,46,.24);
}
.duvida b{color:var(--ouro);font-weight:600}

/* ---------- responsivo ---------- */
.abrir-rail{display:none}
@media (max-width:700px){
  .regua{flex-wrap:wrap;gap:11px}
  .no{width:100%;text-align:left;display:grid;grid-template-columns:15px 1fr;column-gap:10px;align-items:start}
  .no .bolha{margin:4px 0 0}
  .no .k,.no .v,.no .cap{grid-column:2}
  .no .cap{margin-top:2px}
  .trecho{display:none}
  .regua-hero{padding:18px}
}
@media (max-width:960px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;left:0;top:0;width:284px;z-index:60;transform:translateX(-100%);transition:transform .22s}
  .rail.on{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .abrir-rail{display:inline-block}
  .faixa,.barra-in{padding-left:20px;padding-right:20px}
  .tela .grade-ap{grid-template-columns:1fr}
  .duvida{left:14px;right:14px;text-align:center;bottom:12px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- impressão ---------- */
@media print{
  .rail,.barra,.duvida,.navpe,.tela{display:none!important}
  .app{display:block}
  body{background:#fff;font-size:11pt}
  .faixa{max-width:none;padding:0}
  .det,.man{padding-top:0;page-break-before:always}
  .det:first-child,.man:first-child{page-break-before:avoid}
  .ag,.regra,.atencao,.aviso-roxo,.sem-agenda,.regua{page-break-inside:avoid}
  table{page-break-inside:auto}
  tr{page-break-inside:avoid}
  .man h2{margin-top:0}
  .cartao:hover{transform:none;box-shadow:none}
}
</style>
</head>

      <input class="busca" id="busca" type="search" placeholder="Buscar teor, peça ou pessoa…" aria-label="Buscar" autocomplete="off">

</div>

<div class="duvida">Dúvida em qualquer ponto: fale com o <b>Ygor</b></div>

<script>
const D = {"teores":[{"sec":"7.1","fase":"conhecimento","area":"TODAS AS ÁREAS","titulo":"Distribuição do processo","id":"A publicação apenas informa que o processo foi distribuído e em qual vara ele caiu. Não há determinação, não há prazo e não há nada a ser feito por ninguém.","agendas":[],"semAgenda":"NENHUMA AGENDA A CRIAR","nota":"Este é o único teor em que a ausência de agenda é o resultado correto. Se a publicação trouxer qualquer determinação além da informação de distribuição, ela não é este cartão: procure o teor correspondente ou fale com o Ygor."},{"sec":"7.2","fase":"conhecimento","area":"TODAS AS ÁREAS","titulo":"Despacho inaugural que designa audiência","id":"Primeiro pronunciamento do juiz depois da distribuição, designando audiência com data, hora e modalidade. No cível costuma ser conciliação no CEJUSC; no trabalhista, audiência una.","agendas":[{"tipo":"AUDIÊNCIA","titulo":"Área + tipo de audiência + modalidade\nCÍVEL AUD CONCILIAÇÃO CEJUSC VIRTUAL  ·  RT AUD UNA PRESENCIAL","data":"Data e hora da audiência","resp":"Sócio (André)"},{"tipo":"PRAZO","titulo":"CONTATO CLIENTE AUDIÊNCIA","data":"30 dias antes da audiência","resp":"Estagiária jurídica"}],"nota":"Preencha sempre fórum, modalidade e o sócio como responsável. No contato, registre nos comentários se o cliente confirmou o comparecimento dele e das testemunhas, e o nome de cada testemunha. Depois reagende para 15 dias antes, depois 7 e depois 1."},{"sec":"7.3","fase":"conhecimento","area":"TODAS · EXCETO JUIZADO","titulo":"Despacho inaugural que nega a justiça gratuita","id":"O juiz indefere a gratuidade, ou seja, decide que a parte terá de pagar as custas. Costuma vir com determinação de recolhimento em prazo certo. Cabe agravo de instrumento.","agendas":[{"tipo":"PRAZO","titulo":"AI PZ dd/mm; FT dd/mm","data":"Dia da publicação\nPZ: 5 dias úteis antes do fatal","resp":"Advogado da área.\nNo trabalhista, o sênior (Gustavo Freire)"}],"nota":"É recurso, então o campo Data recebe o dia da publicação. O prazo interno de 5 dias úteis é o mais largo do material, porque o agravo é peça de tribunal. Nos juizados especiais não cabe agravo: não crie a agenda e fale com o Ygor."},{"sec":"7.4","fase":"conhecimento","area":"TODAS AS ÁREAS","titulo":"Despacho que concede a gratuidade mas pede documentos","id":"O juiz defere a gratuidade mas pede documentos que comprovem a hipossuficiência: imposto de renda, extratos, carteira de trabalho, comprovante de renda. Gera duas agendas com donos diferentes.","agendas":[{"tipo":"PRAZO","titulo":"JUNTAR DOCS COMPLEMENTARES HIPO\nPZ dd/mm; FT dd/mm","data":"PZ: 3 dias úteis antes do fatal","resp":"Advogado da área"},{"tipo":"PRAZO","titulo":"SOLICITAR AO CLIENTE OS DOCS PEDIDOS PELO JUIZ\nPZ dd/mm; FT dd/mm","data":"PZ: 2 dias úteis depois da publicação\nFT: 3 dias úteis antes do PZ do advogado","resp":"Estagiária jurídica"}],"nota":"Os documentos precisam chegar antes de o advogado começar, e não no mesmo dia. A cobrança ao cliente é do jurídico, porque o contrato já está fechado. Não é recurso: campo Data com o PZ, direto no responsável."},{"sec":"7.5","fase":"conhecimento","area":"TODAS · EXCETO JUIZADO","titulo":"Despacho inaugural que nega a tutela de urgência","id":"O juiz indefere o pedido de providência imediata, aquela que valeria antes do fim do processo. Cuidado: decisão que nega pedido nosso e não trata de urgência não é este caso, é o cartão 8.1.","agendas":[{"tipo":"PRAZO","titulo":"AI PZ dd/mm; FT dd/mm","data":"Dia da publicação\nPZ: 5 dias úteis antes do fatal","resp":"Advogado da área.\nNo trabalhista, o sênior (Gustavo Freire)"}],"nota":"Conduta idêntica à do cartão 7.3. Um mesmo despacho inaugural pode conter os três casos ao mesmo tempo (negar gratuidade, pedir documentos e negar tutela): quando isso acontecer, crie todas as agendas correspondentes."},{"sec":"7.6","fase":"conhecimento","area":"TODAS AS ÁREAS","titulo":"Agendamento de perícia","id":"O juízo designa perícia e informa data, hora, local e tipo: insalubridade, periculosidade ou médica. Perícia é o exame feito por especialista nomeado pelo juiz, e o cliente precisa comparecer pessoalmente.","agendas":[{"tipo":"AUDIÊNCIA","titulo":"PERÍCIA + tipo (INSALUBRIDADE, PERICULOSIDADE ou MÉDICA)","data":"Data e hora da perícia","resp":"Sócio (André), só para controle"},{"tipo":"PRAZO","titulo":"CONTATO CLIENTE PERÍCIA","data":"A confirmar\nProposta: 10 dias úteis antes","resp":"Estagiária jurídica"},{"tipo":"PRAZO","titulo":"COMUNICAR ELLEN","data":"A confirmar\nProposta: 5 dias úteis antes","resp":"Estagiária jurídica"}],"nota":"Endereço da perícia sempre no campo de observação. Ao cliente: peça comparecimento, explique que ele descreverá suas atividades e onde trabalhava, e se for médica oriente que leve todos os documentos médicos. Na terceira agenda, verifique se a Ellen foi contratada e se o perito a comunicou por e-mail; em caso negativo, envie e-mail pedindo que compareça."},{"sec":"7.7","fase":"conhecimento","area":"TODAS · A CONFIRMAR","titulo":"Determinação para indicar quesitos","id":"O juízo determina que as partes apresentem quesitos, que são as perguntas que o perito terá de responder no laudo, e em regra abre a oportunidade de indicar assistente técnico.","agendas":[{"tipo":"AUDIÊNCIA","titulo":"PERÍCIA + tipo (INSALUBRIDADE, PERICULOSIDADE ou MÉDICA)","data":"Data e hora da perícia","resp":"Sócio (André), só para controle"},{"tipo":"PRAZO","titulo":"CONTATO CLIENTE PERÍCIA","data":"A confirmar\nProposta: 10 dias úteis antes","resp":"Estagiária jurídica"},{"tipo":"PRAZO","titulo":"COMUNICAR ELLEN","data":"A confirmar\nProposta: 5 dias úteis antes","resp":"Estagiária jurídica"}],"nota":"Cartão pendente de confirmação. No fluxograma de origem, a conduta é idêntica à do cartão 7.6, o que sugere repetição na montagem. Pela lógica dos demais cartões, deveria existir também um prazo próprio para protocolar os quesitos. Enquanto isso não for definido, fale com o Ygor antes de criar as agendas."},{"sec":"7.8","fase":"conhecimento","area":"TRABALHISTA","titulo":"Juntada de laudo pericial","id":"O perito entregou o laudo e o juízo abre prazo para as partes se manifestarem. Manifestar-se, aqui, significa impugnar: apontar erros, omissões e contradições do laudo.","agendas":[{"tipo":"PRAZO","titulo":"SOLICITAR QUESITOS DE IMPUGNAÇÃO ELLEN\nPZ dd/mm; FT dd/mm","data":"FT: 3 dias úteis antes do fatal da impugnação\nPZ a confirmar. Proposta: dia útil seguinte à publicação","resp":"Estagiária jurídica"},{"tipo":"PRAZO","titulo":"IMPUGNAÇÃO AO LAUDO PZ dd/mm; FT dd/mm","data":"FT: 5 dias úteis da publicação\nPZ: o dia do fatal da agenda da Ellen","resp":"Advogado júnior trabalhista (Ygor Pinheiro)"}],"nota":"As duas datas se encaixam: quando o advogado começa a escrever, os quesitos da assistente já estão no escritório. Esta peça não passa por revisão e vai direto ao advogado júnior. Perícia previdenciária não entra neste fluxo."},{"sec":"8.1","fase":"recursal","area":"TODAS AS ÁREAS","titulo":"Decisão interlocutória ou terminativa de mérito","id":"O juiz nega pedido nosso ou concede o da parte contrária, sem se tratar de tutela de urgência. A interlocutória resolve questão pontual e não encerra a ação. A terminativa encerra o processo sem analisar o pedido central, em regra por obstáculo processual.","agendas":[{"tipo":"PRAZO","titulo":"ED PZ dd/mm; FT dd/mm","data":"Dia da publicação\nPrazo legal: 5 dias\nPZ: 3 dias úteis antes do fatal","resp":"Trabalhista: sênior (Gustavo Freire)\nCível: Juliana Tchani\nPrevidenciário: Elisangela"}],"nota":"É recurso, então o campo Data recebe o dia da publicação. Se o responsável concluir que é caso de embargos, ele mesmo cancela o prazo de recurso eventualmente agendado. Você não cancela agenda por conta própria."},{"sec":"8.2","fase":"recursal","area":"TRABALHISTA","titulo":"Sentença trabalhista","id":"Decisão que julga o pedido e encerra a fase de conhecimento na vara do trabalho. É o teor que gera mais agendas de todo o material: quatro, porque além dos dois caminhos de recurso já se abre a preparação da execução.","agendas":[{"tipo":"PRAZO","titulo":"ED PZ dd/mm; FT dd/mm","data":"Dia da publicação\n5 dias · PZ: fatal menos 3 úteis","resp":"Advogado sênior (Gustavo Freire)"},{"tipo":"PRAZO","titulo":"RO PZ dd/mm; FT dd/mm","data":"Dia da publicação\n8 dias · PZ: fatal menos 3 úteis","resp":"Advogado sênior (Gustavo Freire)"},{"tipo":"PRAZO","titulo":"INICIAR CUMPRIMENTO DE SENTENÇA","data":"20 dias úteis depois da sentença","resp":"Advogado júnior (Ygor Pinheiro)"},{"tipo":"PRAZO","titulo":"LIQUIDAR SENTENÇA","data":"15 dias úteis depois da sentença","resp":"Contador externo (Rui)"}],"nota":"As duas primeiras seguem a regra do mesmo dia, no nome do delegador. As duas últimas não são recursais, vão direto ao responsável e não levam PZ e FT no título. Atenção: os 20 e os 15 dias contam da data da sentença, não da publicação."},{"sec":"8.3","fase":"recursal","area":"CÍVEL","titulo":"Sentença cível","id":"Decisão que julga o pedido e encerra a fase de conhecimento na vara cível ou no juizado. O recurso depende do rito: no juizado é o recurso inominado, com 10 dias; na vara comum é a apelação, com 15 dias.","agendas":[{"tipo":"PRAZO","titulo":"ED PZ dd/mm; FT dd/mm","data":"Dia da publicação\n5 dias · PZ: fatal menos 3 úteis","resp":"Advogada cível (Juliana Tchani)"},{"tipo":"PRAZO","titulo":"RI PZ dd/mm; FT dd/mm   ou   AP PZ dd/mm; FT dd/mm","data":"Dia da publicação\nRI 10 dias · AP 15 dias\nPZ: fatal menos 3 úteis","resp":"Advogada cível (Juliana Tchani)"}],"nota":"Juizado gera recurso inominado (RI); vara comum gera apelação (AP). Se não estiver claro em qual rito o processo tramita, pergunte ao Ygor antes de nomear. Se a advogada entender que não cabe recurso, ela mesma esclarece os motivos nos comentários da agenda."},{"sec":"8.4","fase":"recursal","area":"PREVIDENCIÁRIO","titulo":"Sentença previdenciária","id":"Decisão que julga o pedido de benefício e encerra a fase de conhecimento. A escolha entre recurso inominado e apelação segue a mesma lógica do cível: juizado especial federal gera RI; vara comum gera AP.","agendas":[{"tipo":"PRAZO","titulo":"ED PZ dd/mm; FT dd/mm","data":"Dia da publicação\n5 dias · PZ: fatal menos 3 úteis","resp":"Advogada previdenciária (Elisangela)"},{"tipo":"PRAZO","titulo":"RI PZ dd/mm; FT dd/mm   ou   AP PZ dd/mm; FT dd/mm","data":"Dia da publicação\nRI 10 dias · AP 15 dias\nPZ: fatal menos 3 úteis","resp":"Advogada previdenciária (Elisangela)"}],"nota":"Conduta idêntica à do cartão 8.3. Muda apenas a responsável, porque o previdenciário é integralmente da advogada da área, do começo ao fim do processo."},{"sec":"8.5","fase":"recursal","area":"TRABALHISTA","titulo":"Acórdão trabalhista","id":"Acórdão é a decisão do tribunal, tomada por um colegiado de desembargadores, que julga o recurso. No trabalhista, além dos embargos, ele abre uma verificação obrigatória sobre a execução.","agendas":[{"tipo":"PRAZO","titulo":"ED PZ dd/mm; FT dd/mm","data":"Dia da publicação\n5 dias · PZ: fatal menos 3 úteis","resp":"Advogado sênior (Gustavo Freire)"},{"tipo":"PRAZO","titulo":"VERIFICAR SE HÁ CUMP. PROVISÓRIO DE SENTENÇA","data":"9 dias úteis depois da publicação do acórdão","resp":"Advogado júnior (Ygor Pinheiro)"}],"nota":"A segunda agenda não é recursal e não tem fatal. O que acontece depois não é tarefa sua: sem cumprimento provisório em curso, o advogado júnior abre a agenda de início de cumprimento para ele e a de liquidação para o contador; havendo, abre a manifestação de cálculos de adequação e a agenda para o contador adequar."},{"sec":"8.6","fase":"recursal","area":"CÍVEL","titulo":"Acórdão cível","id":"Decisão do tribunal que julga a apelação ou o recurso inominado em processo cível. Gera duas agendas com duas responsáveis diferentes, porque no cível o cumprimento de sentença não fica com a advogada que conduz o processo.","agendas":[{"tipo":"PRAZO","titulo":"ED PZ dd/mm; FT dd/mm","data":"Dia da publicação\n5 dias · PZ: fatal menos 3 úteis","resp":"Advogada cível (Juliana Tchani)"},{"tipo":"PRAZO","titulo":"INICIAR CUMPRIMENTO DE SENTENÇA","data":"16º dia útil da publicação do acórdão","resp":"Advogada previdenciária (Elisangela)"}],"nota":"No cível, cálculos e cumprimento de sentença são da Elisangela, ainda que todo o resto do processo seja conduzido pela Juliana. A data do 16º dia está fixada assim no fluxograma e não deve ser recalculada por você."},{"sec":"8.7","fase":"recursal","area":"PREVIDENCIÁRIO","titulo":"Acórdão previdenciário","id":"Decisão do tribunal ou da turma recursal que julga o recurso em processo previdenciário. Conduta igual à do acórdão cível, com a diferença de que as duas agendas ficam com a mesma pessoa.","agendas":[{"tipo":"PRAZO","titulo":"ED PZ dd/mm; FT dd/mm","data":"Dia da publicação\n5 dias · PZ: fatal menos 3 úteis","resp":"Advogada previdenciária (Elisangela)"},{"tipo":"PRAZO","titulo":"INICIAR CUMPRIMENTO DE SENTENÇA","data":"16º dia útil da publicação do acórdão","resp":"Advogada previdenciária (Elisangela)"}],"nota":"A primeira agenda é recursal e recebe o dia da publicação no campo Data. A segunda não tem fatal, não leva PZ e FT no título e vai direto para a responsável."},{"sec":"8.8","fase":"recursal","area":"TODAS AS ÁREAS","titulo":"Intimação para apresentar contrarrazões","id":"A parte contrária recorreu e o juízo ou o tribunal abre prazo para que o escritório responda ao recurso dela. Contrarrazões não pedem reforma da decisão: apenas defendem que ela seja mantida.","agendas":[{"tipo":"PRAZO","titulo":"CONTRARRAZÕES + sigla do recurso, PZ dd/mm; FT dd/mm\nExemplo: CONTRARRAZÕES RO PZ 12/09; FT 18/09","data":"Dia da publicação\nFT: o mesmo prazo do recurso contrarrazoado\nPZ: 3 dias úteis antes do fatal","resp":"Advogado da área.\nNo trabalhista, o sênior (Gustavo Freire)"}],"nota":"O prazo do fatal acompanha o recurso respondido: RO 8 dias, AP 15 dias, RI 10 dias, ED 5 dias. Contrarrazões seguem a mesma regra dos recursos, então o campo Data recebe o dia da publicação."},{"sec":"9.1","fase":"execucao","area":"TRABALHISTA","titulo":"Intimação para manifestação de cálculos","id":"A decisão já é definitiva e agora se discute o valor. O juízo abre prazo para as partes se manifestarem sobre os cálculos. No trabalhista são duas etapas, porque o contador externo produz os subsídios antes de o advogado escrever a peça.","agendas":[{"tipo":"PRAZO","titulo":"ELABORAR SUBSÍDIOS DE CÁLCULOS PZ dd/mm; FT dd/mm","data":"PZ: dia útil seguinte à publicação\nFT: 2 dias úteis antes do fatal","resp":"Contador externo (Rui)"},{"tipo":"PRAZO","titulo":"MANIFES CÁLCULOS PZ dd/mm; FT dd/mm","data":"PZ: 2 dias úteis antes do fatal\nFT: o fatal do processo","resp":"Advogado júnior (Ygor Pinheiro)"}],"nota":"O fatal do contador é exatamente o prazo interno do advogado: o contador entrega no dia em que o advogado começa. Nenhuma das duas é recursal, então o campo Data recebe o PZ e cada agenda vai direto ao seu responsável."},{"sec":"9.2","fase":"execucao","area":"CÍVEL","titulo":"Intimação para manifestação de cálculos","id":"Mesmo teor do cartão anterior, em processo cível. Aqui não há etapa do contador externo: o prazo vai direto para a advogada, que examina os cálculos ela mesma.","agendas":[{"tipo":"PRAZO","titulo":"MANIFES CÁLCULOS PZ dd/mm; FT dd/mm","data":"PZ: 2 dias úteis antes do fatal\nFT: o fatal do processo","resp":"Advogada previdenciária (Elisangela)"}],"nota":"Não é da advogada cível. No cível, cálculos e cumprimento de sentença são da Elisangela. O contador externo atua apenas em ações trabalhistas."},{"sec":"9.3","fase":"execucao","area":"TODAS AS ÁREAS","titulo":"Informe de expedição de alvará","id":"O juízo comunica que foi expedido alvará, que é a ordem judicial autorizando o levantamento de um valor depositado. A partir daqui o assunto é dinheiro entrando em conta, e a agenda vai para o financeiro.","agendas":[{"tipo":"PRAZO","titulo":"ACOMPANHAR CREDITO EM CONTA + valor\n(Liquidação ou Crédito Parcial)","data":"5 dias úteis depois da publicação","resp":"Financeiro (Igor Marran)"}],"nota":"Além do valor, informe na própria agenda se o crédito dá quitação à lide ou se é apenas parcial: essa informação define tudo o que vem depois. Dando quitação, a pasta é encerrada com êxito, o financeiro agenda o repasse ao cliente e encaminha a prestação de contas para conferência."},{"sec":"9.4","fase":"execucao","area":"TRABALHISTA E CÍVEL","titulo":"Intimação para manifestar sobre pagamento","id":"O comando judicial pede que o exequente ou reclamante se manifeste sobre o pagamento realizado pela parte contrária. Em outras palavras: confira se o que foi depositado corresponde ao que era devido.","agendas":[{"tipo":"PRAZO","titulo":"CONFERIR PAGTO E SANEAR O FEITO PZ dd/mm; FT dd/mm","data":"PZ: 2 dias úteis antes do fatal\nFT: o fatal do processo","resp":"Trabalhista: Ygor Pinheiro\nCível: Elisangela"}],"nota":"As regras de conteúdo são do responsável, não suas. Valor correto: indicar dados bancários, sempre do Itaú. Quitação: encerrar a pasta com êxito e informar o valor. Valor a menor: executar a diferença. Diferenças inferiores a R$ 300,00 são desconsideradas."},{"sec":"9.5","fase":"execucao","area":"TRABALHISTA","titulo":"Deferimento de parcelamento do artigo 916 do CPC","id":"A parte contrária pediu para pagar a dívida em parcelas, com base no artigo 916 do Código de Processo Civil, e o juízo deferiu. O dispositivo permite depositar 30 por cento do valor e parcelar o restante.","agendas":[{"tipo":"PRAZO","titulo":"MANIFESTAÇÃO PZ dd/mm; FT dd/mm","data":"PZ: 2 dias úteis antes do fatal\nFT: o fatal do processo","resp":"Advogado júnior (Ygor Pinheiro)"}],"nota":"Registre na observação que o teor é de parcelamento do artigo 916. O conteúdo é do responsável: requerer o levantamento dos 30 por cento e que as demais parcelas sejam depositadas na conta do escritório, se execução definitiva. Se a reclamada só requerer o parcelamento sem depositar os 30 por cento, discordar e pedir SISBAJUD com urgência."},{"sec":"9.6","fase":"execucao","area":"TODAS AS ÁREAS","titulo":"Arquivamento ou extinção da execução","id":"O juízo comunica que o processo foi arquivado ou que a execução foi extinta. É o último teor do fluxo: depois dele, em regra, não há mais publicação naquele processo.","agendas":[{"tipo":"PRAZO","titulo":"CIÊNCIA ARQUIVAMENTO/EXTINÇÃO","data":"5 dias úteis depois da publicação","resp":"Estagiária jurídica"}],"nota":"Esta agenda é sua. A análise é verificar se o pagamento da condenação foi efetivamente realizado e se a pasta está encerrada no sistema. Se o pagamento não aparecer ou a pasta seguir aberta sem motivo, fale com o Ygor antes de dar ciência."}],"manual":{"pessoas":[["Sócio","André","Todas as audiências, de todas as áreas. Também figura como responsável nas perícias, apenas para efeito de controle."],["Advogado sênior trabalhista, delegador e revisor","Gustavo Freire","Todos os recursos e contrarrazões do trabalhista. Ele delega a execução e revisa antes do protocolo."],["Advogado pleno trabalhista","Mateus","Nada diretamente de você. Só recebe o que o delegador repassa."],["Advogado júnior trabalhista","Ygor Pinheiro","Cumprimento de sentença, manifestação de cálculos, impugnação ao laudo, manifestação sobre pagamento e parcelamento, no trabalhista. É também o ponto único de dúvida do escritório."],["Advogada cível","Juliana Tchani","Todo o cível, exceto cálculos e cumprimento de sentença. Recebe também as execuções trabalhistas repassadas, pela etiqueta roxa."],["Coordenadora do pré-jurídico e advogada previdenciária","Elisangela","Todo o previdenciário, e os cálculos e cumprimentos de sentença do cível."],["Contador externo","Rui","Liquidação de sentença e subsídios de cálculos, somente em ações trabalhistas."],["Financeiro","Igor Marran","Acompanhamento de crédito em conta e repasse ao cliente."],["Assistente técnica pericial (externa)","Ellen","Não recebe agenda no Astrea. É acionada por e-mail, por meio de agenda no nome da estagiária jurídica."],["Estagiária jurídica","Você","Tratamento das publicações, contato com o cliente depois do contrato fechado e ciência de arquivamento."],["Estagiária do pré-jurídico","","Apoio ao financeiro e contato com o cliente antes do fechamento do contrato. Não entra no fluxo de publicações."]],"regras":[{"n":1,"t":"Toda contagem é em dias úteis","p":["Sem exceção, em todas as áreas e em todos os prazos deste manual. Quando o manual disser \"3 dias\", leia \"3 dias úteis\".","O calendário forense já está configurado no Astrea, com feriados nacionais, estaduais e da comarca, de modo que o próprio sistema calcula a data. Você não precisa contar no calendário de parede, mas precisa conferir se a data que o sistema trouxe cai em dia útil."]},{"n":2,"t":"O campo Data é o prazo interno, e o título carrega as duas datas","p":["Toda agenda de prazo tem duas datas que importam. O <b>prazo interno (PZ)</b> é a data em que o escritório quer a peça pronta. O <b>prazo fatal (FT)</b> é o último dia possível para protocolar, definido por lei.","O campo Data do Astrea recebe sempre o PZ, e o título da agenda traz as duas.","A folga entre PZ e FT existe para absorver imprevisto: doença, sistema fora do ar, peça mais difícil do que parecia. Ela é a margem de segurança do escritório, e por isso a data interna nunca é a data fatal."],"exemplo":"ED PZ 15/09; FT 20/09"},{"n":3,"t":"Recurso e contrarrazões entram na agenda no mesmo dia da publicação","p":["Para recursos (ED, AI, RO, AP, RI) e para contrarrazões, o título continua trazendo PZ e FT como manda a regra 2, mas <b>o campo Data recebe o dia da própria publicação</b>, e não o PZ.","A razão é simples: quem vai delegar precisa ver o prazo hoje, para repassar hoje, e assim quem for elaborar tem o prazo inteiro à disposição, em vez de descobrir a tarefa só na véspera do prazo interno.","Quem ajusta a data depois não é você. No trabalhista, o advogado sênior adia a agenda para o PZ no momento em que delega. No cível e no previdenciário, a própria advogada da área toma ciência e adia.","Para todos os demais prazos, vale o inverso: <b>o campo Data recebe o PZ e a agenda vai direto para o responsável nominal</b>, sem passar pelo delegador."]},{"n":4,"t":"Cada agenda tem um único responsável, definido pela área","p":["Nunca deixe uma agenda sem responsável e nunca coloque duas pessoas. Se a publicação gerar duas providências com donos diferentes, crie duas agendas separadas. É o que acontece, por exemplo, no despacho que pede documentos complementares e na manifestação de cálculos trabalhista."]},{"n":5,"t":"Você não calcula o prazo fatal","p":["O prazo fatal vem da publicação e do Astrea, que já conhece o prazo legal de cada peça e o calendário forense. O seu trabalho é ler o fatal, contar para trás os dias úteis que o cartão indica para chegar ao prazo interno, e escrever as duas datas no título.","Se o fatal não estiver claro na publicação, ou se o sistema trouxer uma data que pareça errada, <b>não arbitre uma data</b>: pergunte ao Ygor."]},{"n":6,"t":"Toda publicação é concluída, mesmo quando não gera agenda","p":["Depois de criar as agendas, conclua a publicação no Astrea. É isso que faz o registro entrar no histórico da pasta do processo.","Há publicações que não geram agenda nenhuma, como a de distribuição do processo, e mesmo elas precisam ser concluídas, para que fique registrado que foram lidas e tratadas."]},{"n":7,"t":"Dúvida é sempre com o Ygor","p":["O ponto único de dúvida é o advogado júnior trabalhista, para as três áreas, inclusive cível e previdenciário. Vale tanto para publicação que você não conseguiu classificar quanto para dúvida de data, de responsável ou de nome de agenda.","Não pergunte ao advogado da área e não deduza pelo teor parecido de outra publicação."]}],"nomenclatura":{"intro":["O Astrea tem quatro tipos de item de agenda, mas o escritório usa apenas dois: <b>Prazo</b> e <b>Audiência</b>. Evento e Tarefa existem no sistema e não são utilizados.","Prazo é o tipo padrão para tudo que tem data limite de protocolo ou de providência. Audiência é reservada para atos com hora marcada, incluindo a perícia.","O título da agenda de prazo segue sempre a mesma estrutura: sigla ou nome da providência, PZ e a data interna, ponto e vírgula, FT e a data fatal. Não é necessário incluir número do processo nem área no título, porque o Astrea já exibe esses dados na própria tela do prazo."],"linhas":[["Recurso ou contrarrazões","RO PZ 12/09; FT 18/09","Dia da publicação","Advogado da área. No trabalhista, sempre o sênior"],["Prazo com data fatal, não recursal","MANIFES CÁLCULOS PZ 10/09; FT 12/09","A data do PZ","Responsável nominal indicado no cartão"],["Providência sem data fatal","INICIAR CUMPRIMENTO DE SENTENÇA","A data calculada no cartão","Responsável nominal indicado no cartão"],["Audiência ou perícia","RT AUD UNA PRESENCIAL","Data e hora do ato","Sócio (André)"]],"nota":"Providência sem data fatal não recebe PZ nem FT no título. É o caso de iniciar cumprimento de sentença, liquidar sentença, acompanhar crédito em conta e ciência de arquivamento. Nesses casos existe apenas uma data de providência, que vai no campo Data, e o título fica só com o nome da providência."},"foraDoManual":[["Prazos que nascem de ata de audiência","São agendados pelo advogado júnior trabalhista, a partir da própria ata, e não a partir de publicação."],["Réplica e manifestação sobre contestação e documentos","O prazo é agendado pelo advogado júnior no momento da audiência."],["Revisão e devolução de minuta entre advogados","O delegador revisa antes do protocolo, e quem elaborou protocola depois da devolutiva. É rotina interna dos advogados e não passa por você."],["Agravo de petição, recurso de revista e agravo em recurso de revista","São medidas de iniciativa dos próprios advogados, usadas em casos raros."],["Custas, preparo e deserção","Tratados caso a caso pelo advogado responsável."],["Requisição de pequeno valor, precatório e exigências do INSS","Rotina previdenciária conduzida integralmente pela advogada da área."],["Perícia previdenciária","Não segue o fluxo de acionamento da assistente técnica."],["Suspensões de prazo e recesso forense","Já configurados no calendário forense do Astrea, sem cálculo manual."]],"glossario":[{"g":"Datas e agendas","itens":[["Publicação","Comunicação oficial do juízo sobre o processo. É o que chega para você tratar."],["Teor","O conteúdo da publicação, ou seja, o que o juiz determinou. É por ele que você identifica a conduta."],["Conduta","O conjunto de agendas que aquele teor exige."],["Prazo fatal, ou FT","O último dia possível para protocolar a peça. Definido por lei. Perdê-lo, em regra, é perder o direito."],["Prazo interno, ou PZ","A data em que o escritório quer a peça pronta, sempre anterior ao fatal. É o que vai no campo Data do Astrea."],["Dias úteis","Contagem que exclui sábados, domingos e feriados. É a única contagem usada neste manual."],["Agenda do tipo Prazo","Item do Astrea usado para tudo que tem data limite de protocolo ou de providência."],["Agenda do tipo Audiência","Item do Astrea usado para atos com hora marcada, incluindo perícia."],["Responsável","A pessoa que vai executar. Sempre uma só por agenda."],["Delegador","No trabalhista, o advogado sênior que recebe os recursos e distribui a execução."],["Revisor","Quem confere a peça antes do protocolo. No trabalhista, é o mesmo advogado sênior."],["Pasta","O registro do processo dentro do Astrea, onde ficam o histórico e os documentos."]]},{"g":"Peças e recursos","itens":[["ED, embargos de declaração","Pede ao próprio juiz ou tribunal que esclareça obscuridade, contradição ou omissão da decisão. Não serve para rediscutir o mérito. Prazo de 5 dias."],["AI, agravo de instrumento","Recurso contra decisão interlocutória, dirigido ao tribunal. Aparece sobretudo contra o indeferimento da gratuidade e contra a negativa de tutela de urgência. Não cabe nos juizados especiais."],["RO, recurso ordinário","Recurso contra a sentença trabalhista, dirigido ao Tribunal Regional do Trabalho. Prazo de 8 dias."],["AP, apelação","Recurso contra a sentença em vara comum, cível ou previdenciária. Prazo de 15 dias."],["RI, recurso inominado","Recurso contra a sentença nos juizados especiais, dirigido à turma recursal. Prazo de 10 dias."],["Contrarrazões","Peça de resposta ao recurso da parte contrária. Não pede reforma, apenas defende que a decisão seja mantida. O prazo é o mesmo do recurso respondido."],["Impugnação ao laudo","Peça que aponta erros, omissões e contradições do laudo pericial."]]},{"g":"Decisões e fases","itens":[["Despacho inaugural","O primeiro pronunciamento do juiz depois da distribuição, em que ele organiza o início do processo."],["Decisão interlocutória","Resolve questão pontual no meio do processo, sem encerrá-lo."],["Decisão terminativa de mérito","Encerra o processo sem analisar o pedido central, em regra por obstáculo processual."],["Sentença","Decisão do juiz de primeiro grau que julga o pedido e encerra a fase de conhecimento."],["Acórdão","Decisão de um colegiado de desembargadores, no tribunal, que julga o recurso."],["Tutela de urgência","Providência concedida antes do fim do processo, quando há urgência e probabilidade do direito."],["Justiça gratuita","Benefício que dispensa a parte de pagar custas processuais."],["Hipossuficiência","A condição de quem não tem condições financeiras de pagar as custas. É o que os documentos complementares comprovam."],["Liquidação de sentença","Etapa em que se apura o valor exato devido, depois de a decisão já ter definido o direito."],["Cumprimento de sentença","Fase em que se cobra o valor devido. Provisório quando ainda cabe recurso, definitivo quando a decisão já é imutável."],["Alvará","Ordem judicial que autoriza o levantamento de valor depositado no processo."],["SISBAJUD","Sistema pelo qual o juiz determina o bloqueio de valores em contas bancárias do devedor."]]},{"g":"Atos e pessoas do processo","itens":[["Audiência una","Audiência trabalhista que reúne conciliação, instrução e julgamento em um único ato."],["CEJUSC","Centro judiciário de solução consensual de conflitos, onde ocorrem as audiências de conciliação no cível."],["JEC","Juizado especial cível, rito mais simples e rápido, com regras próprias de recurso."],["Perícia","Exame técnico feito por especialista nomeado pelo juiz. Pode ser de insalubridade, periculosidade ou médica."],["Quesitos","As perguntas que o perito terá de responder no laudo."],["Assistente técnico","Especialista contratado pela parte para acompanhar a perícia e formular quesitos. No escritório, é a Ellen."],["Perito","Especialista nomeado pelo juiz, que produz o laudo."],["Exequente ou reclamante","A parte que cobra ou que ajuizou a ação. Em regra, o cliente do escritório."],["Reclamada","A parte contrária, na ação trabalhista."]]}],"etiqueta":{"intro":"As execuções trabalhistas que não se resolvem com facilidade são repassadas à advogada cível (Juliana Tchani). O processo então recebe esta etiqueta roxa no Astrea, logo abaixo do nome das partes:","regra":["<b>Se o processo tem a etiqueta roxa, você não precisa ler o teor da publicação.</b>","Abra um único prazo, com o título <span class=\"mono-inline\">CIÊNCIA E PROVIDÊNCIA</span>, para o dia seguinte, no nome da advogada cível. Nada mais: nenhuma outra agenda, nenhum contato com o cliente, nenhuma conferência de prazo fatal."],"campos":[["Tipo de agenda","Prazo"],["Título","CIÊNCIA E PROVIDÊNCIA, sem PZ e sem FT"],["Data","Dia seguinte ao da publicação. Se ele não for dia útil, o próximo dia útil"],["Responsável","Advogada cível (Juliana Tchani)"],["Demais campos","Nada mais precisa ser preenchido"],["Depois disso","Concluir a publicação, como em qualquer outro teor"]],"avisos":[["A etiqueta se sobrepõe a todos os cartões","Havendo etiqueta roxa, nenhum cartão de fase de conhecimento, recursal ou de execução se aplica, ainda que o teor corresponda exatamente a um deles. Aqui, a etiqueta decide sozinha."],["Você nunca coloca nem retira a etiqueta","Quem repassa o processo para a advogada cível são os advogados, e são eles que etiquetam. Se achar que um processo deveria estar etiquetado e não está, não etiquete: fale com o Ygor."],["A etiqueta é do processo, não da publicação","Enquanto ela estiver lá, toda publicação daquele processo segue esta regra, uma por uma, sempre com o mesmo título e a mesma responsável."]]}},"tribunais":{"tj":{"titulo":"Justiça Estadual — Tribunais de Justiça (TJ)","segmento":"Segmento J = 8","fonte":"Resolução CNJ nº 65/2008, Anexo I (numeração única de processos). Código no padrão NNNNNNN-DD.AAAA.J.TR.OOOO.","colunas":["Código (J.TR)","Sigla","Tribunal","UF"],"linhas":[["8.01","TJAC","Tribunal de Justiça do Acre","AC"],["8.02","TJAL","Tribunal de Justiça de Alagoas","AL"],["8.03","TJAP","Tribunal de Justiça do Amapá","AP"],["8.04","TJAM","Tribunal de Justiça do Amazonas","AM"],["8.05","TJBA","Tribunal de Justiça da Bahia","BA"],["8.06","TJCE","Tribunal de Justiça do Ceará","CE"],["8.07","TJDFT","Tribunal de Justiça do Distrito Federal e Territórios","DF"],["8.08","TJES","Tribunal de Justiça do Espírito Santo","ES"],["8.09","TJGO","Tribunal de Justiça de Goiás","GO"],["8.10","TJMA","Tribunal de Justiça do Maranhão","MA"],["8.11","TJMT","Tribunal de Justiça de Mato Grosso","MT"],["8.12","TJMS","Tribunal de Justiça de Mato Grosso do Sul","MS"],["8.13","TJMG","Tribunal de Justiça de Minas Gerais","MG"],["8.14","TJPA","Tribunal de Justiça do Pará","PA"],["8.15","TJPB","Tribunal de Justiça da Paraíba","PB"],["8.16","TJPR","Tribunal de Justiça do Paraná","PR"],["8.17","TJPE","Tribunal de Justiça de Pernambuco","PE"],["8.18","TJPI","Tribunal de Justiça do Piauí","PI"],["8.19","TJRJ","Tribunal de Justiça do Rio de Janeiro","RJ"],["8.20","TJRN","Tribunal de Justiça do Rio Grande do Norte","RN"],["8.21","TJRS","Tribunal de Justiça do Rio Grande do Sul","RS"],["8.22","TJRO","Tribunal de Justiça de Rondônia","RO"],["8.23","TJRR","Tribun const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function areasDe(t){
  const a = norm(t.area);
  const r = [];
  if(a.includes('todas')) r.push('trabalhista','civel','previdenciario');
  else{
    if(a.includes('trabalhista')) r.push('trabalhista');
    if(a.includes('civel')) r.push('civel');
    if(a.includes('previdenciario')) r.push('previdenciario');
  }
  return r.length ? r : ['trabalhista','civel','previdenciario'];
}

function casa(t){
  if(filtroArea !== 'todas' && !areasDe(t).includes(filtroArea)) return false;
  if(!busca) return true;
  const b = norm(busca);
  const alvo = norm([t.sec,t.titulo,t.id,t.nota,t.area,
    t.agendas.map(a=>a.tipo+' '+a.titulo+' '+a.data+' '+a.resp).join(' ')].join(' '));
  return alvo.includes(b);
}

/* ---------- régua PZ / FT: o elemento-assinatura ---------- */
function partesData(txt){
  const frags = String(txt).split('\n').join(' · ').split('·').map(s=>s.trim()).filter(Boolean);
  const out = {campo:[], pz:[], ft:[], legal:[]};
  frags.forEach(f=>{
    if(/^PZ\b/i.test(f))            out.pz.push(f.replace(/^PZ:?\s*/i,''));
    else if(/^FT\b/i.test(f))       out.ft.push(f.replace(/^FT:?\s*/i,''));
    else if(/^(RI |AP |RO |ED )?\d+\s*dias?$/i.test(f)) out.legal.push(f);
    else                            out.campo.push(f);
  });
  return out;
}

function regua(txt, hex){
  const p = partesData(txt);
  const temPrazo = p.pz.length || p.ft.length;

  if(!temPrazo){
    return '<div class="ag-unica"><span class="k">Campo Data</span>'+
           esc(p.campo.concat(p.legal).join(' · '))+'</div>';
  }

  const nos = [];
  if(p.campo.length){
    nos.push({k:'CAMPO DATA', v:p.campo.join(' · '), cheio:true});
    if(p.pz.length) nos.push({k:'PZ', v:p.pz.join(' · ')});
  }else if(p.pz.length){
    nos.push({k:'PZ', v:p.pz.join(' · '), cheio:true, cap:'vai no campo Data'});
  }
  nos.push({k:'FT', v:p.ft.join(' · ') || 'o fatal informado na publicação', ft:true,
            cap:p.legal.length ? 'prazo legal: '+p.legal.join(' · ') : ''});

  let h = '<div class="regua">';
  nos.forEach((n,i)=>{
    if(i) h += '<div class="trecho'+(n.ft?' folga':'')+'">'+(n.ft?'<span class="tag">folga</span>':'')+'</div>';
    h += '<div class="no'+(n.cheio?' cheio':'')+(n.ft?' ft':'')+'"'+(n.cheio?' style="--tinta:'+hex+'"':'')+'>'+
         '<div class="bolha"></div><span class="k">'+esc(n.k)+'</span>'+
         '<span class="v">'+esc(n.v)+'</span>'+
         (n.cap?'<span class="cap">'+esc(n.cap)+'</span>':'')+
         '</div>';
  });
  return h+'</div>';
}

/* ---------- calculadora de prazos ---------- */
function ehFimDeSemana(d){ const w=d.getDay(); return w===0 || w===6; }

// primeiro dia apto a contar: dia seguinte à publicação, empurrado para
// segunda se cair em sábado/domingo. Feriados não são conhecidos pela
// ferramenta, então nunca são pulados — contam como dia útil normal.
function inicioContagem(pub){
  const d = new Date(pub.getTime());
  d.setDate(d.getDate()+1);
  while(ehFimDeSemana(d)) d.setDate(d.getDate()+1);
  return d;
}

function dataFinalUtil(pub, n){
  const d = new Date(pub.getTime());
  d.setDate(d.getDate()+1);
  let contados = 0;
  while(true){
    if(!ehFimDeSemana(d)){
      contados++;
      if(contados===n) break;
    }
    d.setDate(d.getDate()+1);
  }
  // salvaguarda: matematicamente já não cai em fim de semana, mantido por segurança
  while(ehFimDeSemana(d)) d.setDate(d.getDate()+1);
  return d;
}

function fmtData(d){
  return d.toLocaleDateString('pt-BR', {day:'2-digit',month:'2-digit',year:'numeric'});
}
function fmtDiaSemana(d){
  const nome = d.toLocaleDateString('pt-BR', {weekday:'long'});
  return nome.charAt(0).toUpperCase() + nome.slice(1);
}
function parseDataInput(v){
  if(!v) return null;
  const [a,m,dd] = v.split('-').map(Number);
  if(!a||!m||!dd) return null;
  return new Date(a, m-1, dd);
}

function calcCard(n, peca, sigla, obs, extra){
  if(!calcPub){
    return '<div class="calc-card'+(extra?' calc-livre':'')+'">'+
      '<div class="n">'+n+' dias</div>'+
      (peca?'<div class="peca">'+esc(sigla)+' · '+esc(peca)+'</div>':'<div class="peca">'+esc(obs||'')+'</div>')+
      '<div class="sem">—</div><div class="dia">preencha a data</div></div>';
  }
  const fim = dataFinalUtil(calcPub, n);
  return '<div class="calc-card'+(extra?' calc-livre':'')+'">'+
    '<div class="n">'+n+' dias</div>'+
    (peca?'<div class="peca">'+esc(sigla)+' · '+esc(peca)+'</div>':'<div class="peca">'+esc(obs||'')+'</div>')+
    '<div class="data">'+fmtData(fim)+'</div>'+
    '<div class="dia">'+esc(fmtDiaSemana(fim))+'</div>'+
    (extra?'':'')+
    '</div>';
}

/* ---------- roteamento ---------- */
function migalhaDe(rota){
  if(rota==='inicio') return 'Início · todos os cartões';
  if(rota==='calc') return 'Calculadora de prazos';
  if(rota==='tribunais') return 'Tribunais e OAB';
  if(rota.startsWith('t/')){
    const t = T.find(x=>x.sec===rota.slice(2));
    return t ? FASE[t.fase].nome+' · '+t.sec+' '+t.titulo : 'Início';
  }
  const s = SECOES_MANUAL.find(x=>x.id===rota.slice(2));
  return 'Manual · '+(s?s.t:'');
}

function ir(rota, semScroll){
  rotaAtual = rota;
  const palco = document.getElementById('palco');
  palco.innerHTML = rota==='inicio' ? telaInicio()
                  : rota==='calc' ? telaCalculadora()
                  : rota==='tribunais' ? telaTribunais()
                  : rota.startsWith('t/') ? telaTeor(rota.slice(2))
                  : telaManual(rota.slice(2));
  document.getElementById('migalha').textContent = migalhaDe(rota);
  pintaIndice();
  document.getElementById('rail').classList.remove('on');
  if(!semScroll) window.scrollTo({top:0,behavior:'instant'});
  if(location.hash.slice(1)!==rota) history.replaceState(null,'','#'+rota);
}

  document.getElementById('telaConta').textContent = (apIdx+1)+' / '+T.length+'  ·  '+T[apIdx].sec+'  '+T[apIdx].titulo;
  document.getElementById('progresso').style.width = ((apIdx+1)/T.length*100)+'%';
  document.getElementById('telaCorpo').parentElement.scrollTop = 0;
}
function apAbrir(){
  const atual = rotaAtual.startsWith('t/') ? T.findIndex(x=>x.sec===rotaAtual.slice(2)) : 0;
  apIdx = atual<0?0:atual; apOn = true;
  document.getElementById('tela').classList.add('on');
  document.body.style.overflow='hidden';
  apPinta();
}
function apFechar(){
  apOn=false;
  document.getElementById('tela').classList.remove('on');
  document.body.style.overflow='';
  ir('t/'+T[apIdx].sec, true);
}
function apMove(d){ apIdx = Math.min(T.length-1, Math.max(0, apIdx+d)); apPinta(); }

/* ---------- eventos ---------- */
document.addEventListener('click', e=>{
  const r = e.target.closest('[data-rota]');
  if(r){ ir(r.dataset.rota); return; }
  const c = e.target.closest('[data-area]');
  if(c){ filtroArea = c.dataset.area; pintaFiltros(); pintaIndice(); if(rotaAtual==='inicio') ir('inicio',true); return; }
});
document.addEventListener('input', e=>{
  if(e.target.id==='tribBusca'){
    tribFiltrar(e.target.value);
  }
  if(e.target.id==='calcData'){
    calcPub = parseDataInput(e.target.value);
    document.getElementById('calcInicio').innerHTML = calcInicioHTML();
    document.getElementById('calcResultados').innerHTML = calcResultadosHTML();
  }
  if(e.target.id==='calcLivre'){
    const v = parseInt(e.target.value,10);
    calcLivre = (v && v>0) ? v : 1;
    // só o valor do dia/semana muda; reconstruir tudo faria o campo perder o foco
    const card = e.target.closest('.calc-livre');
    if(calcPub && card){
      const fim = dataFinalUtil(calcPub, calcLivre);
      card.querySelector('.data').textContent = fmtData(fim);
      card.querySelector('.dia').textContent = fmtDiaSemana(fim);
    }
  }
});
document.getElementById('busca').addEventListener('input', e=>{
  busca = e.target.value.trim();
  pintaIndice();
  if(rotaAtual==='inicio') ir('inicio',true);
});
document.getElementById('btnApresentar').addEventListener('click', apAbrir);
document.getElementById('btnImprimir').addEventListener('click', ()=>{
  const volta = rotaAtual;
  document.getElementById('palco').innerHTML = telaTudo();
  document.getElementById('migalha').textContent = 'Documento completo';
  window.print();
  setTimeout(()=>ir(volta,true), 300);
});
document.getElementById('telaSair').addEventListener('click', apFechar);
document.getElementById('telaAnt').addEventListener('click', ()=>apMove(-1));
document.getElementById('telaProx').addEventListener('click', ()=>apMove(1));
document.getElementById('abrirRail').addEventListener('click', ()=>document.getElementById('rail').classList.toggle('on'));

document.addEventListener('keydown', e=>{
  if(apOn){
    if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();apMove(1)}
    if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();apMove(-1)}
    if(e.key==='Escape') apFechar();
    return;
  }
  if(e.key==='/' && document.activeElement.id!=='busca'){ e.preventDefault(); document.getElementById('busca').focus(); }
  if(e.key==='Escape' && document.activeElement.id==='busca'){
    document.getElementById('busca').value=''; busca=''; pintaIndice(); if(rotaAtual==='inicio') ir('inicio',true);
    document.getElementById('busca').blur();
  }
});

window.addEventListener('hashchange', ()=>{
  const r = location.hash.slice(1);
  if(r && r!==rotaAtual) ir(r);
});

/* ---------- arranque ---------- */
pintaFiltros();
const inicial = location.hash.slice(1);
ir(inicial && (inicial==='inicio' || inicial==='calc' || inicial==='tribunais' || T.some(t=>'t/'+t.sec===inicial) || SECOES_MANUAL.some(s=>'m/'+s.id===inicial)) ? inicial : 'inicio');
</script>
</body>
</html>
